<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Data Analytics and Fundamentals of Data Science – подготовка к зачету</title>
  <style>
:root{
  --bg:#f4f6f9;
  --panel:#ffffff;
  --panel-soft:#f7f8fb;
  --panel-hover:#f0f2f7;
  --text:#171a22;
  --muted:#717784;
  --faint:#a3a8b2;
  --line:#e3e6ec;
  --line-strong:#d3d7df;
  --accent:#6c5ce7;
  --accent-2:#536dfe;
  --accent-soft:#efedff;
  --accent-text:#4938ba;
  --code:#121620;
  --code-text:#edf0f7;
  --warning:#fff7e6;
  --warning-line:#e5a43b;
  --danger:#cf4a54;
  --shadow:0 10px 32px rgba(30,38,55,.055);
  --shadow-lg:0 16px 48px rgba(30,38,55,.075);
}

html[data-theme="dark"]{
  --bg:#0c0f14;
  --panel:#12161d;
  --panel-soft:#171c24;
  --panel-hover:#1d2330;
  --text:#eef1f6;
  --muted:#9aa2af;
  --faint:#697281;
  --line:#262d38;
  --line-strong:#343d4b;
  --accent:#a692ff;
  --accent-2:#8196ff;
  --accent-soft:#26223d;
  --accent-text:#c7bbff;
  --code:#090c11;
  --code-text:#f2f4f8;
  --warning:#2a2114;
  --warning-line:#d79b3b;
  --danger:#ff7c85;
  --shadow:none;
  --shadow-lg:none;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    radial-gradient(circle at 15% 0%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 24rem),
    var(--bg);
  color:var(--text);
  font:14px/1.65 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  transition:background .18s ease,color .18s ease;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}

.app{
  width:min(1780px,100%);
  margin:0 auto;
  padding:14px;
}

.topbar{
  height:62px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  position:sticky;
  top:10px;
  z-index:30;
  backdrop-filter:blur(20px);
}

.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
}
.brand-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:#fff;
  font-size:13px;
  font-weight:800;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 24%,transparent);
}
.brand-title{
  font-size:13px;
  font-weight:760;
  line-height:1.2;
  white-space:nowrap;
}
.brand-subtitle{
  color:var(--muted);
  font-size:11px;
  line-height:1.3;
  margin-top:2px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.theme-switch,
.export-btn{
  min-height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel-soft);
  color:var(--text);
  padding:7px 10px;
  display:flex;
  align-items:center;
  gap:7px;
  transition:.15s ease;
}
.theme-switch:hover,
.export-btn:hover{
  border-color:var(--line-strong);
  background:var(--panel-hover);
}
.export-btn{
  background:var(--text);
  color:var(--panel);
  border-color:var(--text);
  padding-inline:12px;
}
.export-btn b{
  font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  opacity:.66;
}

.workspace{
  display:grid;
  grid-template-columns:278px minmax(0,1fr) 310px;
  gap:12px;
  align-items:start;
  padding-top:12px;
}

.program,
.reader,
.notes-panel{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.program{
  position:sticky;
  top:84px;
  max-height:calc(100vh - 96px);
  overflow:auto;
  padding:17px 11px 20px;
}
.program::-webkit-scrollbar,
.notes-list::-webkit-scrollbar{width:5px}
.program::-webkit-scrollbar-thumb,
.notes-list::-webkit-scrollbar-thumb{
  background:var(--line-strong);
  border-radius:999px;
}

.panel-title{
  padding:2px 8px 15px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
}
.panel-title>span{
  font-size:12px;
  font-weight:760;
}
.panel-title small{
  font-size:10px;
  font-weight:500;
  color:var(--faint);
  white-space:nowrap;
}

.day-block{
  padding:11px 0 12px;
  border-top:1px solid var(--line);
}
.day-head{
  padding:0 8px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.day-date{
  color:var(--accent-text);
  font:760 10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.03em;
}
.day-num{
  color:var(--faint);
  font-size:9px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.09em;
}

.lesson-link{
  width:100%;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  padding:8px 9px;
  display:grid;
  grid-template-columns:28px 1fr;
  gap:5px;
  text-align:left;
  line-height:1.34;
  font-size:12px;
  transition:.14s ease;
}
.lesson-link:hover{
  color:var(--text);
  background:var(--panel-soft);
}
.lesson-link.active{
  color:var(--text);
  background:var(--accent-soft);
  box-shadow:inset 3px 0 0 var(--accent);
}
.lesson-code{
  color:var(--faint);
  font:700 9px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.lesson-link.active .lesson-code{color:var(--accent-text)}

.reader{
  min-width:0;
  min-height:calc(100vh - 96px);
  padding:0;
  overflow:hidden;
}

.article{
  width:min(900px,100%);
  margin:0 auto;
  padding:48px 58px 88px;
}
.article-kicker{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:13px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.article-kicker .dot{
  width:3px;
  height:3px;
  background:var(--line-strong);
  border-radius:50%;
}
.article h1{
  margin:0;
  max-width:800px;
  font-size:clamp(29px,3.1vw,43px);
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:770;
}
.article-lead{
  max-width:750px;
  margin:16px 0 26px;
  color:var(--muted);
  font-size:15px;
  line-height:1.68;
}
.material-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin:0 0 35px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel-soft);
  color:var(--text);
  text-decoration:none;
  font-size:11px;
  font-weight:720;
  transition:.15s ease;
}
.material-link:hover{
  border-color:var(--line-strong);
  background:var(--panel-hover);
}

.article-section{
  position:relative;
  padding:27px 0 22px;
  border-top:1px solid var(--line);
}
.article-section h2{
  margin:0 0 13px;
  padding-left:15px;
  position:relative;
  font-size:19px;
  line-height:1.28;
  letter-spacing:-.015em;
  font-weight:740;
}
.article-section h2::before{
  content:"";
  position:absolute;
  left:0;
  top:.22em;
  width:4px;
  height:1.05em;
  border-radius:999px;
  background:linear-gradient(var(--accent),var(--accent-2));
}
.article-section p{
  max-width:790px;
  margin:0 0 13px;
  color:color-mix(in srgb,var(--text) 92%,var(--muted));
}
.article-section strong,
.article-section b{font-weight:720}

.callout{
  margin:18px 0;
  padding:14px 15px 14px 45px;
  position:relative;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-soft);
}
.callout::before{
  content:"i";
  position:absolute;
  left:14px;
  top:14px;
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:6px;
  background:var(--accent-soft);
  color:var(--accent-text);
  font-size:11px;
  font-weight:800;
}
.callout strong{
  display:block;
  margin-bottom:2px;
}
.callout span{
  color:var(--muted);
}
.callout.warning{
  background:var(--warning);
  border-color:color-mix(in srgb,var(--warning-line) 38%,var(--line));
}
.callout.warning::before{
  content:"!";
  background:color-mix(in srgb,var(--warning-line) 16%,transparent);
  color:var(--warning-line);
}

.concept-grid{
  margin:18px 0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.concept-grid>div{
  min-height:102px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-soft);
}
.concept-grid b{
  display:block;
  margin-bottom:5px;
  font-size:12px;
}
.concept-grid span{
  display:block;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.formula{
  margin:17px 0;
  padding:14px 16px 14px 19px;
  border-radius:11px;
  overflow:auto;
  border:1px solid color-mix(in srgb,var(--accent) 22%,#2a3140);
  border-left:3px solid var(--accent);
  background:var(--code);
  color:var(--code-text);
  font:12px/1.7 "Cascadia Code",Consolas,ui-monospace,SFMono-Regular,monospace;
}

.future-box{
  margin-top:28px;
  padding:15px;
  border:1px dashed var(--line-strong);
  border-radius:12px;
  color:var(--muted);
  background:var(--panel-soft);
  font-size:12px;
}

.notes-panel{
  position:sticky;
  top:84px;
  height:calc(100vh - 96px);
  min-width:0;
  padding:17px;
  display:flex;
  flex-direction:column;
}
.notes-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.panel-label{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.notes-lesson{
  margin-top:4px;
  max-width:210px;
  font-size:12px;
  font-weight:750;
  line-height:1.35;
}
.add-note{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border:0;
  border-radius:10px;
  color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  font-size:19px;
  box-shadow:0 7px 17px color-mix(in srgb,var(--accent) 22%,transparent);
}
.add-note:hover{filter:brightness(1.04)}

.notes-hint{
  margin:10px 0 13px;
  color:var(--faint);
  font-size:10.5px;
  line-height:1.45;
}
.notes-list{
  min-height:0;
  flex:1;
  overflow:auto;
  padding-right:3px;
}
.note-card{
  margin-bottom:9px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-soft);
}
.note-toolbar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:7px;
}
.note-title{
  min-width:0;
  flex:1;
  border:0;
  outline:none;
  padding:0;
  background:transparent;
  color:var(--text);
  font-size:11px;
  font-weight:750;
}
.note-title::placeholder{color:var(--faint)}
.note-delete{
  border:0;
  background:transparent;
  color:var(--faint);
  padding:2px 3px;
  border-radius:5px;
  font-size:10px;
}
.note-delete:hover{
  color:var(--danger);
  background:var(--panel-hover);
}
.note-text{
  width:100%;
  min-height:115px;
  resize:vertical;
  border:1px solid transparent;
  border-radius:9px;
  outline:none;
  padding:9px 10px;
  background:var(--panel);
  color:var(--text);
  line-height:1.55;
  font-size:11.5px;
}
.note-text:focus{
  border-color:color-mix(in srgb,var(--accent) 52%,var(--line));
  box-shadow:0 0 0 3px var(--accent-soft);
}
.notes-empty{
  display:none;
  padding:12px 0;
  color:var(--faint);
  font-size:11px;
}
.notes-empty.visible{display:block}
.notes-export{
  width:100%;
  margin-top:10px;
  min-height:36px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  font-size:11px;
  font-weight:700;
}
.notes-export:hover{
  border-color:var(--line-strong);
  background:var(--panel-hover);
}

@media(max-width:1220px){
  .workspace{grid-template-columns:250px minmax(0,1fr)}
  .notes-panel{
    grid-column:1/-1;
    position:static;
    height:auto;
    min-height:250px;
  }
  .notes-list{overflow:visible}
}
@media(max-width:820px){
  .app{padding:8px}
  .topbar{
    position:static;
    height:auto;
    padding:11px;
    align-items:flex-start;
  }
  .brand-title{white-space:normal}
  .brand-subtitle{display:none}
  .theme-switch span:last-child{display:none}
  .workspace{grid-template-columns:1fr}
  .program{
    position:static;
    max-height:none;
  }
  .reader{min-height:0}
  .article{padding:34px 20px 65px}
  .article h1{font-size:31px}
  .concept-grid{grid-template-columns:1fr}
  .notes-panel{position:static;height:auto}
}


.rich-list{margin:14px 0 18px;padding-left:21px}
.rich-list li{margin:7px 0;color:color-mix(in srgb,var(--text) 90%,var(--muted))}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0}
.compare>div{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft)}
.compare span{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.compare code{display:block;font:11px/1.55 "Cascadia Code",Consolas,monospace;overflow-wrap:anywhere}
.compare small{display:block;color:var(--muted);margin-top:7px;line-height:1.5}
.tool-table{display:grid;gap:7px;margin:17px 0}
.tool-table>div{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tool-table b{font-size:12px}.tool-table span{color:var(--muted);font-size:12px}

.inline-quiz{margin:24px 0 8px;padding:16px;border:1px solid color-mix(in srgb,var(--accent) 23%,var(--line));border-radius:13px;background:color-mix(in srgb,var(--accent-soft) 46%,var(--panel))}
.quiz-kicker{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-text);margin-bottom:6px}
.quiz-question{font-weight:720;font-size:13px;margin-bottom:11px}
.quiz-options{display:grid;gap:6px}
.quiz-option{width:100%;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:8px 10px;font-size:11.5px}
.quiz-option>span{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;background:var(--panel-soft);font:700 9px/1 ui-monospace,monospace;color:var(--muted)}
.quiz-option:hover{border-color:var(--line-strong);background:var(--panel-hover)}
.quiz-option.correct{border-color:#55a878;background:color-mix(in srgb,#55a878 10%,var(--panel))}
.quiz-option.wrong{border-color:#d56b72;background:color-mix(in srgb,#d56b72 9%,var(--panel))}
.quiz-feedback{min-height:18px;margin-top:9px;color:var(--muted);font-size:11px}
.quiz-feedback strong{color:var(--text)}

.final-assignment{margin:42px 0 10px;padding:24px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent-soft) 60%,var(--panel)),var(--panel))}
.assignment-label{display:inline-block;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-text);margin-bottom:6px}
.final-assignment h2{font-size:23px;margin:0 0 9px;letter-spacing:-.02em}
.final-assignment h3{font-size:12px;margin:21px 0 7px}
.assignment-note{color:var(--muted);font-size:12px}
.assignment-list{margin:0;padding-left:22px}
.assignment-list li{margin:7px 0;font-size:12px}
.assignment-list.optional li{color:var(--muted)}
.acceptance{margin-top:20px;padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.acceptance>strong{display:block;font-size:11px;margin-bottom:7px}
.acceptance .assignment-list{margin-bottom:0}

.material-link{border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));color:var(--accent-text);background:var(--accent-soft)}
.material-link:hover{background:color-mix(in srgb,var(--accent-soft) 76%,var(--panel))}


@media(max-width:820px){
  .compare{grid-template-columns:1fr}
  .tool-table>div{grid-template-columns:1fr;gap:3px}
}


.compact-action{
  font-size:10px;
  padding-inline:9px;
}

.lesson-progress{
  margin:13px 0 4px;
  padding:10px 0 11px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.lesson-progress-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:10px;
  margin-bottom:7px;
}
.lesson-progress-head strong{
  color:var(--text);
  font-size:10px;
}
.lesson-progress-track{
  height:5px;
  overflow:hidden;
  border-radius:999px;
  background:var(--panel-hover);
}
.lesson-progress-bar{
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .18s ease;
}

.material-card{
  margin:0 0 34px;
  padding:13px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));
  border-radius:12px;
  background:color-mix(in srgb,var(--accent-soft) 42%,var(--panel));
}
.material-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.material-kicker{
  color:var(--accent-text);
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.material-copy strong{
  font-size:12px;
}
.material-copy small{
  color:var(--muted);
  font-size:10px;
  overflow-wrap:anywhere;
}
.material-copy code{
  font-family:"Cascadia Code",Consolas,monospace;
}
.material-actions{
  display:flex;
  gap:7px;
  flex:0 0 auto;
}
.material-card .material-link{
  margin:0;
}
.material-secondary{
  min-height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel);
  color:var(--muted);
  padding:7px 10px;
  font-size:10px;
  font-weight:700;
}
.material-secondary:hover{
  color:var(--text);
  border-color:var(--line-strong);
  background:var(--panel-hover);
}

@media(max-width:820px){
  .compact-action{display:none}
  .material-card{
    align-items:flex-start;
    flex-direction:column;
  }
  .material-actions{
    width:100%;
    flex-wrap:wrap;
  }
}

/* v9 action color system and glossary layout */
:root{
  --done:#19b8b0;
  --done-soft:#e7f9f7;
  --quiz:#f28c28;
  --quiz-soft:#fff1e3;
  --homework:#b83d68;
  --homework-soft:#fbeaf0;
  --practice:#2f8f68;
  --practice-soft:#eaf6f0;
}
html[data-theme="dark"]{
  --done:#45d0c8;
  --done-soft:#153432;
  --quiz:#ffad55;
  --quiz-soft:#352516;
  --homework:#e06b93;
  --homework-soft:#341c27;
  --practice:#67c99b;
  --practice-soft:#183128;
}

/* two navigation actions: Overview + Glossary */
.sidebar-tool-row{grid-template-columns:repeat(2,1fr)}

/* completed = turquoise */
.lesson-done{color:var(--done)!important}
.learned-btn.done{
  color:var(--done)!important;
  border-color:color-mix(in srgb,var(--done) 55%,var(--line))!important;
  background:var(--done-soft)!important;
}
.learned-btn.done:hover{background:color-mix(in srgb,var(--done-soft) 84%,var(--done))!important}

/* self-check = orange */
.quiz-summary{
  border-color:color-mix(in srgb,var(--quiz) 40%,var(--line))!important;
  background:var(--quiz-soft)!important;
}
.quiz-summary span,.quiz-kicker{color:var(--quiz)!important}
.quiz-dots i.done{background:var(--quiz)!important}
.inline-quiz{
  border-color:color-mix(in srgb,var(--quiz) 42%,var(--line))!important;
  background:color-mix(in srgb,var(--quiz-soft) 72%,var(--panel))!important;
}
.quiz-option:hover{border-color:color-mix(in srgb,var(--quiz) 56%,var(--line))!important}
.quiz-retry-btn{border-color:color-mix(in srgb,var(--quiz) 44%,var(--line))!important;color:var(--quiz)!important}
.quiz-success{
  background:var(--quiz-soft)!important;
  border-color:color-mix(in srgb,var(--quiz) 42%,var(--line))!important;
}
.quiz-success b{color:var(--quiz)!important}

/* homework = berry */
.final-assignment{
  border-color:color-mix(in srgb,var(--homework) 43%,var(--line))!important;
  background:linear-gradient(145deg,color-mix(in srgb,var(--homework-soft) 78%,var(--panel)),var(--panel))!important;
}
.final-assignment .assignment-label,.submission-kicker{color:var(--homework)!important}
.final-assignment .acceptance{border-color:color-mix(in srgb,var(--homework) 22%,var(--line))!important}
.submission-box{border-color:color-mix(in srgb,var(--homework) 30%,var(--line))!important}
.submission-status:focus,.submission-note:focus{border-color:var(--homework)!important;box-shadow:0 0 0 3px var(--homework-soft)}

/* practical file = green information card; no action buttons */
.material-card.material-info{
  border-color:color-mix(in srgb,var(--practice) 42%,var(--line))!important;
  background:var(--practice-soft)!important;
  padding:14px 15px!important;
}
.material-card.material-info .material-kicker{color:var(--practice)!important}
.material-card.material-info .material-copy strong{font-size:12px}
.material-card.material-info .material-copy small{margin-top:2px}

/* quote toolbar: theme-aware surface + bright outline */
.selection-toolbar{
  border:2px solid var(--accent)!important;
  background:var(--panel)!important;
  box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 28%,transparent)!important;
  padding:3px!important;
}
.selection-toolbar button{
  background:var(--panel)!important;
  color:var(--text)!important;
  border:0!important;
  font-weight:800!important;
}
.selection-toolbar button:hover{background:var(--accent-soft)!important;color:var(--accent-text)!important}

/* glossary: course order, 4 columns desktop */
.glossary-lessons{display:grid;gap:26px;margin-top:24px}
.glossary-lesson-group{padding-top:4px}
.glossary-lesson-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.glossary-lesson-head span{color:var(--accent-text);font:700 9px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap}
.glossary-lesson-head h2{margin:0!important;font-size:14px!important;color:var(--text)!important}
.glossary-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important;margin-top:0!important}
.glossary-card{
  display:block!important;width:100%;min-height:86px;text-align:left!important;
  padding:11px 12px!important;border:1px solid var(--line)!important;border-radius:11px!important;
  background:var(--panel-soft)!important;color:var(--text)!important;
}
.glossary-card:hover{border-color:var(--accent)!important;background:var(--accent-soft)!important}
.glossary-card b{display:block;margin:0 0 6px!important;font-size:11px!important;line-height:1.35}
.glossary-card small{display:block;color:var(--muted);font-size:9px;line-height:1.4}

.profile-menu-action.fallback-save{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-text);background:var(--accent-soft)}

@media(max-width:1250px){.glossary-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:950px){.glossary-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:640px){.glossary-grid{grid-template-columns:1fr!important}.glossary-lesson-head{display:block}.glossary-lesson-head span{display:block;margin-bottom:4px}}


/* v10: neutral file card, explicit icons, distinct warnings */
:root{
  --file-surface:#f1f3f6;
  --file-border:#cfd4dc;
  --file-icon:#69717e;
  --danger-note:#d9545d;
  --danger-note-soft:#fff0f1;
}
html[data-theme="dark"]{
  --file-surface:#191e26;
  --file-border:#343c49;
  --file-icon:#aab2be;
  --danger-note:#ff7b84;
  --danger-note-soft:#321d21;
}

.ui-icon{width:15px;height:15px;display:inline-grid;place-items:center;flex:0 0 auto}

.material-card.material-info{
  border-color:var(--file-border)!important;
  background:var(--file-surface)!important;

.material-card.material-info .material-kicker{
  color:var(--file-icon)!important;
  display:flex;align-items:center;gap:6px;
}
.material-card.material-info .material-copy strong{color:var(--text)!important}
.material-card.material-info .material-copy small{color:var(--muted)!important}

.quiz-summary>div:first-child>span,
.quiz-kicker,
.assignment-label,
.submission-kicker{
  display:flex;align-items:center;gap:6px;
}
.quiz-summary .ui-icon,.quiz-kicker .ui-icon{color:var(--quiz)}
.assignment-label .ui-icon,.submission-kicker .ui-icon{color:var(--homework)}

/* warning/caution is red-coral, intentionally separate from orange self-check */
.callout.warning{
  background:var(--danger-note-soft)!important;
  border-color:color-mix(in srgb,var(--danger-note) 48%,var(--line))!important;
}
.callout.warning::before{
  background:color-mix(in srgb,var(--danger-note) 14%,transparent)!important;
  color:var(--danger-note)!important;
}

.resume-profile{
  margin:0 0 18px;padding:14px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  border-radius:13px;background:var(--accent-soft);display:grid;gap:11px;
}
.resume-profile[hidden]{display:none!important}
.resume-profile>div{display:flex;flex-direction:column;gap:3px}
.resume-profile span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text);font-weight:800}
.resume-profile b{font-size:12px}
.resume-profile small{color:var(--muted);font-size:10px;line-height:1.45}


/* v11: adaptive formulas */
:root{
  --formula-bg:#f4f2ff;
  --formula-text:#28233f;
  --formula-border:#cfc7ff;
}

  --formula-bg:#1d1a2c;
  --formula-text:#f1eefc;
  --formula-border:#4b426d;
}
.formula{
  background:var(--formula-bg)!important;
  color:var(--formula-text)!important;
  border-color:var(--formula-border)!important;
  border-left-color:var(--accent)!important;
}

/* v11: successful self-check becomes turquoise */
.inline-quiz.quiz-passed{
  border-color:color-mix(in srgb,var(--done) 54%,var(--line))!important;
  background:var(--done-soft)!important;
}
.inline-quiz.quiz-passed .quiz-kicker{
  color:var(--done)!important;
}
.inline-quiz.quiz-passed .quiz-kicker .ui-icon{
  color:var(--done)!important;
}
.inline-quiz.quiz-passed .quiz-success{

  border-color:color-mix(in srgb,var(--done) 42%,var(--line))!important;

.inline-quiz.quiz-passed .quiz-success b{

let PARSE_LANG="ru";
function splitRow(line){return line.trim().replace(/\\\|/g,"\u0001").replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim().replace(/\u0001/g,"|"));}
function markdownToHtml(markdown){
  const lines=String(markdown||"").replace(/\r\n?/g,"\n").split("\n");
  const html=[];let paragraph=[],listType=null,listItems=[],inCode=false,codeLang="",codeLines=[];
  const flushP=()=>{if(paragraph.length){html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);paragraph=[];}};
  const flushL=()=>{if(listType&&listItems.length){html.push(`<${listType} class="rich-list">${listItems.map(i=>`<li>${inlineMarkdown(i)}</li>`).join("")}</${listType}>`);}listType=null;listItems=[];};
  const flushC=()=>{
    const raw=codeLines.join("\n");
    if(codeLang==="formula")html.push(`<div class="formula">${escapeHtml(raw).replace(/\n/g,"<br>")}</div>`);
    else{const body=(codeLang==="python"||codeLang==="py")?highlightPython(raw):escapeHtml(raw);
      html.push(`<div class="code-block"><button type="button" class="code-copy">${UI[PARSE_LANG].copy}</button><pre><code>${body}</code></pre></div>`);}
    inCode=false;codeLang="";codeLines=[];
  };
  for(let i=0;i<lines.length;i++){
    const raw=lines[i],tr=raw.trim();
    if(tr.startsWith("```")){if(inCode)flushC();else{flushP();flushL();inCode=true;codeLang=tr.slice(3).trim().split(/\s+/)[0].toLowerCase();}continue;}
    if(inCode){codeLines.push(raw);continue;}
    if(!tr){flushP();flushL();continue;}
    const alert=tr.match(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
    if(alert||tr.startsWith(">")){
      flushP();flushL();
      const body=[];
      if(alert){if(alert[2])body.push(alert[2]);}else body.push(tr.replace(/^>\s?/,""));
      while(i+1<lines.length&&lines[i+1].trim().startsWith(">")){i++;body.push(lines[i].trim().replace(/^>\s?/,""));}
      const kind=alert?alert[1].toUpperCase():"";
      const warn=["WARNING","CAUTION"].includes(kind);
      const label=alert?(warn?UI[PARSE_LANG].caution:UI[PARSE_LANG].attention):"";
      html.push(`<div class="callout${warn?" warning":""}">${label?`<strong>${label}</strong>`:""}<span>${inlineMarkdown(body.join(" "))}</span></div>`);
      continue;
    }
    if(tr.startsWith("|")&&i+1<lines.length&&/^\|?\s*:?-{2,}/.test(lines[i+1].trim())){
      flushP();flushL();
      const head=splitRow(tr);i++;const rows=[];
      while(i+1<lines.length&&lines[i+1].trim().startsWith("|")){i++;rows.push(splitRow(lines[i]));}
      html.push(`<div class="md-table-wrap"><table class="md-table"><thead><tr>${head.map(h=>`<th>${inlineMarkdown(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inlineMarkdown(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const ul=tr.match(/^[-*]\s+(.+)$/);
    if(ul){flushP();if(listType&&listType!=="ul")flushL();listType="ul";listItems.push(ul[1]);continue;}
    const ol=tr.match(/^\d+[.)]\s+(.+)$/);
    if(ol){flushP();if(listType&&listType!=="ol")flushL();listType="ol";listItems.push(ol[1]);continue;}
    const h3=tr.match(/^###\s+(.+)$/);
    if(h3){flushP();flushL();html.push(`<h3>${inlineMarkdown(h3[1])}</h3>`);continue;}
    if(listType&&/^\s{2,}\S/.test(raw)){listItems[listItems.length-1]+=" "+tr;continue;}
    paragraph.push(tr);
  }
  flushP();flushL();if(inCode)flushC();

}
function parseFrontmatter(md){
  const text=String(md||"").replace(/\r\n?/g,"\n");
  if(!text.startsWith("---\n"))return{meta:{},body:text};
  const end=text.indexOf("\n---",4);if(end<0)return{meta:{},body:text};
  const meta={};let listKey=null;
  for(const line of text.slice(4,end).split("\n")){
    const li=line.match(/^\s*-\s+(.+)$/);
    if(li&&listKey){let v=li[1].trim();if(/^".*"$/.test(v))v=v.slice(1,-1);meta[listKey].push(v);continue;}
    const m=line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);if(!m){listKey=null;continue;}
    let v=m[2].trim();
    if(v===""){meta[m[1]]=[];listKey=m[1];continue;}
    listKey=null;if(/^".*"$/.test(v))v=v.slice(1,-1);meta[m[1]]=v;

}
function parseQuiz(content){
  const re=/```quiz\s*\n([\s\S]*?)```/i,m=String(content||"").match(re);
  if(!m)return{body:content,quiz:null};
  const data={},opts={};
  for(const line of m[1].split("\n")){const x=line.match(/^\s*([^:]+):\s*(.*)$/);if(!x)continue;const k=x[1].trim();
    if(/^[ABCD]$/i.test(k))opts[k.toUpperCase()]=x[2].trim();else data[k.toLowerCase()]=x[2].trim();}
  const L=["A","B","C","D"],correct=L.indexOf(String(data.correct||"").trim().toUpperCase());
  const quiz=data.question&&L.every(l=>typeof opts[l]==="string")&&correct>=0?{question:data.question,options:L.map(l=>opts[l]),correct,explanation:data.explanation||""}:null;
  return{body:String(content).replace(re,"").trim(),quiz};
}
function splitSections(body){
  const lines=body.split("\n"),out=[];let h1="",title=null,buf=[];
  const push=()=>{const c=buf.join("\n").trim();if(title!==null||c)out.push({title:title||"",raw:c});buf=[];};
  let inCode=false;
  for(const line of lines){
    if(line.trim().startsWith("```"))inCode=!inCode;
    if(!inCode){
      const a=line.match(/^#\s+(.+)$/);if(a&&!h1){h1=a[1].trim();continue;}
      const b=line.match(/^##\s+(.+)$/);if(b){push();title=b[1].trim();continue;}
    }
    buf.push(line);
  }
  push();
  return{h1,sections:out.filter(s=>s.title)};
}
const PRACTICE_RE=/^(practice|практика)(?=[\s:·–-]|$)/i;
function parseLesson(md,id){
  const{meta,body}=parseFrontmatter(md),{h1,sections}=splitSections(body);
  const pIdx=sections.findIndex(s=>PRACTICE_RE.test(s.title));
  const content=sections.filter((_,i)=>i!==pIdx);
  const concepts=(meta.concepts||[]).map(x=>{const[term,def]=x.split("::").map(s=>s.trim());return{term,def:def||""};});
  const conceptRefs=concepts.map(c=>{
    const needle=c.term.toLocaleLowerCase();
    let s=content.findIndex(sec=>(sec.title+"\n"+sec.raw).toLocaleLowerCase().includes(needle));
    return{...c,section:s<0?0:s};
  });
  return{
    id,title:meta.title||h1,summary:meta.summary||"",source:meta.source||"",
    sections:content.map(s=>{const q=parseQuiz(s.raw);return{title:s.title,html:markdownToHtml(q.body),quiz:q.quiz};}),
    conceptRefs,

}
function parseExam(md){
  const{meta,body}=parseFrontmatter(md);const blocks=[];let cur=null,q=null,inCode=false;
  for(const line of body.split("\n")){
    if(line.trim().startsWith("```"))inCode=!inCode;
    const b=!inCode&&line.match(/^##\s+(.+)$/),h=!inCode&&line.match(/^###\s+(.+)$/);
    if(b){cur={title:b[1].trim(),items:[]};blocks.push(cur);q=null;continue;}
    if(h&&cur){q={q:h[1].trim(),raw:[]};cur.items.push(q);continue;}
    if(q)q.raw.push(line);

function renderOverview(){
  const c=C();
  document.getElementById("reader").innerHTML=`<article class="article overview-article"><div class="article-kicker"><span>${t("overviewKicker")}</span></div><h1>${escapeHtml(c.title)}</h1><div class="overview-body">${c.overview}</div><section class="article-section"><h2>${t("program")}</h2><div class="course-map">${c.parts.map(p=>`<div class="course-map-row"><b>${t("part")} ${p.part}</b><span>${escapeHtml(p.title)}</span><div>${p.lessons.map(l=>`<button data-static-go="${l.id}">${isLearned(l.id)?"✓ ":""}${escapeHtml(l.id+" · "+l.title)}</button>`).join("")}${testButton(p.afterTest,"overview")}</div></div>`).join("")}</div></section></article>`;
  document.querySelectorAll("[data-static-go]").forEach(b=>b.addEventListener("click",()=>openLesson(b.dataset.staticGo)));
  bindTests();
}
function renderGlossary(filter=""){
  const f=filter.trim().toLocaleLowerCase();
  const groups=allLessons().map(l=>({l,items:l.conceptRefs.filter(x=>!f||(x.term+" "+x.def).toLocaleLowerCase().includes(f))})).filter(g=>g.items.length);
  const reader=document.getElementById("reader");
  const listHtml=groups.map(g=>`<section class="glossary-lesson-group"><div class="glossary-lesson-head"><span>${t("module")} ${escapeHtml(g.l.id)}</span><h2>${escapeHtml(g.l.title)}</h2></div><div class="glossary-grid">${g.items.map(x=>`<button class="glossary-card" data-section-lesson="${g.l.id}" data-section-index="${x.section}"><b>${escapeHtml(x.term)}</b><span class="glossary-def">${inlineMarkdown(x.def)}</span><small>${escapeHtml(g.l.sections[x.section]?.title||g.l.title)}</small></button>`).join("")}</div></section>`).join("");
  if(!reader.querySelector("#glossarySearch")){
    reader.innerHTML=`<article class="article overview-article"><div class="article-kicker"><span>${t("glossaryKicker")}</span></div><h1>${t("glossaryTitle")}</h1><p class="article-lead">${t("glossaryLead")}</p><input class="glossary-search" id="glossarySearch" type="search" placeholder="${t("glossarySearch")}"><div class="glossary-lessons" id="glossaryList"></div></article>`;
    reader.querySelector("#glossarySearch").addEventListener("input",e=>renderGlossary(e.target.value));
  }
  reader.querySelector("#glossaryList").innerHTML=listHtml;
  reader.querySelectorAll("[data-section-lesson]").forEach(b=>b.addEventListener("click",()=>scrollToSection(b.dataset.sectionLesson,Number(b.dataset.sectionIndex))));
}
function renderExam(){
  const ex=C().exam;let n=0;
  const total=ex.blocks.reduce((s,b)=>s+b.items.length,0),known=ex.blocks.reduce((s,b,bi)=>s+b.items.filter((_,qi)=>profile.examKnown[`${bi}-${qi}`]).length,0);
  const body=ex.blocks.map((b,bi)=>{
    const items=b.items.map((it,qi)=>{n++;const id=`${bi}-${qi}`,k=!!profile.examKnown[id];
      if(examFilter==="unknown"&&k)return"";
      return `<details class="exam-q ${k?"known":""}" data-exam="${id}"><summary><span class="exam-num">${n}</span><span>${inlineMarkdown(it.q)}</span><button type="button" class="exam-known" data-known="${id}">${k?t("examKnownDone"):t("examKnown")}</button></summary><div class="exam-answer">${it.html}</div></details>`;}).join("");
    return items?`<h2 class="exam-block-title">${escapeHtml(b.title)}</h2>${items}`:"";
  }).join("");
  document.getElementById("reader").innerHTML=`<article class="article overview-article"><div class="article-kicker"><span>${t("examKicker")}</span></div><h1>${escapeHtml(ex.title||t("examTitle"))}</h1><p class="article-lead">${inlineMarkdown(ex.summary||t("examLead"))}</p><div class="exam-progress"><strong>${t("examProgress")}: ${known} ${t("of")} ${total}</strong><div class="track"><div class="bar" style="width:${total?known/total*100:0}%"></div></div></div><div class="exam-tools"><button type="button" data-filter="all" class="${examFilter==="all"?"active":""}">${t("all")}</button><button type="button" data-filter="unknown" class="${examFilter==="unknown"?"active":""}">${t("unknown")}</button><button type="button" data-expand="1">${t("expandAll")}</button><button type="button" data-expand="0">${t("collapseAll")}</button></div>${body}</article>`;
  const r=document.getElementById("reader");
  r.querySelectorAll("[data-known]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();const id=b.dataset.known;
    profile.examKnown[id]=!profile.examKnown[id];if(!profile.examKnown[id])delete profile.examKnown[id];saveState();
    const open=[...r.querySelectorAll("details[open]")].map(d=>d.dataset.exam),y=window.scrollY;renderExam();
    open.forEach(o=>r.querySelector(`details[data-exam="${o}"]`)?.setAttribute("open",""));window.scrollTo({top:y});}));
  r.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{examFilter=b.dataset.filter;renderExam();}));
  r.querySelectorAll("[data-expand]").forEach(b=>b.addEventListener("click",()=>r.querySelectorAll("details.exam-q").forEach(d=>d.open=b.dataset.expand==="1")));
}

/* ---------- Render ---------- */
function renderAll(){
  applyStaticI18n();renderProgram();
  if(currentMode==="lesson")renderReader();
  else if(currentMode==="test")renderTestPage();
  else if(currentMode==="glossary"){document.getElementById("reader").innerHTML="";renderGlossary();}
  else if(currentMode==="exam")renderExam();
  else renderOverview();
}
function goMode(m){activeTestId=null;currentMode=m;renderAll();window.scrollTo({top:0});}

/* ---------- Events ---------- */
document.getElementById("themeToggle").addEventListener("click",toggleTheme);
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.getElementById("showOverview").addEventListener("click",()=>goMode("overview"));
document.getElementById("showGlossary").addEventListener("click",()=>goMode("glossary"));
document.getElementById("showExam").addEventListener("click",()=>goMode("exam"));

profile=loadState();
activeLessonId=profile.lastOpenedLesson;
applyTheme(profile.settings.theme==="dark"?"dark":"light");
renderAll();
})();

</script>
</body>
</html>
