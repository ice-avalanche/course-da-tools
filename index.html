т «Январь отчет» не пройдет фильтр по префиксу «Отчет_» и будет молча пропущен. Поэтому после цикла полезно сравнить число найденных листов с ожидаемым.\n\n### Сводка\n\nСначала обрабатываются единицы, затем агрегируются результаты. Контрольные значения при порогах 5 %:\n\n| Лист | Строк | Критично | Отклонение | В норме |\n|---|---|---|---|---|\n| Отчет_Январь | 12 | 2 | 9 | 1 |\n| Отчет_Февраль | 12 | 2 | 7 | 3 |\n| Отчет_Март | 12 | 2 | 6 | 4 |\n\nИтого 36 строк, план выручки 59 850 000 руб., факт 59 229 404 руб. Строки 5–7 листа «Сводка» рассчитаны на три листа; при большем числе листов запись дойдет до строки «Итого».\n\n```quiz\nquestion: Зачем в цикле по Worksheets нужен фильтр по префиксу имени?\nA: Без фильтра For Each не перебирает коллекцию Worksheets\nB: Фильтр ускоряет выполнение на больших книгах\nC: В коллекцию входят служебные листы, и расчет не должен применяться к ним\nD: Фильтр нужен только при обработке внешних файлов\ncorrect: C\nexplanation: Worksheets включает все листы без различения назначения. Область обработки задается явным признаком.\n```\n\n## 5. Пакетная обработка файлов и cleanup\n\nИсточники находятся в отдельных книгах, и появляется ресурс, которым нужно управлять: открытая внешняя книга.\n\n### Жизненный цикл внешней книги\n\nПеременная `wbSource` перед каждым открытием получает `Nothing`. После `Workbooks.Open` она содержит ссылку на книгу. Перед переходом к следующему файлу книга закрывается. Присваивание `Nothing` позволяет обработчику отличить «открытие не состоялось» от «книга открылась, ошибка возникла позже» и не закрывать несуществующий объект.\n\nРежим `ReadOnly:=True` разграничивает ответственность: исходный файл – вход, процедура его не изменяет и закрывает с `SaveChanges:=False`.\n\n### Перебор через Dir\n\n```excel\nfileName = Dir(folderPath & fileMask)\n\nDo While fileName <> \"\"\n    ' обработка одного файла\n    fileName = Dir()\nLoop\n```\n\nПервый вызов с маской возвращает имя первого файла, следующие вызовы без аргументов – имена остальных, пустая строка означает конец. Путь и маска читаются с листа «Параметры». Если папка недоступна, `Dir` может вернуть ошибку или пустую строку; первый вызов выполняется под ограниченным `On Error Resume Next`, результат проверяется явно, причина пишется в журнал.\n\n### Проверка контракта до расчета\n\nНаиболее опасна не остановка кода, а ситуация, когда столбец сместился, процедура прочитала соседние значения и выдала правдоподобные числа без ошибки. Структура и типы проверяются до расчета:\n\n```excel\nIf Not HasRequiredHeaders(wsSource) Then\n    Err.Raise vbObjectError + 1001, \"ProcessFolder\", \"Неверная структура файла\"\nEnd If\n\nCheckTypes wsSource, lastRow\n```\n\n`HasRequiredHeaders` сравнивает заголовки первой строки с ожидаемыми. `CheckTypes` проверяет, что значения в столбцах E:H – числа: `VarType(ячейка.Value2) <> vbDouble` означает текст, пустое значение или ошибку. Функция `IsNumeric` для этой цели не подходит: ее результат для текста вида «1 915 000» зависит от региональных настроек. Свойство `Value2` используется потому, что `Value` для ячеек с денежным форматом возвращает тип Currency.\n\n`Err.Raise` переводит нарушение контракта в тот же механизм, что и ошибку выполнения: технические и структурные дефекты идут одним маршрутом в журнал.\n\n### Закрытие при любом исходе\n\n```excel\nFileExit:\n    If Not wbSource Is Nothing Then wbSource.Close SaveChanges:=False\n    Set wbSource = Nothing\n    On Error GoTo 0\n    fileName = Dir()\n    GoTo ContinueLoop\n\nFileError:\n    LogError fileName, \"ProcessFolder\", Err.Number, Err.Description\n    Resume FileExit\n\nContinueLoop:\n```\n\nВ листинге на листе «Код VBA» метки находятся в первой позиции строки. Закрытие размещено в блоке, к которому ведут и успешный путь, и обработчик. Если разместить `Close` только в конце основной ветви, при ошибке управление уйдет в обработчик в обход закрытия, и файл останется открытым. По смыслу блок соответствует `finally` в других языках. После `FileExit` обработчик отключается, чтобы следующая итерация не унаследовала состояние.\n\n### Учебные файлы\n\n- `01_January.xlsx`, `02_February.xlsx` – структура корректна, по 12 строк; совпадают с листами «Отчет_Январь» и «Отчет_Февраль», поэтому результаты можно сверить.\n- `03_March_error.xlsx` – нет столбца «Факт затрат, руб.»: `HasRequiredHeaders` возвращает `False`, ошибка записывается в журнал, книга закрывается, обработка продолжается.\n- `04_April_type.xlsx` – структура корректна, но в ячейке F10 значение «1 915 000» записано текстом: `CheckTypes` обнаруживает дефект до расчета.\n\nРезультат на листе «Сводка» (блок «Файлы папки») для четырех файлов: обработано 2, отклонено 2; в журнале две строки с кодами –2147220503 и –2147220501.\n\n```quiz\nquestion: Инструкция wbSource.Close размещена в конце основной ветви после расчетов. Что произойдет при ошибке структуры в третьем файле?\nA: Excel закроет книги автоматически при выходе из процедуры\nB: Управление перейдет в обработчик в обход закрытия, и файл останется открытым\nC: Процедура остановится полностью, остальные файлы обработаны не будут\nD: Книга закроется с сохранением изменений\ncorrect: B\nexplanation: Обработчик перехватывает управление с места ошибки, поэтому код ниже в основной ветви не выполняется. Закрытие должно находиться в блоке, который выполняется при любом исходе.\n```\n\n## 6. Выбор между формулами, Power Query и VBA\n\nТри вопроса определяют стартовый инструмент:\n\n1. Нужен ли постоянно пересчитываемый результат в ячейке? – **формулы**.\n2. Это преобразование табличных данных? – **Power Query**.\n3. Нужно управлять последовательностью действий и объектами приложения? – **VBA**.\n\n«Стартовый» означает, что сложная задача часто требует комбинации, но выбор начинается с механизма, который уже решает задачу.\n\n```excel\nДанные                    → Power Query\nРасчет                    → формулы / DAX\nДействия и оркестрация    → VBA\n```\n\nФормулы подходят для прозрачного пересчета по ячейкам. Power Query – для импорта, очистки, типизации и объединения таблиц; Folder connector получает список файлов и объединяет результаты. VBA – для действий над объектами: обновление запросов, проверка контрольных ячеек, формирование копий отчетов, управление файлами, журнал.\n\n| Задача | Старт | Риск неверного выбора |\n|---|---|---|\n| Расчет показателя из ячеек | Формулы | Избыточный код |\n| Импорт и очистка однотипных файлов | Power Query | Ручные циклы и хрупкие адреса |\n| Управление книгами, листами, форматированием | VBA | Ручные действия в интерфейсе |\n| Массовое объединение таблиц | Power Query | Переписывание готового механизма |\n| Расчетная функция | Формула или UDF по сложности | UDF там, где достаточно LET |\n| Исключительная ситуация, журнал, cleanup | VBA | Resume Next скрывает дефект |\n| Полный регламентный процесс | Комбинация | Монолитный макрос |\n\n### Сопровождаемость\n\nФормула понятна большинству пользователей, шаги Power Query видны в редакторе запросов, код VBA скрыт и может менять состояние книги. Из равнозначных по результату вариантов выбирается тот, который проще проверять и поддерживать в конкретной команде. Техническая возможность не равна организационной целесообразности.\n\n### Оркестрация\n\nVBA может не выполнять трансформацию, а управлять готовыми компонентами: запустить `RefreshAll`, проверить контрольную ячейку, сохранить отчет в папку, записать журнал. Это устойчивее дублирования логики Power Query в коде. Монолитный макрос, самостоятельно читающий файлы, считающий модель, оформляющий отчет и управляющий выходом, трудно проверять и передавать.\n\n```quiz\nquestion: Ежемесячно приходят 25 однотипных файлов: их нужно объединить, привести названия и типы столбцов, рассчитать маржу и сохранить 12 копий отчета по филиалам. Какое распределение инструментов корректно?\nA: VBA целиком\nB: Power Query для импорта и типизации, формулы или мера для маржи, VBA для формирования и сохранения копий\nC: Power Query целиком\nD: Формулы целиком\ncorrect: B\nexplanation: Задача состоит из трех слоев: загрузка и типизация, расчет, процедурные действия над книгами. Каждому слою соответствует свой инструмент.\n```\n\n## 7. Использование ИИ: проверка устойчивости процедуры\n\nЯзыковая модель применяется для поиска необработанных путей выхода и незакрытых ресурсов. Поведение на конкретных файлах она подтвердить не может: оно проверяется запуском.\n\n```excel\nНиже приведена моя процедура регулярной обработки на VBA и описание контракта источника:\n\n[ВСТАВЬТЕ КОД ПРОЦЕДУР, ОПИСАНИЕ СТРУКТУРЫ ИСТОЧНИКА, ОЖИДАЕМОЕ ПОВЕДЕНИЕ ПРИ КОРРЕКТНОМ И ДЕФЕКТНОМ ФАЙЛЕ]\n\n1. Найди пути выхода, на которых открытая внешняя книга остается незакрытой.\n2. Проверь, есть ли перед обработчиком ошибок явный выход из нормальной ветви.\n3. Найди широкие On Error Resume Next и предложи, как ограничить область действия.\n4. Проверь, что структура и типы источника проверяются до расчета, а не после.\n5. Укажи места, где пользовательская функция выполняет действия вместо вычисления.\n6. Проверь, содержит ли журнал источник, этап, код и описание.\n7. Оцени, какие части задачи логичнее отдать Power Query или формулам.\n```\n\nПредложения проверяются запуском на учебных файлах. Характерный признак ненадежного совета – оборачивание проблемного участка в `On Error Resume Next` вместо устранения причины.\n\n## 8. Итоги занятия\n\n1. Регулярный процесс повторяется без правки кода; успех выполнения и полнота результата различаются.\n2. У процесса есть контракт входа; отказ от расчета при его нарушении корректен, если причина зафиксирована.\n3. `Function` вычисляет, `Sub` действует; UDF не имеет побочных действий, все входы передаются аргументами.\n4. Некорректный вход возвращается контролируемой ошибкой, а не пустой строкой.\n5. Ошибка записывается в журнал с источником, этапом, кодом и описанием; перед обработчиком обязателен явный выход.\n6. Широкий `On Error Resume Next` недопустим; область подавления – одна ожидаемая операция.\n7. Пакетная обработка имеет фильтр области; оркестратор отделен от рабочей процедуры.\n8. Структура и типы источника проверяются до расчета; внешняя книга закрывается при любом исходе.\n9. Инструмент выбирается по природе задачи и сопровождаемости; регламентный процесс обычно комбинирует слои.\n\n## Практика: регламентный процесс обработки\n\n**Задача.** Построить устойчивую обработку: функция статуса, обработчик ошибок с журналом, пакетная обработка трех листов и папки выгрузок с контролем структуры и типов, затем выбрать инструмент для пяти кейсов.\n\n**Файл.** [lesson-7.2.xlsx](materials/lesson-7.2.xlsx) и архив [lesson-7.2-exports.zip](materials/lesson-7.2-exports.zip). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри книги. Работа выполняется в рабочей копии xlsm; дефектные файлы выгрузок не исправляются.\n\n**Что нужно сделать.**\n\n1. Создать `VarianceStatus`, проверить ее на пяти строках и на нулевом плане.\n2. Добавить `LogError` и обработчик в `ProcessOneSheet`, вызвать ошибку искусственно и проверить запись в журнале.\n3. Обработать три листа с префиксом «Отчет_» и сверить «Сводку».\n4. Обработать папку выгрузок в три этапа (два корректных файла, затем с ошибкой структуры, затем с ошибкой типа) и проверить закрытие книг.\n5. Заполнить лист «Выбор инструмента» и добавить на лист «Параметры» инструкцию запуска процесса.\n\n**Результат.** Книга xlsm с заполненными листами «Сводка», «Журнал» и «Выбор инструмента»; процедура не зависит от активной книги, не прекращает работу без записи в журнале и не оставляет внешние файлы открытыми.\n", "8.1": "---\ntitle: \"Управленческие дашборды в Excel\"\nsummary: \"Проектирование мониторингового экрана: пользователь и вопросы, определения KPI, корректная агрегация маржи, единый фильтр-контекст, динамика и структура, факторное разложение с замыканием, срезы и контроль качества.\"\nsource: \"materials/lesson-8.1.xlsx\"\nconcepts:\n  - \"Дашборд :: Экран, создающий приоритет: за 30–60 секунд отвечает на заранее определенные управленческие вопросы. Не заменяет детализацию.\"\n  - \"Мониторинговый экран :: Экран с устойчивым набором вопросов и показателей, не предполагающий свободного исследования.\"\n  - \"KPI :: Показатель с определением: что измеряется, в каких единицах, за какой период, по какому правилу агрегируется, с чем сравнивается.\"\n  - \"База сравнения :: Значение, с которым сопоставляется факт: бюджет, прогноз, лимит, прошлый год. Указывается явно.\"\n  - \"Процентные пункты :: Единица изменения уровня показателя, выраженного в процентах: разность двух процентов, а не их отношение.\"\n  - \"Агрегированная маржа :: Отношение суммы операционной прибыли к сумме выручки. Среднее построчных марж присваивает сегментам одинаковый вес и искажает результат.\"\n  - \"Фильтр-контекст :: Единый набор условий, по которому все элементы экрана агрегируют одни и те же строки.\"\n  - \"Визуальная иерархия :: Порядок внимания, заданный размером, положением и контрастом элементов.\"\n  - \"Факторное разложение :: Представление отклонения прибыли суммой эффектов объема, цены, переменных и постоянных затрат с обязательным замыканием.\"\n  - \"Срез :: Интерфейс фильтра сводной таблицы или таблицы. Меняет контекст объекта, но не создает расчетной логики.\"\n---\n\n# Управленческие дашборды в Excel\n\n## Цели и требования\n\nПредыдущие занятия были посвящены надежности расчета: организации книги, получению и очистке данных, показателям, сценариям, прогнозу, автоматизации. Здесь расчет считается корректным и обновляемым, а точка зрения меняется: пользователю нужен не расчетный слой, а интерфейс, быстро отвечающий на управленческий вопрос.\n\nРабочая книга состоит из трех слоев: лист `Data` с исходными строками (192 строки: 12 месяцев, 4 региона, 4 категории), лист `Calc` с расчетным слоем и лист `Dashboard` с экраном. Задача занятия – разобрать логику каждого слоя, проверить ее арифметически и сформулировать вывод, который экран подтверждает.\n\nПосле занятия нужно уметь:\n\n- формулировать пользователя и вопросы экрана до выбора диаграмм;\n- определять KPI и корректно агрегировать маржу;\n- реализовывать единый фильтр-контекст и проверять его на нескольких комбинациях;\n- проверять замыкание факторного разложения;\n- проводить технический и смысловой аудит экрана.\n\n> [!NOTE]\n> Используются `СУММЕСЛИМН`, `ПРОСМОТРX`, `ЕСЛИ`, `И`, `ИЛИ`, `ТЕКСТ`, сводные таблицы и срезы. В английском интерфейсе: `SUMIFS`, `XLOOKUP`, `IF`, `AND`, `OR`, `TEXT`. Требуется Excel 2021 или Microsoft 365.\n\n## 1. Дашборд как интерфейс к модели\n\nТипичная ошибка начинается с формулировки «нужен дашборд» и выбора типа диаграммы. Результат – набор корректных по отдельности визуализаций, не образующих решения.\n\nОтчет может быть подробным: десятки строк, пояснения, детализация, чтение последовательное и длительное. Дашборд должен создавать приоритет: пользователь не обязан просматривать каждый объект, чтобы понять состояние дел.\n\nМониторинговый экран отвечает на заранее известные вопросы и устойчив от периода к периоду. Исследовательский анализ допускает множество разрезов и перестройку графиков. Проектируется мониторинговый экран, поэтому ограниченное число показателей и фильтров – свойство задачи, а не недостаток реализации.\n\nПроектирование начинается с пользователя. В учебном примере за 30–60 секунд он должен ответить на три вопроса:\n\n1. Выполняется ли план.\n2. Где формируется отклонение.\n3. Какой фактор требует внимания.\n\nВопросы определяют компоновку. Карточки KPI отвечают на первый. График по месяцам показывает, когда возникает разрыв. Структура показывает, где формируется результат. Факторный блок объясняет, из чего складывается отклонение прибыли. Архитектура экрана – маршрут от общего результата к объяснению.\n\n> [!IMPORTANT]\n> Дашборд не отменяет детализацию, он не помещает ее на первый уровень. Листы `Data` и `Calc` остаются проверяемой основой экрана и при публикации не удаляются.\n\nИнтерактивность не является самостоятельной ценностью: фильтр, не меняющий решение, добавляет состояние, которое придется контролировать.\n\n```quiz\nquestion: С чего следует начинать проектирование управленческого дашборда?\nA: С выбора типов диаграмм\nB: С определения пользователя и вопросов, на которые экран должен отвечать\nC: С настройки условного форматирования и палитры\nD: С подсчета числа KPI, которые уместятся на листе\ncorrect: B\nexplanation: Тип диаграммы и оформление следуют из управленческого вопроса. Без определенного пользователя и вопросов набор визуализаций решения не образует.\n```\n\n## 2. KPI, план-факт и агрегация\n\nНа листе `Dashboard` четыре карточки: фактическая выручка, операционная прибыль, фактическая маржа, выполнение плана по выручке. У каждого показателя должно быть пять характеристик: что измеряется, единица, период, правило агрегации, база сравнения.\n\n```excel\nОтклонение, % = Факт / План - 1\n```\n\nДля выручки и прибыли знак отклонения совпадает с оценкой: факт ниже плана – отрицательное значение. Для затрат правило нельзя переносить автоматически: рост затрат – положительное отклонение, но управленчески неблагоприятное. Знак и цвет интерпретируются через смысл показателя.\n\nСлово «план» требует определения: бюджет, последний прогноз, лимит, целевое значение, прошлый год. База сравнения записывается явно, иначе одинаковое слово воспринимается как одинаковая методика.\n\n### Агрегированная маржа\n\nМаржа строки существует на листе `Data`, но среднее по столбцу присвоит сегментам одинаковый вес. Если сегмент с выручкой 1 млн руб. имеет маржу 50 %, а сегмент с выручкой 100 млн руб. – 10 %, среднее равно 30 %, тогда как итоговая маржа близка к 10 %. Итоговая маржа считается как отношение сумм:\n\n```excel\nМаржа = СУММ(Операционная прибыль) / СУММ(Выручка)\n```\n\nВ базовом фильтре среднее факт-марж по 192 строкам равно 32,98 %, а агрегированная маржа – 33,36 %; разница 0,38 п.п. На более неоднородных данных она больше.\n\nИзменение уровня маржи измеряется в процентных пунктах: от 20 % до 18 % – минус 2 п.п. Относительное снижение в процентах – другой показатель.\n\n> [!WARNING]\n> Подмена процентных пунктов процентами – частая содержательная ошибка отчетности. На карточке маржи указывается «п.п.»: это обозначение способа расчета.\n\n### Масштаб и точность\n\nВыполнение плана по выручке в базовом фильтре – 98,1 %, что выглядит нейтрально, но абсолютное отклонение составляет около 50,4 млн руб. В расчетном слое хранятся план, факт, абсолютное и относительное отклонение раздельно, даже если на карточку выводится часть из них. С другой стороны, значение 2 607 088 860,73 руб. на экране создает шум; уместнее 2,61 млрд руб. при полном значении в расчетном слое.\n\n```quiz\nquestion: Как корректно рассчитать итоговую маржу по выбранному срезу данных?\nA: Как среднее арифметическое марж отдельных строк\nB: Как медиану марж отдельных строк\nC: Как отношение суммы операционной прибыли к сумме выручки\nD: Как среднее марж, взвешенное по числу строк\ncorrect: C\nexplanation: Маржа – отношение двух аддитивных величин и агрегируется через суммы числителя и знаменателя. Среднее по строкам искажает результат: в учебной книге расхождение 0,38 п.п.\n```\n\n## 3. Визуальная иерархия\n\nПользователь замечает крупные и контрастные объекты прежде, чем читает ячейки. Размер и положение передают приоритет.\n\nНа учебном экране сверху расположены фильтры, ниже карточки, затем самая крупная визуализация – план-факт выручки по месяцам. Первый переход после ответа «план не выполняется» – понять, когда возник разрыв. Если бы главной задачей было сравнение регионов, центральным объектом стала бы региональная структура. Иерархия следует из решения, а не из шаблона.\n\nПроверка иерархии: временно сделать все элементы серыми. Если порядок чтения сохраняется за счет размера и положения, структура рабочая; если экран работает только благодаря ярким цветам, структура слабая.\n\nПравила оформления:\n\n- трехмерные диаграммы не применяются;\n- легенда убирается, если смысл ряда ясен из заголовка;\n- декоративные рамки и фоновые изображения не применяются, если они не кодируют состояние;\n- цвет расходуется ограниченно, роли цвета постоянны: один стиль для плана, один для факта, один для предупреждения;\n- заголовок передает смысл («План / факт выручки по месяцам»), а не номер («График 1»);\n- на соседних сравниваемых графиках масштаб осей унифицируется либо расхождение обозначается.\n\n> [!TIP]\n> Дашборд не обязан быть симметричным. Заполнение свободного места обычно приводит к появлению графика, о котором никто не просил.\n\n## 4. Единый фильтр-контекст\n\nНа листе `Dashboard` три фильтра: регион, категория, период до месяца. Значения по умолчанию – «Все», «Все», «Весь год».\n\nКонтекст реализован одним столбцом: в столбце `X` листа `Data` каждая строка получает 1, если удовлетворяет всем условиям, иначе 0. Карточки, таблицы `Calc` и диаграммы агрегируют только строки с единицей.\n\n```excel\n=ЕСЛИ(И(ИЛИ(Dashboard!$B$3=\"Все\";D5=Dashboard!$B$3);\n        ИЛИ(Dashboard!$D$3=\"Все\";E5=Dashboard!$D$3);\n        C5<=Calc!$B$5);1;0)\n```\n\nНомер последнего месяца периода вычисляется на листе `Calc`:\n\n```excel\n=ПРОСМОТРX(Dashboard!$F$3;Lists!$A$2:$A$14;Lists!$B$2:$B$14)\n```\n\nОдин фильтр меняет весь экран. Если карточка изменилась, а факторная диаграмма нет, пользователь видит экран в двух состояниях одновременно. Несогласованность возникает, когда одна часть экрана построена формулами, другая – сводной таблицей, третья – моделью данных: у каждого механизма свой фильтр.\n\nФильтр периода накопительный: сентябрь означает январь–сентябрь. Подпись «Период до» отражает эту логику; подпись «Месяц» была бы неверной.\n\n### Проверки фильтра\n\n1. Базовое состояние дает сумму по всем 192 строкам.\n2. Выбор региона меняет все элементы экрана одновременно; для «Центра» за год остается 48 строк (4 категории × 12 месяцев).\n3. Регион и категория вместе дают пересечение условий: 12 строк за год, 9 – за период до сентября.\n\n> [!WARNING]\n> Сохранение последних выбранных фильтров в общем файле опасно: следующий пользователь откроет экран в узком сегменте и примет локальные цифры за общий итог. Состояние по умолчанию и способ сброса проектируются явно.\n\nПустой сегмент не должен выводиться нулями: корректнее сообщение «Нет данных». Строка контекста, например «Регион: Центр | Категория: Продукт B | Период: Сентябрь», сохраняет смысл при печати, экспорте и пересылке скриншота.\n\n```quiz\nquestion: Зачем на листе Data введен служебный столбец «Выбрано» со значениями 1 и 0?\nA: Чтобы ускорить пересчет книги\nB: Чтобы все элементы экрана агрегировали один и тот же набор строк\nC: Чтобы скрыть лишние строки от пользователя\nD: Чтобы заменить сводные таблицы формулами\ncorrect: B\nexplanation: Столбец задает единый фильтр-контекст: логика фильтра описана один раз, а не в каждой диаграмме отдельно, поэтому один фильтр меняет весь экран согласованно.\n```\n\n## 5. Динамика и структура\n\nВопрос «когда» решается месячным план-фактом выручки: две серии на одной шкале. График показывает месяцы с большим разрывом, но точное значение читается на `Calc`. Роли разделены: визуализация обнаруживает закономерность, таблица подтверждает.\n\nВ базовом фильтре наибольшее отклонение в рублях приходится на октябрь: минус 7,11 млн руб. при плане 242,41 млн руб. По относительной величине октябрь и июль почти совпадают (минус 2,93 % в обоих случаях). Ранжирование по рублям и по процентам отвечает на разные вопросы, и выбор делается осознанно.\n\nВременной ряд сохраняет хронологический порядок; сортировка месяцев по величине разрушила бы логику времени. Для категорий без естественного порядка сортировка по величине уместна. Форма отклонения также важна: стабильный недобор и отклонение, возникшее с июля, дают одинаковый годовой итог, но разные управленческие действия.\n\nВопрос «где» решается структурой фактической выручки по категориям. В базовом фильтре крупнейшая – «Продукт D» (773,32 млн руб., 29,66 %), далее «Продукт C» (26,44 %), «Продукт B» (23,39 %), «Продукт A» (20,51 %). Горизонтальные полосы на общей оси сравнивать проще, чем секторы круговой диаграммы; круг допустим при трех-четырех различимых долях.\n\n> [!NOTE]\n> Структура уровня и структура отклонения – разные визуализации. Крупнейшая категория может быть близка к плану, а провал – находиться в меньшей. Если задача – работа с отклонениями, блок заменяется ранжированием категорий по вкладу в отклонение.\n\nЛюбой вывод о структуре привязан к контексту: «Продукт D крупнейший» верно только для выбранных фильтров.\n\n## 6. Факторы отклонения операционной прибыли\n\nТретий уровень объясняет, из чего сложилось отклонение. Используются четыре фактора:\n\n```excel\nЭффект объема = (Факт объем - План объем) × (План цена - План перем. затраты)\nЭффект цены = Факт объем × (Факт цена - План цена)\nЭффект перем. затрат = -Факт объем × (Факт перем. затраты - План перем. затраты)\nЭффект пост. затрат = -(Факт пост. затраты - План пост. затраты)\n```\n\nПри одновременном изменении цены и объема совместный эффект можно отнести к цене, к объему или выделить отдельно. Единственно правильной методики нет: требуется одна документированная, применяемая одинаково в каждом периоде. Здесь ценовой эффект считается на фактическом объеме, эффект объема – на плановой марже вклада на единицу.\n\nАрифметическое замыкание обязательно:\n\n```excel\nΔ Прибыль = Эффект объема + Эффект цены + Эффект перем. затрат + Эффект пост. затрат\n```\n\nВ базовом фильтре эффекты равны: объем минус 24 999 149 руб., цена плюс 3 836 240 руб., переменные затраты минус 5 588 643 руб., постоянные затраты минус 526 329 руб. Сумма минус 27 277 882 руб. совпадает с разностью фактической и плановой прибыли (869 660 479 минус 896 938 361). Незамкнутое разложение исправляется до публикации.\n\nГлавный фактор определяется по абсолютной величине вклада, знак показывает направление. В базовом фильтре на объем приходится 71,5 % абсолютного эффекта, на переменные затраты 16,0 %, на цену 11,0 %, на постоянные затраты 1,5 %. Все эффекты выражены в рублях прибыли: сравнение процентных изменений цены и объема без базы некорректно.\n\nВывод зависит от контекста. Для региона «Центр» главный фактор – цена (минус 5 186 175 руб., 48,2 %), объем даст минус 4 570 058 руб. (42,5 %). Для «Северо-Запада» план по прибыли перевыполнен на 1,28 %, главный фактор – снова цена, но с положительным знаком (плюс 2 762 285 руб.).\n\n> [!IMPORTANT]\n> Разложение объясняет структуру отклонения внутри модели, но не причины изменения объема или цены. Для этого нужен анализ спроса, доступности, сезонности и маркетинга. Дашборд показывает точку входа в анализ.\n\n```quiz\nquestion: Сумма четырех факторных эффектов не совпала с разностью фактической и плановой прибыли. Что следует сделать?\nA: Оставить диаграмму и подписать, что она отражает основные факторы\nB: Распределить невязку пропорционально между факторами\nC: Исправить методику разложения до точного замыкания\nD: Добавить столбец «Прочие факторы» с величиной невязки\ncorrect: C\nexplanation: Диаграмма без замыкания объясняет лишь часть отклонения, оставаясь убедительной. Невязку нельзя распределить или скрыть отдельным столбцом: исправляется сама методика.\n```\n\n## 7. Срезы и интерактивность\n\nФильтры учебного экрана – выпадающие списки: логика остается видимой. Срез – визуальный интерфейс фильтра сводной таблицы или таблицы; кнопки показывают активное состояние. Срез не рассчитывает показатель, а меняет контекст объекта: неверно определенный показатель срез не исправит.\n\nПорядок построения на листе `Срезы`: сводная таблица из таблицы `FactPlanTable`, регион в строки, категория в столбцы, факт и план выручки в значения, затем срезы «Регион» и «Категория». Один срез можно связать с несколькими сводными таблицами через «Подключения отчета»; связь нужно проверять после копирования таблицы или замены источника.\n\nДля даты обычно удобна временная шкала, но она требует настоящего типа «дата»: текст «Январь 2026» не даст ни шкалы, ни хронологического фильтра.\n\nСрез на каждое поле источника превращает экран в панель управления с неконтролируемым числом состояний. Сводная таблица со срезами и формульный `Dashboard` – две независимые системы фильтрации; при сверке контекст выставляется эквивалентно, иначе расхождение означает разные наборы строк.\n\n## 8. Контроль качества перед публикацией\n\nТехнический аудит – правильно ли считает экран:\n\n- обновляются ли данные и подключения;\n- совпадают ли итоги в двух независимых местах;\n- работают ли фильтры и восстанавливается ли базовое состояние;\n- нет ли ошибок формул в скрытых областях;\n- замкнуто ли факторное разложение;\n- связаны ли срезы с нужными сводными таблицами.\n\nСмысловой аудит – правильно ли экран будет прочитан:\n\n- понятны ли показатель и единица;\n- не перепутаны ли проценты и процентные пункты;\n- не создает ли цвет ложный сигнал там, где рост неблагоприятен;\n- указаны ли период и база сравнения;\n- достаточно ли содержательны заголовки.\n\nТестируются не только базовое состояние, но и сегмент с малым числом строк, неполный период, сегмент с положительным отклонением и сегмент с прибылью ниже плана. Внешний тест: коллега без участия в разработке за тридцать секунд формулирует вывод; несовпадение с задуманным означает проблему интерфейса при верных формулах. Часть рисков не связана с формулами: 98 % выполнения без суммы отклонения создает впечатление несущественности, зеленый индикатор роста выручки скрывает более быстрый рост затрат.\n\nТипичные ошибки:\n\n- проектирование от диаграмм, а не от вопросов пользователя;\n- маржа как среднее построчных значений;\n- изменение маржи в процентах вместо процентных пунктов;\n- фильтр применен к части элементов;\n- подпись фильтра не отражает логику («Месяц» вместо «Период до»);\n- факторное разложение не замкнуто;\n- главный фактор определен по знаку или проценту изменения, а не по абсолютному вкладу;\n- вывод по одному срезу перенесен на весь набор;\n- избыточные срезы.\n\n## 9. Использование ИИ: аудит экрана\n\nЯзыковая модель помогает найти неоднозначные формулировки и слабые места иерархии по описанию экрана. Числа и замыкание она проверить не может.\n\n```excel\nНиже приведено описание управленческого дашборда:\n\n[ВСТАВЬТЕ ПОЛЬЗОВАТЕЛЯ, ВОПРОСЫ ЭКРАНА, СПИСОК KPI С ОПРЕДЕЛЕНИЯМИ, ФИЛЬТРЫ, СОСТАВ ВИЗУАЛИЗАЦИЙ]\n\n1. Для каждого KPI проверь наличие единицы, периода, правила агрегации и базы сравнения.\n2. Найди показатели, где среднее по строкам может быть принято за агрегат.\n3. Найди места, где проценты могут быть спутаны с процентными пунктами.\n4. Укажи элементы, которые не отвечают ни на один из заявленных вопросов.\n5. Проверь, что подписи фильтров соответствуют их фактической логике.\n6. Предложи сегменты для тестирования, где экран может быть прочитан неверно.\n```\n\nЗамечания проверяются на листе `Calc`; предложения по формулам сверяются с контрольными значениями.\n\n## 10. Итоги занятия\n\n1. Проектирование начинается с пользователя и вопросов, а не с диаграмм.\n2. Каждый KPI имеет определение: единица, период, правило агрегации, база сравнения.\n3. Маржа агрегируется как отношение сумм; изменение уровня выражается в процентных пунктах.\n4. Все элементы экрана используют один фильтр-контекст, проверенный на нескольких комбинациях.\n5. Динамика отвечает на вопрос «когда», структура – «где», факторы – «почему».\n6. Факторное разложение замкнуто на каждом проверенном срезе; вывод о главном факторе привязан к контексту.\n7. Размер, положение и цвет поддерживают иерархию.\n8. Интерактивность ограничена разрезами, по которым принимаются решения; перед публикацией проводятся технический и смысловой аудит.\n\n## Практика: проверка и доработка дашборда\n\n**Задача.** Проверить определения KPI, фильтр-контекст и факторное разложение учебного дашборда, добавить показатель и строку контекста, построить сводную таблицу со срезами и подготовить схему переноса экрана в BI.\n\n**Файл.** [lesson-8.1.xlsx](materials/lesson-8.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла.\n\n**Что нужно сделать.**\n\n1. Проверить определения KPI на листе `Calc` и сравнить агрегированную маржу со средним строковых марж.\n2. Проверить фильтр-контекст на пяти комбинациях и вернуть базовое состояние.\n3. Прочитать динамику и структуру, проверить замыкание факторов в трех регионах и записать главный фактор.\n4. Добавить KPI «Выполнение плана по операционной прибыли» и строку контекста на `Dashboard`; построить сводную таблицу со срезами и сверить итоги.\n5. Провести визуальный аудит по шести критериям и составить схему переноса: датасет, показатели, измерения, селекторы, права.\n\n**Результат.** Книга с доработанным листом `Dashboard` и заполненным листом «Контроль»: значения для контекстов, определение нового KPI, замечания аудита, схема переноса в BI.\n", "8.2": "---\ntitle: \"BI-системы на примере DataLens\"\nsummary: \"Перенос проверенной аналитической модели в DataLens: подключение, плоский источник, датасет, формулы показателей и согласованность агрегации, чарты, селекторы, дашборд, права доступа, RLS и приемка по контрольным числам.\"\nsource: \"materials/lesson-8.2.xlsx\"\nconcepts:\n  - \"BI-система :: Платформа распространения аналитики: единое определение показателей, ссылка вместо файла, права на объект.\"\n  - \"Воркбук :: Контейнер DataLens, в котором хранятся подключения, датасеты, чарты и дашборды. Права выдаются на воркбук или коллекцию и наследуются объектами.\"\n  - \"Подключение :: Объект, определяющий, где находится источник данных.\"\n  - \"Датасет :: Аналитическая модель: поля, их роли и типы, вычисляемые показатели, связи таблиц.\"\n  - \"Измерение и показатель :: Измерение задает разрез анализа, к показателю применяется функция агрегации. Роль определяется применением агрегации.\"\n  - \"Вычисляемое поле :: Поле датасета, заданное формулой в синтаксисе DataLens; доступно всем чартам датасета.\"\n  - \"Согласованность агрегации :: Требование: в одном выражении нельзя смешивать агрегированные и неагрегированные значения.\"\n  - \"Чарт :: Отдельная визуализация на датасете, строится в визарде.\"\n  - \"Селектор :: Виджет дашборда, меняющий контекст связанных чартов; не создает расчетной логики.\"\n  - \"RLS :: Ограничение доступа к строкам датасета для пользователя или группы: к запросу добавляется фильтр по измерению.\"\n  - \"Приемка :: Проверка переноса: BI должен воспроизводить контрольные числа Excel в тех же контекстах.\"\n---\n\n# BI-системы на примере DataLens\n\n## Цели и требования\n\nНа занятии 8.1 управленческий экран собран в Excel: данные, расчетный слой и экран с четырьмя KPI, динамикой, структурой и факторным разложением. Определения проверены арифметически. Здесь та же модель переносится в BI-систему Yandex DataLens. Рассматриваются понятия, общие для BI-платформ: подключение, модель данных, вычисляемое поле, визуализация, селектор, дашборд, права доступа. Названия элементов интерфейса различаются, логика остается.\n\n> [!IMPORTANT]\n> BI не исправляет аналитику. Неверное определение показателя в Excel останется неверным в BI, но его увидит вся организация. Результат практики – не внешний вид, а дашборд, воспроизводящий контрольные числа 8.1.\n\nПосле занятия нужно уметь:\n\n- обосновывать перенос модели в BI и называть его границы;\n- готовить плоский источник и подключать его с корректными кодировкой, разделителем и типами;\n- создавать в датасете показатели с согласованной агрегацией;\n- строить чарты и дашборд с селекторами, связанными со всеми чартами;\n- выполнять приемку по контрольным числам и планировать права доступа.\n\n> [!NOTE]\n> Практика выполняется в DataLens. Материалы: [lesson-8.2.xlsx](materials/lesson-8.2.xlsx) (спецификации моделей, показателей, чартов, селекторов, доступа; листы «Задание» и «Контроль») и [factplan-2026.csv](materials/factplan-2026.csv) (источник для загрузки). Описание функций DataLens приведено по документации платформы; названия элементов интерфейса и ограничения могут измениться.\n\n## 1. Зачем переносить модель в BI\n\nExcel удобен для индивидуального анализа. Ограничения возникают, когда растет число пользователей, а не объем данных:\n\n- **распространение:** файл рассылается, и через неделю существует несколько версий; открывший старую копию не видит, что она старая;\n- **единственность определения:** в отделах «выручка» в двух книгах может считаться по-разному, расхождение обнаруживается на совещании;\n- **права доступа:** показать руководителю только его регион без копирования файла нельзя;\n- **аудируемость:** трудно определить, кто изменил формулу показателя и какие отчеты от нее зависят.\n\nВ BI показатель определяется один раз в модели и переиспользуется отчетами, пользователь получает ссылку, права выдаются на объект, зависимости между источником, моделью и визуализацией явные.\n\n> [!IMPORTANT]\n> BI – следующий слой распространения, а не замена расчетной работы. Excel остается средой разработки и проверки: в нем считаются контрольные значения, по которым принимается BI-решение. BI не проверяет экономический смысл показателя, не выбирает базу сравнения и не делает корректным незамкнутое разложение.\n\n```quiz\nquestion: Какую задачу BI-система решает принципиально лучше, чем рассылаемая книга Excel?\nA: Выполняет расчеты, недоступные формулам Excel\nB: Гарантирует экономическую корректность определений показателей\nC: Обеспечивает единое определение показателя и разграничение прав доступа\nD: Автоматически выбирает подходящий тип диаграммы\ncorrect: C\nexplanation: BI – слой распространения аналитики: одно определение показателя для всех отчетов, ссылка вместо копии, права на объект. Корректность определений и выбор визуализации остаются за аналитиком.\n```\n\n## 2. Архитектура решения\n\nПуть от данных до экрана состоит из четырех объектов:\n\n1. **Подключение** – где находится источник.\n2. **Датасет** – что считается: поля, роли, типы, вычисляемые показатели, связи.\n3. **Чарт** – как показать: отдельная визуализация на датасете.\n4. **Дашборд** – как пользоваться: экран из чартов и селекторов.\n\nОбъекты хранятся в **воркбуке**; воркбуки группируются в коллекции. Права доступа выдаются на воркбук или коллекцию и наследуются.\n\nСоответствие книге 8.1: лист `Data` – таблица подключения, лист `Calc` и производные столбцы – вычисляемые поля датасета, диаграммы – чарты, лист `Dashboard` – дашборд, выпадающие списки – селекторы, блок «Контроль интерпретации» – виджет «Текст». Полная таблица находится на листе «Модель».\n\nОдин объект не переносится: служебный столбец «Выбрано». В Excel он задавал фильтр-контекст формулой, в BI фильтрация – свойство платформы, и ее выполняют селекторы.\n\nПорядок работы – от вопросов к сборке: вопросы и показатели, подключение, датасет, чарты, дашборд. Начало с дашборда приводит к тем же ошибкам, что начало с выбора диаграммы в Excel.\n\n## 3. Подготовка источника и подключение\n\nТребования BI к источнику жестче, чем у Excel, и это полезно: пригодная таблица почти всегда понятнее.\n\nИсточник плоский: одна строка – один факт; нет объединенных ячеек, промежуточных итогов, пустых строк-разделителей, многоуровневых шапок, примечаний сбоку. Названия столбцов в одной строке, без повторов.\n\nПроизводные величины в источник не выносятся. На листе `Data` книги 8.1 двадцать четыре столбца, одиннадцать из них с формулами. В источнике для BI остаются одиннадцать исходных: дата, регион, категория и восемь первичных величин плана и факта. Остальное – вычисляемые поля датасета. Построчная маржа в источнике фиксирует один способ расчета и не суммируется; определенная в датасете как отношение агрегатов, она корректна в любом разрезе.\n\n### Подключение к файлу\n\nВ разделе «Файлы и сервисы» выбирается подключение «Файлы». Ограничения по документации:\n\n- форматы CSV, TXT и Excel (xlsx); каждый лист Excel считается отдельным файлом;\n- не более десяти файлов в подключении, 200 МБ на файл, 300 столбцов;\n- предпросмотр показывает первые 30 строк.\n\nЗагружается отдельный CSV, а не рабочая книга: из восьми листов книги семь методические. Для CSV задаются кодировка (`utf-8`, `utf-16`, `windows-1251`, `utf-8-sig`), разделитель (запятая, точка с запятой, табуляция) и признак заголовка. Файл занятия: `utf-8-sig`, точка с запятой, заголовок «Да»; десятичный разделитель – точка. Точка с запятой не конфликтует с запятыми внутри текста, точка исключает двойное толкование чисел.\n\nТипы столбцов задаются сразу при загрузке: ошибка типа, замеченная на этапе чартов, означает переделку датасета.\n\n> [!WARNING]\n> Дата должна распознаться как дата, а не строка. Текст «Январь 2026» не даст корректной сортировки, группировки по месяцам и фильтра по диапазону. В файле даты записаны как `2026-01-01`.\n\nОбновление файлового подключения выполняется заменой файла; для регулярно меняющихся данных это учебное решение, в рабочем контуре источником служит база данных.\n\n```quiz\nquestion: Почему производные столбцы – выручку, прибыль, маржу – не переносят в источник для BI?\nA: BI не умеет работать с большим числом столбцов\nB: Построчный расчет фиксирует один способ агрегации и мешает считать показатель в других разрезах\nC: Файл с формулами нельзя загрузить в подключение\nD: DataLens пересчитывает такие столбцы автоматически при загрузке\ncorrect: B\nexplanation: Построчная маржа не суммируется и не усредняется корректно. Определенная в датасете как отношение агрегатов, она верна в любом срезе.\n```\n\n## 4. Датасет: измерения и показатели\n\nДатасет – аналитическая модель из полей (до 1200). У поля две роли:\n\n- **измерение** задает разрез (дата, регион, категория), агрегация не применяется; в интерфейсе окрашено зеленым;\n- **показатель** содержит числа, к которым применяется агрегация; в интерфейсе синий.\n\nРоль меняется применением функции агрегации: с агрегацией поле – показатель, без нее – измерение. Тип данных (строка, дата, дата и время, дробное, целое число) определяет доступные агрегации: сумма и среднее – для чисел, количество – почти для всех типов, максимум и минимум недоступны для строк.\n\nВ учебном датасете три измерения и восемь числовых полей, на которых строятся вычисляемые показатели.\n\nЕсли источников несколько, таблицы объединяются связями (`INNER`, `LEFT`, `RIGHT`, `FULL`). DataLens создает связь автоматически по первому совпадению имени поля и типа; это предположение системы, а не утверждение аналитика, и его проверяют. Опция «Оптимизировать связь» включена по умолчанию: если в запросе поля только одной таблицы, соединение не выполняется. В учебном датасете таблица одна.\n\n## 5. Формулы показателей и согласованность агрегации\n\nВычисляемое поле создается в датасете и доступно всем чартам: так обеспечивается единственность определения. Синтаксис похож на SQL, поля заключаются в квадратные скобки. Определения 8.1 переносятся так:\n\n```excel\nПлан выручка = SUM([План объем] * [План цена])\nФакт выручка = SUM([Факт объем] * [Факт цена])\nПлан прибыль = SUM([План объем] * ([План цена] - [План перем затраты]) - [План пост затраты])\nФакт прибыль = SUM([Факт объем] * ([Факт цена] - [Факт перем затраты]) - [Факт пост затраты])\n\nВыполнение плана = [Факт выручка] / [План выручка]\nОтклонение выручки = [Факт выручка] / [План выручка] - 1\nПлан маржа = [План прибыль] / [План выручка]\nФакт маржа = [Факт прибыль] / [Факт выручка]\nИзменение маржи = ([Факт маржа] - [План маржа]) * 100\nИзменение прибыли = [Факт прибыль] - [План прибыль]\n```\n\nМаржа определена как отношение агрегатов: правило, разобранное в Excel, переносится дословно. Факторное разложение также переносится без изменений:\n\n```excel\nЭффект объема = SUM(([Факт объем] - [План объем]) * ([План цена] - [План перем затраты]))\nЭффект цены = SUM([Факт объем] * ([Факт цена] - [План цена]))\nЭффект переменных затрат = -SUM([Факт объем] * ([Факт перем затраты] - [План перем затраты]))\nЭффект постоянных затрат = -SUM([Факт пост затраты] - [План пост затраты])\n\nКонтроль замыкания = [Эффект объема] + [Эффект цены] + [Эффект переменных затрат]\n                     + [Эффект постоянных затрат] - [Изменение прибыли]\n```\n\nСлужебный показатель «Контроль замыкания» на экран пользователя не выносится.\n\n### Согласованность агрегации\n\nВ одном выражении нельзя смешивать агрегированные и неагрегированные значения: неагрегированное поле имеет в группе много значений, и система не знает, какое взять. Результат – ошибка `ERR.DS_API.FORMULA.VALIDATION.AGG.INCONSISTENT`. Примеры по документации: `[Sales] / SUM([Sales])` работает, только если `Sales` добавлено в чарт как измерение группировки; выражение `[Total Sales] - [Profit]` ошибочно, корректная запись – `[Total Sales] - SUM([Profit])`.\n\nСпособы исправления:\n\n- применить агрегацию ко всем полям выражения;\n- разделить выражение на несколько показателей;\n- использовать LOD-выражения, когда нужна вложенная агрегация или другая группировка.\n\nВ словаре показателей правило соблюдено по построению: внутри `SUM(...)` только неагрегированные поля, снаружи – только агрегированные показатели. Полезно один раз создать такую ошибку намеренно и прочитать текст.\n\n> [!TIP]\n> Показатель записывается в словарь до создания в интерфейсе: название, формула, роль, единица, база сравнения, вопрос. Словарь служит заданием, документацией и основой приемки.\n\n```quiz\nquestion: В датасете создается поле [Факт прибыль] - [План пост затраты], где «Факт прибыль» – агрегированный показатель, а «План пост затраты» – исходное числовое поле. Что произойдет?\nA: Формула сохранится, второе поле будет просуммировано автоматически\nB: Формула сохранится, но будет считаться только при группировке по дате\nC: Возникнет ошибка несогласованной агрегации операндов\nD: Поле будет создано как измерение\ncorrect: C\nexplanation: В выражении смешаны агрегированное и неагрегированное значения. Корректная запись – [Факт прибыль] - SUM([План пост затраты]).\n```\n\n## 6. Чарты, селекторы и дашборд\n\nЧарт строится в визарде: датасет, тип визуализации, затем поля по секциям (X, Y, цвета, сортировка, фильтры). Соответствие экрана 8.1:\n\n- четыре карточки – четыре индикатора по одному показателю;\n- план-факт по месяцам – линейная диаграмма: дата по X с группировкой по месяцам, два показателя по Y;\n- структура фактической выручки – линейчатая диаграмма: категория по Y, показатель по X, сортировка по показателю;\n- факторное разложение – столбчатая диаграмма: четыре эффекта в секции Y.\n\nПри добавлении нескольких показателей в чарт появляются технические поля `Measure Names` и `Measure Values`: через них показатели отображаются как отдельные столбцы с подписями и цветом. В список полей датасета они не входят.\n\nТипы виджетов дашборда: «Чарт», «Селектор», «Селектор (JS)», «Текст», «Заголовок», «Инсайт». Связи строятся между селекторами и чартами. Нужны три селектора: регион и категория (списки с множественным выбором), период (календарь с диапазоном дат). В 8.1 фильтр периода был накопительным («Период до»); в BI тот же смысл выражает диапазон дат, и подпись должна соответствовать реальной логике.\n\n> [!WARNING]\n> Чарт, не связанный с селектором, остается в прежнем контексте. Экран выглядит работающим: часть элементов меняется, часть нет. Проверка связей обязательна.\n\nЗначения по умолчанию задаются одинаково у всех селекторов. Пояснения на дашборде – виджет «Текст» или «Заголовок».\n\n## 7. Права доступа и публикация\n\nДоступ настраивается не на каждом объекте, а на уровне коллекций и воркбуков и наследуется.\n\nРоли организации:\n\n- `datalens.visitor` – доступ к сервису; просмотр и редактирование возможны при наличии ролей на воркбуки;\n- `datalens.creator` – то же и создание воркбуков и коллекций в корне;\n- `datalens.admin` – полный доступ.\n\nРоли воркбука по возрастанию, каждая включает предыдущую: `datalens.workbooks.limitedViewer`, `viewer`, `editor`, `admin`. Автору воркбука роль администратора назначается автоматически.\n\nСтруктура воркбуков повторяет структуру доступа, а не тематику: дашборды для разных аудиторий размещаются в разных воркбуках, даже при общем датасете.\n\n### Доступ к строкам: RLS\n\nRLS ограничивает строки одного датасета для пользователя или группы: к запросу добавляется фильтр вида\n\n```excel\nwhere измерение in (значение_1, значение_2 ... значение_N)\n```\n\nТиповой случай: руководитель региона видит тот же дашборд, но только свой регион. В Excel это требовало отдельных файлов. В конфигурации указывается название группы, а не идентификатор: при переименовании группы конфигурация обновляется, иначе доступ перестанет работать без сообщений.\n\n> [!IMPORTANT]\n> RLS меняет данные, а не интерфейс. Приемка выполняется под учетной записью без ограничений по строкам, иначе расхождение с 8.1 будет объясняться правами, а поиск ошибки пойдет в формулах.\n\n## 8. Приемка и контроль качества\n\nПеренос выполнен, когда BI воспроизводит числа Excel. Контрольные значения для трех контекстов находятся на листе «Контроль».\n\n**Контекст 1:** все регионы, категории, весь 2026 год, 192 строки. Плановая выручка 2 657 524 362 руб., фактическая 2 607 088 860,73 руб., отклонение минус 1,90 %. Плановая прибыль 896 938 361 руб., фактическая 869 660 479,24 руб., отклонение минус 3,04 %. Плановая маржа 33,75 %, фактическая 33,36 %, изменение минус 0,39 п.п. Эффекты: объема минус 24 999 149, цены плюс 3 836 239,73, переменных затрат минус 5 588 643,49, постоянных затрат минус 526 329 руб.; сумма равна изменению прибыли минус 27 277 881,76 руб., контроль замыкания равен нулю.\n\n**Контекст 2:** регион «Центр», 48 строк. Факт выручки 620 209 101,40 руб., факт прибыли 203 602 804,85 руб., отклонение прибыли минус 4,65 %, главный фактор – цена (минус 5 186 174,60 руб.).\n\n**Контекст 3:** регион «Северо-Запад», 48 строк. Факт выручки 583 730 222,05 руб., факт прибыли 196 358 917,58 руб., отклонение прибыли плюс 1,28 %, главный фактор – цена с положительным вкладом 2 762 285,05 руб.\n\nТретий контекст проверяет фильтрацию: если при смене региона главный фактор и знак отклонения не меняются, селекторы связаны не со всеми чартами либо показатели считают не то, что задумано.\n\nТипичные ошибки:\n\n- перенос производных столбцов вместо определения показателей в датасете;\n- маржа как среднее построчных значений;\n- смешение агрегированных и неагрегированных полей;\n- дата, загруженная как строка;\n- чарт без связи с селектором;\n- селектор на каждое поле источника;\n- права, выданные в обход воркбука, и структура воркбуков, не совпадающая со структурой доступа;\n- приемка под учетной записью с RLS;\n- публикация до сверки контрольных чисел.\n\n```quiz\nquestion: В общем контексте BI показывает те же числа, что Excel, но при выборе региона часть чартов не меняется. Что это означает?\nA: Особенность кеширования, нужно обновить страницу\nB: Ошибку в формулах показателей\nC: Отсутствие связи между селектором и частью чартов\nD: Срабатывание RLS для текущей учетной записи\ncorrect: C\nexplanation: Совпадение чисел в общем контексте говорит, что показатели определены верно. Несогласованная реакция на селектор – признак чартов без связи с ним.\n```\n\n## 9. Использование ИИ: проверка модели и формул\n\nЯзыковая модель помогает проверить словарь показателей на согласованность агрегации и найти формулы, воспроизводящие среднее по строкам. Числа и замыкание проверяются в BI.\n\n```excel\nНиже приведены словарь показателей и описание датасета для DataLens:\n\n[ВСТАВЬТЕ ПОЛЯ ИСТОЧНИКА, ФОРМУЛЫ ПОКАЗАТЕЛЕЙ, СПИСОК ЧАРТОВ И СЕЛЕКТОРОВ]\n\n1. Найди выражения, в которых агрегированные и неагрегированные значения смешаны в одной формуле.\n2. Найди показатели-отношения, определенные не как отношение агрегатов.\n3. Проверь, что изменение маржи выражено в процентных пунктах.\n4. Проверь, что факторные эффекты замыкаются на изменение прибыли.\n5. Укажи чарты, для которых не сформулирован управленческий вопрос.\n6. Укажи, какие селекторы должны быть связаны с каждым чартом.\n```\n\nФормулы проверяются в датасете, а контрольные числа – по листу «Контроль».\n\n## 10. Итоги занятия\n\n1. BI – слой распространения аналитики: единое определение показателя, ссылка вместо файла, права на объект.\n2. Источник плоский, без производных столбцов; тип даты распознан верно.\n3. Показатели создаются в датасете и записываются в словарь с формулой, единицей и базой сравнения.\n4. В одном выражении агрегированные и неагрегированные значения не смешиваются.\n5. Маржа – отношение агрегатов, изменение уровня выражается в процентных пунктах.\n6. Все чарты связаны со всеми селекторами, значения по умолчанию одинаковы.\n7. Структура воркбуков соответствует структуре доступа; RLS меняет данные.\n8. Перенос принимается по контрольным числам трех контекстов.\n\n## Практика: перенос модели в DataLens\n\n**Задача.** Перенести модель из книги 8.1 в DataLens: загрузить источник, создать датасет с показателями, построить чарты и дашборд с селекторами, выполнить приемку по трем контекстам и описать схему прав.\n\n**Файл.** [lesson-8.2.xlsx](materials/lesson-8.2.xlsx) и [factplan-2026.csv](materials/factplan-2026.csv). Пошаговые инструкции находятся на листе «Задание», контрольные значения – на листе «Контроль» внутри книги.\n\n**Что нужно сделать.**\n\n1. Определить слой DataLens для каждого объекта дашборда 8.1.\n2. Создать подключение к файлу `factplan-2026.csv` с кодировкой `utf-8-sig` и разделителем «точка с запятой», проверить типы.\n3. Создать датасет и показатели по словарю, намеренно воспроизвести ошибку согласованности агрегации и исправить ее.\n4. Построить четыре индикатора и три диаграммы, собрать дашборд, добавить три селектора и связать их со всеми чартами.\n5. Выполнить приемку по трем контекстам, записать значения BI и описать схему прав доступа и границы применимости Excel и BI.\n\n**Результат.** Дашборд в DataLens, воспроизводящий контрольные числа, и заполненный лист «Контроль»: значения BI, причины расхождений (если есть), схема прав, три решения 8.1, измененные при переносе, и вывод о границах применимости.\n", "9.1": "---\ntitle: \"Оптимизационные задачи\"\nsummary: \"Постановка задачи оптимизации, надстройка «Поиск решения», линейные, целочисленные и нелинейные задачи, отчет по устойчивости и теневые цены, локальные оптимумы и границы применимости результата.\"\nsource: \"materials/lesson-9.1.xlsx\"\nconcepts:\n  - \"Переменные решения :: Величины, значения которых выбирает модель: объемы выпуска, доли портфеля, признаки включения проекта.\"\n  - \"Целевая функция :: Показатель, который нужно максимизировать или минимизировать; в Excel – одна ячейка с формулой.\"\n  - \"Ограничение :: Условие на переменные или на функции от них, определяющее допустимое множество решений.\"\n  - \"Допустимое решение :: Набор значений переменных, удовлетворяющий всем ограничениям.\"\n  - \"Симплекс-метод :: Метод решения линейных задач; находит глобальный оптимум линейной модели.\"\n  - \"ОПГ (GRG) :: Обобщенный понижающий градиент: метод решения гладких нелинейных задач; находит локальный оптимум.\"\n  - \"Эволюционный метод :: Эвристический поиск для негладких задач; не гарантирует оптимума и зависит от случайных чисел.\"\n  - \"Бинарная переменная :: Целочисленная переменная со значениями 0 и 1; кодирует решение «реализовать или нет».\"\n  - \"Теневая цена :: Прирост целевой функции при увеличении правой части активного ограничения на единицу.\"\n  - \"Активное ограничение :: Ограничение, выполняющееся как равенство в оптимуме; только такие ограничения имеют ненулевую теневую цену.\"\n  - \"Индекс рентабельности (PI) :: Отношение NPV проекта к инвестициям; основа жадного правила отбора проектов.\"\n  - \"Локальный оптимум :: Решение, которое нельзя улучшить небольшими изменениями переменных, но которое может уступать глобальному.\"\n---\n\n# Оптимизационные задачи\n\n## Цели и требования\n\nАнализ чувствительности и сценарии отвечают на вопрос «что будет, если». Оптимизация отвечает на обратный вопрос: какие значения управляемых переменных дают наилучший результат при заданных ограничениях. Занятие вводит три типа задач, различающихся способом решения и надежностью результата: линейную (ассортимент), целочисленную (отбор проектов) и нелинейную (портфель).\n\n> [!IMPORTANT]\n> Решатель возвращает оптимум модели, а не оптимум реальной системы. Результат корректен настолько, насколько корректны целевая функция, ограничения и входные данные.\n\nПосле занятия нужно уметь:\n\n- записывать задачу в виде переменных решения, целевой функции и ограничений;\n- выбирать метод решения по типу задачи;\n- читать отчет по устойчивости и использовать теневые цены;\n- решать задачи с бинарными переменными и сравнивать результат с эвристикой;\n- проверять результат решателя и указывать границы его применимости.\n\n> [!NOTE]\n> Используются надстройка «Поиск решения» (Solver), `СУММПРОИЗВ`, `МУМНОЖ`, `КОРЕНЬ`. В английском интерфейсе: `SUMPRODUCT`, `MMULT`, `SQRT`. Надстройка включается в разделе «Файл – Параметры – Надстройки». В Excel для Mac и в веб-версии Excel доступность и интерфейс надстройки отличаются; на таких версиях задание нужно выполнять в классическом Excel для Windows.\n\n## 1. Постановка задачи\n\nЛюбая задача оптимизации состоит из трех элементов:\n\n| Элемент | Содержание | Где находится в книге |\n|---|---|---|\n| Переменные решения | Значения, которые подбирает решатель | Ячейки с входными значениями (изменяемые ячейки) |\n| Целевая функция | Один показатель для максимизации или минимизации | Одна ячейка с формулой, зависящей от переменных |\n| Ограничения | Условия допустимости | Формулы использования ресурсов и граничные значения |\n\nТребования к модели на листе:\n\n- целевая ячейка и левые части ограничений являются формулами от изменяемых ячеек: связь не должна проходить через вставленные значения;\n- параметры (маржа, нормы расхода, лимиты) хранятся в отдельных ячейках и не вшиваются в ограничения Solver;\n- единицы измерения единообразны в целевой функции и ограничениях.\n\nПример (лист `ProductMix`): четыре продукта, маржа на единицу 110, 90, 140 и 70 тыс. руб. Выпуск ограничен тремя ресурсами (станочные часы, материал, трудозатраты) и максимальным спросом по каждому продукту (400, 350, 300 и 500 единиц). Цель – максимум суммарной маржи:\n\n```excel\nЦель:        =СУММПРОИЗВ(B5:E5; B10:E10)\nРесурс i:    =СУММПРОИЗВ($B$10:$E$10; B6:E6)   <=  лимит i\nСпрос:       B10:E10 <= B9:E9\nЗнак:        B10:E10 >= 0\n```\n\n```quiz\nquestion: Какое утверждение о формуле целевой ячейки верно?\nA: Целевая ячейка может содержать константу, если значение подобрано вручную\nB: Целевая ячейка должна зависеть от изменяемых ячеек через формулы\nC: Целевая ячейка должна находиться на том же листе, что и ограничения\nD: Целевая ячейка должна быть единственной ячейкой листа с формулой\ncorrect: B\nexplanation: Решатель меняет изменяемые ячейки и пересчитывает целевую. Если связь разорвана значением, изменение переменных не влияет на цель и поиск теряет смысл.\n```\n\n## 2. Надстройка «Поиск решения» и выбор метода\n\nВ диалоге задаются целевая ячейка (максимум, минимум или заданное значение), изменяемые ячейки, ограничения и метод решения. Три метода различаются по классу задач:\n\n| Метод | Класс задач | Гарантия |\n|---|---|---|\n| Симплекс (линейный) | Целевая функция и все ограничения линейны по переменным | Глобальный оптимум, если он существует |\n| ОПГ (GRG, нелинейный) | Гладкие нелинейные функции | Локальный оптимум; зависит от начальной точки |\n| Эволюционный | Негладкие функции: ЕСЛИ, ОКРУГЛ, ВПР от переменных | Нет гарантии; результат зависит от случайных чисел и числа итераций |\n\nПравила выбора:\n\n1. Линейная задача решается только симплекс-методом. Использование ОПГ на линейной задаче допустимо, но дает меньше информации и менее надежно.\n2. При включении флажка «Сделать переменные без ограничений неотрицательными» ограничения неотрицательности отдельно не вводятся.\n3. Если симплекс-метод сообщает о нелинейности модели, причина обычно в `ЕСЛИ`, `МАКС`, `ОКРУГЛ` или произведении двух переменных; такую формулу нужно переписать в линейном виде или сменить метод.\n4. Для эволюционного метода задаются границы всех переменных; без них поиск неустойчив.\n\nСообщения решателя нужно читать полностью. «Решение найдено» означает выполнение критериев сходимости, но не корректность модели. «Допустимое решение не найдено» означает противоречивые ограничения. «Значения целевой ячейки не сходятся» означает, что задача неограничена: в модели пропущено ограничение.\n\n```quiz\nquestion: Задача содержит целевую функцию и ограничения, линейные по переменным. Какой метод выбирается?\nA: Эволюционный: он универсален\nB: ОПГ: он быстрее симплекса\nC: Симплекс: он дает глобальный оптимум линейной задачи\nD: Любой, результат не зависит от метода\ncorrect: C\nexplanation: Для линейной задачи симплекс-метод находит глобальный оптимум и позволяет получить отчет по устойчивости с теневыми ценами. ОПГ и эволюционный метод таких гарантий не дают.\n```\n\n## 3. Линейная задача: ассортимент\n\nРешение задачи листа `ProductMix` симплекс-методом дает выпуск 270, 120, 0 и 500 единиц продуктов A, B, C и D, суммарная маржа 75 500 тыс. руб.\n\nИспользование ресурсов в оптимуме:\n\n| Ресурс | Использовано | Лимит | Статус |\n|---|---|---|---|\n| Станочные часы | 1 800 | 1 800 | Активное |\n| Материал, кг | 3 330 | 3 400 | Не активное (остаток 70) |\n| Трудозатраты | 1 400 | 1 400 | Активное |\n\nОграничение спроса активно только у продукта D (500 единиц). Продукт C не выпускается: его маржа на единицу ресурсов ниже, чем у остальных, и ресурсы выгоднее направить на A, B и D.\n\nВыводы из структуры решения:\n\n- оптимум линейной задачи находится в вершине допустимого множества: число ненулевых переменных не превышает числа активных ограничений;\n- «самый маржинальный продукт на единицу» (C, 140) не обязан входить в оптимум: важна маржа относительно потребления ограниченных ресурсов;\n- неактивный ресурс (материал) не ограничивает результат, и его увеличение не даст прироста.\n\n## 4. Отчет по устойчивости и теневые цены\n\nПосле решения симплекс-методом доступен отчет «Устойчивость» (Sensitivity). Для изменяемых ячеек он содержит допустимые приращения целевых коэффициентов, при которых оптимальный план не меняется, для ограничений – теневые цены и допустимые приращения правых частей.\n\nТеневая цена ограничения – прирост целевой функции при увеличении правой части на единицу, пока набор активных ограничений не меняется.\n\n| Ограничение | Теневая цена, тыс. руб. на единицу ресурса |\n|---|---|\n| Станочные часы | 30 |\n| Материал | 0 |\n| Трудозатраты | 10 |\n\nПроверка: увеличение лимита станочных часов с 1 800 до 1 810 повышает маржу на 10 × 30 = 300 тыс. руб. (до 75 800), если решить задачу заново.\n\nПрименение теневой цены:\n\n- сравнение с ценой дополнительной единицы ресурса: если час работы станка можно закупить дешевле 30 тыс. руб., расширение выгодно в пределах допустимого приращения;\n- ранжирование узких мест: ограничения с нулевой теневой ценой не требуют внимания;\n- оценка стоимости требований: теневая цена ограничения по спросу показывает, чего стоит вынужденный минимальный выпуск.\n\n> [!WARNING]\n> Теневая цена действует только в пределах допустимого приращения из отчета. За его границами меняется набор активных ограничений, и значение нужно получать повторным решением. В нелинейных задачах отчет содержит множители Лагранжа, которые интерпретируются аналогично, но локально.\n\n```quiz\nquestion: Теневая цена станочных часов равна 30 тыс. руб. Лимит увеличен на 10 часов в пределах допустимого приращения. Каков прирост цели?\nA: 30 тыс. руб.\nB: 300 тыс. руб.\nC: 3 тыс. руб.\nD: Определить нельзя без повторного решения\ncorrect: B\nexplanation: Прирост равен теневой цене, умноженной на приращение ресурса: 30 × 10 = 300 тыс. руб., пока набор активных ограничений не изменился.\n```\n\n## 5. Целочисленные и бинарные задачи: отбор проектов\n\nЕсли решение состоит в выборе «реализовать или нет», переменная принимает значения 0 и 1. В Solver для этого вводится ограничение «bin» (бинарное) на изменяемые ячейки. Лист `Capital`: восемь проектов, бюджет 100 млн руб., цель – максимум суммарной NPV.\n\n| Проект | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 |\n|---|---|---|---|---|---|---|---|---|\n| Инвестиции, млн руб. | 28 | 22 | 35 | 18 | 40 | 15 | 25 | 30 |\n| NPV, млн руб. | 12,9 | 11,0 | 15,5 | 8,6 | 18,7 | 5,6 | 12,0 | 13,6 |\n\n```excel\nИспользовано:  =СУММПРОИЗВ(B5:B12; C5:C12)    <=  B14\nСуммарная NPV: =СУММПРОИЗВ(B5:B12; D5:D12)\nПеременные:    B5:B12 – bin\n```\n\nОптимум: проекты 2, 3, 4 и 7, инвестиции 100 млн руб., NPV 47,1 млн руб.\n\nЖадное правило – выбирать проекты по убыванию индекса рентабельности `PI = NPV / Инвестиции`, пока позволяет бюджет – дает проекты 2, 7, 4 и 1 (инвестиции 93 млн руб., NPV 44,5 млн руб.). Потеря относительно оптимума – 2,6 млн руб. Причина: правило не учитывает «остаток» бюджета, который нельзя использовать, и поэтому не гарантирует оптимума.\n\nЕсли снять требование целочисленности (переменные от 0 до 1), решение допускает доли проектов, и значение цели возрастает до 47,96 млн руб. Это верхняя граница для целочисленной задачи; сравнение с ней показывает, насколько ограничение целочисленности дорого обходится.\n\nЛогические условия записываются линейными неравенствами:\n\n| Условие | Ограничение |\n|---|---|\n| Проекты 3 и 4 взаимоисключающие | `x3 + x4 <= 1` |\n| Проект 5 возможен только при проекте 2 | `x5 <= x2` |\n| Выбрать не более трех проектов | `СУММ(x) <= 3` |\n\nПри условии «3 и 4 несовместимы» оптимум снижается до 46,2 млн руб. (проекты 3, 5 и 7). Разность 47,1 − 46,2 = 0,9 млн руб. – стоимость этого ограничения.\n\n> [!NOTE]\n> Для целочисленных задач Solver использует ветвление и границы. Параметр «Допуск» (Integer Optimality) по умолчанию ненулевой, поэтому решение может отличаться от точного оптимума на малую долю. В параметрах при необходимости допуск уменьшают до нуля. Теневые цены в целочисленных задачах отчетом не выдаются.\n\n```quiz\nquestion: Почему оптимум с бинарными переменными не превышает оптимум той же задачи с долями проектов (0 ≤ x ≤ 1)?\nA: Бинарные переменные сужают допустимое множество, поэтому цель не может вырасти\nB: Бинарные переменные увеличивают число ограничений в оптимуме\nC: Доли проектов запрещены в обеих задачах\nD: Решатель всегда снижает результат при бинарных переменных\ncorrect: A\nexplanation: Допустимое множество целочисленной задачи входит в допустимое множество ее непрерывной релаксации. Значение релаксации служит верхней границей для максимума.\n```\n\n## 6. Нелинейная задача: портфель с минимальным риском\n\nЛист `Portfolio`: четыре актива с ожидаемой доходностью и стандартным отклонением.\n\n| Актив | Доходность | Стандартное отклонение |\n|---|---|---|\n| Облигации | 8 % | 4 % |\n| Акции РФ | 14 % | 22 % |\n| Акции США | 12 % | 18 % |\n| Золото | 6 % | 15 % |\n\nКовариации рассчитываются из корреляций: `cov(i; j) = corr(i; j) × σi × σj`. Для весов `w` дисперсия портфеля равна `wᵀ Σ w`:\n\n```excel\nКовариация:   =B12*$D$5*$D$5      (корреляция × σi × σj)\nДисперсия:    =СУММПРОИЗВ(МУМНОЖ(B19:E22; B5:B8); B5:B8)\nДоходность:   =СУММПРОИЗВ(B5:B8; C5:C8)\nσ портфеля:   =КОРЕНЬ(B26)\n```\n\nПостановка: минимум `σ портфеля` при `СУММ(w) = 1`, `доходность >= 9 %`, `0 <= w <= 1`. Метод – ОПГ. Результат при минимальной доходности 9 %:\n\n| Показатель | Значение |\n|---|---|\n| Веса: облигации / акции РФ / акции США / золото | 0,799 / 0,098 / 0,103 / 0 |\n| Доходность | 9,00 % |\n| Стандартное отклонение | 5,20 % |\n\nСравнение: равные веса 0,25 дают доходность 10,00 % при стандартном отклонении 10,37 %. При требовании 10 % оптимальный портфель (0,613 / 0,225 / 0,162 / 0) имеет отклонение 7,92 %. Рост требуемой доходности на один процентный пункт повышает риск с 5,20 до 7,92 %.\n\nПрактические замечания:\n\n- формула дисперсии использует `МУМНОЖ` и требует корректной размерности (4 × 4 на 4 × 1); в версиях без динамических массивов ввод выполняется как формула массива;\n- веса, близкие к нулю, не округляются вручную: изменение весов нарушает ограничение суммы;\n- ожидаемые доходности, отклонения и корреляции оцениваются по истории и сами содержат ошибку; оптимизатор усиливает эту ошибку, выбирая активы с благоприятными оценками. Результат нужно проверять на устойчивость к входным данным.\n\n## 7. Локальные оптимумы и проверка результата\n\nМетод ОПГ находит локальный оптимум. Для выпуклой задачи (дисперсия портфеля при линейных ограничениях) локальный оптимум совпадает с глобальным: запуск из разных начальных точек (равные веса или 0,7 / 0,1 / 0,1 / 0,1) дает один и тот же результат. Для невыпуклых задач результат зависит от начальной точки.\n\nПроверка результата решателя:\n\n1. **Ограничения выполняются.** Использование ресурсов, сумма весов и бинарность проверяются прямым просмотром, а не только по сообщению Solver.\n2. **Модель воспроизводит известный случай.** При простых значениях (нулевой выпуск, равные веса) формулы дают ожидаемые числа.\n3. **Решение устойчиво к старту.** Запуск из двух-трех начальных точек (для нелинейных и эволюционных методов обязателен).\n4. **Решение имеет смысл.** Нулевой выпуск продукта C, отсутствие золота в портфеле или целиком использованный бюджет должны объясняться структурой задачи.\n5. **Входы проверены.** Небольшое изменение маржи или лимита не должно менять решение скачком; иначе оно получено на границе устойчивости.\n\nУсловия, при которых результат нельзя принимать без дополнительной проверки: модель содержит округления и условия, зависящие от переменных; параметры оценены с большой погрешностью; оптимум лежит на границе допустимых значений, заданных произвольно; решатель вернул «Решение найдено» после остановки по числу итераций.\n\n```quiz\nquestion: Результат ОПГ в нелинейной невыпуклой задаче получен из одной начальной точки. Что требуется перед использованием?\nA: Ничего: сообщение «Решение найдено» гарантирует глобальный оптимум\nB: Повторный запуск из нескольких начальных точек и сравнение результатов\nC: Замена метода на симплекс\nD: Увеличение допуска сходимости до максимума\ncorrect: B\nexplanation: ОПГ сходится к локальному оптимуму. Совпадение результатов нескольких запусков повышает уверенность, различие указывает на несколько локальных оптимумов.\n```\n\n## 8. Использование ИИ: проверка постановки задачи\n\nИИ полезен для формулировки ограничений и поиска пропущенных условий, но не для расчета оптимума: числовой результат должен быть получен в Solver. Запрос задается с полным описанием модели:\n\n```excel\nДана задача оптимизации.\nПеременные: объем выпуска четырех продуктов, ед.\nЦель: максимум суммарной маржи (110, 90, 140, 70 тыс. руб./ед.).\nОграничения: станочные часы <= 1800, материал <= 3400, трудозатраты <= 1400, спрос по продуктам не выше заданного.\nПроверь постановку: перечисли пропущенные ограничения, нелинейности, допущения о делимости переменных и условия, при которых решение будет неустойчивым. Расчет оптимума не выполняй.\n```\n\nПолученные замечания проверяются на модели: каждое предложенное ограничение либо вводится в Solver и оценивается по изменению результата, либо отклоняется с указанием причины.\n\n## 9. Итоги занятия\n\n- Задача оптимизации задается переменными, целевой функцией и ограничениями; целевая ячейка связана с переменными формулами.\n- Метод выбирается по классу задачи: симплекс – линейные (глобальный оптимум), ОПГ – гладкие нелинейные (локальный), эволюционный – негладкие (без гарантий).\n- Теневые цены из отчета по устойчивости оценивают ценность дополнительной единицы ресурса в пределах допустимого приращения.\n- В бинарной задаче жадное правило по индексу рентабельности может уступать оптимуму; значение релаксации служит верхней границей.\n- Результат решателя проверяется: выполнение ограничений, воспроизведение известного случая, устойчивость к стартовой точке и входным данным.\n\n## Практика: оптимизация ассортимента, бюджета и портфеля\n\n**Задача.** Решить три оптимизационные задачи в Solver (линейную, бинарную и нелинейную), прочитать отчет по устойчивости и проверить результаты.\n\n**Файл.** [lesson-9.1.xlsx](materials/lesson-9.1.xlsx). Пошаговые инструкции находятся на листе «Задание», контрольные значения – на листе «Контроль» внутри книги.\n\n**Что нужно сделать.**\n\n1. Включить надстройку «Поиск решения» и записать постановку задачи ассортимента: переменные, цель, ограничения.\n2. Решить задачу ассортимента симплекс-методом, определить активные ограничения и теневые цены по отчету по устойчивости, проверить одну теневую цену повторным решением.\n3. Решить задачу выбора проектов с бинарными переменными, сравнить результат с жадным правилом и значением релаксации, добавить условие несовместимости проектов 3 и 4.\n4. Решить задачу портфеля методом ОПГ при минимальной доходности 9 % и 10 %, проверить результат из другой начальной точки.\n5. Воспроизвести сообщения решателя о несовместимых ограничениях и неограниченной задаче и записать условия, при которых результат нельзя принимать без проверки.\n\n**Результат.** Книга с найденными решениями и заполненным листом «Контроль».\n", "9.2": "---\ntitle: \"Моделирование неопределенности и Monte Carlo\"\nsummary: \"Вероятностные распределения входов, генерация случайных чисел и обратные функции в Excel, симуляция NPV на 1000 итерациях, статистики результата, перцентили и вероятность убытка, сходимость, корреляции входов и ограничения метода.\"\nsource: \"materials/lesson-9.2.xlsx\"\nconcepts:\n  - \"Метод Монте-Карло :: Расчет модели на большом числе случайных наборов входных параметров для получения распределения результата.\"\n  - \"Итерация :: Один расчет модели на одном случайном наборе входов.\"\n  - \"Обратная функция распределения :: Функция, преобразующая равномерное число U(0;1) в значение с заданным распределением.\"\n  - \"Треугольное распределение :: Распределение с минимумом, наиболее вероятным значением (модой) и максимумом; используется при экспертных оценках.\"\n  - \"Логнормальное распределение :: Распределение положительной величины, логарифм которой нормален; задается медианой и σ логарифма.\"\n  - \"Перцентиль :: Значение, ниже которого лежит заданная доля результатов; P5 и P95 ограничивают 90 % исходов.\"\n  - \"Вероятность убытка :: Доля итераций, в которых NPV меньше нуля.\"\n  - \"Стандартная ошибка среднего :: σ / √N; оценка погрешности среднего, вызванной конечным числом итераций.\"\n  - \"Сходимость :: Стабилизация статистики симуляции при росте числа итераций.\"\n  - \"Фиксированный набор случайных чисел :: Сохраненные значения U(0;1), обеспечивающие воспроизводимость симуляции.\"\n---\n\n# Моделирование неопределенности и Monte Carlo\n\n## Цели и требования\n\nСценарии и стресс-тесты задают небольшое число состояний мира вручную. Метод Монте-Карло задает вероятностные распределения входных параметров и рассчитывает модель сотни и тысячи раз, получая распределение результата: не одно значение NPV, а диапазон исходов и вероятность каждого из них.\n\n> [!IMPORTANT]\n> Результат симуляции определяется выбранными распределениями. Тысяча итераций повышает точность расчета, но не исправляет ошибочные допущения о входах.\n\nПосле занятия нужно уметь:\n\n- выбирать распределение для входного параметра и задавать его параметры;\n- генерировать значения с заданным распределением из равномерных чисел;\n- строить симуляцию NPV в Excel без надстроек и обеспечивать ее воспроизводимость;\n- рассчитывать среднее, σ, перцентили и вероятность убытка и оценивать сходимость;\n- определять вклад входов в риск и указывать границы применимости метода.\n\n> [!NOTE]\n> Используются `СЛЧИС`, `НОРМ.ОБР`, `ЛОГНОРМ.ОБР`, `ПРОЦЕНТИЛЬ.ВКЛ`, `СТАНДОТКЛОН.В`, `СРЗНАЧ`, `СЧЁТЕСЛИ`, `КОРРЕЛ`, `СУММПРОИЗВ`. В английском интерфейсе: `RAND`, `NORM.INV`, `LOGNORM.INV`, `PERCENTILE.INC`, `STDEV.S`, `AVERAGE`, `COUNTIF`, `CORREL`, `SUMPRODUCT`. Модель – учебная NPV из занятия 4.1.\n\n## 1. Принцип метода и схема модели\n\nСхема симуляции:\n\n1. Определить входы с неопределенностью и задать распределение каждого.\n2. Для каждой итерации получить случайный набор входов.\n3. Рассчитать выход (NPV) по детерминированной модели.\n4. Повторить N раз и изучить распределение выхода.\n\nВ модели листа `Simulation` неопределенность задана для трех входов; остальные параметры детерминированы (лист «Параметры»: инвестиции 30 млн руб., ставка 15 %, налог 20 %, постоянные затраты 18 млн руб. в первом году, темпы роста объема, цены, переменных затрат и постоянных затрат 4, 3, 3 и 4 %).\n\n| Вход | Распределение | Параметры |\n|---|---|---|\n| Объем, ед. | Треугольное | минимум 65 000, мода 80 000, максимум 90 000 |\n| Цена, руб. | Нормальное | среднее 1 200, σ 100 |\n| Переменные затраты, руб./ед. | Логнормальное | медиана 700, σ логарифма 0,08 |\n\nМодель NPV для итерации: операционная прибыль каждого года (`объем × цена − объем × затраты − постоянные затраты`, с ростом по годам), налог только на положительную прибыль, дисконтирование по ставке 15 % и вычет инвестиций:\n\n```excel\nОП год t:  = Объем*(1+gv)^(t-1) * Цена*(1+gp)^(t-1)\n           - Объем*(1+gv)^(t-1) * Затраты*(1+gvc)^(t-1)\n           - ПостЗатр*(1+gfc)^(t-1)\nNPV:       = -Инвестиции + СУММПРОИЗВ((ОП - (ОП>0)*ОП*Налог) / (1+Ставка)^Годы)\n```\n\nДетерминированный расчет на модальных значениях (строка 3 листа `Simulation`) дает NPV 39 602 574 руб.\n\n```quiz\nquestion: Что является результатом симуляции Монте-Карло в отличие от сценарного анализа?\nA: Одно наиболее вероятное значение NPV\nB: Распределение NPV с оценками перцентилей и вероятностей\nC: Таблица из трех сценариев с заданными весами\nD: Точное значение NPV без погрешности\ncorrect: B\nexplanation: Симуляция строит распределение результата по множеству случайных наборов входов. Из него определяются среднее, разброс, перцентили и вероятности событий, например убытка.\n```\n\n## 2. Выбор распределений\n\nРаспределение должно отражать природу величины и имеющуюся информацию:\n\n| Распределение | Когда использовать | Параметры |\n|---|---|---|\n| Равномерное | Известны только границы, внутри все значения равновероятны | Минимум, максимум |\n| Треугольное | Есть экспертная оценка: минимум, наиболее вероятное и максимум | Минимум, мода, максимум |\n| Нормальное | Симметричные отклонения вокруг среднего (цены, курсы за короткий период) | Среднее, σ |\n| Логнормальное | Положительная величина с правой асимметрией (затраты, цены сырья) | Медиана (или среднее), σ логарифма |\n\nПравила:\n\n- границы распределения должны исключать физически невозможные значения: объем и затраты не могут быть отрицательными; нормальное распределение допускает любые значения, поэтому σ ограничивается так, чтобы вероятность невозможных значений была пренебрежимо мала;\n- параметры задаются на основе данных или документированной экспертной оценки; выбор «по привычке» превращает симуляцию в иллюстрацию допущений;\n- асимметричное распределение смещает среднее относительно моды: для объема среднее равно `(65 000 + 80 000 + 90 000) / 3 = 78 333`, что ниже моды 80 000.\n\n## 3. Генерация значений: СЛЧИС и обратные функции\n\nФункция `СЛЧИС()` возвращает равномерное число из интервала [0; 1). Значение с нужным распределением получается подстановкой этого числа в обратную функцию распределения (метод обратного преобразования):\n\n```excel\nНормальное:      =НОРМ.ОБР(U; среднее; σ)\nЛогнормальное:   =ЛОГНОРМ.ОБР(U; LN(медиана); σ_лог)\nТреугольное:     =ЕСЛИ(U < (мода-мин)/(макс-мин);\n                      мин + КОРЕНЬ(U*(макс-мин)*(мода-мин));\n                      макс - КОРЕНЬ((1-U)*(макс-мин)*(макс-мода)))\n```\n\nУ треугольного распределения нет готовой функции Excel; формула делит интервал U на две ветви. Для объема точка деления равна `(80 000 − 65 000) / (90 000 − 65 000) = 0,6`.\n\nДля параметра `ЛОГНОРМ.ОБР` второй аргумент – среднее логарифма, равное `LN(медиана)`; медиана 700 соответствует `LN(700)`. Среднее логнормального распределения выше медианы: `медиана × EXP(σ²/2)`.\n\nКаждому входу выделяется отдельное равномерное число (столбцы U1, U2, U3): использование одн
