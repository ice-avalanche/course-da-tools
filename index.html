трока);\n- заголовки в пятой строке и пустой столбец между «Категория» и «Январь»;\n- числа записаны текстом с неразрывным пробелом в качестве разделителя тысяч (`1 240 500,00`), в отдельных ячейках есть символ валюты;\n- часть значений – настоящие числа, часть – текст;\n- заполнители отсутствующих данных: `-` и `н/д`; в одной ячейке значения нет совсем;\n- названия точек и категорий записаны по-разному (регистр, пробел в конце, неразрывный пробел);\n- промежуточные итоги, итог по сети, повторная шапка таблицы и подписи в конце листа.\n\nКаждая особенность превращается в отдельный шаг запроса.\n\n## 3. Структура: что оставить в таблице\n\nПорядок шагов важен. Сначала приводится в порядок **структура** (какие строки и столбцы остаются), затем текст, затем формат «широкий → длинный» и только после этого числа и типы. Причины объясняются по ходу.\n\n### Служебная шапка и заголовки\n\n1. «Главная» → «Удалить строки» → «Удалить верхние строки», значение `4`.\n2. «Использовать первую строку в качестве заголовков».\n\nЕсли после навигации в списке шагов уже появились автоматические «Повышенные заголовки» и «Измененный тип», их нужно удалить и выполнить эти действия самостоятельно. Автоматическая типизация выполняется до очистки и на сырых данных делает ошибки (подробнее в разделе 5).\n\nСтолбец без заголовка и без данных (он получит имя вида `Column3`) удаляется командой «Удалить столбцы».\n\n### Какие строки считать данными\n\nВ таблице есть строки четырех видов: записи (точка, категория, суммы), промежуточные и общие итоги, пустые строки, повторная шапка и подписи.\n\nЕсть два подхода к удалению лишних строк.\n\n**Перечень известных исключений.** Снять флажки с «Итого по Северо-Западу» и «Итого по Уралу». Запрос обработает текущий файл. Когда в следующей выгрузке появится «Итого по Центральному», фильтр его не исключит, и итог попадет в данные как «точка».\n\n**Признак записи.** Определить, чем запись отличается от всего остального, и оставить только то, что этому признаку отвечает. В выгрузке каждая запись имеет заполненную категорию, а итоги, подписи и пустые строки – нет.\n\n1. Столбец «Категория» → фильтр «Удалить пустые».\n2. Столбец «Торговая точка» → фильтр «Не равно» значению «Торговая точка» (повторная шапка: категория в ней заполнена словом «Категория»).\n\nПосле этого остаются 11 строк.\n\n> [!NOTE]\n> Различаются решение, которое работает на текущем файле, и решение, которое воспроизводимо. Фильтр по признаку записи выдерживает новые регионы и новые подписи, фильтр по списку известных значений – нет.\n\n### Практика\n\n1. Удалить четыре верхние строки и назначить заголовки.\n2. Удалить пустой столбец.\n3. Оставить только записи: категория не пуста, строка не повторяет шапку.\n4. Убедиться, что осталось 11 строк.\n\n```quiz\nquestion: Почему фильтр «категория заполнена» надежнее, чем снятие флажков с «Итого по Северо-Западу» и «Итого по Уралу»?\nA: Он работает быстрее на больших таблицах\nB: Он описывает признак записи и исключает любые новые итоги и подписи, а не только известные сегодня\nC: Он автоматически исправляет регистр\nD: Он преобразует итоги в null\ncorrect: B\nexplanation: Фильтр по списку известных значений привязан к текущему файлу. Условие, описывающее запись, остается верным, когда в выгрузке появляются новые итоговые строки.\n```\n\n## 4. Стандартизация текста\n\nЗначения, которые выглядят одинаково, могут не совпадать технически. Для Power Query строки `Точка №1 «Центр»` и `точка №1 центр` – разные. Пока написание не единое, их нельзя сопоставить со справочником (занятие 2.2) и связать в модели данных (занятие 3.1).\n\nВ выгрузке одна и та же точка встречается:\n\n- в разном регистре;\n- с пробелом в конце (`Точка №3 «Заводская» `);\n- с неразрывным пробелом вместо обычного (после номера точки №2);\n- с кавычками и без них (`Точка №1 «Центр»`, `точка №1 центр`).\n\n### Последовательность\n\nДля столбцов «Торговая точка» и «Категория» выполняются подряд:\n\n1. **Заменить неразрывный пробел обычным.** «Преобразование» → «Заменить значения»: символ неразрывного пробела копируется из любой исходной ячейки и вставляется в поле «Значение для поиска». Набранный с клавиатуры пробел не заменит ничего, так как это другой символ.\n2. «Преобразование» → «Формат» → **«Обрезать»** (пробелы в начале и конце).\n3. «Формат» → **«Очистить»** (непечатаемые управляющие символы).\n4. «Формат» → **«Каждое Слово С Прописной Буквы»** (единый регистр).\n5. Удалить кавычки-«елочки» двумя заменами: `«` и `»` на пустое значение. Точка в разных источниках записана и с кавычками, и без них, поэтому кавычки не являются частью названия, по которому значения сопоставляются.\n\n> [!WARNING]\n> Каждая из команд решает свою задачу. «Обрезать» не затрагивает пробелы внутри строки; «Очистить» не удаляет неразрывный пробел. Проверка результата выполняется по уникальным значениям столбца (фильтр столбца или вкладка «Вид» → «Профиль столбца»): их должно остаться ровно столько, сколько есть в действительности.\n\nПосле стандартизации в «Торговой точке» остаются 5 различных значений: `Точка №1 Центр`, `Точка №2 Приморская`, `Точка №3 Заводская`, `Точка №5 Вокзальная`, `Точка №8 Луговая`. В «Категории» – 4: Бакалея, Молочная, Напитки, Непродовольственные.\n\n### Ограничение регистра\n\nКоманда «Каждое Слово С Прописной Буквы» подходит для названий, но искажает значения, в которых по смыслу есть строчные слова: `Магазин у дома` превратится в `Магазин У Дома`. Для таких столбцов используется «нижний регистр» или значения приводятся к одному написанию иным способом. Принцип прежний: единое написание, а не конкретная команда.\n\n### Дубликаты: после стандартизации\n\nУдаление дубликатов выполняется **после** стандартизации. До нее `Точка №8 «Луговая»` с регионом `урал` и та же точка с регионом `Урал` – разные строки. После приведения регистра они совпадают, и дубликат удаляется командой «Удалить дубликаты».\n\nПорядок «стандартизировать, затем сравнивать и удалять» применяется во всех операциях, использующих равенство значений: удаление дубликатов, группировка, слияние, связи модели.\n\n### Столбец из примеров\n\nКоманда «Добавление столбца» → «Столбец из примеров» позволяет ввести несколько ожидаемых результатов, после чего Power Query подбирает правило. Инструмент подходит для извлечения фрагмента текста, разделения и объединения строк.\n\n> [!WARNING]\n> Правило выводится по нескольким образцам и может быть верным на первых строках и неверным на остальных. Выражение шага необходимо прочитать, а результат проверить на строках, не вошедших в образцы.\n\n### Практика\n\n1. Стандартизировать «Торговую точку» и «Категорию» по последовательности выше.\n2. Проверить число уникальных значений: 5 и 4.\n3. Переименовать шаги по смыслу.\n\n```quiz\nquestion: В какой момент следует удалять дубликаты в справочнике, где одна и та же точка записана с разным регистром региона?\nA: До стандартизации, чтобы уменьшить число строк\nB: После стандартизации, когда одинаковые по смыслу значения становятся одинаковыми и по записи\nC: Дубликаты удалять не нужно\nD: Только вручную после загрузки на лист\ncorrect: B\nexplanation: До стандартизации строки различаются регистром, и Power Query считает их разными. После приведения к единому виду дубликат становится явным и удаляется.\n```\n\n## 5. От широкого формата к длинному\n\nИсходная выгрузка записана в широком формате:\n\n```excel\nТорговая точка | Категория | Январь | Февраль | Март\n```\n\nЧитателю такой вид удобен. Для регулярной обработки он неудобен: при появлении апреля меняется структура таблицы (добавляется столбец), а вместе с ней приходится пересматривать формулы, сводные таблицы и шаги запроса, которые ссылаются на месяцы по именам.\n\nВ длинном формате период хранится значением:\n\n```excel\nТорговая точка | Категория | Месяц | Сумма\n```\n\nНовый период добавляет **строки**, структура не меняется. Рабочее правило курса: данные хранятся и обрабатываются в длинном формате, а широкое представление формируется на этапе отчета (сводная таблица, занятие 8.1).\n\n### Два варианта преобразования\n\n1. Выделить столбцы месяцев → «Преобразование» → «Отменить свертывание столбцов». В запрос записываются имена трех месяцев.\n2. Выделить «Торговая точка» и «Категория» → **«Отменить свертывание других столбцов»**. В запрос записываются имена двух столбцов, которые остаются.\n\nРезультат на текущем файле одинаков. Различие проявляется на следующем: в первом случае апрель в запрос не попадает, во втором – попадает автоматически.\n\n> [!NOTE]\n> «Отменить свертывание других столбцов» описывает **роль** столбцов (идентифицирующие и значения), а не сегодняшний перечень месяцев. Такое описание воспроизводимо.\n\nСтолбцы «Атрибут» и «Значение» переименовываются в «Месяц» и «Сумма».\n\n### Контроль количества строк\n\nПосле unpivot должно быть **33 строки** (11 записей × 3 месяца). Если число строк другое, на предыдущих шагах потеряны или добавлены записи.\n\n### Почему unpivot выполняется до очистки сумм\n\nМесяцы в широкой таблице – три столбца. Очистка сумм (замена заполнителей, символов, приведение типа) в таком виде выполнялась бы тремя одинаковыми шагами с привязкой к именам `Январь`, `Февраль`, `Март`. На апрельской выгрузке, где есть единственный столбец `Апрель`, такие шаги выдали бы ошибку из-за отсутствия столбцов. После unpivot все суммы находятся в **одном** столбце «Сумма», и очистка записывается один раз.\n\n```quiz\nquestion: Почему для регулярной выгрузки предпочтителен вариант «Отменить свертывание других столбцов»?\nA: Он всегда выполняется быстрее\nB: Он фиксирует идентифицирующие столбцы, поэтому новые месяцы автоматически попадают в длинный формат\nC: Он автоматически удаляет строки с null\nD: Он превращает все столбцы в текст\ncorrect: B\nexplanation: Воспроизводимый запрос должен выдерживать появление нового периода. Если зафиксированы только столбцы, остающиеся без изменений, любые другие столбцы разворачиваются независимо от их числа и названий.\n```\n\n## 6. Типы данных, локаль и отсутствующие значения\n\nРаздел относится к наиболее частым источникам молчаливых ошибок. Столбец «Сумма» после unpivot содержит смесь значений:\n\n| Значение в источнике | Что это |\n| --- | --- |\n| `1 240 500,00` | текст с неразрывным пробелом и запятой |\n| `512 900,00 ₽` | текст с символом валюты |\n| `655400` | настоящее число (в том же столбце, что и текст) |\n| `н/д`, `-` | заполнители отсутствующих данных |\n| пусто | null |\n\n### Порядок действий\n\nПравило: **сначала очищается содержимое, затем задается тип.**\n\n1. Привести столбец «Сумма» к типу **«Текст»**. Столбец смешанный: команды замены и обрезки работают с текстом и дают ошибку на значениях-числах. После приведения к тексту число `655400` становится строкой `655400`.\n2. «Заменить значения»: `₽` на пустое значение.\n3. «Преобразование» → «Формат» → «Обрезать» (убирает пробельные символы по краям, в том числе остаток после символа валюты).\n4. «Заменить значения»: `н/д` на `null`.\n5. «Заменить значения»: `-` на `null`.\n6. «Тип данных» → **«Использовать локаль»** → «Десятичное число», локаль **«Русский (Россия)»**.\n\nВ окне замены `null` вводится словом `null`; Power Query воспримет его как отсутствие значения, а не как текст.\n\nЗамена `-` выполняется при включенном параметре «Сопоставлять все содержимое ячейки» (дополнительные параметры окна). Иначе дефис будет удален из любого значения, где он встречается.\n\nЕсли после шага 6 в одной-двух ячейках появилось `Error`, в значении остался неразрывный пробел, не удаленный обрезкой. Его нужно заменить на пустое значение (символ копируется из ячейки) и повторить установку типа. Такая диагностика – обычная часть работы: причину ошибки показывает щелчок по ячейке.\n\n### Заполнители: null, не ноль\n\nЗначения `н/д` и `-` означают отсутствие данных. Заменять их нулем нельзя:\n\n- `0` – значение известно и равно нулю;\n- `null` – значение неизвестно.\n\nРазличие влияет на среднее, количество наблюдений и дальнейшие расчеты. Если заменить отсутствующую сумму нулем, среднее по точке окажется заниженным, а количество продаж – завышенным.\n\n### Локаль\n\nЗапись `1 240 500,00` подчиняется правилам русской локали: разделитель тысяч – неразрывный пробел, десятичный – запятая. Нежелательный путь – глобально заменять запятые точками и удалять пробелы: значения подгоняются под ожидания программы. Правильный путь – сообщить Power Query, **по каким правилам записан источник**, командой «Использовать локаль».\n\n> [!NOTE]\n> Выбор локали определяет и результат разбора дат. Текст `03.04.2026` в русской локали – 3 апреля, в американской – 4 марта. При неверной локали часть дат преобразуется **без ошибки, но неправильно**. Это тот же класс риска, что и молчаливые ошибки занятия 1.1.\n\n### Преждевременная типизация\n\nАвтоматический шаг «Измененный тип» создается сразу после импорта, когда данные еще не очищены. Тип, определенный по первым строкам, может оказаться неверным для остальных и вызвать ошибку, а при последующем изменении источника – остановить запрос. Поэтому автоматический шаг удаляется, а типы устанавливаются в конце.\n\n### Контрольные значения\n\nПосле приведения типа и до загрузки проверяются:\n\n- 33 строки;\n- 4 строки с пустой суммой (`н/д`, два дефиса и одна пустая ячейка);\n- сумма за январь – 6 627 560, за февраль – 5 605 630, за март – 6 646 260 (всего 18 879 450).\n\n### Сверка с итоговыми строками источника\n\nСтроки «Итого» удалены из данных, но выгрузка содержит собственные итоговые значения: «ВСЕГО ПО СЕТИ» за февраль указано как 4 987 800. Сумма очищенных данных за февраль – 5 605 630. Расхождение – 617 830.\n\nИсточник ошибся: итог за февраль по Уралу (2 160 170) не учитывает значение 617 830 по точке №3 «Заводская», категория «Бакалея». Итоги за январь и март с данными совпадают. Запрос, обработавший данные верно, выявил дефект самой выгрузки.\n\n> [!WARNING]\n> Итоговые строки отчета не являются эталоном. Сверка данных с итогом показывает, что **где-то** есть расхождение; какой из двух источников неверен, определяется по составу строк.\n\n### Практика\n\n1. Привести «Сумма» к тексту, заменить `₽`, обрезать, заменить `н/д` и `-` на null.\n2. Установить тип «Десятичное число» с локалью «Русский (Россия)».\n3. Проверить 33 строки и 4 пустые суммы.\n4. Сверить суммы по месяцам с контрольными значениями.\n\n```quiz\nquestion: Почему значения «н/д» и «-», обозначающие отсутствие данных, не следует заменять нулем?\nA: Power Query не умеет хранить нулевые значения\nB: Ноль и отсутствие значения имеют разный смысл и по-разному влияют на среднее и количество\nC: Ноль превращает столбец в текстовый\nD: Null используется только для дат\ncorrect: B\nexplanation: Ноль – это известное значение. Null – отсутствие информации. Подмена одного другим искажает среднее, число наблюдений и последующие расчеты.\n```\n\n## 7. Реестр поступлений: даты в нескольких форматах\n\nЛист «Поступления» воспроизводит типичную выгрузку банковского клиента. Столбец «Дата» содержит значения разной записи:\n\n| Значение | Формат |\n| --- | --- |\n| `01.02.2026` | день.месяц.год |\n| `2026-02-14` | ISO |\n| `3 марта 2026` | текст с названием месяца |\n| `15.02.26` | двузначный год |\n| `46073` | порядковый номер даты Excel, записанный текстом |\n\nОдин шаг «Изменить тип → Дата» с одной локалью не разберет все варианты: часть значений превратится в ошибки. Задачу решают столбцом, в котором для каждого значения предпринимается попытка разбора, а при неудаче используется запасной способ. Для этого служит пользовательский столбец («Добавление столбца» → «Пользовательский столбец»):\n\n```excel\ntry Date.FromText([Дата], [Culture = \"ru-RU\"])\notherwise Date.From(Number.FromText([Дата], \"ru-RU\"))\n```\n\nВыражение читается так: попытаться разобрать значение как дату по правилам русской локали; если не получилось – считать значение порядковым номером и перевести номер в дату.\n\n### Разбор выражения\n\n- `try ... otherwise ...` перехватывает ошибку и выполняет запасной вариант вместо остановки запроса.\n- `Date.FromText` разбирает текст как дату; `Culture` задает локаль.\n- `Number.FromText` преобразует текст в число; `Date.From` – число в дату (отсчет от 30.12.1899, как в Excel).\n\n> [!WARNING]\n> Конструкция `try ... otherwise` не сообщает, какой из способов сработал. Значение, разобранное неверно (например, порядковый номер из другого периода), ошибкой не станет. После такого шага необходимо проверить диапазон полученных дат: минимум и максимум должны попадать в ожидаемый период.\n\nВ реестре поступлений даты должны лежать между 01.02.2026 и 30.03.2026. Значение вне диапазона указывает на неверный разбор.\n\n### Остальные столбцы\n\n- «Сумма» обрабатывается как в разделе 6 (символ валюты, заполнители `-` и `н/д`, локаль).\n- «Торговая точка» стандартизируется полной последовательностью раздела 4, включая удаление кавычек: в реестре встречается запись без кавычек (`точка №1 центр`), в справочнике – с кавычками. Одинаковая обработка реестра и справочника приводит обе записи к одному ключу `Точка №1 Центр`.\n\nПосле обработки реестр содержит 12 строк, 2 пустые суммы, сумма поступлений – 7 586 160. Поступления от точки №1 «Центр» (три платежа) составляют 3 340 940.\n\n### Справочник точек\n\nНа листе «Справочник точек» те же проблемы: регистр, пробелы, дубликат точки №8 «Луговая», текстовые даты открытия. После стандартизации «Наименования» и «Региона» (по последовательности раздела 4), удаления дубликатов и установки типа «Дата» для «Даты открытия» в справочнике должно остаться **8 строк**.\n\n```quiz\nquestion: Что делает конструкция try ... otherwise в M?\nA: Удаляет строки с ошибками\nB: Выполняет выражение, а при ошибке возвращает результат запасного выражения\nC: Преобразует текст в число\nD: Отключает проверку типов\ncorrect: B\nexplanation: try перехватывает ошибку вычисления, otherwise задает значение на этот случай. Запрос не останавливается, поэтому результат шага нужно проверять отдельно.\n```\n\n## 8. Загрузка результата, обновление и диагностика\n\n### Загрузка\n\n- **«Закрыть и загрузить»** помещает результат на лист в виде структурированной таблицы (занятие 1.1).\n- **«Закрыть и загрузить в…»** позволяет выбрать режим, в том числе «Только создать подключение»: данные не занимают лист. Этот режим нужен для справочников и промежуточных запросов, а также для моделей данных, где таблица фактов может быть больше, чем помещается на лист (занятие 3.1).\n\n### Обновление на следующей выгрузке\n\nЛист «Продажи апрель» источника представляет следующий период той же системы: та же структура, один столбец месяца, 7 записей и один заполнитель `-`.\n\nЗапрос переключается на апрель правкой одной строки:\n\n1. Выделить шаг «Навигация» (второй шаг запроса).\n2. В строке формул заменить название листа:\n\n```excel\n= Источник{[Item = \"Продажи апрель\", Kind = \"Sheet\"]}[Data]\n```\n\n3. Просмотреть результат по шагам.\n\nПосле правки в таблице должно быть 7 строк, 1 пустая сумма, сумма 5 022 500. Если запрос отработал **без изменения других шагов**, он воспроизводим. Если какой-то шаг выдал ошибку, он зависит от названий или состава столбцов, которых в апрельской выгрузке нет (например, ссылается на столбец `Январь`).\n\nДля получения резервной копии без переключения исходного запроса его можно дублировать («Дублировать» в контекстном меню запроса) и изменить только в копии.\n\n### Настройки обновления\n\n«Данные» → «Запросы и подключения» → правый щелчок на запросе → «Свойства». Основные параметры:\n\n- обновлять при открытии файла;\n- обновлять каждые N минут;\n- сохранять или удалять данные при неудачном обновлении.\n\nОбновление при открытии удобно, но на больших и сетевых источниках замедляет запуск. Сохранение прежних данных при неудаче тоже имеет две стороны: лучше старые данные, чем пустой отчет, но старые данные могут быть восприняты как текущие. Компромисс – показывать на листе **дату последнего успешного обновления**.\n\n### Диагностика ошибок\n\nРазличаются два вида ошибок.\n\n**Ошибка в ячейке.** В просмотре появляется `Error`. Щелчок по ячейке показывает причину. Строку не следует сразу удалять: ошибка может указывать на реальный дефект источника (например, неразобранная дата).\n\n**Ошибка шага.** Шаг ссылается на столбец, которого больше нет, или на значение, которое изменилось. Запрос останавливается. Типичная причина – изменение структуры источника.\n\nПоиск места проблемы выполняется щелчками по шагам **сверху вниз**: ищется первый шаг, после которого данные перестали соответствовать ожиданиям. Ошибка нередко возникает раньше, чем становится заметной.\n\n### Практика\n\n1. Загрузить результат запроса на лист.\n2. Переименовать все шаги по смыслу.\n3. Переключить запрос на лист «Продажи апрель» и проверить: 7 строк, 1 пустая сумма, сумма 5 022 500.\n\n## 9. Использование ИИ: разбор шагов Power Query\n\nЯзыковая модель полезна для чтения чужого M-кода и первичной диагностики. Запрос формулируется как проверка воспроизводимости:\n\n```excel\nНиже приведен M-код запроса Power Query:\n\n[ВСТАВЬТЕ КОД ИЗ РАСШИРЕННОГО РЕДАКТОРА]\n\n1. Перечисли шаги по порядку и опиши результат каждого простыми словами.\n2. Для каждого шага укажи, на какие названия столбцов, значения, типы и локали он опирается.\n3. Найди шаги, которые остановятся или дадут неверный результат, если:\n   - в выгрузке появится новый месяц;\n   - изменится название столбца;\n   - появится новая итоговая строка;\n   - в числовом столбце появится новый заполнитель вместо числа.\n4. Найди шаги, которые выполняются слишком рано (например, типизация до очистки).\n5. Если предлагаешь изменить код, не меняй смысл обработки и отдельно перечисли, что нужно проверить после изменения.\n```\n\nОтвет модели является гипотезой. После любого изменения необходимо самостоятельно:\n\n1. пройти по шагам запроса сверху вниз;\n2. сравнить число строк до и после изменения;\n3. проверить типы и наличие `Error`;\n4. сверить суммы с контрольными значениями;\n5. обновить запрос на следующей выгрузке.\n\n## 10. Итоги занятия\n\nНеобходимо зафиксировать семь положений:\n\n1. Power Query сохраняет последовательность обработки, а не только результат. Качество запроса определяется тем, выдержит ли он следующую выгрузку.\n2. Сначала приводится в порядок структура (строки, столбцы), затем текст, затем формат таблицы, затем типы.\n3. Лишние строки удаляются по признаку записи, а не по списку известных значений.\n4. Тип данных задается после очистки; числа и даты разбираются с указанием локали источника, а не заменой разделителей.\n5. Заполнители отсутствующих данных заменяются на null, а не на ноль.\n6. Текст стандартизируется (неразрывный пробел, обрезка, очистка, регистр) до сопоставления и удаления дубликатов.\n7. Широкая таблица преобразуется в длинную командой «Отменить свертывание других столбцов»; очистка сумм выполняется после этого в одном столбце.\n\nКонтрольные значения учебных данных:\n\n| Показатель | Значение |\n| --- | --- |\n| Записей в выгрузке | 11 |\n| Строк после unpivot | 33 |\n| Строк с пустой суммой | 4 |\n| Сумма за январь, февраль, март | 6 627 560; 5 605 630; 6 646 260 |\n| Расхождение с итоговой строкой за февраль | 617 830 |\n| Строк в апрельской выгрузке; сумма | 7; 5 022 500 |\n| Строк в реестре поступлений; пустых сумм; сумма | 12; 2; 7 586 160 |\n| Строк в справочнике точек после очистки | 8 |\n\n## Практика: импорт и очистка данных в Power Query\n\n**Задача.** Построить три запроса (продажи, поступления, справочник точек), довести их до контрольных значений и проверить продажи на апрельской выгрузке.\n\n**Файлы.** [lesson-2.1.xlsx](materials/lesson-2.1.xlsx) – рабочая книга. Пошаговые инструкции и контрольные значения находятся на листах «Задание» и «Контроль». [lesson-2.1-source.xlsx](materials/lesson-2.1-source.xlsx) – источник данных, он не редактируется.\n\n**Что нужно сделать.**\n\n1. Построить запрос «Продажи» по листу «Продажи (выгрузка)»: структура, стандартизация, unpivot, очистка сумм, типы.\n2. Загрузить результат на лист и проверить 33 строки, 4 пустые суммы и суммы по месяцам.\n3. Переключить запрос на лист «Продажи апрель» и проверить результат.\n4. Построить запросы «Поступления» и «Справочник точек» по листам источника.\n5. По желанию: сверить суммы с итоговой строкой выгрузки и записать причину расхождения.\n\n**Результат.** Выполненная книга `lesson-2.1.xlsx` с тремя запросами и заполненным листом «Контроль».\n", "2.2": "---\ntitle: \"Power Query: интеграция и автоматическое обновление данных\"\nsummary: \"Объединение источников в Power Query: добавление и слияние запросов, импорт всех файлов папки, контроль полноты справочников анти-соединением, согласование уровня детализации, параметры запросов и поведение при изменении структуры источника.\"\nsource: \"materials/lesson-2.2.xlsx; materials/lesson-2.2-source.zip\"\nconcepts:\n  - \"Добавление запросов (append) :: Вертикальное объединение таблиц с одинаковой структурой. Увеличивает число строк. Столбцы сопоставляются по названиям.\"\n  - \"Слияние запросов (merge) :: Присоединение к строкам одной таблицы столбцов другой таблицы по ключу. Увеличивает число столбцов.\"\n  - \"Ключ слияния :: Столбец (или набор столбцов), по значениям которого строки двух таблиц считаются соответствующими. Значения ключа должны быть стандартизованы и совпадать по типу.\"\n  - \"Левое внешнее соединение :: Тип слияния, сохраняющий все строки левой таблицы. При отсутствии соответствия присоединенные поля пусты. Основной тип для присоединения справочника к фактам.\"\n  - \"Внутреннее соединение :: Тип слияния, оставляющий только строки, для которых соответствие найдено в обеих таблицах. Несопоставленные факты исчезают без сообщения.\"\n  - \"Антисоединение :: Тип слияния, возвращающий строки одной таблицы, для которых соответствия в другой нет. Служит постоянным контролем полноты справочников.\"\n  - \"Гранулярность :: Уровень детализации таблицы: что описывает одна строка (транзакция, точка за месяц, точка за год). Слияние выполняется между таблицами одной гранулярности.\"\n  - \"Образец файла :: Служебный запрос, который создается при импорте папки. Содержит обработку одного файла; она применяется ко всем файлам папки, включая будущие.\"\n  - \"Source.Name :: Столбец с именем файла-источника, добавляемый при импорте папки. Используется для аудита и для извлечения периода из имени файла.\"\n  - \"Параметр запроса :: Значение (путь, год, порог), вынесенное из шагов запроса в отдельное место и изменяемое пользователем без правки M-кода.\"\n  - \"Конструкция let ... in :: Структура M-запроса: после let перечисляются именованные шаги, после in указывается результат.\"\n---\n\n# Power Query: интеграция и автоматическое обновление данных\n\n## Цели и требования\n\nНа занятии 2.1 запрос обрабатывал одну выгрузку. В реальной отчетности источников несколько: данные приходят отдельными файлами за периоды, названия точек и категорий лежат в справочниках, план хранится отдельно. Здесь решается задача интеграции: собрать эти источники в одну таблицу так, чтобы\n\n1. объединение не теряло и не размножало факты;\n2. новые файлы подхватывались автоматически;\n3. неполнота справочников обнаруживалась сразу;\n4. изменяемые значения (путь, год) задавались без правки запроса;\n5. изменение структуры источника приводило к явной ошибке, а не к искаженному отчету.\n\nПосле занятия нужно уметь:\n\n- различать добавление и слияние запросов и выбирать между ними;\n- импортировать все файлы папки и настраивать обработку образца;\n- выбирать тип соединения и проверять число строк после слияния;\n- строить анти-соединение как постоянный контроль;\n- сопоставлять данные разной гранулярности (факт и план);\n- выносить пути и фильтры в параметры на листе;\n- читать структуру M-запроса и диагностировать изменение схемы источника.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. Источники данных находятся в архиве `lesson-2.2-source.zip`; его необходимо распаковать. Папка `Выгрузки` содержит три файла. Файл `Позже/Продажи_2026_04.xlsx` подключается только в части 9 задания и должен находиться **вне** папки `Выгрузки`. Рабочая книга с инструкцией – `lesson-2.2.xlsx`.\n\n## 1. Два способа объединения таблиц\n\nPower Query объединяет таблицы двумя принципиально разными способами.\n\n> **Добавление увеличивает число строк. Слияние увеличивает число столбцов.**\n\n**Добавление (append)** применяется, когда таблицы имеют одинаковую структуру и содержат разные записи: продажи за январь и за февраль, данные разных подразделений, последовательные периоды одного реестра. Задача: «собрать вместе записи из нескольких однотипных таблиц».\n\n**Слияние (merge)** применяется, когда к записям одной таблицы нужно присоединить сведения из другой по общему ключу. В выгрузке продаж есть код точки `TT03`, но нет названия точки, региона и формата. Эти сведения находятся в справочнике. Задача: «присоединить к каждой записи атрибуты по ключу».\n\n| Свойство | Добавление | Слияние |\n| --- | --- | --- |\n| Что происходит | Таблицы ставятся друг под другом | К таблице справа присоединяются столбцы |\n| Что растет | Число строк | Число столбцов |\n| Условие | Одинаковый набор столбцов | Общий ключ |\n| Типичный пример | Продажи за январь + продажи за февраль | Продажи + справочник точек |\n\nВ обоих случаях новый результат лучше создавать командами **«Добавить запросы как новые»** и **«Объединить запросы как новые»**. Исходные запросы остаются самостоятельными, новый отвечает только за объединение. Если логика объединения окажется неверной, исходные запросы восстанавливать не нужно.\n\n## 2. Добавление запросов и схема столбцов\n\nPower Query сопоставляет столбцы при добавлении **по названиям**, а не по положению. Если в первой таблице столбец называется `Сумма`, а во второй `Сумма продаж`, запрос не остановится. Он создаст оба столбца и заполнит каждый только в своей части строк:\n\n| Дата | Код точки | Сумма | Точка | Сумма продаж |\n| --- | --- | --- | --- | --- |\n| 14.01.2026 | TT09 | 63 800,00 | null | null |\n| 14.04.2026 | null | null | TT09 | 63 800,00 |\n\nВсе 52 строки на месте, ошибок нет, но данные распределены по разным столбцам, а любая итоговая сумма окажется неполной.\n\n> [!WARNING]\n> Несовпадение схем при добавлении не приводит к ошибке. Запрос завершается успешно, а информация распределяется по разным столбцам. Это один из самых опасных видов молчаливой ошибки: результат выглядит правдоподобно.\n\nКонтроль после добавления:\n\n- сравнить число столбцов с ожидаемым;\n- проверить, нет ли столбцов, заполненных наполовину (профиль столбца показывает долю пустых значений);\n- сравнить число строк с суммой строк источников.\n\n### Практика\n\n1. Создать запросы к `Выгрузки/Продажи_2026_01.xlsx` и `Позже/Продажи_2026_04.xlsx` (удалить верхние строки, назначить заголовки, отфильтровать пустые даты).\n2. Выполнить «Добавить запросы как новые».\n3. Сравнить названия столбцов. Ожидается 8 столбцов и 52 строки; в каждом из столбцов `Сумма` и `Сумма продаж` по 26 пустых значений.\n4. Удалить опытные запросы.\n\n```quiz\nquestion: Какое правило помогает выбрать между добавлением и слиянием запросов?\nA: Добавление увеличивает число строк, слияние – число столбцов\nB: Добавление применяется только к Excel, слияние – только к CSV\nC: Добавление всегда требует справочник, слияние – никогда\nD: Слияние увеличивает число строк, добавление – число столбцов\ncorrect: A\nexplanation: Добавление собирает однотипные записи вертикально. Слияние сохраняет записи и присоединяет к ним поля из другой таблицы.\n```\n\n## 3. Импорт всех файлов папки\n\nТипичный сценарий: каждый период приходит отдельным файлом, файлы складываются в одну папку, а итоговый запрос должен собирать их автоматически.\n\n### Порядок действий\n\n1. «Данные» → «Получить данные» → «Из файла» → «Из папки».\n2. Указать папку `Выгрузки`.\n3. Нажать **«Объединить и преобразовать данные»**.\n4. В окне «Объединение файлов» выбрать лист `Данные` в качестве образца и нажать «ОК».\n\nPower Query создаст несколько связанных объектов (в группе «Вспомогательные запросы»):\n\n- **Параметр** и **Образец файла**: ссылка на один файл, используемый как образец структуры.\n- **Преобразовать файл**: функция, которая принимает файл и применяет к нему обработку.\n- **Преобразовать образец файла**: запрос, в котором настраивается обработка **одного** файла.\n- **Основной запрос** (по имени папки): применяет функцию ко всем файлам и склеивает результаты.\n\n> [!WARNING]\n> Преобразования, которые должны выполняться для каждого файла отдельно, настраиваются в запросе **«Преобразовать образец файла»**, а не в основном запросе. Шаги основного запроса выполняются один раз над уже склеенной таблицей. Различие важно: структурные шаги (удаление служебных строк, назначение заголовков) нужны каждому файлу до склейки, иначе служебные строки из каждого файла попадут в итог.\n\n### Обработка образца\n\nВ запросе «Преобразовать образец файла» выполняются действия занятия 2.1:\n\n1. удалить верхние 3 строки (название выгрузки, примечание, пустая строка);\n2. назначить первую строку заголовками;\n3. отфильтровать строки без значения в «Код точки» (подпись «Исполнитель» в конце файла);\n4. установить типы: «Дата» и «Десятичное число» для «Сумма» с локалью «Русский (Россия)», «Целое число» для «Количество».\n\nАвтоматические шаги типизации, созданные до очистки, удаляются (см. раздел 6 занятия 2.1).\n\n### Столбец Source.Name\n\nPower Query добавляет в итоговую таблицу столбец `Source.Name` – имя файла. Его не следует удалять без необходимости: он позволяет определить файл-источник каждой строки, служит элементом аудита и позволяет извлечь период из имени (`Продажи_2026_01.xlsx` разделяется по `_`).\n\n### Фильтрация содержимого папки\n\nPower Query пытается обработать **все** файлы папки. Случайный документ или временный файл Excel (имя начинается с `~$`, он появляется, когда файл открыт) остановит обновление. Поэтому сразу после шага `Источник` в основном запросе добавляется фильтр:\n\n- `Extension` равно `.xlsx`;\n- `Name` не начинается с `~$`.\n\n### Организация запросов\n\nЗапросов становится много, поэтому действуют два правила.\n\n1. **Не все запросы загружаются на лист.** Справочники и промежуточные запросы загружаются командой «Закрыть и загрузить в…» → «Только создать подключение».\n2. **Запросы группируются** по назначению: источники, справочники, результаты (правый щелчок на запросе → «Переместить в группу»). Это тот же принцип слоев книги из занятия 1.1, перенесенный на запросы.\n\n### Контрольные значения\n\n| Показатель | Значение |\n| --- | --- |\n| Файлов в папке | 3 |\n| Строк в каждом файле | 26 |\n| Строк в основном запросе | 78 |\n| Сумма продаж | 8 157 878 |\n\n### Практика\n\nИмпортировать папку, настроить обработку образца и убедиться, что основной запрос содержит 78 строк и столбец `Source.Name`.\n\n```quiz\nquestion: Где следует выполнять очистку, которая должна применяться к каждому файлу при импорте папки?\nA: Только в основном объединенном запросе\nB: В запросе «Преобразовать образец файла»\nC: На листе Excel после загрузки\nD: В контрольном антисоединении\ncorrect: B\nexplanation: Запрос образца лежит в основе функции, применяемой к каждому файлу папки, в том числе к файлам, которые появятся позже.\n```\n\n## 4. Слияние запросов и типы соединений\n\n### Справочники как запросы\n\nСправочники загружаются запросами к листам `Точки`, `Категории` и `План` файла `Справочники.xlsx` (для каждого удаляются служебные строки, назначаются заголовки, при необходимости стандартизуются значения). Загружаются в режиме «Только создать подключение».\n\n### Порядок слияния\n\n1. Выделить запрос продаж и выбрать «Главная» → «Объединить запросы» → **«Объединить запросы как новые»**.\n2. Выбрать вторую таблицу (справочник).\n3. Щелкнуть заголовок ключевого столбца в обеих таблицах (`Код точки`).\n4. Выбрать тип соединения.\n5. Нажать «ОК» и **развернуть** вложенный столбец кнопкой с двумя стрелками.\n\nПри развертывании нужно снять флажок «Использовать исходное имя столбца как префикс». Иначе столбцы получат названия вида `Справочник_точек.Регион`; формально это работает, но усложняет чтение и сопровождение.\n\n### Ключ должен быть подготовлен\n\nСлияние выполняется по равенству значений, поэтому ключи подчиняются тем же требованиям, что и в 2.1: одинаковый тип (текст с текстом) и единое написание (пробелы, регистр). Если в продажах код записан `TT05 `, а в справочнике `TT05`, строка не сопоставится, и ошибки не будет.\n\n### Типы соединений\n\n| Тип | Что возвращает | Применение |\n| --- | --- | --- |\n| Левое внешнее | Все строки левой таблицы и найденные данные правой; при отсутствии соответствия присоединенные поля пусты | Основной тип для присоединения справочника к фактам |\n| Правое внешнее | Все строки правой таблицы и найденные данные левой | Применяется редко; если понадобилось для обычного присоединения справочника, проверьте, не перепутаны ли таблицы |\n| Полное внешнее | Все строки обеих таблиц | Сверка двух источников, когда ни один нельзя считать главным |\n| Внутреннее | Только строки, для которых соответствие найдено в обеих таблицах | Когда несопоставленные записи действительно не нужны |\n| Левое антисоединение | Строки левой таблицы, которым нет соответствия в правой | Контроль полноты справочника |\n| Правое антисоединение | Строки правой таблицы, которым нет соответствия в левой | Поиск неиспользуемых позиций справочника |\n\n> [!WARNING]\n> Внутреннее соединение не является «неправильным»: оно делает именно то, что задано. Риск возникает, когда аналитик не осознает, что несопоставленные факты будут отброшены без сообщения об ошибке. Отчет по фактам с внутренним соединением занижает итог на сумму потерянных записей.\n\n### Контроль числа строк после слияния\n\nПосле каждого слияния сравнивается число строк до и после.\n\n| Что произошло | Вероятная причина |\n| --- | --- |\n| Число строк уменьшилось | Внутреннее соединение отбросило несопоставленные факты |\n| Число строк выросло | В правой таблице дубликаты ключа: одна запись факта сопоставилась с несколькими строками справочника |\n| Число строк не изменилось | Необходимый (но не единственный) признак корректного присоединения |\n\nРост числа строк особенно опасен: если точка записана в справочнике дважды, каждая запись продаж этой точки удвоится, и выручка вырастет без единой ошибки. Поэтому ключ справочника проверяется на уникальность до слияния (профиль столбца: «различных» равно «уникальных», или группировка по ключу с подсчетом).\n\n> [!NOTE]\n> Контроль числа строк после слияния выполняет для интеграции ту же функцию, что контрольная сумма для расчетной модели: позволяет быстро обнаружить потерю или размножение записей.\n\n### Контрольные значения\n\nВ учебных данных в продажах есть коды, которых нет в справочниках: код точки `TT09` (3 записи) и код категории `CAT7` (3 записи).\n\n| Операция | Строк |\n| --- | --- |\n| Продажи до слияния | 78 |\n| Левое внешнее со справочником точек | 78 |\n| Внутреннее со справочником точек | 75 |\n| Левое внешнее со справочником категорий | 78 |\n| Внутреннее с обоими справочниками | 72 |\n\n### Практика\n\n1. Присоединить справочник точек левым внешним соединением, развернуть `Наименование`, `Регион`, `Формат` без префикса. Проверить: 78 строк.\n2. Присоединить справочник категорий, развернуть `Наименование категории`, `Товарная группа`. Проверить: 78 строк.\n3. В шаге слияния сменить тип на внутреннее и сравнить число строк (75). Вернуть левое внешнее.\n\n```quiz\nquestion: После левого внешнего соединения со справочником число строк выросло с 78 до 84. Что проверить в первую очередь?\nA: Локаль числовых столбцов\nB: Наличие дубликатов ключа в справочнике\nC: Наличие null в фактах\nD: Режим автоматического пересчета Excel\ncorrect: B\nexplanation: При нескольких совпадениях в правой таблице одна запись факта размножается. Рост числа строк после левого соединения указывает на дубликаты ключа.\n```\n\n## 5. Антисоединение как постоянный контроль\n\nЛевое внешнее соединение сохраняет факты без соответствия, но после слияния они выглядят как обычные строки с пустыми справочными полями. На десятках тысяч строк такие записи легко пропустить. Поэтому контроль делается постоянным.\n\n### Построение\n\n1. «Объединить запросы как новые»: левая таблица – продажи, правая – справочник точек, ключ `Код точки`.\n2. Тип соединения: **«Левое антисоединение (строки только из первой)»**.\n3. Удалить столбец с вложенной таблицей (он пуст).\n4. Повторить для справочника категорий.\n\nРезультат содержит только записи без соответствия. В учебных данных:\n\n| Запрос | Строк | Сумма |\n| --- | --- | --- |\n| Нет в справочнике точек (`TT09`) | 3 | 191 400 |\n| Нет в справочнике категорий (`CAT7`) | 3 | 85 350 |\n\n### Что делать с найденными записями\n\nАнтисоединение само по себе не решает предметную проблему. Причины бывают разные: открыта новая точка, справочник не обновлен, опечатка в коде, в выгрузку попали чужие данные. Решение принимает владелец данных. Задача аналитика – не допустить, чтобы расхождение осталось незамеченным.\n\n> [!NOTE]\n> Антисоединение со справочником – аналог контрольной суммы для расчетной модели. Ноль строк означает, что несопоставленных записей нет; ненулевой результат требует разбирательства. Контрольные запросы загружаются на отдельные листы, а число строк выводится на видное место.\n\n### Практика\n\nПостроить два антисоединения (по точкам и по категориям), загрузить их на отдельные листы и сверить с таблицей выше.\n\n## 6. Гранулярность: факты и план\n\nВ файле `Справочники.xlsx` на листе `План` хранится плановая выручка по точкам и месяцам: одна строка на пару «точка – месяц» (24 строки). В продажах одна строка – одна **транзакция** (78 строк). Таблицы имеют разную **гранулярность**.\n\n### Ошибка прямого слияния\n\nЕсли присоединить план к транзакциям по паре «точка – месяц», каждая транзакция получит план своей пары. У точки TT03 в январе несколько транзакций, и план этой пары продублируется несколько раз. Сумма плана после слияния окажется завышенной в разы, хотя число строк не изменится (левое соединение, ключ плана уникален). Этот случай не обнаруживается контролем числа строк и требует контроля суммы.\n\n> [!WARNING]\n> Слияние выполняется между таблицами одной гранулярности. Если факт детальнее плана, факт сначала агрегируется до гранулярности плана.\n\n### Порядок\n\n1. Создать запрос на основе продаж («Ссылка» в контекстном меню запроса).\n2. Добавить столбец «Месяц» с датой начала месяца: выделить `Дата` → «Добавление столбца» → «Дата» → «Месяц» → «Начало месяца».\n3. «Главная» → «Группировать по»: столбцы `Код точки` и `Месяц`, операция «Сумма» по `Сумма`, новое имя `Факт`.\n4. «Объединить запросы» (в этом же запросе): правая таблица – `План`, ключ из **двух** столбцов.\n\n### Ключ из нескольких столбцов\n\nВ окне слияния столбцы выбираются с удержанием `Ctrl`. Порядок выбора в обеих таблицах должен быть одинаков: если сверху выбраны `Код точки`, затем `Месяц`, то и снизу сначала `Код точки`, затем `Месяц`. Иначе Power Query может не найти соответствий и вернуть пустые значения без ошибки. Типы пар столбцов также должны совпадать (`Месяц` в обеих таблицах – «Дата»).\n\n### Отклонение от плана\n\nПосле слияния и развертывания столбца `План`:\n\n1. «Добавление столбца» → «Пользовательский столбец»: `Отклонение` = `[Факт] - [План]`.\n2. Столбец `Отклонение, %` = `[Отклонение] / [План]`.\n\nЕсли плана нет (запись TT09), разность и отношение равны null. Такое поведение корректно: отклонение неизвестно, а не равно нулю (правило null из занятия 2.1).\n\n### Контрольные значения\n\n| Показатель | Значение |\n| --- | --- |\n| Строк после группировки | 27 (8 точек × 3 месяца и TT09 × 3 месяца) |\n| Строк после слияния | 27 |\n| Строк без плана | 3 (TT09) |\n| Сумма плана | 8 178 000 |\n| Факт по точкам с планом | 7 966 478 |\n| Суммарное отклонение | −211 522 (−2,59 %) |\n\n```quiz\nquestion: Почему план нельзя присоединять напрямую к транзакциям продаж?\nA: Power Query не умеет объединять по двум столбцам\nB: Строки плана дублируются на каждую транзакцию той же пары «точка – месяц», сумма плана завышается\nC: Левое соединение всегда уменьшает число строк\nD: План и продажи имеют разные локали\ncorrect: B\nexplanation: План задан на уровне «точка – месяц», а факт на уровне транзакции. При прямом слиянии план повторяется для каждой транзакции пары, и сумма плана искажается без изменения числа строк.\n```\n\n## 7. Параметры запросов\n\nВ построенных запросах остается архитектурный дефект: путь к папке записан непосредственно в шаге `Источник`:\n\n```excel\n= Folder.Files(\"C:\\Курс\\Выгрузки\")\n```\n\nЕсли книгу передать коллеге, у которого файлы лежат в другом месте, запрос перестанет работать. Это тот же дефект, что и изменяемая константа внутри формулы на занятии 1.1.\n\n### Встроенные параметры\n\n«Главная» → «Управление параметрами» → «Создать параметр»: имя, тип, значение. Это лучше, чем строка в шаге, но значение изменяется только в редакторе запросов.\n\n### Параметры на листе\n\nДля пользовательской книги удобнее хранить параметры в таблице Excel на листе. Пользователь изменяет значения на листе, не открывая редактор.\n\n| Параметр | Значение |\n| --- | --- |\n| Путь к папке выгрузок | C:\\Курс\\Выгрузки |\n| Отчетный год | 2026 |\n| Минимальная сумма для отбора | 50000 |\n| Регион для отбора | Урал |\n\nТаблица называется `Параметры` и импортируется запросом «Из таблицы или диапазона» (загрузка – «Только создать подключение»). Значение параметра извлекается выражением:\n\n```excel\nПараметры{[Параметр = \"Путь к папке выгрузок\"]}[Значение]\n```\n\nОно читается так: найти в таблице `Параметры` строку, где в столбце `Параметр` стоит указанный текст, и взять значение из столбца `Значение`.\n\n### Подстановка в запрос\n\n1. В основном запросе выделить шаг `Источник`.\n2. В строке формул заменить текстовую константу выражением из таблицы параметров:\n\n```excel\n= Folder.Files(Параметры{[Параметр = \"Путь к папке выгрузок\"]}[Значение])\n```\n\n3. Изменить путь на листе (например, указать копию папки) и выполнить «Обновить все».\n\nПараметры управляют не только путем. Год можно использовать в фильтре столбца `Дата`, порог и регион – в фильтрах результата:\n\n```excel\nTable.SelectRows(Предыдущий, each Date.Year([Дата]) = Параметры{[Параметр = \"Отчетный год\"]}[Значение])\n```\n\nНа занятии 1.1 предпосылки управляли расчетами; здесь параметры управляют загрузкой и подготовкой данных.\n\n> [!WARNING]\n> Если в одном запросе используются данные из нескольких источников, Power Query может показать ошибку `Formula.Firewall` или предупреждение об уровнях конфиденциальности. Для локальной учебной среды проверку можно отключить: «Данные» → «Получить данные» → «Параметры запроса» → «Текущая книга» → «Конфиденциальность» → «Игнорировать уровни конфиденциальности». В реальной работе с внешними источниками такая настройка выбирается осознанно.\n\n### Практика\n\n1. Создать запрос к таблице `Параметры`.\n2. Подставить путь к папке из параметров в шаг `Источник`.\n3. Скопировать папку `Выгрузки` в другое место, изменить путь на листе и обновить запросы. Результат: 78 строк.\n4. Использовать параметр `Отчетный год` в фильтре даты. При годе 2025 результат пуст, при 2026 – 78 строк.\n\n## 8. Изменение структуры источника\n\nСкопируем в папку `Выгрузки` файл `Продажи_2026_04.xlsx` (из папки `Позже`). Структура апрельской выгрузки отличается от прежней:\n\n| Было | Стало |\n| --- | --- |\n| Код точки | Точка |\n| Код категории | Категория |\n| Сумма | Сумма продаж |\n\nШаги запроса образца обращаются к старым названиям, поэтому обновление завершается ошибкой: функция не находит столбец `Код точки`.\n\n### Явный отказ лучше молчаливого искажения\n\nОстановка запроса кажется недостатком, но сравните два сценария.\n\n1. **Запрос остановился.** Пользователь видит ошибку и ищет причину.\n2. **Запрос продолжил работу.** Из-за несовпадения названий Power Query создал дополнительные столбцы, часть значений оказалась пустой, итоговый отчет собран с неполными суммами (раздел 2).\n\nВторой сценарий гораздо опаснее.\n\n> [!NOTE]\n> Полностью защититься от изменений источника невозможно. Цель устойчивого решения – не обязательно продолжить работу любой ценой, а сделать так, чтобы критичное изменение стало явным и не привело к молчаливому искажению.\n\n### Меры защиты\n\n**Переименование столбцов сразу после заголовков.** Подходит, если порядок столбцов стабилен, а названия могут меняться. В запросе образца после назначения заголовков добавляется шаг переименования:\n\n```excel\nTable.RenameColumns(Повышенные_заголовки,\n    {{\"Точка\", \"Код точки\"}, {\"Категория\", \"Код категории\"}, {\"Сумма продаж\", \"Сумма\"}},\n    MissingField.Ignore)\n```\n\nПараметр `MissingField.Ignore` указывает пропускать переименование, если исходного столбца нет. В прежних файлах столбцов «Точка», «Категория» и «Сумма продаж» нет, и шаг их пропускает. В апрельском файле шаг приводит названия к прежнему виду.\n\n**Контрольный запрос состава столбцов.** Получает фактический список названий и сравнивает с ожидаемым.\n\n**Игнорирование отсутствующего поля.** Некоторые операции можно настроить так, чтобы отсутствие столбца не останавливало запрос (`MissingField.Ignore`). Прием применяется осознанно: допустимое отсутствие должно быть действительно предусмотрено предметной логикой. Иначе явная ошибка превращается в молчаливую.\n\n### Практическое правило\n\nПрежде чем защищать запрос от изменений, нужно решить: **должен ли запрос продолжить работу или должен остановиться?** Для критичных полей (суммы, ключи) безопаснее явный отказ; для переименований, которые заведомо безвредны и однозначны, допустима автоматическая подстановка.\n\n### Контрольные значения после добавления апреля\n\n| Показатель | Значение |\n| --- | --- |\n| Файлов в папке | 4 |\n| Строк | 104 |\n| Сумма продаж | 10 747 153 |\n| Несопоставленных записей (антисоединения) | 8 (4 по точке, 4 по категории) |\n\n```quiz\nquestion: Что произойдет при обновлении запроса образца, если в источнике изменилось название столбца, на которое ссылается шаг?\nA: Power Query автоматически подберет подходящий столбец\nB: Шаг выдаст ошибку, и обновление остановится\nC: Столбец будет создан заново и заполнен нулями\nD: Запрос продолжит работу без этого шага\ncorrect: B\nexplanation: Шаг ссылается на столбец по имени. Если столбца нет, возникает явная ошибка. Это предпочтительнее молчаливого искажения, но означает, что изменение источника нужно обработать осознанно.\n```\n\n## 9. Язык M и пользовательские функции\n\nРаздел носит обзорный характер: требуется уметь читать структуру запроса.\n\nКаждое действие в интерфейсе записывается как M-код. Весь запрос виден в «Главная» → «Расширенный редактор». Упрощенный пример:\n\n```excel\nlet\n    Источник = Excel.Workbook(File.Contents(Путь)),\n    Данные = Источник{[Item = \"Данные\"]}[Data],\n    Заголовки = Table.PromoteHeaders(Данные)\nin\n    Заголовки\n```\n\n### Конструкция let ... in\n\nВ блоке `let` объявляется последовательность именованных шагов; каждый следующий шаг может ссылаться на предыдущий. После `in` указывается результат запроса. Структура близка функции LET из занятия 1.2: промежуточные величины получают имена, а результатом служит выбранное выражение. Имена шагов в M совпадают с названиями в панели «Примененные шаги».\n\n### Функции\n\nПри импорте папки автоматически создается функция «Преобразовать файл»: она принимает файл, применяет последовательность шагов и возвращает таблицу. Собственные функции строятся по тому же принципу: имя параметра, затем `=>` и выражение:\n\n```excel\n(месяц as text) as table =>\nlet\n    Результат = Table.SelectRows(Продажи_факт, each [Месяц] = месяц)\nin\n    Результат\n```\n\nНаписание функций вручную относится к повышенной сложности; на базовом уровне достаточно читать структуру запроса и понимать, что «Преобразовать файл» – обычная функция.\n\n## 10. Использование ИИ: анализ M-кода и логики объединения\n\nЯзыковая модель помогает разобраться в длинном M-коде, но полезнее просить не пересказ, а проверку рисков интеграции:\n\n```excel\nНиже приведен M-код Power Query:\n\n[ВСТАВЬТЕ КОД ИЗ РАСШИРЕННОГО РЕДАКТОРА]\n\nПроанализируй его как процедуру интеграции данных.\n\n1. Перечисли источники и порядок шагов.\n2. Для каждого слияния укажи левую и правую таблицы, ключи, тип соединения и какие строки могут быть потеряны или размножены.\n3. Для каждого добавления укажи, какие названия столбцов должны совпадать.\n4. Найди жестко заданные пути, годы, регионы и другие значения, которые можно вынести в параметры.\n5. Найди шаги, чувствительные к переименованию или исчезновению столбцов.\n6. Предложи контрольные проверки: число строк, антисоединение, состав столбцов, число null после слияния.\n7. Если предлагаешь изменить код, не меняй смысл обработки и отдельно перечисли проверки эквивалентности.\n```\n\nРезультат модели – гипотеза. После любого изменения необходимо проверить:\n\n1. число строк до и после слияния;\n2. число строк после добавления;\n3. состав несопоставленных записей;\n4. отсутствие дубликатов ключей в справочниках;\n5. работу на новом файле периода;\n6. соответствие контрольных сумм источникам.\n\n## 11. Итоги занятия\n\nНеобходимо зафиксировать семь положений:\n\n1. Добавление увеличивает число строк, слияние – число столбцов.\n2. При добавлении столбцы сопоставляются по названиям; несовпадение схем приводит к неполным данным без явной ошибки.\n3. Для присоединения справочника к фактам применяется левое внешнее соединение; внутреннее молча отбрасывает несопоставленные факты.\n4. Число строк после слияния проверяется всегда; рост означает дубликаты ключа, снижение – потерянные факты.\n5. Антисоединение – постоянный контроль полноты справочников.\n6. Слияние выполняется между таблицами одной гранулярности: факт агрегируется до уровня плана до присоединения.\n7. Изменяемые значения (путь, год) выносятся в параметры на листе; изменение структуры источника должно приводить к явной ошибке, а не к молчаливому искажению.\n\n## Практика: интеграция данных в Power Query\n\n**Задача.** Собрать из трех выгрузок, справочников и плана итоговые запросы с контролем полноты и параметрами, затем проверить их на выгрузке с измененной структурой.\n\n**Файлы.** [lesson-2.2.xlsx](materials/lesson-2.2.xlsx) – рабочая книга. Пошаговые инструкции и контрольные значения находятся на листах «Задание» и «Контроль». [lesson-2.2-source.zip](materials/lesson-2.2-source.zip) – источники данных (архив нужно распаковать).\n\n**Что нужно сделать.**\n\n1. Импортировать папку `Выгрузки`, настроить обработку образца, получить 78 строк.\n2. Присоединить справочники точек и категорий левым внешним соединением, проверить число строк.\n3. Построить антисоединения по точкам и категориям и вывести их на листы.\n4. Присоединить план, рассчитать отклонение на уровне «точка – месяц».\n5. Вынести путь и год в таблицу параметров на листе.\n6. Добавить апрельскую выгрузку и восстановить работу запросов.\n\n**Результат.** Выполненная книга `lesson-2.2.xlsx` с запросами и заполненным листом «Контроль».\n", "3.1": "---\ntitle: \"Модель данных Excel и Power Pivot\"\nsummary: \"Организация данных в модель: таблица фактов и измерения, зерно, ключи, связи «один ко многим», схема «звезда», проверка модели и сводная таблица, построенная из нескольких связанных таблиц.\"\nsource: \"materials/lesson-3.1.xlsx\"\nconcepts:\n  - \"Модель данных Excel :: Набор связанных таблиц внутри книги, хранящийся в сжатом виде в памяти и используемый сводными таблицами. Не требует объединения таблиц в одну.\"\n  - \"Power Pivot :: Надстройка Excel для работы с моделью данных: добавление таблиц, создание связей и вычислений на языке DAX.\"\n  - \"Плоская таблица :: Таблица, в которой в каждой строке совмещены факт и все описания связанных объектов (точки, категории). Повторяет описания и допускает их противоречия.\"\n  - \"Таблица фактов :: Таблица повторяющихся наблюдений (продаж, платежей) с числовыми показателями и ключами, указывающими на объекты.\"\n  - \"Измерение :: Справочная таблица, описывающая объекты, по которым группируют и фильтруют факты (точка, категория, период). Одна строка соответствует одному объекту.\"\n  - \"Зерно таблицы фактов :: Точное определение того, что описывает одна строка факта. Формулируется до построения связей.\"\n  - \"Ключ измерения и внешний ключ :: Ключ однозначно определяет строку измерения. Внешний ключ в таблице фактов ссылается на эту строку и может повторяться.\"\n  - \"Кардинальность связи :: Тип соответствия строк двух таблиц. В учебной модели «один ко многим»: одна строка измерения, много строк факта.\"\n  - \"Схема «звезда» :: Организация модели, в которой измерения связаны напрямую только с таблицей фактов и не связаны друг с другом.\"\n  - \"Распространение фильтра :: Механизм, по которому выбор значения в измерении ограничивает строки таблицы фактов через связь по ключу.\"\n  - \"Сортировка по столбцу :: Свойство текстового столбца в модели, задающее порядок значений по другому (числовому) столбцу. Нужно, чтобы месяцы шли в календарном, а не алфавитном порядке.\"\n---\n\n# Модель данных Excel и Power Pivot\n\n## Цели и требования\n\nНа занятиях 2.1 и 2.2 данные были собраны в чистые таблицы. Теперь их нужно организовать так, чтобы один набор фактов можно было группировать по разным признакам (точка, регион, категория, месяц) без дублирования описаний и без риска противоречий. Для этого в Excel используется модель данных.\n\nПосле занятия нужно уметь:\n\n- объяснять недостатки плоской таблицы и находить противоречивые описания;\n- формулировать зерно таблицы фактов и отличать факт от измерения;\n- добавлять таблицы в модель данных и создавать связи «один ко многим»;\n- проверять ключи (уникальность, типы, полнота);\n- настраивать порядок месяцев в сводной таблице;\n- строить сводную таблицу из нескольких связанных таблиц и сверять результат.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows с доступной надстройкой Power Pivot. Если на ленте нет вкладки «Power Pivot», надстройка включается в «Файл» → «Параметры» → «Надстройки» → «Управление: надстройки COM» → «Перейти» → «Microsoft Power Pivot for Excel». Работа выполняется в файле `lesson-3.1.xlsx`; сохраненная модель понадобится на занятии 3.2.\n\n## 1. Недостатки плоской таблицы\n\nЛист «Плоская таблица» содержит 128 строк: продажи восьми точек по четырем категориям за четыре месяца (январь – апрель 2026). В каждой строке совмещены:\n\n- сведения о продаже: дата, количество, выручка, прямые затраты;\n- код, название, регион и формат торговой точки;\n- код, название и группа категории.\n\nДля сводной таблицы такая структура удобна: все поля уже в одной таблице. Но при сопровождении возникают три проблемы.\n\n### Избыточность\n\nТочка `TT03` продает четыре категории в течение четырех месяцев, поэтому ее название, регион и формат записаны 16 раз. На большем горизонте повторений станет больше. Повторяется не событие, а описание объекта.\n\n### Аномалия обновления\n\nЕсли у точки изменился регион, его придется исправить во всех строках точки. Пропущенная строка создаст у одного кода два региона, и никакая проверка формата это не обнаружит.\n\n### Противоречие описаний\n\nУчебная таблица содержит именно такую ошибку. Если отфильтровать `TT03`, в столбце «Регион» окажутся два значения: «Урал» (в 15 строках) и «Поволжье» (в одной). Это запись продажи за март в категории CAT4 на 414 500 руб.\n\n> [!WARNING]\n> Совпадение общей суммы не доказывает корректность разрезов. Суммарная выручка плоской таблицы равна 43 965 500 руб., как и должна. Но в сводной по регионам появляется четвертый регион «Поволжье» с этими 414 500 руб., а выручка Урала занижена на ту же сумму. Итог верен, разрез неверен.\n\n### Решение\n\nОписание объекта хранится один раз, а в строке продажи остается только код:\n\n```excel\nПлоская таблица:  продажа → код + название + регион + формат + суммы   (повторяется в каждой строке)\nМодель данных:    факт → код + суммы\n                  справочник → код + название + регион + формат         (один раз)\n```\n\nРазделение определяет, **где хранится смысл каждого поля**. Регион точки – свойство точки, а не продажи.\n\n```quiz\nquestion: Почему плоская таблица может дать верный общий итог выручки, но неверный отчет по регионам?\nA: В плоской таблице нельзя использовать числовые поля в сводной\nB: Один и тот же код точки может иметь противоречивые значения региона в разных строках\nC: Power Pivot всегда изменяет исходную сумму выручки\nD: Сводная по регионам автоматически удаляет повторяющиеся продажи\ncorrect: B\nexplanation: Общий итог складывает те же строки. Группировка же использует регион каждой строки, и при противоречивых описаниях часть выручки уходит в неверную группу.\n```\n\n## 2. Таблица фактов, измерения, зерно и ключи\n\nЛисты «Факт_Продажи», «Спр_Точки», «Спр_Категории», «Спр_Календарь» содержат те же данные, разделенные на таблицы Excel с именами `FactSales`, `DimStore`, `DimCategory`, `DimDate`.\n\n### Таблица факта\n\nТаблица фактов содержит повторяющиеся наблюдения и числовые показатели, которые анализируются. В `FactSales`: ID записи, дата, код точки, код категории, количество, выручка, прямые затраты. Названий точек, регионов и категорий в ней нет. Числовые показатели (количество, выручка, затраты) называют **фактами**; коды и дата служат для связи с измерениями.\n\n### Зерно\n\nЗерно (*grain*) – точное определение того, что описывает одна строка факта. Для `FactSales`:\n\n```excel\n1 строка = 1 торговая точка × 1 категория × 1 месяц\n```\n\nВ наборе 8 точек, 4 категории и 4 месяца, значит 128 строк. Зерно формулируется **до** построения связей. Если часть строк описывает отдельные продажи, а часть – месячные итоги, суммирование и средние становятся неоднозначными, а вычисления на занятии 3.2 дадут неверные результаты.\n\n> [!NOTE]\n> Перед загрузкой таблицы в модель смысл одной строки записывается одним предложением. Если для разных строк это предложение разное, таблицу нужно разделить.\n\n### Измерения\n\nИзмерение – справочная таблица, описывающая объекты, по которым группируют и фильтруют факты. Одна строка измерения соответствует одному объекту.\n\n| Таблица | Одна строка | Поля |\n| --- | --- | --- |\n| `DimStore` | одна торговая точка | код, наименование, регион, формат, дата открытия |\n| `DimCategory` | одна категория | код, наименование, группа |\n| `DimDate` | один месяц | дата начала месяца, № месяца, месяц, квартал, год |\n\n### Ключи\n\nВ измерении код определяет ровно одну строку: `TT03` – одна точка. Это **ключ** измерения. В факте тот же код встречается многократно: это **внешний ключ**, ссылка на объект.\n\n```excel\nDimStore[Код точки]    TT03 → одна строка справочника\nFactSales[Код точки]   TT03 → много строк продаж\n```\n\nСвязывать следует по устойчивому идентификатору, а не по названию: название может измениться, содержать лишние пробелы или различаться по регистру (занятие 2.1).\n\n### Отличие от слияния в Power Query\n\nПри слиянии (занятие 2.2) столбцы справочника физически копируются в каждую строку результата. В модели данных таблицы не объединяются: каждая хранит свои данные, а связь сообщает Excel, как сопоставлять строки при построении отчета. Поэтому справочник можно менять в одном месте.\n\n```quiz\nquestion: Где повтор кода TT03 является ожидаемым, а где дефектом?\nA: Повтор запрещен и в FactSales, и в DimStore\nB: Повтор допустим в DimStore, но запрещен в FactSales\nC: Повтор допустим в FactSales; в DimStore код должен однозначно определять одну строку\nD: Повторы допустимы везде, Excel выберет нужную строку сам\ncorrect: C\nexplanation: Точка имеет много записей продаж, поэтому в факте ее код повторяется. В справочнике ключ обязан быть уникальным, иначе объект описывается несколькими строками.\n```\n\n## 3. Добавление таблиц в модель данных\n\n### Что такое модель данных\n\nМодель данных хранится внутри книги и обрабатывается компонентом, который сжимает данные по столбцам и держит их в памяти. Поэтому она работает быстрее обычных формул на больших таблицах и не ограничена размером листа (1 048 576 строк). Сводные таблицы могут использовать несколько таблиц модели одновременно.\n\n### Добавление таблицы\n\n1. Установить курсор внутри таблицы `FactSales` на листе «Факт_Продажи».\n2. Вкладка «Power Pivot» → **«Добавить в модель данных»**.\n3. Дождаться открытия окна Power Pivot.\n\nТо же выполняется для `DimStore`, `DimCategory` и `DimDate`. Таблицы «Плоская таблица» (`FlatSales`) и `DimStoreBad` в модель **не добавляются**: первая – учебный пример дефектов, вторая – учебный пример дубликата ключа.\n\nЕсли данные приходят через Power Query, результат запроса можно загрузить в модель без листа: «Закрыть и загрузить в…» → «Только создать подключение» + флажок «Добавить эти данные в модель данных» (занятие 2.1).\n\n### Два представления Power Pivot\n\n- **Представление данных:** таблицы в виде вкладок, как листы. Удобно проверить состав и типы столбцов.\n- **Представление диаграммы:** таблицы в виде блоков. Здесь создаются и проверяются связи.\n\n> [!WARNING]\n> Четыре таблицы в окне Power Pivot еще не образуют аналитическую модель. Пока связи не созданы, Excel не знает, как сопоставлять строки, и сводная будет показывать в каждой ячейке итог без разбивки.\n\n### Практика\n\n1. Добавить четыре таблицы в модель.\n2. В представлении диаграммы убедиться, что их ровно четыре.\n\n## 4. Связи, кардинальность и проверка ключей\n\n### Один ко многим\n\nОтношение между справочником и фактом имеет кардинальность «один ко многим»: одна строка справочника соответствует многим строкам факта. В модели три связи, и во всех сторона «многие» – `FactSales`:\n\n| Измерение (сторона «один») | Факт (сторона «многие») |\n| --- | --- |\n| `DimStore[Код точки]` | `FactSales[Код точки]` |\n| `DimCategory[Код категории]` | `FactSales[Код категории]` |\n| `DimDate[Дата]` | `FactSales[Дата]` |\n\nВ представлении диаграммы связь создается перетаскиванием ключа измерения на соответствующее поле факта либо командой «Конструктор» → «Создать связь».\n\n### Направление фильтра\n\nСвязь «один ко многим» передает фильтр в одну сторону: **из измерения в факт**. Выбор региона в сводной ограничивает строки факта, а не наоборот. Это поведение по умолчанию, и в учебной модели его менять не требуется.\n\n### Уникальность ключа\n\nЛист «Демо_дубликат» содержит справочник `DimStoreBad`, в котором код `TT08` встречается дважды («Точка №8 «Луговая»» и «Точка №8 «Луговая» (архив)»). Использовать такую таблицу как сторону «один» нельзя: Excel не может определить, к какой из двух строк относится продажа, и отказывается создавать связь.\n\nУстранение: удалить архивную строку или привести справочник к единственной записи на объект. Проверка выполняется до создания связи (в Power Query: профиль столбца «различных» равно «уникальных», занятие 2.2).\n\n### Типы и значения ключей\n\nПоля связи должны иметь совместимые типы: код точки в факте и справочнике – текст; дата – дата. Различие в значениях (`TT03 ` с пробелом, `tt03`) нарушает сопоставление без ошибки. Аналогично, дата начала месяца и произвольная дата внутри месяца – разные значения.\n\n### Полнота справочника\n\nЕсли в факте встретится код, которого нет в измерении (новая точка), модель не сможет назначить ему регион. Такие строки попадают в сводной в группу «(пусто)». Это сигнал проверить полноту справочника, а не скрыть группу фильтром (занятие 2.2, антисоединение).\n\n> [!WARNING]\n> Модель не исправляет исходные данные. Если регион в `DimStore` указан неверно, модель согласованно отнесет все продажи точки к неверному региону. Ошибка станет не случайной, а систематической.\n\n### Как работает фильтрация через связь\n\n```excel\nВыбран регион «Урал» в DimStore\n          ↓\nОтобраны коды точек этого региона\n          ↓\nЧерез связь отобраны строки FactSales с этими кодами\n          ↓\nПросуммирована выручка этих строк\n```\n\nТекст региона не копируется в факт: фильтр распространяется по ключам. Этот механизм определяет **контекст фильтра**, на котором основаны меры занятия 3.2.\n\n```quiz\nquestion: Что проверить в первую очередь, если связь «один ко многим» не создается?\nA: Оформление заголовков сводной таблицы\nB: Уникальность ключа на стороне «один» и совместимость типов полей\nC: Сортировку таблицы фактов по выручке\nD: Наличие столбца «Регион» внутри FactSales\ncorrect: B\nexplanation: Сторона «один» должна однозначно определять объект, а значения ключей должны быть сопоставимы по типу и написанию.\n```\n\n### Практика\n\n1. Создать три связи. Для каждой назвать таблицу стороны «один» и «многие».\n2. Проверить уникальность ключей трех справочников.\n3. Добавить `DimStoreBad` в копию модели, попытаться связать с фактом по коду точки и зафиксировать причину отказа. Удалить `DimStoreBad` из модели.\n\n## 5. Календарь и порядок месяцев\n\nВ сводной таблице месяцы – текст («Январь», «Февраль»…). Текст сортируется по алфавиту: порядок будет «Апрель, Февраль, Январь». Чтобы месяцы шли хронологически, в Power Pivot задается сортировка по столбцу:\n\n1. В окне Power Pivot открыть таблицу `DimDate` (представление данных).\n2. Выделить столбец «Месяц».\n3. «Главная» → «Сортировка по столбцу» → «№ месяца».\n\nСортировка сохраняется в модели и применяется ко всем сводным.\n\n### Требования к календарю\n\nВ учебной модели факты помесячные, поэтому `DimDate` содержит четыре строки по числу месяцев. В моделях с датами по дням календарь строится иначе:\n\n- одна строка на каждый день непрерывного диапазона (без пропусков);\n- ключ – дата без времени;\n- таблица помечается как таблица дат («Конструктор» → «Пометить как таблицу дат»);\n- календарь содержит все нужные атрибуты (год, квартал, месяц, номер месяца, день недели).\n\nНепрерывность нужна функциям сравнения периодов (например, «тот же период прошлого года»), которые рассматриваются в более сложных моделях.\n\n## 6. Схема «звезда»\n\nПосле создания связей `FactSales` располагается в центре диаграммы, `DimStore`, `DimCategory`, `DimDate` – вокруг:\n\n```excel\n                 DimStore\n                    │\nDimCategory ─── FactSales ─── DimDate\n```\n\nТакая организация называется **схемой «звезда»**: одна центральная таблица фактов и несколько измерений, связанных непосредственно с ней. В учебной модели:\n\n- измерений три, связей три;\n- сторона «один» – в измерении, сторона «многие» – в факте;\n- прямых связей между измерениями нет.\n\nРегион – характеристика точки, поэтому хранится в `DimStore`. Группа – характеристика категории, поэтому хранится в `DimCategory`. Чтобы сгруппировать продажи по региону и группе одновременно, отдельная связь «точка – категория» не нужна: оба признака доходят до факта своими связями.\n\nТакую модель проще читать и сопровождать: новый атрибут точки добавляется в `DimStore` и сразу доступен для группировки.\n\n> [!NOTE]\n> Схема «звезда» не исправляет неверно выбранное зерно, дубликаты ключей и неверные атрибуты. Ее преимущество в ясности: для любого поля понятно, в какой таблице оно хранится.\n\n### Порядок в списке полей\n\nКлючи и технические поля факта (`Код точки`, `Код категории`, `Дата`, `ID`) в отчетах не нужны: группировать следует по полям измерений. Чтобы пользователь не выбрал не то поле, их скрывают («Скрыть из клиентских средств» в контекстном меню столбца в Power Pivot). Числовые столбцы (`Выручка`) остаются видимыми.\n\n```quiz\nquestion: Почему в схеме «звезда» не создают связей между измерениями (например, между DimStore и DimCategory)?\nA: Excel не позволяет связывать две справочные таблицы\nB: Измерения связаны через общий факт, а лишние связи создают неоднозначные пути фильтра\nC: Связи между измерениями удаляют данные из факта\nD: Связей между измерениями быть не может, так как в них нет ключей\ncorrect: B\nexplanation: Измерения соотносятся друг с другом через факт: продажа указывает и точку, и категорию. Дополнительные связи создают несколько путей между таблицами, и результат фильтрации становится неоднозначным.\n```\n\n## 7. Сводная таблица из модели данных\n\nПостроение диаграммы – промежуточный результат. Главная проверка: корректно ли модель агрегирует.\n\n### Сводная «Регион × Месяц»\n\n1. «Power Pivot» → «Сводная таблица» (или «Вставка» → «Сводная таблица» → «Использовать модель данных этой книги»). В списке полей таблицы модели отображаются отдельными группами.\n2. «Строки»: `DimStore[Регион]`.\n3. «Столбцы»: `DimDate[Месяц]`.\n4. «Значения»: `FactSales[Выручка]`, операция «Сумма».\n\nТри поля взяты из трех разных таблиц и работают совместно благодаря связям.\n\n### Контрольные значения\n\n| Показатель | Значение |\n| --- | --- |\n| Общая выручка | 43 965 500 |\n| Северо-Запад | 18 021 000 |\n| Урал | 15 229 500 |\n| Юг | 10 715 000 |\n| Регионов | 3 |\n\n### Сравнение с плоской таблицей\n\nОбычная сводная по листу «Плоская таблица» дает те же 43 965 500, но четыре региона: Урал – 14 815 000, Поволжье – 414 500. Разница возникла из-за записи TT03 за март в категории CAT4. Её ID в `FactSales` – 76.\n\nМодель данных исправляет эту ситуацию **структурно**: регион берется из `DimStore`, где у `TT03` одно значение.\n\n```quiz\nquestion: Почему из модели можно построить сводную, где регион взят из DimStore, месяц из DimDate, а выручка из FactSales?\nA: Excel при каждой сводной копирует все поля справочников в FactSales\nB: Связи передают отбор из измерений в таблицу фактов, где суммируется выручка выбранных строк\nC: Каждая из трех таблиц обязана содержать одинаковый список столбцов\nD: Регион и месяц предварительно суммируются в справочниках без обращения к факту\ncorrect: B\nexplanation: Регион и месяц задают фильтры, которые по связям отбирают строки факта. Суммируется выручка отобранных строк.\n```\n\n## 8. Проверка модели перед вычислениями\n\nПрежде чем создавать меры, проверяется:\n\n- зерно `FactSales`: точка × категория × месяц, 128 строк;\n- в модели четыре рабочих таблицы;\n- ключи справочников уникальны;\n- три связи, прямых связей между измерениями нет;\n- типы и значения ключей согласованы;\n- сводная по регионам показывает три региона;\n- общая выручка – 43 965 500.\n\n> [!TIP]\n> При неожиданном значении в сводной диагностика начинается с модели, а не с формулы: связи, ключи, зерно, уникальность. Исправление формулы без проверки модели ведет к правке не того места.\n\n## 9. Использование ИИ: проверка модели\n\nЯзыковая модель помогает проверять описание модели. Запрос:\n\n```excel\nНиже описание таблиц модели данных Excel: столбцы, ключи, число строк, связи.\n\n[ВСТАВЬТЕ ОПИСАНИЕ]\n\n1. Сформулируй зерно каждой таблицы фактов.\n2. Для каждой связи укажи таблицы со стороны «один» и «многие» и проверь, что ключ со стороны «один» может быть уникальным.\n3. Найди связи, которые образуют несколько путей между таблицами.\n4. Укажи поля, которые следует скрыть из клиентских средств.\n5. Предложи проверки: сумма по факту и сумма по сводной, число строк, ключи без соответствия.\n```\n\nОтвет является гипотезой: структура проверяется по данным книги, а не по описанию.\n\n## 10. Итоги занятия\n\n1. Модель данных состоит из связанных таблиц и не требует копирования описаний в каждую строку факта.\n2. До построения связей определяется зерно: что означает одна строка факта.\n3. Факт хранит наблюдения и внешние ключи; измерения – уникальные объекты и их признаки.\n4. Все связи учебной модели – «один ко многим», сторона «один» в измерении.\n5. Уникальность ключа, согласованность типов и полнота справочника проверяются до связывания: Power Pivot не исправляет плохие источники.\n6. В схеме «звезда» измерения связаны только с фактом.\n7. Совпадение общей суммы не доказывает правильность разрезов; регион берется из справочника, а не из строки факта.\n8. Порядок месяцев в сводной задается сортировкой по столбцу.\n\n## Практика: построение модели данных\n\n**Задача.** Построить модель из четырех таблиц, проверить ключи и связи, получить сводную по региону и найти запись с противоречивым регионом.\n\n**Файл.** [lesson-3.1.xlsx](materials/lesson-3.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Модель строится в этой же книге и сохраняется для занятия 3.2.\n\n**Что нужно сделать.**\n\n1. Найти в плоской таблице противоречивое описание точки TT03.\n2. Добавить четыре таблицы в модель данных.\n3. Создать три связи и расположить таблицы в виде звезды.\n4. Настроить порядок месяцев и построить сводную «Регион × Месяц», проверить 43 965 500.\n5. Сравнить с плоской таблицей, найти ID записи с противоречием.\n\n**Результат.** Выполненная книга с моделью данных и двумя сводными таблицами.\n", "3.2": "---\ntitle: \"Основы DAX и корректная агрегация\"\nsummary: \"Вычисляемые столбцы и меры на языке DAX, контексты строки и фильтра, функции SUM, SUMX, CALCULATE, ALL и DIVIDE, расчет долей и корректная агрегация относительных показателей и средних.\"\nsource: \"materials/lesson-3.2.xlsx\"\nconcepts:\n  - \"DAX :: Язык формул Power Pivot (Data Analysis Expressions). Описывает вычисления над таблицами модели данных.\"\n  - \"Вычисляемый столбец :: Столбец, значение которого вычисляется для каждой строки таблицы при обновлении модели и хранится в ней.\"\n  - \"Мера :: Выражение, которое вычисляется для текущей ячейки отчета с учетом действующих фильтров. Хранится как формула, а не как значения.\"\n  - \"Контекст строки :: Текущая строка таблицы, для которой вычисляется выражение. Возникает в вычисляемом столбце и внутри итераторов (SUMX).\"\n  - \"Контекст фильтра :: Набор ограничений, действующих на ячейку отчета: строки, столбцы и срезы сводной и фильтры внутри меры.\"\n  - \"Аддитивный показатель :: Показатель, который можно суммировать по любым группам без потери смысла (выручка, количество, затраты).\"\n  - \"Неаддитивный показатель :: Показатель, который нельзя получить сложением значений групп (маржинальность, цена, доля). Рассчитывается из агрегированных числителя и знаменателя.\"\n  - \"SUMX :: Итератор: вычисляет выражение для каждой строки таблицы (в контексте строки), затем суммирует результаты.\"\n  - \"CALCULATE :: Функция, которая вычисляет выражение в измененном контексте фильтра: добавляет, заменяет или снимает ограничения.\"\n  - \"ALL :: Функция, снимающая фильтр с указанного столбца или таблицы внутри CALCULATE.\"\n  - \"Средневзвешенная величина :: Среднее, в котором каждое значение учитывается пропорционально весу (например, цена с весом в виде количества). Для цены – выручка, деленная на количество.\"\n---\n\n# Основы DAX и корректная агрегация\n\n## Цели и требования\n\nНа занятии 3.1 построена модель: таблица фактов `FactSales` и три измерения. Выручку в сводной таблице можно получить стандартной операцией «Сумма». Но для маржинальности, доли региона или средней цены стандартной операции недостаточно: нужно определить, как правильно агрегировать. Такие показатели задаются мерами на языке DAX один раз на уровне модели и затем используются в любом отчете одинаково.\n\nПосле занятия нужно уметь:\n\n- различать вычисляемый столбец и меру, контекст строки и контекст фильтра;\n- создавать базовые аддитивные меры и производные меры;\n- считать относительные показатели (маржинальность, доля) из агрегированных числителя и знаменателя;\n- применять SUMX, CALCULATE и ALL и объяснять, какие фильтры они меняют;\n- распознавать «среднее из средних» и заменять его средневзвешенным.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows с Power Pivot. Работа продолжается в сохраненной книге занятия 3.1 либо в файле `lesson-3.2.xlsx` (таблицы там оформлены, но модель нужно создать). Разделитель аргументов в DAX в русской версии Excel – точка с запятой.\n\n## 1. Проверка модели перед вычислениями\n\nМера может быть записана верно и все же давать неверный результат из-за модели: дубликата ключа, отсутствующей связи, неверного зерна. Поэтому перед DAX проверяется состояние модели:\n\n- в диаграмме четыре таблицы: `FactSales` в центре, вокруг `DimStore`, `DimCategory`, `DimDate`;\n- три связи «один ко многим», сторона «многие» –
