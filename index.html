 факт;\n- сводная «Регион × Месяц» дает 43 965 500 и три региона.\n\n> [!WARNING]\n> Если связь не создается, сначала проверяются уникальность ключа на стороне «один» и совпадение типов (занятие 3.1). Повторное перетаскивание поля проблему не решает.\n\nЕсли работа ведется в чистом файле 3.2, четыре таблицы сначала добавляются в модель и связываются, как на занятии 3.1.\n\n## 2. Вычисляемый столбец и мера\n\nВычисляемый столбец и мера могут использовать одни поля, но работают по-разному:\n\n| Свойство | Вычисляемый столбец | Мера |\n| --- | --- | --- |\n| Что вычисляется | Значение для каждой строки таблицы | Значение для текущей ячейки отчета |\n| Когда | При загрузке и обновлении модели | При построении отчета, с текущими фильтрами |\n| Что хранится | Результат по каждой строке | Только формула |\n| Контекст | Строки | Фильтра |\n| Типичные задачи | Прибыль строки, цена строки, признак | Выручка региона, маржинальность, доля |\n\n### Вычисляемый столбец и контекст строки\n\nВ Power Pivot, в таблице `FactSales` (представление данных), создается столбец «Прибыль строки»:\n\n```excel\n= FactSales[Выручка] - FactSales[Прямые затраты]\n```\n\nДля каждой строки берутся ее собственные выручка и затраты. Получается 128 значений. **Контекст строки** – это текущая строка, для которой вычисляется выражение. Выбор региона в сводной не меняет сохраненную прибыль строки; он лишь определяет, какие строки участвуют в показателе.\n\n### Мера и контекст фильтра\n\nМеры записываются в виде `Имя := выражение` (так определение показано в тексте). В окне «Новая мера» имя вводится в отдельное поле, а в поле формулы вводится выражение, начиная со знака равенства.\n\n```excel\nВыручка := SUM(FactSales[Выручка])\nПрямые затраты := SUM(FactSales[Прямые затраты])\nВаловая прибыль := [Выручка] - [Прямые затраты]\n```\n\nСтолбец записывается как `FactSales[Выручка]`, а ранее определенная мера – как `[Выручка]`. Производная мера через базовые остается согласованной: если определение выручки изменится, изменятся все зависящие от нее показатели.\n\nЕсли вывести `[Валовая прибыль]` в сводную по регионам, формула одна, а результат для каждого региона свой. **Контекст фильтра** – набор ограничений, действующих в ячейке. Для строки «Урал» и столбца «Март» это: регион = Урал, месяц = Март. Мера вычисляется только по строкам, удовлетворяющим этим условиям.\n\n> [!TIP]\n> Выбор между столбцом и мерой определяется вопросом. «Какова прибыль **этой записи**?» – столбец. «Какова прибыль **выбранного региона** в выбранном месяце?» – мера.\n\n### Контрольные значения\n\n| Показатель | Значение |\n| --- | --- |\n| Выручка | 43 965 500 |\n| Прямые затраты | 29 273 600 |\n| Валовая прибыль | 14 691 900 |\n\n```quiz\nquestion: Что является основным отличием меры от вычисляемого столбца?\nA: Мера всегда возвращает текст, а столбец – только число\nB: Столбец хранит результаты на уровне строк, а мера вычисляет показатель в текущем контексте фильтра\nC: Вычисляемый столбец доступен только в Power Query\nD: Мера не может использовать поля таблицы фактов\ncorrect: B\nexplanation: Мера вычисляется для набора строк, заданного фильтрами отчета. Вычисляемый столбец вычисляется один раз для каждой строки.\n```\n\n## 3. Аддитивные и неаддитивные показатели\n\nКоличество, выручка и затраты **аддитивны**: сумма по двум месяцам равна сумме месячных значений, сумма по регионам равна общему итогу. Для них подходит `SUM`:\n\n```excel\nКоличество := SUM(FactSales[Количество])\n```\n\nЕсли просто перетащить числовое поле в «Значения» сводной, Excel создаст неявную меру («Сумма по полю Выручка»). Она допустима для простых случаев, но определение показателя оказывается внутри конкретной сводной. Явные меры задают определение один раз в модели, и все отчеты используют его одинаково.\n\n### Маржинальность не является суммой\n\nМаржинальность – отношение валовой прибыли к выручке. Складывать проценты по регионам нельзя, а простое среднее процентов в общем случае неверно. Корректный способ – разделить агрегированные величины:\n\n```excel\nМаржинальность := DIVIDE([Валовая прибыль]; [Выручка])\n```\n\n`DIVIDE` делит с обработкой нулевого знаменателя: при делении на ноль возвращается пустое значение (а не ошибка).\n\nВ общем итоге мера делит **общую** валовую прибыль на **общую** выручку, а не усредняет маржу строк. Это сохраняет смысл на любом уровне детализации: регион, месяц, точка.\n\nСравнение на учебных данных:\n\n| Способ | Значение |\n| --- | --- |\n| Общая прибыль / общая выручка | 33,42 % |\n| Простое среднее маржинальности 128 строк | 33,75 % |\n\nРазличие мало, но систематично: строки с большей выручкой имеют больший вес в общем отношении. На данных с большим разбросом выручки различие становится существенным.\n\n> [!NOTE]\n> Единица и формат входят в определение показателя. Выручка и затраты – числа с разделителем групп разрядов, количество – целое, маржинальность – процент. Форматы задаются в свойствах меры в модели.\n\n### Контрольные значения\n\n| Показатель | Значение |\n| --- | --- |\n| Количество | 265 260 |\n| Маржинальность | 33,42 % |\n\n```quiz\nquestion: Как получить общую маржинальность для нескольких регионов с разной выручкой?\nA: Сложить региональные проценты маржинальности\nB: Взять простое среднее процента маржинальности по всем строкам\nC: Разделить общую валовую прибыль на общую выручку выбранных регионов\nD: Взять максимальную маржинальность одного региона\ncorrect: C\nexplanation: Общая маржинальность – отношение агрегированных числителя и знаменателя. Простое среднее процентов меняет веса и искажает результат.\n```\n\n## 4. SUMX: построчное вычисление и сумма\n\n`SUM` складывает значения одного готового столбца. Если показатель нужно сначала вычислить для каждой строки, а потом сложить, применяется итератор:\n\n```excel\nSUMX(таблица; выражение_для_каждой_строки)\n```\n\n`SUMX` берет таблицу, ограниченную текущими фильтрами отчета, вычисляет выражение в контексте строки для каждой строки и суммирует результаты. Валовую прибыль можно записать так:\n\n```excel\nВаловая прибыль SUMX :=\n    SUMX(\n        FactSales;\n        FactSales[Выручка] - FactSales[Прямые затраты]\n    )\n```\n\nРезультат совпадает с `[Валовая прибыль]`, так как разность сумм равна сумме разностей. Но если выручка уже хранится в одном столбце, проще и быстрее `SUM`. Итератор нужен, когда выражение зависит от нескольких столбцов, значения которых нужно перемножить до суммирования.\n\n### Пример: цена строки\n\nДобавляется вычисляемый столбец:\n\n```excel\n= DIVIDE(FactSales[Выручка]; FactSales[Количество])\n```\n\n«Цена строки» – цена единицы внутри одной агрегированной записи. Выручку можно восстановить мерой:\n\n```excel\nВыручка SUMX :=\n    SUMX(\n        FactSales;\n        FactSales[Количество] * FactSales[Цена строки]\n    )\n```\n\nРезультат должен совпасть с `[Выручка]` (43 965 500).\n\n> [!WARNING]\n> Итератор вычисляет выражение для каждой строки таблицы. На больших таблицах сложное выражение внутри `SUMX` замедляет отчет. Если задачу решает `SUM` или простая арифметика мер, итератор не применяется.\n\n```quiz\nquestion: В какой задаче SUMX принципиально отличается от SUM?\nA: Нужно сложить значения существующего столбца FactSales[Выручка]\nB: Нужно для каждой строки перемножить количество и цену, а затем сложить произведения\nC: Нужно изменить шрифт сводной таблицы\nD: Нужно удалить фильтр региона из отчета\ncorrect: B\nexplanation: SUMX сначала вычисляет выражение в контексте каждой строки, затем агрегирует. SUM складывает значения одного готового столбца.\n```\n\n## 5. CALCULATE: изменение контекста фильтра\n\nПока фильтры задавались извне: строками, столбцами и срезами сводной. `CALCULATE` позволяет изменить контекст внутри меры:\n\n```excel\nCALCULATE(выражение; фильтр_1; фильтр_2; ...)\n```\n\nВыражение вычисляется с добавленными, замененными или снятыми фильтрами. **Фильтры, не затронутые аргументами, продолжают действовать.**\n\n### Добавление фильтра\n\n```excel\nВыручка продовольственных :=\n    CALCULATE(\n        [Выручка];\n        DimCategory[Группа] = \"Продовольственные\"\n    )\n```\n\nМера возвращает выручку группы «Продовольственные». Если вывести ее по регионам, фильтр региона из сводной сохраняется: в каждой строке видна выручка продовольственных товаров этого региона. Общий итог меры равен 32 562 700. Если пользователь уже фильтрует то же поле (`DimCategory[Группа]`), фильтр меры заменяет его.\n\n### Снятие фильтра: ALL\n\nДля сравнения региона со всей сетью нужна мера, которая игнорирует выбранный регион:\n\n```excel\nВыручка без фильтра региона :=\n    CALCULATE(\n        [Выручка];\n        ALL(DimStore[Регион])\n    )\n```\n\n`ALL(DimStore[Регион])` снимает фильтр по полю региона. Фильтр по месяцу, если месяц есть в сводной, продолжает действовать. Поэтому в строке «Урал» столбца «Март» мера возвращает выручку всей сети за март.\n\nЗапись `ALL(DimStore)` снимает фильтры всех полей таблицы точек (регион, формат и другие). Это более широкое действие, и применять его без необходимости не следует.\n\n> [!TIP]\n> Перед выбором ALL нужно сформулировать словами: какой именно фильтр убирается и какие остаются. Для доли региона достаточно снять ограничение по региону.\n\n```quiz\nquestion: В сводной строки – регионы, столбцы – месяцы. Что делает ALL(DimStore[Регион]) внутри меры выручки?\nA: Снимает фильтры всех таблиц, включая месяц\nB: Убирает только ограничение по полю региона; фильтр по месяцу продолжает действовать\nC: Удаляет таблицу DimStore из модели\nD: Делает меру постоянным числом, не зависящим от фильтров\ncorrect: B\nexplanation: CALCULATE меняет только перечисленные в аргументах фильтры. Фильтр по месяцу не упомянут и сохраняется.\n```\n\n## 6. Относительный показатель: доля региона\n\nЕсли числитель и знаменатель определены как меры, доля строится без зашитых итогов:\n\n```excel\nДоля региона :=\n    DIVIDE(\n        [Выручка];\n        CALCULATE([Выручка]; ALL(DimStore[Регион]))\n    )\n```\n\nЧислитель – выручка региона в текущем контексте. Знаменатель – выручка без фильтра региона, но с остальными фильтрами отчета. Поэтому при выборе одного месяца знаменатель становится выручкой сети за этот месяц, а при выборе группы категорий – выручкой сети по этой группе.\n\nКонтрольные значения (без дополнительных фильтров):\n\n| Регион | Выручка | Доля |\n| --- | --- | --- |\n| Северо-Запад | 18 021 000 | 40,99 % |\n| Урал | 15 229 500 | 34,64 % |\n| Юг | 10 715 000 | 24,37 % |\n| Итого | 43 965 500 | 100 % |\n\nВ столбце «Март» доля Урала – 34,76 % (3 923 600 из 11 286 300): долю нужно читать в своем контексте. В каждом столбце месяца доли регионов суммируются до 100 %.\n\n> [!NOTE]\n> Долю нельзя складывать с маржинальностью или суммировать между разными контекстами. Перед записью относительной меры нужно определить, что в знаменателе: вся сеть, тот же месяц, та же группа.\n\n## 7. Среднее из средних\n\nВ `FactSales` одна строка не соответствует одной проданной единице: она описывает все продажи точки в категории за месяц. Для средней цены единицы строки имеют разные веса: в одной строке 5 119 единиц, в другой 679.\n\n### Неверный способ\n\n```excel\nСредняя цена, неверно := AVERAGE(FactSales[Цена строки])\n```\n\nФормула работает без ошибок, но каждая строка получает **одинаковый вес**, независимо от числа проданных единиц.\n\n### Малый пример\n\nПервая запись: 1 единица по 100 руб. Вторая: 9 единиц по 10 руб. Простое среднее цен – (100 + 10) / 2 = 55 руб. Общая выручка – 100 + 90 = 190 руб., проданных единиц – 10, средняя цена единицы – 19 руб. Разница в том, что усредняется: две записи или десять единиц.\n\n### Корректная мера\n\n```excel\nСредняя цена := DIVIDE([Выручка]; [Количество])\n```\n\nОбщая выручка делится на общее количество в том же контексте: это средневзвешенная цена, весом служит количество. Эквивалентная запись через итератор:\n\n```excel\nСредняя цена SUMX :=\n    DIVIDE(\n        SUMX(FactSales; FactSales[Цена строки] * FactSales[Количество]);\n        [Количество]\n    )\n```\n\n### Сравнение на учебных данных\n\n| Показатель | Значение |\n| --- | --- |\n| Средняя цена, неверно (общий итог) | 211,01 |\n| Средняя цена (корректно) | 165,74 |\n| Минимальная цена строки (ID 81, TT05, CAT1) | 111,99 |\n| Максимальная цена строки (ID 64, TT08, CAT4) | 379,23 |\n\nПростое среднее выше корректного почти на 45 руб., потому что высокие цены категории CAT4 (около 379 руб.) сочетаются с малыми количествами: в среднем 940 единиц на строку против 3 711 в категории CAT1 (около 112 руб.). По регионам неверная мера дает примерно 211, корректная – 165,7.\n\n> [!WARNING]\n> «Среднее из средних» не всегда неверно: оно совпадает с правильным результатом, если веса всех групп одинаковы. Но это условие требует проверки, а не предположения.\n\n```quiz\nquestion: Почему AVERAGE(FactSales[Цена строки]) завышает среднюю цену проданной единицы?\nA: DAX не поддерживает вычисляемые столбцы\nB: В каждой строке одинаковое количество проданных единиц\nC: Каждая агрегированная строка получает одинаковый вес, хотя продано разное количество единиц\nD: DIVIDE всегда умножает результат на количество\ncorrect: C\nexplanation: Простое среднее цен строк взвешивает записи одинаково. Для средней цены единицы вес должен соответствовать количеству единиц.\n```\n\n## 8. Организация мер\n\nС увеличением числа мер важна дисциплина:\n\n- **Одна мера – одно определение.** Выручка определена один раз; прочие показатели ссылаются на нее.\n- **Имена по смыслу.** «Валовая прибыль», «Доля региона», а не «Мера1».\n- **Формат задается в модели.** Свойство «Формат» меры: число, процент, денежная единица. Тогда в любой сводной показатель выглядит одинаково.\n- **Комментарии.** В DAX строка, начинающаяся с `//`, является комментарием: можно записать, что и зачем снимается фильтром.\n- **Проверка на контрольных значениях.** Каждая новая мера сверяется с независимым расчетом (на плоской таблице, на калькуляторе) по общему итогу и хотя бы одному региону.\n- **Ключи скрыты.** Технические столбцы факта скрыты, чтобы не использоваться в отчетах вместо полей измерений.\n\n## 9. Использование ИИ: проверка определения меры\n\nЯзыковая модель помогает разобрать чужую формулу DAX. Запрос:\n\n```excel\nНиже мера DAX и описание таблиц моей модели:\n\n[ВСТАВЬТЕ МЕРУ И ОПИСАНИЕ МОДЕЛИ]\n\n1. Определи, является ли результат аддитивным, относительным или средневзвешенным.\n2. Назови смысл числителя и знаменателя, если они есть.\n3. Укажи, какие фильтры действуют на меру и какие она изменяет.\n4. Проверь, нет ли простого среднего агрегированных средних при разных весах.\n5. Предложи небольшой контрольный набор с разными весами и нулевым знаменателем.\n6. Объясни, как проверить равенство формулы и ее аналога по общему итогу, регионам и месяцам.\n7. Не меняй логику без объяснения того, какой вопрос решает новая формула.\n```\n\nКаждый вывод проверяется в Excel: совпадение имен таблиц и полей, наличие связей, равенство значений на контрольных данных.\n\n## 10. Итоги занятия\n\n1. Вычисляемый столбец хранит значения по строкам, мера вычисляет показатель для текущего контекста фильтра.\n2. Контекст строки отвечает на вопрос «какая запись вычисляется», контекст фильтра – «какие записи доступны ячейке».\n3. Явные базовые меры задают единое определение выручки, количества и затрат.\n4. `SUM` складывает готовый столбец, `SUMX` вычисляет выражение по строкам и суммирует.\n5. `CALCULATE` изменяет контекст; `ALL` применяется к минимально необходимому набору полей.\n6. Доля требует динамического знаменателя, сохраняющего остальные фильтры.\n7. Маржинальность и цена – отношения агрегированных величин; среднее из средних дает неверный результат при разных весах.\n8. Меры проверяются на контрольных значениях.\n\n## Практика: меры DAX и корректная агрегация\n\n**Задача.** Создать в модели данных вычисляемые столбцы и меры (выручка, прибыль, маржинальность, доля региона, средняя цена) и собрать итоговую сводную таблицу.\n\n**Файл.** [lesson-3.2.xlsx](materials/lesson-3.2.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Работа продолжается в книге модели занятия 3.1 либо в этом файле.\n\n**Что нужно сделать.**\n\n1. Проверить модель: четыре таблицы, три связи, итог 43 965 500.\n2. Создать столбец «Прибыль строки» и меры выручки, затрат, валовой прибыли, количества, маржинальности.\n3. Создать меры на SUMX и CALCULATE: «Валовая прибыль SUMX», «Выручка продовольственных», «Выручка без фильтра региона», «Доля региона».\n4. Сравнить «Среднюю цену, неверно» и «Среднюю цену».\n5. Собрать итоговую сводную по регионам и задать форматы мер.\n\n**Результат.** Выполненная книга с моделью, мерами и итоговой сводной таблицей, значения которой совпадают с контрольными.\n", "4.1": "---\ntitle: \"Анализ чувствительности финансовых моделей\"\nsummary: \"Однофакторный анализ чувствительности: таблицы данных, выбор диапазонов и шага, проценты и процентные пункты, эластичность, диаграмма-торнадо и ограничения метода.\"\nsource: \"materials/lesson-4.1.xlsx\"\nconcepts:\n  - \"Анализ чувствительности :: Вычислительный эксперимент: одна предпосылка модели меняется по заданному диапазону, остальные остаются неизменными («при прочих равных»), фиксируется изменение результата.\"\n  - \"Таблица данных :: Инструмент Excel «Анализ \"что если\"»: многократно вычисляет модель, подставляя в выбранную входную ячейку значения из списка. Не путать со структурированной таблицей.\"\n  - \"Ячейка подстановки :: Входная ячейка модели (предпосылка), в которую таблица данных временно подставляет тестовые значения.\"\n  - \"Диапазон предпосылки :: Границы и шаг тестовых значений. Выбираются исходя из внешних ограничений и не могут быть заданы инструментом.\"\n  - \"Процентный пункт :: Единица изменения величины, выраженной в процентах. Рост ставки с 15 % до 17 % – это +2 п.п. (относительное изменение +13,3 %).\"\n  - \"Эластичность :: Отношение относительного изменения результата к относительному изменению предпосылки. Безразмерная локальная характеристика около базовой точки.\"\n  - \"Диаграмма-торнадо :: Столбчатая диаграмма отклонений результата от базы при значениях Low и High каждой предпосылки, упорядоченная по убыванию эффекта.\"\n  - \"Low / Base / High :: Нижнее, базовое и верхнее значения предпосылки, используемые для построения диаграммы-торнадо.\"\n  - \"Режим «Автоматически, кроме таблиц данных» :: Режим вычислений Excel, в котором таблицы данных пересчитываются только по команде (F9) и могут показывать устаревшие значения.\"\n---\n\n# Анализ чувствительности финансовых моделей\n\n## Цели и требования\n\nНа третьем дне рассматривалось, как корректно вычислить показатель по данным. Теперь рассматривается обратный вопрос: как результат модели зависит от допущений. Предпосылки финансовой модели (цена, объем, затраты, ставка) заранее неизвестны точно, и оценка реакции результата на их изменение входит в любой расчет, предназначенный для принятия решения.\n\nПосле занятия нужно уметь:\n\n- отличать анализ чувствительности от сценарного анализа и стресс-тестирования;\n- строить однофакторную таблицу данных и проверять ее по базовой строке;\n- обоснованно выбирать диапазон и шаг, различать проценты и процентные пункты;\n- рассчитывать эластичность и читать ее значение;\n- строить диаграмму-торнадо по отклонениям от базы;\n- называть ограничения метода и особенности пересчета таблиц данных.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. Используется команда «Данные» → «Анализ \"что если\"» → «Таблица данных». Файл `lesson-4.1.xlsx` содержит модель и заготовки областей для таблиц.\n\n> [!WARNING]\n> В этом занятии «таблица данных» означает инструмент анализа «что если», а не структурированную таблицу из занятия 1.1 («Вставка» → «Таблица»).\n\n## 1. Учебная модель и точка отсчета\n\nКнига содержит упрощенную пятилетнюю инвестиционную модель. Лист «Предпосылки» содержит исходные величины (ячейки `B6:B16`), лист «Модель» – расчет по годам, лист «Торнадо» – заготовку для диаграммы.\n\n| Ячейка | Предпосылка | Значение |\n| --- | --- | --- |\n| `B6` | Объем продаж, год 1 | 80 000 ед. |\n| `B7` | Цена, год 1 | 1 200 руб./ед. |\n| `B8` | Рост объема | 4 % в год |\n| `B9` | Рост цены | 3 % в год |\n| `B10` | Переменные затраты, год 1 | 700 руб./ед. |\n| `B11` | Рост переменных затрат | 3 % в год |\n| `B12` | Постоянные затраты, год 1 | 18 000 000 руб. |\n| `B13` | Рост постоянных затрат | 4 % в год |\n| `B14` | Налоговая ставка | 20 % |\n| `B15` | Первоначальный CAPEX | 30 000 000 руб. |\n| `B16` | Ставка дисконтирования | 15 % |\n\nРасчет: объем и цена растут заданными темпами, их произведение дает выручку; из выручки вычитаются переменные и постоянные затраты; с положительной операционной прибыли удерживается налог; денежный поток дисконтируется; из суммы вычитается CAPEX.\n\n**Базовый NPV модели – 39 602 574 руб.** Это точка отсчета занятия: каждое сравнение выражается как отклонение от нее. Перед любым анализом базовый результат проверяется и фиксируется.\n\nВходные величины собраны на одном листе в одном блоке, расчет вынесен на другой лист. Это слои из занятия 1.1: чувствительность возможна именно потому, что предпосылки не вписаны в формулы.\n\n### Практика\n\n1. На листе «Предпосылки» изменить цену `B7` с 1 200 на 1 300 руб./ед. и записать NPV из `B19`.\n2. Вернуть 1 200 и убедиться, что NPV снова 39 602 574.\n\nРучное изменение – прообраз всего занятия: таблица данных делает то же самое автоматически для целого списка значений.\n\n## 2. Что такое чувствительность и чем она не является\n\nАнализ чувствительности – контролируемый вычислительный эксперимент. Одна предпосылка меняется по заданному диапазону, остальные остаются на базовом уровне, фиксируется результат. Фраза «при прочих равных» – определение метода, а не оговорка. Именно она отличает чувствительность от смежных методов:\n\n| Метод | Что меняется | Вопрос |\n| --- | --- | --- |\n| Однофакторная чувствительность | Одна предпосылка | Насколько и в какую сторону реагирует результат на этот фактор? |\n| Сценарный анализ (занятие 5.1) | Согласованный набор предпосылок | Каким будет результат при определенном сочетании условий? |\n| Стресс-тестирование (занятие 5.2) | Набор неблагоприятных, часто экстремальных предпосылок | Выдерживает ли модель тяжелые условия? |\n\n### Чем чувствительность не является\n\nСтрока «цена 1 050 руб./ед.» в таблице не означает, что такая цена ожидается, вероятна или имеет какую-то частоту. Диапазон – это область исследования, а не прогнозный интервал.\n\n> [!WARNING]\n> Типовая ошибка управленческих материалов: диапазон чувствительности выдается за прогнозный интервал. Утверждение «NPV окажется в диапазоне от … до …» требует вероятностной модели, которой в анализе чувствительности нет.\n\n```quiz\nquestion: Чем однофакторный анализ чувствительности отличается от сценарного анализа?\nA: Чувствительность применяется к доходам, сценарный анализ – к затратам\nB: Чувствительность меняет одну предпосылку при неизменных остальных, сценарий меняет согласованный набор предпосылок\nC: Чувствительность дает вероятность каждого исхода, сценарный анализ нет\nD: Чувствительность выполняется только через «Подбор параметра», сценарий только через таблицу данных\ncorrect: B\nexplanation: Различие определяется числом одновременно изменяемых предпосылок и их согласованностью, а не видом показателя и не инструментом.\n```\n\n## 3. Однофакторная таблица данных\n\nТаблица данных вычисляет модель многократно, временно подставляя в выбранную входную ячейку значения из списка, и записывает результаты в ячейки таблицы. Исходная предпосылка при этом не меняется.\n\n### Устройство заготовки\n\nНа листе «Предпосылки» в области `E5:F18` подготовлен вертикальный список цен от 900 до 1 500 руб./ед. с шагом 50:\n\n- `E5` – подпись;\n- `F5` – формула `=Модель!$B$5` (ссылка на NPV);\n- `E6:E18` – тестовые значения цены;\n- `F6:F18` – пустые ячейки, их заполнит Excel.\n\nДля вертикального списка ссылка на результат расположена **выше и правее** первого тестового значения.\n\n### Порядок построения\n\n1. Выделить весь прямоугольник `E5:F18` (подпись, значения и формулу).\n2. «Данные» → «Анализ \"что если\"» → «Таблица данных».\n3. В поле **«Подставлять значения по столбцам в»** указать `B7` (исходная цена).\n4. Поле «Подставлять значения по строкам в» оставить пустым.\n5. «ОК».\n\nСтолбец `F` заполнится: в каждой строке NPV при данной цене и базовых значениях остальных предпосылок.\n\n> [!WARNING]\n> Поле подстановки выбирается по расположению **тестовых значений**, а не результата. Вертикальный список значений – подстановка по столбцам, горизонтальный – по строкам.\n\n### Ограничение расположения\n\nТаблица данных **должна находиться на том же листе, что и входная ячейка** (`B7` и `E5:F18` – оба на листе «Предпосылки»). Результирующая формула может ссылаться на другой лист, поэтому в `F5` стоит ссылка на лист «Модель». Если нужен блок чувствительности на листе отчета, на этом листе размещается и входная ячейка, или таблица остается на листе предпосылок, а отчет ссылается на ее результаты.\n\n### Чтение результата\n\n| Цена, руб./ед. | NPV, млн руб. |\n| --- | --- |\n| 1 000 | −8,93 |\n| 1 050 | +3,20 |\n| 1 200 (база) | 39,60 |\n| 1 500 | 112,40 |\n\nЗависимость почти линейная: шаг цены 50 руб. дает примерно +12,13 млн руб. NPV. Важнее другое: **между 1 000 и 1 050 руб. NPV меняет знак.** Где-то в интервале находится цена, при которой проект выходит на нулевую эффективность. Точное значение определяется на занятии 4.2.\n\n### Практика\n\n1. Построить таблицу по цене.\n2. Проверить три значения: при 1 200 результат равен базовому NPV; при 1 000 – примерно −8,93 млн; при 1 500 – примерно 112,40 млн.\n3. Если базовая строка не совпала с базовым NPV, проверить адрес ячейки подстановки.\n\n```quiz\nquestion: Тестовые значения предпосылки расположены в столбце по вертикали. Какое поле диалога «Таблица данных» нужно заполнить?\nA: «Подставлять значения по строкам в», так как результат читается построчно\nB: «Подставлять значения по столбцам в», так как список значений расположен в столбце\nC: Оба поля, указав одну и ту же входную ячейку\nD: Ни одно: при вертикальном списке Excel определяет ячейку автоматически\ncorrect: B\nexplanation: Поле выбирается по ориентации списка тестовых значений: вертикальный список – по столбцам, горизонтальный – по строкам.\n```\n\n## 4. Диапазон предпосылки\n\nПостроить таблицу несложно. Основной вопрос – **какой диапазон и с каким шагом** задать. Инструмент этого не определяет.\n\nСлишком узкий диапазон создает ложное ощущение устойчивости, слишком широкий включает значения, которые для модели не имеют смысла. Решения принимаются по следующим вопросам.\n\n- **Откуда брать границы?** Из договорных, производственных, рыночных или экспертных ограничений. Если их нет, диапазон явно маркируется как условный.\n- **Абсолютный или относительный шаг?** Денежные и натуральные показатели удобно менять в процентах от базы; для ставок содержательнее процентные пункты.\n- **Симметричны ли Low и High?** Не обязаны быть: цена может упасть сильнее, чем вырасти.\n- **Какой шаг?** Достаточно мелкий, чтобы была видна форма отклика, но без сотен лишних пересчетов.\n- **Можно ли сравнивать факторы с разными диапазонами?** Можно сравнивать эффект выбранных диапазонов, но не «чувствительность факторов вообще».\n\n### Проценты и процентные пункты\n\nИзменение ставки с 15 % до 17 % – это **+2 процентных пункта (п.п.)**. Относительное изменение самой ставки – +13,3 %. Величины, которые сами выражены в процентах (ставки, доли, маржинальность), изменяются в процентных пунктах; в разговоре о ставках путаница меняет смысл высказывания.\n\n### Таблица по ставке дисконтирования\n\nВ области `H5:I14` подготовлен список ставок от 8 % до 24 % с шагом 2 п.п. Таблица строится так же, как для цены; ячейка подстановки по столбцам – `B16`.\n\n| Ставка | NPV, млн руб. |\n| --- | --- |\n| 8 % | 53,85 |\n| 15 % (база) | 39,60 |\n| 24 % | 26,25 |\n\nРеакция на цену близка к линейной, реакция на ставку **нелинейна**: рост ставки на 2 п.п. сначала уменьшает NPV на 4,5 млн руб., а следующие шаги уменьшают его все меньше. Прежде чем описывать чувствительность одним числом, нужно посмотреть форму отклика.\n\n### Практика\n\nПостроить таблицу по ставке, сверить крайние значения и записать одно различие между откликом на цену и на ставку.\n\n## 5. Эластичность\n\nАбсолютное изменение результата удобно читать в рублях, но оно плохо сопоставляет факторы разной природы: рубли за единицу, штуки и проценты. Эластичность переводит обе стороны в относительные величины:\n\n```excel\nE = ((Y₁ − Y₀) / Y₀) / ((X₁ − X₀) / X₀)\n```\n\nЗдесь `X` – предпосылка, `Y` – результат. Коэффициент показывает, на сколько процентов изменяется результат при изменении предпосылки на 1 % (при прочих равных).\n\n### Расчет для цены\n\nЦена растет с 1 200 до 1 320 руб./ед. (+10 %), NPV – с 39 602 574 до 68 720 782 руб.\n\n```excel\nE = ((68 720 782 − 39 602 574) / 39 602 574) / 0,10 ≈ 0,7353 / 0,10 ≈ 7,35\n```\n\nВблизи базовой точки рост цены на 1 % соответствует росту NPV примерно на 7,35 % при неизменности остальных предпосылок.\n\n### Почему коэффициент велик\n\nNPV – остаточная величина: из выручки вычитаются затраты, налог и капитальные вложения, а остаток составляет лишь часть выручки. Небольшое относительное изменение выручки дает большое относительное изменение остатка. Ошибки в значении 7,35 нет.\n\nОграничение показателя: если базовый результат близок к нулю, знаменатель в формуле мал, и эластичность становится неустойчивой. Тогда сравнение лучше выражать в абсолютных отклонениях (раздел 6).\n\n### Контрольные значения\n\nВ области `K5:O10` подготовлена заготовка; для всех факторов используется изменение +10 %. Значения «NPV +10 %» (столбец `N`) берутся из строки High мини-таблиц раздела 6, поэтому столбец заполняется после их построения.\n\n| Фактор | Эластичность |\n| --- | --- |\n| Цена | +7,35 |\n| Объем | +3,06 |\n| Переменные затраты | −4,29 |\n| Постоянные затраты | −1,31 |\n| CAPEX | −0,76 |\n\nЗнак читается содержательно: рост цены и объема увеличивает NPV, рост затрат уменьшает. Эластичность по цене больше, чем по объему, хотя оба фактора действуют на выручку: изменение объема увеличивает и переменные затраты, а изменение цены – нет.\n\n> [!NOTE]\n> Эластичность локальна: она описывает поведение модели около конкретной базовой точки и конкретного шага. Для другого шага (например, −10 %) значение может отличаться.\n\n```quiz\nquestion: Эластичность NPV по цене составила 7,35. Что это означает?\nA: Цена может вырасти в 7,35 раза, прежде чем проект станет убыточным\nB: Около базовой точки рост цены на 1 % увеличивает NPV примерно на 7,35 % при прочих равных\nC: NPV в 7,35 раза больше выручки первого года\nD: Вероятность роста NPV составляет 7,35 к одному\ncorrect: B\nexplanation: Эластичность сопоставляет относительные изменения результата и предпосылки около базовой точки. Это локальная характеристика, а не вероятность.\n```\n\n## 6. Диаграмма-торнадо\n\nЭластичность дает по одному числу на фактор, но шесть коэффициентов в таблице неудобно показывать руководителю. Диаграмма-торнадо ранжирует факторы по размаху влияния на результат.\n\n### Принцип\n\nДля каждого фактора задаются три значения: **Low, Base, High**. Модель рассчитывается при Low и High, из каждого результата вычитается базовый NPV. Полученные отклонения (Δ Low, Δ High) и составляют столбцы. В учебной книге для цены, объема, переменных и постоянных затрат и CAPEX используются ±10 % от базы; для ставки – ±2 п.п. (13 %, 15 %, 17 %).\n\n> [!WARNING]\n> Различие в способе задания диапазонов (проценты для одних факторов, пункты для другого) нужно проговаривать при каждом показе диаграммы: ранжируется эффект выбранных диапазонов, а не «вес» факторов в абсолюте.\n\n### Мини-таблицы Low / Base / High\n\nВ области `E24:U27` листа «Предпосылки» подготовлено шесть мини-таблиц (подпись и ссылка на NPV в строке 24, значения Low, Base, High в строках 25–27):\n\n| Фактор | Low | Base | High |\n| --- | --- | --- | --- |\n| Цена, руб./ед. | 1 080 | 1 200 | 1 320 |\n| Объем, ед. | 72 000 | 80 000 | 88 000 |\n| Переменные затраты, руб./ед. | 630 | 700 | 770 |\n| Постоянные затраты, руб. | 16 200 000 | 18 000 000 | 19 800 000 |\n| CAPEX, руб. | 27 000 000 | 30 000 000 | 33 000 000 |\n| Ставка дисконтирования | 13 % | 15 % | 17 % |\n\nКаждая мини-таблица строится отдельной таблицей данных: выделяется прямоугольник из четырех строк и двух столбцов (подпись, Low, Base, High и формула NPV), ячейка подстановки по столбцам – соответствующая предпосылка.\n\n**Контроль:** строка Base во всех шести мини-таблицах равна 39 602 574. Иначе одна из таблиц построена неверно.\n\n### Отклонения\n\nЛист «Торнадо» заполняется по ссылкам на мини-таблицы. Отклонения от базы, млн руб.:\n\n| Фактор | Δ Low | Δ High | Макс. эффект |\n| --- | --- | --- | --- |\n| Цена | −29,12 | +29,12 | 29,12 |\n| Переменные затраты | +16,99 | −16,99 | 16,99 |\n| Объем | −12,13 | +12,13 | 12,13 |\n| Постоянные затраты | +5,17 | −5,17 | 5,17 |\n| Ставка дисконтирования | +3,66 | −3,38 | 3,66 |\n| CAPEX | +3,00 | −3,00 | 3,00 |\n\nДва наблюдения. **Знаки затратных факторов зеркальны:** для цены и объема Low дает отрицательное отклонение, для затрат – положительное. **Отклонения ставки несимметричны** (+3,66 против −3,38): это нелинейность из раздела 4.\n\n### Сборка\n\n1. Отсортировать строки листа «Торнадо» по «Макс. эффект» по убыванию (до построения диаграммы).\n2. Выделить названия факторов и два столбца Δ Low и Δ High.\n3. «Вставка» → линейчатая диаграмма с группировкой.\n4. Проверить, что вертикальная ось проходит через ноль.\n5. При необходимости обратить порядок категорий, чтобы самый сильный фактор оказался сверху.\n\n> [!WARNING]\n> На диаграмме выводятся отклонения от базы, а не абсолютные значения NPV при Low и High. База около 39,6 млн руб. входит в каждый столбец и скрывает различия между факторами.\n\n### Что читается с диаграммы\n\nПервая тройка – цена, переменные затраты, объем. Уточнять прогноз целесообразно в первую очередь по ним. Это главная управленческая польза метода: он показывает, **куда направить ограниченные усилия по сбору и проверке данных**. Рейтинг при этом зависит от диапазонов: если для CAPEX взять ±40 % вместо ±10 %, он поднимется выше.\n\n### Практика\n\n1. Построить шесть мини-таблиц и убедиться, что Base везде равен 39 602 574.\n2. Отсортировать лист «Торнадо» и построить диаграмму.\n\n```quiz\nquestion: Почему на диаграмме-торнадо выводят отклонения от базового NPV, а не абсолютные значения NPV при Low и High?\nA: Excel не отображает абсолютные значения на линейчатой диаграмме\nB: База входит в каждый столбец и визуально скрывает различия между факторами\nC: Отклонения всегда положительны и поэтому удобнее\nD: Абсолютные значения нельзя отсортировать по убыванию\ncorrect: B\nexplanation: База около 39,6 млн руб. занимает большую часть длины каждого столбца, и различия между факторами становятся малозаметными.\n```\n\n## 7. Ограничения метода и поведение Excel\n\n**Взаимозависимость предпосылок не учитывается.** Анализ «при прочих равных» удерживает объем неизменным при изменении цены. В реальности рост цены обычно снижает спрос, и независимое изменение дает завышенный эффект (это тема сценарного анализа, занятие 5.1).\n\n**Low и High не имеют вероятностного смысла.** Диаграмма не говорит о том, что менее вероятно.\n\n**Результат зависит от базовой точки и диапазона.** Эластичность локальна, рейтинг торнадо определяется выбранными шагами.\n\n**Таблицы данных пересчитываются при каждом изменении книги.** Таблица из тринадцати строк – тринадцать пересчетов модели; шесть мини-таблиц и две основные – ощутимая нагрузка на большой модели. Excel предусматривает режим «Формулы» → «Параметры вычислений» → **«Автоматически, кроме таблиц данных»**: таблицы пересчитываются только по F9.\n\n> [!WARNING]\n> В этом режиме таблицы продолжают показывать прежние числа и не сообщают, что они устарели. После изменения предпосылки результаты в таблицах и диаграммах нужно обновлять вручную (F9) и проверять базовую строку.\n\n## 8. Использование ИИ: проверка постановки анализа\n\nЯзыковая модель полезна для проверки логики постановки и формулировок выводов, но не для выбора диапазонов: они определяются внешними ограничениями. Запрос:\n\n```excel\nНиже описана моя финансовая модель и постановка анализа чувствительности:\n\n[ОПИШИТЕ ВЫХОДНОЙ ПОКАЗАТЕЛЬ, СПИСОК ПРЕДПОСЫЛОК, БАЗОВЫЕ ЗНАЧЕНИЯ И ВЫБРАННЫЕ ДИАПАЗОНЫ LOW / HIGH]\n\n1. Проверь, изменяется ли в каждом тесте ровно одна предпосылка и остаются ли прочие на базовом уровне.\n2. Укажи, какие предпосылки в реальности связаны между собой, и объясни, почему независимое изменение каждой искажает картину.\n3. Проверь, где диапазон задан в процентах от базы, а где в процентных пунктах, и корректно ли это для каждой величины.\n4. Укажи, можно ли при заданных диапазонах сравнивать факторы между собой, и какую оговорку нужно добавить.\n5. Найди в моих выводах вероятностные утверждения о значениях Low и High.\n6. Назови, при каком базовом значении результата эластичность перестает быть устойчивой.\n7. Не предлагай менять диапазоны на «более реалистичные» без объяснения, из какого внешнего ограничения они следуют.\n```\n\nЛюбой ответ проверяется расчетом в книге.\n\n## 9. Итоги занятия\n\n1. Анализ чувствительности меняет одну предпосылку при неизменности остальных; это не прогноз и не вероятностная оценка.\n2. Таблица данных автоматизирует многократную подстановку в одну входную ячейку и располагается на листе этой ячейки.\n3. Поле подстановки определяется ориентацией списка: вертикальный список – по столбцам, горизонтальный – по строкам.\n4. Диапазон и шаг – содержательная часть постановки задачи.\n5. Проценты и процентные пункты не взаимозаменяемы: 15 % → 17 % это +2 п.п. и одновременно +13,3 %.\n6. Эластичность безразмерна и локальна; при базовом результате около нуля неустойчива.\n7. Диаграмма-торнадо строится по отклонениям от базы, сортируется по размаху, а ее рейтинг зависит от выбранных диапазонов.\n8. Режим «Автоматически, кроме таблиц данных» ускоряет работу, но требует ручного обновления (F9) и проверки.\n\n## Практика: чувствительность NPV к предпосылкам\n\n**Задача.** Построить таблицы данных по цене и ставке, рассчитать эластичность пяти факторов и построить диаграмму-торнадо.\n\n**Файл.** [lesson-4.1.xlsx](materials/lesson-4.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Модель сохраняется для занятия 4.2.\n\n**Что нужно сделать.**\n\n1. Проверить базовый NPV (39 602 574).\n2. Построить таблицу данных по цене и найти интервал смены знака NPV.\n3. Построить таблицу по ставке дисконтирования и сравнить форму отклика.\n4. Заполнить шесть мини-таблиц Low / Base / High и проверить строку Base.\n5. Рассчитать эластичность NPV по пяти факторам, отсортировать лист «Торнадо» и построить диаграмму.\n\n**Результат.** Выполненная книга с таблицами данных, эластичностями и диаграммой-торнадо; выводы под диаграммой.\n", "4.2": "---\ntitle: \"Многофакторная чувствительность и критические значения\"\nsummary: \"Двухфакторные таблицы данных, зоны приемлемости, условное форматирование, «Подбор параметра», критические значения и запас до границы.\"\nsource: \"materials/lesson-4.2.xlsx\"\nconcepts:\n  - \"Двухфакторная таблица данных :: Таблица данных с двумя входными ячейками: значения одной предпосылки расположены по строке, другой – по столбцу, на пересечении вычисляется результат модели.\"\n  - \"Зона приемлемости :: Область значений предпосылок, в которой результат удовлетворяет заданному критерию (например, NPV не ниже порога).\"\n  - \"Критерий приемлемости :: Правило, по которому результат считается допустимым: NPV ≥ 0 или NPV ≥ учебного порога. Выбирается до расчета.\"\n  - \"Подбор параметра :: Инструмент Excel («Анализ \"что если\"»), подбирающий значение одной входной ячейки так, чтобы целевая ячейка достигла заданного значения.\"\n  - \"Критическое значение :: Значение предпосылки, при котором результат равен границе критерия при неизменных остальных предпосылках.\"\n  - \"Запас до границы :: Расстояние от базового значения предпосылки до критического: абсолютное, относительное (в процентах базы) или в процентных пунктах для ставок.\"\n  - \"Условное форматирование :: Автоматическое оформление ячеек по правилам. Используется для выделения зон NPV в матрице.\"\n---\n\n# Многофакторная чувствительность и критические значения\n\n## Цели и требования\n\nНа занятии 4.1 предпосылки изменялись по одной. Реальные решения зависят от сочетаний: цена и затраты, цена и объем. Кроме того, интерес представляет не только форма отклика, но и граница, за которой результат перестает удовлетворять критерию.\n\nПосле занятия нужно уметь:\n\n- строить двухфакторную таблицу данных и проверять ее по базовой ячейке;\n- читать матрицу как зоны приемлемости и оформлять их условным форматированием;\n- находить критическое значение предпосылки через «Подбор параметра» и безопасно возвращать модель к базе;\n- рассчитывать запас до границы в абсолютных и относительных величинах;\n- формулировать выводы без вероятностных утверждений и называть ограничения инструмента.\n\n> [!NOTE]\n> Используется модель занятия 4.1. В файле `lesson-4.2.xlsx` расчет и предпосылки находятся на одном листе «Модель»: предпосылки в `B6:B16`, NPV в `B19`, учебный порог в `B20`, запас над порогом в `B21`. Двухфакторная таблица должна находиться на том же листе, что и обе входные ячейки.\n\n## 1. Двухфакторная таблица данных\n\nДвухфакторная таблица вычисляет модель для всех сочетаний значений двух предпосылок. Одна предпосылка расположена по строке (верхний ряд), другая – по столбцу (левый столбец), а в левом верхнем углу находится ссылка на результат.\n\n### Устройство заготовки «цена × переменные затраты»\n\nОбласть `J5:O10` листа «Модель»:\n\n- `J5` – формула `=$B$19` (ссылка на NPV);\n- `K5:O5` – цены 1 000, 1 100, 1 200, 1 300, 1 400 руб./ед.;\n- `J6:J10` – переменные затраты 600, 650, 700, 750, 800 руб./ед.;\n- `K6:O10` – пустые ячейки, которые заполнит Excel.\n\n### Порядок построения\n\n1. Выделить `J5:O10`.\n2. «Данные» → «Анализ \"что если\"» → «Таблица данных».\n3. «Подставлять значения по строкам в» – `B7` (цена расположена в верхней строке).\n4. «Подставлять значения по столбцам в» – `B10` (затраты расположены в левом столбце).\n5. «ОК».\n\n> [!WARNING]\n> Поля нужно заполнять по расположению значений, а не по смыслу ячеек. Перестановка адресов дает правдоподобную, но неверную матрицу: цена «подставится» в затраты и наоборот.\n\n### Контроль базовой точки\n\nНа пересечении базовой цены (1 200) и базовых затрат (700) – ячейка `M8`. Она должна равняться базовому NPV **39 602 574 руб.** (39,60 млн). Если это не так, перепутаны входные ячейки.\n\n### Результат, млн руб.\n\n| Затраты \\ Цена | 1 000 | 1 100 | 1 200 | 1 300 | 1 400 |\n| --- | --- | --- | --- | --- | --- |\n| 600 | 15,34 | 39,60 | 63,87 | 88,13 | 112,40 |\n| 650 | 3,20 | 27,47 | 51,74 | 76,00 | 100,27 |\n| 700 | −8,93 | 15,34 | 39,60 | 63,87 | 88,13 |\n| 750 | −21,06 | 3,20 | 27,47 | 51,74 | 76,00 |\n| 800 | −33,99 | −8,93 | 15,34 | 39,60 | 63,87 |\n\n### Диагональная структура\n\nВ матрице одинаковые числа повторяются по диагоналям: 39,60 стоит при сочетаниях (цена 1 100; затраты 600), (1 200; 700) и (1 300; 800). Причина: в модели результат зависит от разности «цена − переменные затраты» (маржи на единицу), а не от каждой величины по отдельности. Сдвиг цены на 100 и затрат на 100 в одну сторону оставляет маржу прежней.\n\nПрактический вывод: при обсуждении цены и затрат отдельно рискуют недооценить их совместное действие. Для модели с мультипликативным эффектом (например, цена и объем) диагональной структуры нет.\n\n```quiz\nquestion: В двухфакторной таблице цены расположены по верхней строке, переменные затраты – по левому столбцу. Какие адреса вводятся в диалог?\nA: По строкам – ячейка цены, по столбцам – ячейка затрат\nB: По строкам – ячейка затрат, по столбцам – ячейка цены\nC: В оба поля вводится ячейка с NPV\nD: Заполняется только поле «по строкам»\ncorrect: A\nexplanation: Поле «по строкам» относится к значениям верхней строки, поле «по столбцам» – к значениям левого столбца.\n```\n\n## 2. Зоны приемлемости\n\nМатрица из 25 чисел плохо читается без критерия. Критерий приемлемости задается **до** расчета:\n\n- **NPV < 0** – проект не окупается;\n- **0 ≤ NPV < 20 млн** – проект окупается, но не достигает учебного порога (ячейка `B20`);\n- **NPV ≥ 20 млн** – проект удовлетворяет порогу.\n\n> [!NOTE]\n> Порог 20 млн руб. – условное допущение учебной модели. В реальном анализе он следует из внутренних требований организации или внешних условий.\n\n### Условное форматирование\n\n1. Выделить `K6:O10`.\n2. «Главная» → «Условное форматирование» → «Создать правило» → «Форматировать только ячейки, которые содержат».\n3. Правило 1: значение меньше 0 – светло-серая заливка с полужирным шрифтом.\n4. Правило 2: значение от 0 до 20 000 000 – курсив.\n5. Для значений не ниже 20 000 000 дополнительное оформление не требуется.\n\nПравила проверяются на пороговых значениях. Для читаемости допускается любая палитра, но различие должно сохраняться при печати в оттенках серого.\n\n### Чтение матрицы\n\nИз таблицы раздела 1: при базовых затратах 700 NPV отрицателен только при цене 1 000. При затратах 800 отрицательный результат дают уже цены 1 000 и 1 100; базовое значение 39,60 достигается лишь при цене 1 300. **Граница приемлемости – не точка, а линия** на плоскости «цена × затраты»; ее положение определяет матрица.\n\n### Практика\n\n1. Построить матрицу, проверить `M8`.\n2. Оформить зоны правилами условного форматирования.\n3. Записать, сколько из 25 сочетаний имеют отрицательный NPV (ответ: 4) и сколько не достигают порога 20 млн (ответ: 9 с учетом отрицательных).\n\n## 3. «Подбор параметра»\n\nМатрица показывает, что граница существует, но не определяет ее точное положение. Точное критическое значение находится инструментом «Подбор параметра» («Данные» → «Анализ \"что если\"» → «Подбор параметра»).\n\nИнструмент подбирает значение **одной** входной ячейки так, чтобы формула в целевой ячейке приняла заданное число. Три поля диалога:\n\n- **Установить в ячейке** – ячейка с формулой результата (`B19`);\n- **Значение** – целевое число (0 или 20000000);\n- **Изменяя значение ячейки** – входная ячейка (`B7` для цены).\n\n> [!WARNING]\n> Подбор параметра **записывает найденное значение во входную ячейку**, то есть изменяет модель. Результат нужно зафиксировать, а модель вернуть к базе вручную. Иначе дальнейшие расчеты (таблицы данных, диаграммы) выполнятся на искаженной базе.\n\n### Порядок безопасной работы\n\n1. Проверить базовые предпосылки и базовый NPV 39 602 574 руб.\n2. Запустить «Подбор параметра»: целевая ячейка `B19`, значение 0, изменяемая ячейка `B7`.\n3. Записать найденное значение на лист «Критические значения» (столбец `E`).\n4. Вернуть `B7` к значению 1 200.\n5. Проверить, что `B19` снова равна 39 602 574, и только после этого переходить к следующему расчету.\n\n### Результат для цены\n\nNPV = 0 при цене **1 036,79 руб./ед.** При 1 000 NPV отрицателен, при 1 050 положителен – это согласуется с таблицей занятия 4.1 (знак меняется между 1 000 и 1 050).\n\nКритерий задается явно. При целевом значении 20 000 000 критическая цена – **1 119,22 руб./ед.** Критическое значение определяется критерием: «граница» не существует независимо от выбранного порога.\n\n## 4. Критические значения и запас до границы\n\nКритическое значение можно найти для каждой предпосылки отдельно. На листе «Критические значения» собирается таблица.\n\n| Предпосылка | База | Критическое значение (NPV = 0) | Абсолютный запас | Запас, % базы |\n| --- | --- | --- | --- | --- |\n| Цена, руб./ед. | 1 200 | 1 036,79 | 163,21 | 13,60 % |\n| Переменные затраты, руб./ед. | 700 | 863,21 | 163,21 | 23,32 % |\n| Объем, ед. | 80 000 | 53 887 | 26 113 | 32,64 % |\n| Ставка дисконтирования | 15 % | 59,17 % | 44,17 п.п. | – |\n\nЗапас – расстояние от базы до границы. Он считается в трех видах: абсолютный (в единицах предпосылки), относительный (в процентах базы) и, для ставки, в процентных пунктах. Процент базы позволяет сравнивать факторы разной природы.\n\n### Что видно из таблицы\n\n- **Цена и переменные затраты имеют одинаковый абсолютный запас (163,21)**, как и следует из диагональной структуры: результат зависит от их разности.\n- **Относительный запас по цене – 13,60 %.** Снижение цены больше чем на эту величину при прочих равных делает NPV отрицательным.\n- **Ставка** имеет большой запас (44,17 п.п.): сам по себе рост ставки проект не разрушает.\n\nДля порога 20 млн запасы меньше: цена – 1 119,22 (запас 6,73 %), переменные затраты – 780,78, объем – 67 074.\n\n> [!WARNING]\n> Запасы по отдельным факторам нельзя складывать: границы найдены при неизменных остальных предпосылках. Совместное ухудшение двух факторов нарушает критерий раньше, чем каждый по отдельности достигнет своего запаса. Это показывает матрица раздела 1.\n\n```quiz\nquestion: Что означает критическое значение цены 1 036,79 руб./ед.?\nA: Цена, которая реализуется с вероятностью 50 %\nB: Цена, при которой NPV равен нулю при неизменных остальных предпосылках\nC: Минимальная цена, допустимая рынком\nD: Цена, при которой сумма всех запасов равна нулю\ncorrect: B\nexplanation: Критическое значение определяется критерием и условием «при прочих равных». Рыночной или вероятностной интерпретации оно не имеет.\n```\n\n## 5. Формулировка выводов\n\nРезультаты этого занятия легко прочитать как прогноз. Допустимые и недопустимые формулировки:\n\n| Допустимо | Недопустимо |\n| --- | --- |\n| «При прочих равных NPV обращается в ноль при цене 1 036,79 руб./ед.» | «Цена не упадет ниже 1 036,79 руб./ед.» |\n| «Запас по цене до границы NPV = 0 составляет 13,60 % базы» | «Проект безопасен, пока цена снижается не более чем на 13,60 %» |\n| «При затратах 800 руб./ед. и цене 1 100 NPV отрицателен» | «Такое сочетание вероятно» |\n\nВероятностные утверждения требуют вероятностной модели (занятие 9.2). Здесь определены границы области, а не частота попадания в нее.\n\n## 6. Ограничения инструмента «Подбор параметра»\n\n- **Одна изменяемая ячейка.** Для подбора двух величин одновременно нужен Solver (занятие 9.1).\n- **Результат зависит от начальной точки.** Для немонотонных зависимостей алгоритм может остановиться на одном из нескольких решений или не найти его.\n- **Нужен критерий в виде числа.** Условие «NPV ≥ 20 млн» задается целевым значением 20 000 000, что дает границу, но не область.\n- **Приближенный результат.** Остановка по точности возможна на значении, не равном строго нулю; проверка выполняется пересчетом.\n- **Модель изменяется.** Возврат к базе и проверка NPV – обязательные шаги порядка работы.\n\nДля ставки решение может отсутствовать при слишком узком диапазоне поиска, поскольку зависимость NPV от ставки нелинейна (занятие 4.1).\n\n## 7. Использование ИИ: проверка постановки\n\nЗапрос для проверки постановки задачи о критических значениях:\n\n```excel\nНиже описаны модель, критерий приемлемости и найденные критические значения:\n\n[ОПИШИТЕ МОДЕЛЬ, КРИТЕРИЙ, БАЗУ, КРИТИЧЕСКИЕ ЗНАЧЕНИЯ И ЗАПАСЫ]\n\n1. Проверь, что для каждого критического значения остальные предпосылки оставались на базовом уровне.\n2. Укажи, какие пары предпосылок связаны между собой в самой модели, и объясни, как это отражается в матрице.\n3. Найди формулировки, в которых граница интерпретируется как прогноз или вероятность.\n4. Укажи, для каких предпосылок зависимость результата немонотонна и может иметь несколько критических значений.\n5. Проверь расчет запаса: абсолютный, процентный, в процентных пунктах для ставок.\n6. Не предлагай изменить критерий; укажи, как результат зависит от его выбора.\n```\n\nОтвет проверяется пересчетом в книге.\n\n## 8. Итоги занятия\n\n1. Двухфакторная таблица показывает результат для сочетаний двух предпосылок; ее правильность проверяется базовой ячейкой.\n2. Матрица читается через критерий приемлемости, заданный заранее.\n3. Диагональная структура отражает зависимость результата от разности цены и затрат.\n4. «Подбор параметра» изменяет модель, поэтому результат фиксируется, а база восстанавливается и проверяется.\n5. Критическое значение определяется критерием; запас считается абсолютно, относительно и для ставки в процентных пунктах.\n6. Запасы по отдельным факторам не суммируются.\n7. Выводы формулируются без вероятностного смысла.\n\n## Практика: матрица «цена × объем» и критические значения\n\n**Задача.** Построить матрицу «цена × переменные затраты» и «цена × объем», найти критические значения цены и объема и рассчитать запасы.\n\n**Файл.** [lesson-4.2.xlsx](materials/lesson-4.2.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла.\n\n**Что нужно сделать.**\n\n1. Построить матрицу «цена × переменные затраты» и проверить ячейку `M8`.\n2. Оформить зоны приемлемости условным форматированием и посчитать сочетания с NPV < 0.\n3. Найти критическую цену для NPV = 0 и NPV = 20 млн «Подбором параметра», возвращая базу после каждого шага.\n4. Найти критические значения переменных затрат и объема, заполнить таблицу запасов.\n5. Построить матрицу «цена × объем» (объем по столбцу, подстановка `B6`) и записать вывод о ее отличии от первой матрицы.\n\n**Результат.** Выполненная книга с матрицами, таблицей критических значений и краткими выводами.\n", "5.1": "---\ntitle: \"Сценарное моделирование\"\nsummary: \"Сценарий как согласованный набор предпосылок: матрица, переключатель, блок активных значений, граница факта и прогноза, единый расчетный контур и контроль инвариантов.\"\nsource: \"materials/lesson-5.1.xlsx\"\nconcepts:\n  - \"Сценарий :: Согласованный набор предпосылок модели, описывающий одно целостное состояние будущего. Не является прогнозом события и не имеет вероятности.\"\n  - \"Сценарная матрица :: Таблица, в которой параметры расположены по строкам, сценарии по столбцам; дополнительно содержит единицы измерения и логику параметра.\"\n  - \"Переключатель сценария :: Единственная ячейка с проверкой данных, выбирающая активный сценарий.\"\n  - \"Блок выбранных предпосылок :: Область, в которую формулой поиска выгружается столбец активного сценария; расчетные формулы ссылаются только на этот блок.\"\n  - \"Граница факта и прогноза :: Явное разделение периодов с разными источниками и режимами изменения: факт сценарием не управляется.\"\n  - \"Единый расчетный контур :: Один набор формул модели, обслуживающий все сценарии. При смене сценария меняются значения предпосылок, но не формулы.\"\n  - \"ПРОСМОТРX (XLOOKUP) :: Функция поиска значения в строке или столбце; в занятии извлекает столбец выбранного сценария из матрицы.\"\n  - \"Гибридное состояние :: Состояние модели, в котором часть предпосылок принадлежит одному сценарию, часть другому или изменена вручную; воспроизвести такой расчет нельзя.\"\n  - \"Инвариант модели :: Утверждение, которое должно выполняться при любых допустимых входных данных, например неизменность фактических лет при смене сценария.\"\n---\n\n# Сценарное моделирование\n\n## Цели и требования\n\nЗанятия четвертого дня исследовали модель через изолированное изменение предпосылок. Сценарный анализ ставит другую задачу: описать несколько целостных состояний будущего, в каждом из которых предпосылки связаны общей экономической причиной. Спрос не меняется отдельно от цены, загрузки мощностей и инвестиционной программы.\n\nПосле занятия нужно уметь:\n\n- отличать сценарий от чувствительности и от вероятностной оценки;\n- строить сценарную матрицу с единицами измерения и логикой параметров;\n- реализовывать переключатель и блок активных предпосылок формулой поиска;\n- разделять фактические и прогнозные периоды и подключать прогноз к последнему факту;\n- проверять сценарную модель набором инвариантов.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365. Функция `ПРОСМОТРX` (английское название `XLOOKUP`) недоступна в более ранних версиях. Файл `lesson-5.1.xlsx` содержит факт 2024–2025 годов и прогнозный контур 2026–2030.\n\n## 1. Сценарий и чувствительность\n\nРазличие определяется постановкой вопроса, а не инструментом.\n\n| Метод | Что меняется | Вопрос |\n| --- | --- | --- |\n| Однофакторная чувствительность | Одна предпосылка | Насколько результат зависит от фактора X? |\n| Двухфакторная чувствительность | Сетка значений двух предпосылок | Какие сочетания X и Y дают приемлемый результат? |\n| Сценарий | Согласованный набор нескольких предпосылок | Что показывает модель при конкретной логике развития условий? |\n\nДвухфакторная таблица перебирает прямоугольную сетку, включая экономически несовместимые сочетания. Сценарий, напротив, выбирает небольшое число состояний, каждое из которых осмысленно целиком.\n\n### Сценарий не равен «все параметры лучше»\n\nВ оптимистичном сценарии объем и цена растут быстрее, а рост затрат замедляется. При этом **CAPEX выше базового: 38 млн руб. против 30 млн руб.** Сценарий согласован: ускорение спроса требует расширенной инвестиционной программы. Отдельная предпосылка может двигаться в менее благоприятную сторону, если этого требует логика состояния в целом.\n\nСценарий, построенный механическим улучшением или ухудшением всех значений, невозможно объяснить, и он не описывает никакого реального состояния.\n\n### Сценарий не равен вероятности\n\nТри сценария в книге не означают, что каждому принадлежит треть вероятности, а базовый «наиболее вероятен». Вероятностная постановка требует распределений и рассматривается в день 9. Набор сценариев не обязан быть исчерпывающим: его задача – дать несколько различимых режимов расчета.\n\n```quiz\nquestion: В оптимистичном сценарии CAPEX выше, чем в базовом. Что это означает?\nA: Сценарий составлен с ошибкой: в оптимистичном варианте все предпосылки должны быть благоприятнее\nB: Сценарий согласован: ускорение спроса требует расширенной инвестиционной программы\nC: CAPEX не влияет на результат, поэтому его значение можно задавать произвольно\nD: Оптимистичный сценарий менее вероятен, чем базовый\ncorrect: B\nexplanation: Сценарий – связанный набор предпосылок, а не список улучшений. Отдельный параметр может двигаться в менее выгодную сторону, если этого требует экономическая логика сценария.\n```\n\n## 2. Факт и прогноз\n\nЛист `Fact` содержит фактические значения 2024 и 2025 годов: объем, цену, переменные и постоянные затраты, налоговую ставку. На листе `Model` эти годы помечены «Факт», годы 2026–2030 – «Прогноз».\n\n- **2024–2025, факт.** Значения берутся ссылками вида `=Fact!B5`. Обновляются при закрытии периода, сценарием не управляются.\n- **2026–2030, прогноз.** Каждый год рассчитывается от предыдущего через активные предпосылки. Пересчитывается при смене сценария.\n\nЯвная граница нужна по трем причинам. Источники различаются: факт приходит из учетной системы и не может переписываться допущениями. Контроль упрощается: появляется инвариант «смена сценария не изменяет исторические столбцы». У прогноза появляется точка привязки: первый прогнозный год строится от последнего фактического.\n\n### Первый прогнозный год\n\nОбъем 2026 в ячейке `D6` листа `Model`:\n\n```excel\n=C6*(1+Scenarios!$I$8)\n```\n\n`C6` – фактический объем 2025, `Scenarios!$I$8` – активный рост объема. Только первый прогнозный год соединяет два слоя, остальные годы связаны между собой: `E6` строится от `D6`, `F6` от `E6`.\n\n> [!WARNING]\n> Строить 2026 год от отдельной «стартовой базы» со скопированным значением 2025 нельзя. В книге появляются два источника одного числа: после обновления факта скрытая ячейка останется прежней, и прогноз будет считаться от устаревшей точки. Сообщений об ошибке при этом нет.\n\nПри корректной сборке изменение факта 2025 автоматически сдвигает старт прогноза, а смена сценария не затрагивает факт. В рабочих моделях граница сопровождается датой отсечения («факт закрыт по 31.12.2025») и процедурой обновления.\n\n**Контрольные значения:** выручка 2024 – **84 000 000 руб.**, 2025 – **96 000 000 руб.** Эти числа не должны изменяться ни в одном сценарии.\n\n## 3. Сценарная матрица\n\nМатрица на листе `Scenarios` содержит параметры в строках и сценарии в столбцах. Помимо значений обязательны два служебных столбца: единица измерения и логика параметра.\n\n| Параметр | Единица | Базовый | Оптимистичный | Пессимистичный | Логика параметра |\n| --- | --- | --- | --- | --- | --- |\n| Рост объема | %/год | 4 % | 8 % | −2 % | Спрос, загрузка |\n| Рост цены | %/год | 3 % | 6 % | 0 % | Рыночная цена |\n| Рост переменных затрат | %/год | 3 % | 1 % | 7 % | Себестоимость единицы |\n| Рост постоянных затрат | %/год | 4 % | 3 % | 7 % | Инфляция, инфраструктура |\n| CAPEX | руб. | 30 000 000 | 38 000 000 | 25 000 000 | Инвестиционная программа |\n| Ставка дисконтирования | % | 15 % | 13 % | 18 % | Требуемая доходность, риск |\n\nПроценты учебные, их реалистичность предметом занятия не является. Внутреннюю логику столбцов формулируют так:\n\n- **Базовый** – продолжение текущей траектории.\n- **Оптимистичный** – ускорение спроса и цены, замедление роста затрат, расширенная инвестиционная программа, ниже требуемая доходность.\n- **Пессимистичный** – сжатие спроса, отсутствие роста цены, ускорение затрат, сокращение инвестиций, выше требуемая доходность.\n\n### Столбец логики\n\nПроверка качества формулируется одним вопросом: **для каждой отличающейся от базовой предпосылки должно быть сказано, почему она отличается**. Если причину назвать нельзя, значение, вероятно, внесено механически. В рабочих моделях рядом с матрицей хранят источник, дату согласования и владельца параметра.\n\n### Связанные предпосылки и двойной счет\n\nЕсли сценарий описывает инфляционный шок, рост цены, переменных и постоянных затрат имеет общую причину, и матрица позволяет описать их одной рамкой. Обратная ошибка – учесть один риск дважды, например повысить и затраты, и ставку дисконтирования, хотя оба изменения отражают одно событие.\n\n### Практика\n\n1. Выбрать один сценарий и записать его логику двумя-тремя предложениями без перечисления значений.\n2. Найти в нем параметр, движущийся в менее выгодную сторону, и объяснить, почему это не делает сценарий ошибочным.\n\n## 4. Переключатель и блок выбранных предпосылок\n\nАктивный сценарий задается одной ячейкой `Scenarios!B4` с проверкой данных: список из трех названий. Блок «Выбранные предпосылки» справа извлекает из матрицы столбец выбранного сценария.\n\nФормула роста объема в ячейке `I8`:\n\n```excel\n=ПРОСМОТРX($B$4;$C$7:$E$7;$C8:$E8)\n```\n\nАргументы:\n\n1. `$B$4` – искомое значение, название выбранного сценария;\n2. `$C$7:$E$7` – строка заголовков сценариев, в которой выполняется поиск;\n3. `$C8:$E8` – строка значений параметра, из которой возвращается результат.\n\nПри копировании вниз ячейка переключателя и строка заголовков остаются на месте (знаки `$`), строка параметра смещается. Одна формула обслуживает всю матрицу.\n\n### Зачем отдельный блок\n\nКаждая прогнозная формула могла бы искать значение в матрице самостоятельно, но тогда поиск повторяется десятки раз, а активное состояние модели негде проверить. Блок из шести ячеек показывает все действующие предпосылки в одном месте.\n\nКонтрольные наборы активных значений:\n\n| Сценарий | Объем | Цена | Пер. затраты | Пост. затраты | CAPEX | Ставка |\n| --- | --- | --- | --- | --- | --- | --- |\n| Базовый | 4 % | 3 % | 3 % | 4 % | 30 млн | 15 % |\n| Оптимистичный | 8 % | 6 % | 1 % | 3 % | 38 млн | 13 % |\n| Пессимистичный | −2 % | 0 % | 7 % | 7 % | 25 млн | 18 % |\n\n### Единственность переключателя\n\nПравило: **один сценарий – один переключатель – один набор активных предпосылок**. Если на одном листе выбран один сценарий, а часть формул напрямую ссылается на другой столбец, у книги нет определенного состояния.\n\n> [!TIP]\n> В рабочих книгах матрицу нередко защищают от правки, оставляя доступной только ячейку переключателя. Это снижает риск появления «четвертого сценария», созданного случайным изменением одной ячейки.\n\n```quiz\nquestion: Зачем нужен отдельный блок «Выбранные предпосылки», если каждая формула прогноза могла бы искать значение в матрице самостоятельно?\nA: Без него функция ПРОСМОТРX не работает при копировании вниз\nB: Он задает единственное место, где видно активное состояние модели, и не дублирует поиск в каждой формуле\nC: Он ускоряет пересчет, так как Excel кэширует результат поиска\nD: Он требуется для работы проверки данных в ячейке переключателя\ncorrect: B\nexplanation: Оба варианта дают одинаковый результат. Блок нужен для сопровождаемости: активные предпосылки проверяются в одном месте, расчетные формулы не содержат повторяющегося поиска.\n```\n\n## 5. Единый расчетный контур\n\nГлавное свойство сборки: при смене сценария меняются не формулы, а значения, на которые они ссылаются. Поэтому все сценарии считаются по одной методике и сопоставимы.\n\nРасчет на листе `Model`:\n\n- **Объем, цена, переменные и постоянные затраты** – 2026 год от факта 2025 через активный темп роста, далее от предыдущего прогнозного года.\n- **Выручка** – объем × цена.\n- **Операционная прибыль** – выручка минус переменные и постоянные затраты.\n- **Налог** – от положительной операционной прибыли; ставка берется с листа `Fact`, она не сценарная.\n- **FCF** – операционная прибыль после налога.\n- **NPV прогноза** – минус активный CAPEX плюс сумма дисконтированных FCF 2026–2030.\n\n> [!WARNING]\n> Сценарной логики внутри расчетных формул быть не должно. Конструкция «если сценарий оптимистичный, дополнительно умножить на 1,05» прячет часть различий в расчете, где их не найдут при проверке. Любое различие сценариев находится в матрице: отдельной строкой, с единицей измерения и обоснованием.\n\n### Контрольные результаты\n\n| Показатель | Базовый | Оптимистичный | Пессимистичный |\n| --- | --- | --- | --- |\n| Выручка 2024, руб. | 84 000 000 | 84 000 000 | 84 000 000 |\n| Выручка 2025, руб. | 96 000 000 | 96 000 000 | 96 000 000 |\n| Выручка 2030, руб. | 135 401 680 | 188 764 072 | 86 776 396 |\n| Операционная прибыль 2030, руб. | 34 517 614 | 81 417 538 | −9 466 093 |\n| NPV прогноза, руб. | 46 172 044 | 104 619 555 | −12 070 699 |\n\nПервые две строки одинаковы во всех столбцах: это основной архитектурный контроль. Для базового сценария проверяется и первый прогнозный год: объем 2026 равен **83 200 ед.**, цена – **1 236 руб./ед.**\n\n### Траектория, а не точка\n\nВ пессимистичном сценарии операционная прибыль положительна в 2026–2028 годах (16,10; 10,01; 3,74 млн руб.), в **2029 году становится отрицательной** (−2,75 млн руб.) и в 2030 году составляет −9,47 млн руб. NPV при этом выражен одним числом (−12,07 млн руб.), и год перелома маржи в нем не виден. Единый контур показывает его без отдельного расчета.\n\n```quiz\nquestion: В пессимистичном сценарии операционная прибыль положительна в 2026–2028 и отрицательна в 2029–2030. Что дает это наблюдение сверх значения NPV?\nA: Ничего: NPV уже содержит всю информацию о результате\nB: Показывает год перелома маржи, который в едином числе NPV не виден\nC: Позволяет оценить вероятность убытка в 2029 году\nD: Означает, что NPV рассчитан неверно, раз часть лет убыточна\ncorrect: B\nexplanation: NPV сворачивает траекторию в одно число. Построчный просмотр показывает, когда комбинация предпосылок нарушает маржу.\n```\n\n## 6. Контроль сценарной модели\n\nМодель проверяется не отдельными числами, а набором инвариантов, которые должны выполняться при любом сценарии:\n\n- смена сценария меняет шесть активных предпосылок и весь прогноз;\n- факт 2024–2025 не изменяется;\n- формулы 2026–2030 не переписываются;\n- все шесть активных значений принадлежат одному столбцу матрицы;\n- название сценария подкреплено описанием экономической логики.\n\n### Гибридное состояние\n\nЕсли выбран базовый сценарий, но CAPEX вручную заменен значением оптимистичного, модель не соответствует ни одному столбцу матрицы, и воспроизвести расчет невозможно. Такой набор допустим только как отдельный сценарий с названием и описанием. Принцип тот же, что на занятии 4.2: после каждого подбора параметра модель возвращается к базе.\n\n## 7. Как читать результат\n\nТри формулировки требуют исправления.\n\n- **«Пессимистичный сценарий показывает, что так и будет».** Сценарий не является прогнозом события; он показывает результат модели при заданных предпосылках.\n- **«Оптимистичный сценарий лучше, потому что все параметры улучшены».** В учебной матрице CAPEX в нем выше.\n- **«Пессимистичный сценарий – это стресс-тест».** Сценарий описывает одно из рабочих состояний будущего. Стресс-тест проверяет устойчивость к неблагоприятному воздействию относительно заранее заданного критерия (занятие 5.2).\n\nЗначения NPV 46,17; 104,62 и −12,07 млн руб. используются здесь как проверка работы контура, а не как сравнение по критериям.\n\n## 8. Использование ИИ: проверка согласованности сценария\n\nЯзыковая модель проверяет внутреннюю логику набора предпосылок и формулировки выводов. Значения предпосылок задает предметная область.\n\n```excel\nНиже приведена моя сценарная матрица с единицами измерения и описанием логики каждого сценария:\n\n[ВСТАВЬТЕ ПАРАМЕТРЫ, ЗНАЧЕНИЯ ПО СЦЕНАРИЯМ И ОПИСАНИЕ ЭКОНОМИЧЕСКОЙ РАМКИ]\n\n1. Проверь, образует ли каждый столбец согласованное экономическое состояние или это механический набор улучшений и ухудшений.\n2. Укажи предпосылки с общей причиной и проверь, не учтен ли один риск дважды.\n3. Найди параметры, отличие которых от базового значения нельзя объяснить описанной логикой.\n4. Проверь, есть ли параметры, движущиеся против общего направления, и обоснованно ли это.\n5. Отметь вероятностные утверждения в моих выводах и предложи корректную замену.\n6. Укажи, чем мой пессимистичный сценарий отличается от стресс-теста по постановке задачи.\n7. Не предлагай «более реалистичные» проценты без указания внешнего источника.\n```\n\nРезультат проверяется в книге: согласованная на словах матрица может быть подключена к модели неверно, и обнаружится это только контролем инвариантов.\n\n## 9. Итоги занятия\n\n1. Сценарий – согласованный набор предпосылок, описывающий одно состояние будущего; он не является вероятностью и не сводится к «все параметры лучше».\n2. Факт и прогноз имеют разные источники и должны быть разделены явно; первый прогнозный год строится от последнего факта.\n3. Матрица содержит значения, единицы измерения и логику каждой предпосылки.\n4. Один переключатель формирует один блок активных предпосылок; расчетные формулы ссылаются только на этот блок.\n5. При смене сценария меняются значения, но не формулы; сценарной логики внутри расчета нет.\n6. Качество проверяется инвариантами: неизменность факта, неизменность формул, принадлежность активных значений одному столбцу.\n7. Сценарий не равен стресс-тесту: у стресс-теста есть заранее заданный критерий неприемлемости.\n\n## Практика: сценарная модель и четвертый сценарий\n\n**Задача.** Проверить работу трех сценариев, добавить четвертый и подтвердить неизменность факта.\n\n**Файл.** [lesson-5.1.xlsx](materials/lesson-5.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Модель используется на занятии 5.2.\n\n**Что нужно сделать.**\n\n1. Проверить формулы блока выбранных предпосылок и первый прогнозный год.\n2. Переключить три сценария и заполнить контрольную таблицу результатов.\n3. Убедиться, что выручка 2024 и 2025 остается неизменной при всех переключениях.\n4. Добавить четвертый сценарий со значениями, логикой и описанием, расширив список проверки данных и диапазоны поиска без изменения расчетных формул.\n5. Задать один KPI с измеримым порогом неприемлемости (подготовка к занятию 5.2) и записать, чем четвертый сценарий отличается от стресс-сценария.\n\n**Результат.** Выполненная книга с четырьмя сценариями; в базовом состоянии переключателя.\n", "5.2": "---\ntitle: \"Стресс-тестирование и reverse stress testing\"\nsummary: \"Критерии приемлемости, причинно согласованные стресс-тесты, сравнение по нескольким KPI, коэффициент интенсивности стресса и поиск критической интенсивности подбором параметра.\"\nsource: \"materials/lesson-5.2.xlsx\"\nconcepts:\n  - \"Стресс-тестирование :: Проверка устойчивости результата модели к заранее заданному неблагоприятному воздействию относительно критерия приемлемости.\"\n  - \"Reverse stress testing :: Обратная постановка: задан неприемлемый результат, определяются условия или интенсивность воздействия, при которых он возникает.\"\n  - \"Критерий приемлемости :: Правило, по которому результат признается допустимым. Задается до расчета.\"\n  - \"Минимальная граница :: Порог, следующий из определения показателя (например, NPV = 0).\"\n  - \"Управленческий порог :: Порог, заданный внешним требованием (инвестиционной политикой), например NPV = 20 млн руб.\"\n  - \"Стресс-вектор :: Набор изменений предпосылок от базы к полному стрессу, рассматриваемый как одно направление ухудшения.\"\n  - \"Коэффициент интенсивности k :: Доля пути от базы (k = 0) до полного стресса (k = 100 %). Модельный индекс тяжести, не вероятность.\"\n  - \"Критическая интенсивность :: Значение k, при котором выбранный KPI достигает заданного порога. Определена только вместе с KPI и порогом.\"\n  - \"Двойной счет :: Повторный учет одного риска в нескольких предпосылках как независимых.\"\n---\n\n# Стресс-тестирование и reverse stress testing\n\n## Цели и требования\n\nЗанятие завершает детерминированный блок курса. Стресс-тестирование добавляет к сценарному аппарату то, чего в нем не было: **заранее заданный критерий неприемлемости**. Вопрос звучит не «что покажет модель при таких условиях», а «сохраняет ли модель приемлемый результат при заданном неблагоприятном воздействии и какой запас остается до границы».\n\nПосле занятия нужно уметь:\n\n- различать сценарное моделирование, стресс-тестирование и reverse stress testing;\n- задавать критерии приемлемости до расчета, различая минимальную границу и управленческий порог;\n- строить причинно согласованные стресс-тесты и сравнивать их по нескольким KPI;\n- задавать стресс-вектор и коэффициент интенсивности, находить критическую интенсивность подбором параметра;\n- формулировать выводы без вероятностного смысла.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365. Используются выпадающие списки, условное форматирование и «Данные» → «Анализ \"что если\"» → «Подбор параметра». Модель совпадает по устройству с книгой занятия 5.1.\n\n> [!WARNING]\n> Все значения стресс-тестов в файле учебные. Они не являются отраслевыми нормативами, регуляторными сценариями или вероятностными оценками.\n\n## 1. Три постановки задачи\n\nСценарное моделирование и стресс-тестирование используют одну конструкцию: матрицу предпосылок, переключатель, единый расчетный контур. Различие в вопросе.\n\n| Постановка | Исходные данные | Результат |\n| --- | --- | --- |\n| Сценарное моделирование | Несколько согласованных состояний будущего | Сравнение альтернативных траекторий |\n| Стресс-тестирование | Намеренно неблагоприятная объяснимая комбинация предпосылок | Оценка устойчивости, факт нарушения порогов |\n| Reverse stress testing | Заранее заданный неприемлемый результат | Условия или интенсивность, при которых результат возникает |\n\nСтресс-тест не сводится к «пессимистичному сценарию, только сильнее». Он строится вокруг конкретной уязвимости и механизма: падение спроса, сжатие маржи, удорожание капитала. Важна причинная логика, а не степень «плохости».\n\nСтресс-тест не получает вероятностного смысла автоматически: из наличия столбца «Комбинированный стресс» не следует, что у него есть вероятность.\n\n## 2. Критерии приемлемости\n\nПорог задается **до расчета**. Если он выбирается после просмотра результата, критерий подстраивается под число, и проверка теряет смысл.\n\nНа листе `StressCases` заданы три KPI:\n\n| KPI | Минимальный порог | Управленческий порог | Смысл |\n| --- | --- | --- | --- |\n| NPV прогноза | 0 руб. | 20 000 000 руб. | Экономический результат прогноза |\n| Операционная прибыль 2030 | 0 руб. | нет | Положительная операционная деятельность в конце горизонта |\n| FCF 2030 | 0 руб. | нет | Денежный поток последнего года |\n\n### Два уровня порога\n\n**NPV = 0** – минимальная экономическая граница, следующая из определения показателя. **NPV = 20 млн руб.** – управленческий порог, заданный извне (в файле условный). Поэтому результат различается тремя состояниями: **приемлемо**, **ниже управленческого порога**, **неприемлемо**.\n\n### Почему одного KPI недостаточно\n\nNPV агрегирует потоки всего горизонта с учетом CAPEX и ставки. Операционная прибыль 2030 описывает последний год. Показатели могут давать разные сигналы: операционная прибыль в конце горизонта еще положительна, а NPV уже отрицателен из-за слабых потоков ранних лет или высокого CAPEX. Устойчивость читается как **система сигналов**.\n\n```quiz\nquestion: Почему порог приемлемости задается до стресс-теста, а не после?\nA: Иначе Excel не сможет применить условное форматирование к результату\nB: Иначе критерий подстраивается под полученное число, и анализ перестает проверять устойчивость\nC: После расчета значение порога технически нельзя изменить\nD: Чтобы заранее приписать стресс-тесту вероятность\ncorrect: B\nexplanation: Порог – правило приемки. Если он выбирается после просмотра результата, проверка превращается в обоснование уже полученного числа.\n```\n\n## 3. Причинно согласованные стресс-тесты\n\nМатрица `StressCases` содержит базу и три учебных стресс-теста.\n\n| Параметр | База | Стресс спроса | Стресс маржи | Комбинированный |\n| --- | --- | --- | --- | --- |\n| Рост объема, %/год | 4 | −2 | 2 | −6 |\n| Рост цены, %/год | 3 | 1 | 1 | 0 |\n| Рост переменных затрат, %/год | 3 | 4 | 7 | 9 |\n| Рост постоянных затрат, %/год | 4 | 5 | 6 | 8 |\n| CAPEX, млн руб. | 30 | 25 | 30 | 35 |\n| Ставка дисконтирования, % | 15 | 17 | 18 | 22 |\n\n- **Стресс спроса** – спрос замедляется, инвестиционная программа сокращается.\n- **Стресс маржи** – спрос сохраняется, цена растет медленнее затрат; риск формируется через единичную маржу, а не через выручку.\n- **Комбинированный стресс** – одновременный шок спроса, маржи и стоимости капитала.\n\nВ стрессе спроса CAPEX **ниже** базового (25 против 30 млн руб.): при слабом спросе инвестиционная программа сокращается. Стресс-тест нельзя строить правилом «каждую ячейку сделать хуже»: причинная связь важнее механического направления параметра.\n\n> [!WARNING]\n> Контролируется двойной счет. Если один внешний шок влияет на цену, затраты и ставку, эти изменения описываются как элементы **одной** причинной рамки. Обратная ошибка: изменить один параметр и назвать это системным стрессом, хотя механизм предполагает связанное движение нескольких величин.\n\n```quiz\nquestion: В стрессе спроса CAPEX снижен с 30 до 25 млн руб. Почему это не ошибка построения?\nA: В стресс-тестах CAPEX всегда снижают, чтобы компенсировать падение выручки\nB: При слабом спросе инвестиционная программа сокращается: параметр следует причинной логике шока\nC: Снижение CAPEX ухудшает NPV, поэтому делает тест жестче\nD: CAPEX не входит в расчет NPV\ncorrect: B\nexplanation: Стресс-тест строится вокруг механизма, а не правилом «хуже во всем». Сокращение инвестиций – естественная реакция на падение спроса, и в модели оно смягчает удар по NPV.\n```\n\n## 4. Сравнение по KPI\n\nСравнение выполняется через один расчетный контур `Model`. Активный тест переключается ячейкой `StressCases!B4`, результаты четырех KPI переносятся значениями в таблицу листа `KPI`.\n\n> [!WARNING]\n> Копировать лист `Model` для каждого стресс-теста нельзя: копии со временем расходятся по формулам, и сравниваются уже разные модели, а не разные условия.\n\nЗначения, млн руб.:\n\n| Тест | NPV | Выручка 2030 | Опер. прибыль 2030 | FCF 2030 |\n| --- | --- | --- | --- | --- |\n| База | 46,17 | 135,40 | 34,52 | 27,61 |\n| Стресс спроса | 10,49 | 91,20 | 6,64 | 5,31 |\n| Стресс маржи | −0,84 | 111,40 | 0,59 | 0,47 |\n| Комбинированный | −37,43 | 70,45 | −19,23 | −19,23 |\n\n### Два показательных случая\n\n**Стресс маржи.** Операционная прибыль 2030 положительна
