ультата, критерий подстраивается под число, и проверка теряет смысл.\n\nНа листе `StressCases` заданы три KPI:\n\n| KPI | Минимальный порог | Управленческий порог | Смысл |\n| --- | --- | --- | --- |\n| NPV прогноза | 0 руб. | 20 000 000 руб. | Экономический результат прогноза |\n| Операционная прибыль 2030 | 0 руб. | нет | Положительная операционная деятельность в конце горизонта |\n| FCF 2030 | 0 руб. | нет | Денежный поток последнего года |\n\n### Два уровня порога\n\n**NPV = 0** – минимальная экономическая граница, следующая из определения показателя. **NPV = 20 млн руб.** – управленческий порог, заданный извне (в файле условный). Поэтому результат различается тремя состояниями: **приемлемо**, **ниже управленческого порога**, **неприемлемо**.\n\n### Почему одного KPI недостаточно\n\nNPV агрегирует потоки всего горизонта с учетом CAPEX и ставки. Операционная прибыль 2030 описывает последний год. Показатели могут давать разные сигналы: операционная прибыль в конце горизонта еще положительна, а NPV уже отрицателен из-за слабых потоков ранних лет или высокого CAPEX. Устойчивость читается как **система сигналов**.\n\n```quiz\nquestion: Почему порог приемлемости задается до стресс-теста, а не после?\nA: Иначе Excel не сможет применить условное форматирование к результату\nB: Иначе критерий подстраивается под полученное число, и анализ перестает проверять устойчивость\nC: После расчета значение порога технически нельзя изменить\nD: Чтобы заранее приписать стресс-тесту вероятность\ncorrect: B\nexplanation: Порог – правило приемки. Если он выбирается после просмотра результата, проверка превращается в обоснование уже полученного числа.\n```\n\n## 3. Причинно согласованные стресс-тесты\n\nМатрица `StressCases` содержит базу и три учебных стресс-теста.\n\n| Параметр | База | Стресс спроса | Стресс маржи | Комбинированный |\n| --- | --- | --- | --- | --- |\n| Рост объема, %/год | 4 | −2 | 2 | −6 |\n| Рост цены, %/год | 3 | 1 | 1 | 0 |\n| Рост переменных затрат, %/год | 3 | 4 | 7 | 9 |\n| Рост постоянных затрат, %/год | 4 | 5 | 6 | 8 |\n| CAPEX, млн руб. | 30 | 25 | 30 | 35 |\n| Ставка дисконтирования, % | 15 | 17 | 18 | 22 |\n\n- **Стресс спроса** – спрос замедляется, инвестиционная программа сокращается.\n- **Стресс маржи** – спрос сохраняется, цена растет медленнее затрат; риск формируется через единичную маржу, а не через выручку.\n- **Комбинированный стресс** – одновременный шок спроса, маржи и стоимости капитала.\n\nВ стрессе спроса CAPEX **ниже** базового (25 против 30 млн руб.): при слабом спросе инвестиционная программа сокращается. Стресс-тест нельзя строить правилом «каждую ячейку сделать хуже»: причинная связь важнее механического направления параметра.\n\n> [!WARNING]\n> Контролируется двойной счет. Если один внешний шок влияет на цену, затраты и ставку, эти изменения описываются как элементы **одной** причинной рамки. Обратная ошибка: изменить один параметр и назвать это системным стрессом, хотя механизм предполагает связанное движение нескольких величин.\n\n```quiz\nquestion: В стрессе спроса CAPEX снижен с 30 до 25 млн руб. Почему это не ошибка построения?\nA: В стресс-тестах CAPEX всегда снижают, чтобы компенсировать падение выручки\nB: При слабом спросе инвестиционная программа сокращается: параметр следует причинной логике шока\nC: Снижение CAPEX ухудшает NPV, поэтому делает тест жестче\nD: CAPEX не входит в расчет NPV\ncorrect: B\nexplanation: Стресс-тест строится вокруг механизма, а не правилом «хуже во всем». Сокращение инвестиций – естественная реакция на падение спроса, и в модели оно смягчает удар по NPV.\n```\n\n## 4. Сравнение по KPI\n\nСравнение выполняется через один расчетный контур `Model`. Активный тест переключается ячейкой `StressCases!B4`, результаты четырех KPI переносятся значениями в таблицу листа `KPI`.\n\n> [!WARNING]\n> Копировать лист `Model` для каждого стресс-теста нельзя: копии со временем расходятся по формулам, и сравниваются уже разные модели, а не разные условия.\n\nЗначения, млн руб.:\n\n| Тест | NPV | Выручка 2030 | Опер. прибыль 2030 | FCF 2030 |\n| --- | --- | --- | --- | --- |\n| База | 46,17 | 135,40 | 34,52 | 27,61 |\n| Стресс спроса | 10,49 | 91,20 | 6,64 | 5,31 |\n| Стресс маржи | −0,84 | 111,40 | 0,59 | 0,47 |\n| Комбинированный | −37,43 | 70,45 | −19,23 | −19,23 |\n\n### Два показательных случая\n\n**Стресс маржи.** Операционная прибыль 2030 положительна (0,59 млн руб.). Контроль только последнего года дал бы вывод «модель выдерживает». NPV равен −0,84 млн руб.: с учетом траектории, CAPEX и дисконтирования экономическая граница нарушена. Выручка 2030 в этом тесте (111,40) выше, чем в стрессе спроса (91,20), а NPV хуже: верхняя строка отчета устойчивости не показывает.\n\n**Стресс спроса.** NPV положителен (10,49 млн), но управленческий порог 20 млн не выполнен. Результат приемлем по минимальной границе и неприемлем по внутреннему требованию.\n\n```quiz\nquestion: В стрессе маржи операционная прибыль 2030 равна +0,59 млн руб., а NPV равен −0,84 млн руб. Как это возможно?\nA: В расчете ошибка: знаки этих показателей всегда совпадают\nB: NPV учитывает всю траекторию, CAPEX и дисконтирование, поэтому слабые потоки ранних лет перевешивают положительный результат последнего года\nC: NPV считается без налога, а операционная прибыль с налогом\nD: Операционная прибыль измеряется в номинальных рублях, а NPV в реальных\ncorrect: B\nexplanation: Это нормальная ситуация и причина, по которой устойчивость оценивают по нескольким KPI.\n```\n\n## 5. Reverse stress testing\n\nОбычный стресс-тест начинает с условий. Reverse stress testing начинает с неприемлемого результата («NPV равен нулю») и ищет условия, при которых он наступает. Метод измеряет **расстояние до отказа**.\n\n### Одна изменяемая ячейка вместо шести\n\nПодбор параметра изменяет одну ячейку. Если двигать только цену, задача сводится к критическому значению занятия 4.2, а требуется ухудшать несколько связанных предпосылок одновременно. Решение (лист `ReverseStress`): задан стресс-вектор от базы к комбинированному стрессу и один коэффициент интенсивности `k` в ячейке `B5`. Каждая предпосылка вычисляется одинаково:\n\n```excel\nАктивное значение = База + k × (Полный стресс − База)\n```\n\n- `k = 0 %` – база;\n- `k = 100 %` – комбинированный стресс;\n- `k = 50 %` – каждая предпосылка проходит половину пути;\n- `k > 100 %` – усиление того же вектора.\n\nВсе шесть активных значений – функции `k`, поэтому подбор параметра двигает один вход, а тот пересчитывает все предпосылки.\n\n> [!WARNING]\n> `k` – модельный индекс тяжести. Это не вероятность, не процентиль и не частота события. Формулировка «при вероятности стресса 47,5 % NPV обращается в ноль» неверна.\n\n### Поведение модели вдоль вектора\n\n| k | NPV, млн руб. | Опер. прибыль 2030, млн руб. | Статус |\n| --- | --- | --- | --- |\n| 0 % | 46,17 | 34,52 | База |\n| 25 % | 19,76 | 17,44 | NPV ниже управленческого порога |\n| 50 % | −1,99 | 2,99 | NPV отрицателен, операционный KPI положителен |\n| 75 % | −20,88 | −9,13 | Нарушены оба критерия |\n| 100 % | −37,43 | −19,23 | Полный комбинированный стресс |\n\n### Поиск критической интенсивности\n\nДля первой границы в диалоге «Подбор параметра»:\n\n- **Установить в ячейке** – `J20` (NPV на листе `ReverseStress`);\n- **Значение** – `20000000`;\n- **Изменяя значение ячейки** – `B5`.\n\nРезультаты:\n\n| Граница | Критическое k |\n| --- | --- |\n| NPV = 20 млн руб. | 24,75 % |\n| NPV = 0 | 47,50 % |\n| Операционная прибыль 2030 = 0 | 55,77 % |\n\n> [!WARNING]\n> Подбор параметра оставляет найденное значение в `B5`. Порядок: зафиксировать базу → выполнить поиск → записать результат отдельно → вернуть `k = 0 %` → проверить, что NPV равен 46,17 млн руб. Иначе следующий поиск стартует с измененной точки, и результаты несопоставимы.\n\nГраница всегда определена **относительно конкретного KPI и порога**. Фраза «модель выдерживает стресс 47,5 %» неполна: нужно указать, что произошло при 47,5 % (NPV пересек ноль), тогда как операционная прибыль 2030 оставалась положительной до 55,77 %.\n\n```quiz\nquestion: Критический k для NPV = 0 составил 47,5 %, для операционной прибыли 2030 = 0 составил 55,77 %. Что следует из этого?\nA: В одном из расчетов ошибка: критическая интенсивность должна быть одна\nB: Граница отказа определена относительно KPI, поэтому указывать k без критерия некорректно\nC: Вероятность нарушения операционного критерия выше вероятности отрицательного NPV\nD: Модель устойчива, поскольку оба значения меньше 100 %\ncorrect: B\nexplanation: Разные показатели пересекают границы при разной интенсивности. Критическое k имеет смысл только вместе с KPI и порогом.\n```\n\n## 6. Ограничения метода\n\n- **Зависимость от вектора.** Все шесть предпосылок движутся линейно от базы к полному стрессу. Найденное `k` характеризует эту траекторию ухудшения; другой вектор (только шок спроса) даст другое значение.\n- **Линейность – учебное допущение.** В реальности спрос может падать скачком, ставка реагировать быстрее цены, затраты приходить с лагом.\n- **Зависимость от KPI.** Три границы дают три значения `k`.\n- **Отсутствие вероятностной интерпретации.** Метод отвечает на вопрос «что должно произойти для отказа», но не «насколько это вероятно» (день 9).\n\n### Документирование\n\nДля рабочего стресс-теста фиксируют: название и цель, изменяемые предпосылки, основание шоков, KPI, порог, результат и дату выполнения.\n\n## 7. Использование ИИ: проверка постановки\n\n```excel\nНиже приведены мой стресс-тест, заданные пороги KPI и полученные результаты:\n\n[ВСТАВЬТЕ ПАРАМЕТРЫ СТРЕСС-ТЕСТА, ПОРОГИ, ЗНАЧЕНИЯ KPI И ТЕКСТ ВЫВОДОВ]\n\n1. Проверь, образуют ли измененные предпосылки одну причинную рамку или набор независимых ухудшений.\n2. Найди признаки двойного счета: один внешний шок, отраженный в нескольких параметрах как разные риски.\n3. Проверь по формулировкам, был ли порог задан до расчета.\n4. Укажи случаи, где разные KPI дают разные сигналы, и объясни экономическую причину.\n5. Найди вероятностные утверждения о стресс-тесте или о коэффициенте интенсивности и предложи замену.\n6. Проверь, указан ли рядом с критической интенсивностью KPI и порог, к которым она относится.\n7. Не предлагай менять шоки без указания механизма, из которого они следуют.\n```\n\nХарактерный признак ошибки в теме – число критической интенсивности, названное без критерия.\n\n## 8. Итоги занятия\n\n1. Сценарий описывает альтернативные состояния; стресс-тест проверяет устойчивость относительно заданного критерия.\n2. Порог задается до расчета; различают минимальную границу и управленческий порог.\n3. Стресс-тест причинно согласован и не сводится к ухудшению каждой предпосылки (CAPEX в стрессе спроса ниже базового).\n4. Устойчивость оценивается по нескольким KPI: операционная прибыль и NPV пересекают границы при разных условиях.\n5. Reverse stress testing начинает с неприемлемого результата и ищет условия его возникновения.\n6. Коэффициент `k` – индекс интенсивности вектора, не вероятность.\n7. Критическая интенсивность привязана к KPI и порогу; после каждого поиска `k` возвращается к нулю.\n\n## Практика: сравнение стресс-тестов и критическая интенсивность\n\n**Задача.** Сравнить три стресс-теста по KPI, найти критическую интенсивность для трех границ и добавить собственный стресс-тест.\n\n**Файл.** [lesson-5.2.xlsx](materials/lesson-5.2.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла.\n\n**Что нужно сделать.**\n\n1. Переключить три стресс-теста и перенести KPI в таблицу листа `KPI`.\n2. Классифицировать результаты как «приемлемо», «ниже управленческого порога» или «неприемлемо».\n3. Рассчитать модель при `k` = 25, 50 и 100 % на листе `ReverseStress`.\n4. Найти критическое `k` для NPV = 20 млн, NPV = 0 и операционной прибыли 2030 = 0, возвращая `k = 0` после каждого поиска.\n5. Добавить собственный стресс-тест с минимум четырьмя изменяемыми предпосылками и причинами изменений.\n\n**Результат.** Выполненная книга: активный тест «База», `k = 0 %`, таблица критических интенсивностей.\n", "6.1": "---\ntitle: \"Статистический анализ и временные ряды\"\nsummary: \"Диагностика временного ряда: корреляция Pearson и Spearman, линейная регрессия, тренд и сезонность, выбросы по остаткам, структурные сдвиги, лаги и утечка будущего.\"\nsource: \"materials/lesson-6.1.xlsx\"\nconcepts:\n  - \"Временной ряд :: Последовательность наблюдений, упорядоченная по времени. Порядок наблюдений несет информацию и не может быть изменен.\"\n  - \"Корреляция Pearson :: Коэффициент от −1 до +1, измеряющий линейную совместную изменчивость двух числовых признаков. Не доказывает причинность.\"\n  - \"Корреляция Spearman :: Корреляция рангов; измеряет монотонность связи и устойчивее к выбросам и масштабу, чем Pearson.\"\n  - \"Ложная корреляция тренда :: Высокая корреляция двух показателей, вызванная общим временным трендом, а не связью между ними.\"\n  - \"Линейная регрессия :: Прямая Y = a + bX, минимизирующая сумму квадратов отклонений. Наклон b измеряется в единицах Y на единицу X.\"\n  - \"Коэффициент детерминации R² :: Доля вариации Y, описанная моделью на данных, по которым она построена. Не является точностью прогноза.\"\n  - \"Сезонный индекс :: Среднее отношение факта к тренду для календарного месяца. Индекс 1,10 означает уровень примерно на 10 % выше тренда.\"\n  - \"Остаток :: Разность факта и ожидаемого уровня модели «тренд × сезонность». Стандартизируется делением на стандартное отклонение остатков.\"\n  - \"Выброс :: Наблюдение с большим стандартизированным остатком. Требует проверки источника, а не автоматического удаления.\"\n  - \"Структурный сдвиг :: Устойчивый переход ряда в новый режим: последующие наблюдения не возвращаются на прежний уровень.\"\n  - \"Лаг :: Сдвиг одного ряда относительно другого: значение X периода t−k сопоставляется с Y периода t.\"\n  - \"Утечка будущего (look-ahead bias) :: Использование при расчете периода сведений, ставших известными позже этого периода.\"\n---\n\n# Статистический анализ и временные ряды\n\n## Цели и требования\n\nС этого занятия исходной точкой становятся наблюдения. Вопрос меняется: не «что будет, если изменить предпосылку», а «что можно обоснованно сказать о структуре накопленных данных». Задача – отделить устойчивую структуру ряда от шума, разовых событий и изменений режима.\n\nПосле занятия нужно уметь:\n\n- рассчитывать корреляции Pearson и Spearman и называть причины высокой связи, не равные причинности;\n- строить линейную регрессию и читать наклон с единицей измерения;\n- выделять тренд и сезонные индексы и искать выбросы по остаткам;\n- отличать выброс от структурного сдвига;\n- проверять лаговые зависимости и соблюдать информационный момент.\n\n> [!NOTE]\n> Используются функции `КОРРЕЛ`, `РАНГ.СР`, `НАКЛОН`, `ОТРЕЗОК`, `КВПИРСОН`, `СТАНДОТКЛОН.В`, `СУММЕСЛИМН`, `СЧЁТЕСЛИМН`, `ПРОСМОТРX`. В английском интерфейсе: `CORREL`, `RANK.AVG`, `SLOPE`, `INTERCEPT`, `RSQ`, `STDEV.S`, `SUMIFS`, `COUNTIFS`, `XLOOKUP`. Требуется Excel 2021 или Microsoft 365.\n\n> [!WARNING]\n> Данные в книге синтетические. В ряд заложены тренд, сезонность, лаговая связь маркетинга с объемом, два разовых события и структурный сдвиг затрат. Коэффициенты не являются отраслевыми ориентирами.\n\nЗанятие посвящено диагностике, а не прогнозу. Регрессия и тренд служат средствами описания структуры. Прогнозирование, holdout и метрики качества рассматриваются на занятии 6.2.\n\n## 1. Устройство ряда\n\nЛист `Data` содержит 48 ежемесячных наблюдений с января 2022 по декабрь 2025: объем, цену, маркетинговые расходы, переменные затраты на единицу, постоянные затраты, выручку, операционную прибыль и маржу. В столбце «Примечание источника» сохранены пояснения к отдельным периодам. Они не участвуют в формулах и читаются **после** числовой диагностики: сначала процедура обнаруживает необычное поведение, затем аналитик обращается к контексту.\n\n### Время – часть данных\n\nСтрока временного ряда – наблюдение в конкретный момент. Для обычной корреляции порядок строк безразличен, для тренда, сезонности и лагов он принципиален: перестановка строк безвозвратно уничтожает информацию.\n\n### Четыре явления\n\n| Явление | Определение |\n| --- | --- |\n| Тренд | Медленное изменение уровня ряда |\n| Сезонность | Повторяющийся календарный рисунок с устойчивым периодом |\n| Событие | Единичное или кратковременное отклонение с деловой причиной |\n| Структурный сдвиг | Переход ряда в новый устойчивый режим |\n\nРазличать их нужно по проверяемым признакам, а не по интуиции.\n\n## 2. Корреляция: Pearson и Spearman\n\n> [!IMPORTANT]\n> Корреляция не доказывает причинность. Коэффициент показывает, как два ряда менялись вместе, но не сообщает причину и направление влияния.\n\nPearson принимает значения от −1 до +1 и описывает **линейную** совместную изменчивость. Значение около 0 означает отсутствие линейной связи; сильная нелинейная зависимость также может дать значение около 0.\n\n### Две высокие корреляции разной природы\n\nНа листе `Correlation` рассчитаны матрицы для семи показателей.\n\n- **Объем и выручка: Pearson 0,987.** Связь почти функциональная: выручка равна произведению объема и цены. Высокий коэффициент ожидаем и ничего нового не сообщает.\n- **Цена и переменные затраты на единицу: Pearson 0,934, Spearman 1,000.** Один показатель не вычисляется из другого. Оба ряда на протяжении четырех лет растут, и **общий временной тренд** создает высокую корреляцию.\n\nДва трендовых ряда почти всегда выглядят связанными, поэтому матрица корреляций – начало анализа, а не результат.\n\n### Spearman\n\nSpearman строится по рангам: каждому значению присваивается номер в упорядоченном ряду, затем между ранговыми столбцами считается обычная корреляция. Отдельной функции в Excel нет, поэтому ранги вычисляются `РАНГ.СР`, а затем применяется `КОРРЕЛ`.\n\n| | Pearson | Spearman |\n| --- | --- | --- |\n| Что измеряет | Линейную связь | Монотонность связи |\n| Работает с | Исходными значениями | Порядком значений |\n| Выбросы | Чувствителен | Устойчивее |\n\nSpearman равен единице для пары «цена – переменные затраты» потому, что оба ряда монотонно возрастают. Это наглядная демонстрация общего тренда, а не доказательство влияния: устойчивость к выбросам не делает коэффициент пригодным для причинных выводов.\n\n### Безразмерность и знак\n\nКорреляция безразмерна, поэтому сопоставляет рубли с единицами продаж. Одинаковые по модулю коэффициенты могут описывать разные по смыслу связи. Знак описывает направление совместного изменения, а не «хорошесть»: рост переменных затрат связан со снижением маржи, и отрицательный знак здесь ожидаем.\n\n```quiz\nquestion: Pearson для пары «цена – переменные затраты на единицу» равен 0,934, а Spearman равен 1,000. Какой вывод корректен?\nA: Рост цены вызывает рост закупочной себестоимости, и связь строго монотонна\nB: Оба ряда монотонно растут во времени, поэтому общий тренд создает высокую связь без прямого механизма между показателями\nC: Spearman точнее Pearson, поэтому истинная связь равна единице\nD: Один показатель рассчитывается из другого, как выручка из объема и цены\ncorrect: B\nexplanation: Общий временной тренд – типичная причина высокой корреляции между не связанными напрямую показателями. Spearman равен единице потому, что оба ряда возрастают монотонно.\n```\n\n## 3. Линейная регрессия\n\nКорреляция симметрична, регрессия задает направление: выбирается зависимая переменная Y и объясняющая X, строится прямая с минимальной суммой квадратов вертикальных отклонений.\n\n```excel\nY = a + bX\n\nb – наклон: среднее изменение Y при увеличении X на одну единицу\na – свободный член: расчетное Y при X = 0\nR² – доля вариации Y, описанная линейной моделью\n```\n\n### Тренд выручки по времени\n\nНа листе `Regression`: Y – выручка, X – номер месяца `t`. Функции `НАКЛОН`, `ОТРЕЗОК`, `КВПИРСОН` дают:\n\n- наклон **216 668 руб. в месяц**: средняя линейная прибавка выручки за месяц; фактический прирост отдельных месяцев отличается из-за сезонности и остатка;\n- свободный член около 10,73 млн руб. – технический параметр: нумерация начинается с единицы, и `t = 0` не наблюдается;\n- R² = **80,30 %**: линейная зависимость от времени описывает около 80 % вариации выручки внутри наблюдаемого периода.\n\n### Две типовые ошибки\n\n**«R² 80 % означает точность прогноза 80 %».** Неверно: R² измеряет объясненную долю вариации на данных, по которым модель построена. Качество вне этих данных проверяется отдельно (занятие 6.2).\n\n**«Линия описывает прошлое, продлим ее вперед».** Экстраполяция – отдельное решение: за пределами интервала характер связи может измениться.\n\nОставшиеся 20 % вариации находятся в остатках. Остаток – источник информации: в нем видны сезонность, изменение разброса, события и смена режима.\n\n### Единицы наклона\n\nНаклон имеет единицу измерения. Регрессия «объем текущего месяца от маркетинга предыдущего» дает наклон 0,00877 ед./руб., то есть около 8,77 единицы на тысячу рублей внутри этого ряда. Это описательная ассоциация исторического ряда, а не гарантия того, что дополнительная тысяча рублей даст 8,77 продажи.\n\n```quiz\nquestion: R² регрессии выручки по времени равен 80,30 %. Что это означает?\nA: Прогноз выручки на следующий год будет точен на 80 %\nB: Линейная зависимость от времени описывает около 80 % вариации выручки внутри наблюдавшегося периода\nC: В 80 % месяцев фактическая выручка совпала с линией тренда\nD: Вероятность сохранения тренда составляет 80 %\ncorrect: B\nexplanation: R² характеризует долю объясненной вариации на данных построения модели. Это описание прошлого, а не мера точности будущего прогноза и не вероятность.\n```\n\n## 4. Тренд и сезонность\n\nРабота ведется на листе `TimeSeries`. Тренд объема оценивается регрессией по времени: наклон **95,3 ед. в месяц**. Для каждого периода вычисляется отношение факта к трендовому уровню.\n\n### Сезонный индекс\n\n```excel\nСезонный индекс месяца = среднее(Факт / Тренд) по всем наблюдениям этого календарного месяца\n```\n\nИндекс 1 означает уровень около тренда; 1,10 – примерно на 10 % выше; 0,90 – на 10 % ниже. Максимум приходится на декабрь (**1,224**), минимум – на февраль (**0,908**): декабрьский объем в среднем на 22 % выше тренда.\n\nИндексы вычисляются формулой `СУММЕСЛИМН / СЧЁТЕСЛИМН` по номеру месяца и подтягиваются в строки ряда через `ПРОСМОТРX`.\n\n### Ожидаемый уровень\n\n```excel\nОжидаемый объем = Трендовый уровень × Сезонный индекс месяца\n```\n\nЭто простая диагностическая модель «тренд × сезонность». Ее задача – не прогнозировать, а создать базу для остатков: остаток показывает отличие наблюдения от ожидаемого с учетом времени года.\n\nФорма мультипликативная: индекс умножается на тренд, что уместно, когда сезонный размах растет вместе с уровнем. Если сезонная добавка примерно постоянна в единицах (аддитивная форма), вычисляют разности, а не отношения. Выбор формы относится к диагностике.\n\n```quiz\nquestion: Почему выбросы ищут по остаткам относительно ожидаемого уровня, а не по абсолютным значениям ряда?\nA: Абсолютные значения измеряются в разных единицах\nB: Иначе декабрь с индексом 1,224 отмечался бы аномалией каждый год, хотя это повторяющийся календарный режим\nC: Excel не позволяет применять условное форматирование к исходным данным\nD: Остатки всегда распределены нормально\ncorrect: B\nexplanation: Ожидаемый уровень уже содержит тренд и сезонность, поэтому сравнение с ним отделяет необычное наблюдение от регулярного календарного повышения.\n```\n\n## 5. Выбросы и анализ остатков\n\nОстаток – факт минус ожидаемый объем. Для сопоставимости остатки стандартизируются:\n\n```excel\nz = (остаток − средний остаток) / σ остатков\n```\n\nВ ряду средний остаток равен −20,9 ед., стандартное отклонение (`СТАНДОТКЛОН.В`) – 375 ед. Учебный порог – `|z| ≥ 3`; это не норматив, в разных задачах применяются более мягкие и более жесткие правила.\n\n### Две отмеченные точки\n\n- **Декабрь 2023**, z = **+3,79**; примечание источника: крупная корпоративная поставка.\n- **Декабрь 2025**, z = **−3,58**; примечание источника: ограничение поставок в высокий сезон.\n\nОбе точки найдены процедурой, без обращения к примечаниям. Затем выполняется то, что формулой не заменяется: возврат к контексту. Удаление строки только из-за статистической необычности сделало бы данные удобнее и менее правдивыми: реальная операция исчезла бы из истории.\n\n> [!IMPORTANT]\n> Выброс означает «наблюдение требует проверки», а не «строку следует удалить». Последовательность: обнаружить → проверить источник → классифицировать → принять решение (исправить ошибку источника, сохранить реальное событие, выделить отдельный режим, добавить признак события).\n\n### Ограничение метода\n\nСреднее и стандартное отклонение остатков чувствительны к составу выборки: несколько крупных событий увеличивают σ, и порог в три сигмы перестает их замечать. В рядах с тяжелыми хвостами метод работает плохо. Он выбран за прозрачность, а не как наилучший.\n\n```quiz\nquestion: В декабре 2023 года z = +3,79, источник указывает на крупную корпоративную поставку. Какое действие корректно?\nA: Удалить строку, поскольку она искажает тренд и сезонность\nB: Сохранить наблюдение как реальное событие и зафиксировать решение с основанием\nC: Заменить значение на ожидаемый уровень, чтобы остаток стал нулевым\nD: Повысить порог до |z| ≥ 4, чтобы наблюдение перестало отмечаться\ncorrect: B\nexplanation: Процедура указывает, какое наблюдение требует проверки. Решение принимается по источнику, реальное событие из данных не удаляется.\n```\n\n## 6. Структурные сдвиги\n\nСтруктурный сдвиг отличается от выброса тем, что после некоторого момента изменяется устойчивый режим ряда. На листе `StructuralShift` с июля 2024 года переменные затраты на единицу переходят на более высокий уровень, а маржа снижается и не восстанавливается.\n\n| Показатель | До июля 2024 | С июля 2024 | Изменение |\n| --- | --- | --- | --- |\n| Средняя маржа | 19,59 % | 15,21 % | −4,38 п.п. |\n| Средние переменные затраты, руб./ед. | 808,97 | 1 001,84 | около +193 |\n\nПримечание источника – новый контракт с поставщиком; статистическая картина и контекст согласуются.\n\n### Одна точка не доказывает сдвиг\n\nИюль 2024 признан началом нового режима не из-за скачка, а потому, что **последующие наблюдения продолжают вести себя иначе**. Сентябрь 2023 года – контрпример: разовый ремонт поднял постоянные затраты, но уже следующий месяц вернулся к обычному уровню. Это событие, не сдвиг. Различающий признак один: **устойчивость изменения во времени**.\n\nСдвиг может касаться не только уровня: меняются сезонность, разброс, связь между показателями. Поэтому одна регрессия на всем периоде усредняет два режима и описывает ни один из них хорошо.\n\n```quiz\nquestion: Что отличает структурный сдвиг от выброса?\nA: Величина отклонения: сдвиг всегда больше по модулю\nB: Знак отклонения: сдвиг направлен в неблагоприятную сторону\nC: Устойчивость: после сдвига наблюдения продолжают вести себя по-новому, после выброса ряд возвращается к прежнему режиму\nD: Источник: у сдвига есть деловое объяснение, а выброс является ошибкой данных\ncorrect: C\nexplanation: Июль 2024 признан сдвигом потому, что новый уровень затрат сохраняется. Разовый ремонт сентября 2023 такого продолжения не имеет.\n```\n\n## 7. Лаги и утечка будущего\n\nПроцессы редко реагируют мгновенно: маркетинг текущего месяца может влиять на продажи следующего. Проверка только синхронной связи способна пропустить содержательную зависимость.\n\nНа листе `Lag` рассчитана корреляция маркетинга и объема при сдвигах 0–3 месяца:\n\n| Лаг | Pearson | R² | Пар наблюдений |\n| --- | --- | --- | --- |\n| 0 | 0,549 | 30,14 % | 48 |\n| 1 | 0,764 | 58,41 % | 47 |\n| 2 | 0,429 | 18,42 % | 46 |\n| 3 | 0,096 | 0,92 % | 45 |\n\nМаксимум приходится на лаг в один месяц. Число пар убывает с лагом: для лага 1 маркетинг периода `t−1` сопоставляется с объемом периода `t`, и диапазоны выравниваются так, чтобы число наблюдений совпало.\n\n### Выравнивание по дате\n\nЕсли в рабочей таблице пропущен месяц, а сдвиг выполнен смещением столбца на строку, маркетинг мая окажется сопоставлен с июлем. Пропуск строки – отсутствие наблюдения, а не нулевое значение, поэтому в рабочих наборах лаг формируется выравниванием по дате.\n\n### Корректная формулировка\n\n«В данном ряду маркетинговые расходы предыдущего месяца связаны с объемом сильнее, чем синхронные расходы». Формулировка «тысяча рублей маркетинга приводит к 8,77 продажи» требует причинного дизайна. Временной порядок усиливает правдоподобие причинной гипотезы, но не доказывает ее: оба ряда могут реагировать на третий фактор, например на сезонный спрос.\n\n### Утечка будущего\n\n> [!WARNING]\n> Если задача – прогноз будущего периода, в признаки допускаются только данные, известные к моменту формирования прогноза. Значение, ставшее доступным позже, дает красивую, но непригодную модель. Высокая корреляция с будущим показателем не делает будущее доступным в момент расчета.\n\n```quiz\nquestion: Корреляция маркетинга с объемом равна 0,549 при лаге 0 и 0,764 при лаге 1. Какая формулировка вывода корректна?\nA: Маркетинг предыдущего месяца вызывает рост продаж текущего месяца\nB: Тысяча рублей маркетинга приводит к 8,77 дополнительной продажи\nC: В данном ряду расходы предыдущего месяца связаны с текущим объемом сильнее, чем синхронные расходы\nD: Эффект маркетинга полностью проявляется ровно через один месяц\ncorrect: C\nexplanation: Корреляция и регрессия описывают совместное изменение рядов. Причинное утверждение требует отдельного обоснования.\n```\n\n## 8. Использование ИИ: проверка диагностического заключения\n\nМодель проверяет формулировки и причинные утверждения, но не подтверждает значения коэффициентов.\n\n```excel\nНиже приведено мое диагностическое заключение по временному ряду и рассчитанные коэффициенты:\n\n[ВСТАВЬТЕ ЗАКЛЮЧЕНИЕ, КОЭФФИЦИЕНТЫ КОРРЕЛЯЦИИ, ПАРАМЕТРЫ РЕГРЕССИИ И СЕЗОННЫЕ ИНДЕКСЫ]\n\n1. Найди причинные утверждения, не следующие из корреляционного или регрессионного анализа.\n2. Проверь, различаются ли выброс, событие и структурный сдвиг и названы ли признаки различения.\n3. Укажи места, где высокая корреляция может объясняться общим трендом.\n4. Проверь, указаны ли единицы измерения рядом с наклоном регрессии.\n5. Найди утверждения, в которых R² трактуется как точность прогноза.\n6. Проверь, не используются ли для описания периода сведения, ставшие известными позже.\n7. Не предлагай удалять наблюдения только из-за статистической необычности.\n```\n\nХарактерный признак ошибки в теме – утверждение о влиянии одного показателя на другой на основании одного коэффициента корреляции.\n\n## 9. Итоги занятия\n\n1. Корреляция показывает ассоциацию; причинный вывод требует отдельного основания.\n2. Общий тренд создает высокие корреляции между несвязанными показателями.\n3. Регрессия задает направление зависимости; прогнозом сама по себе не является.\n4. Наклон регрессии читается вместе с единицей измерения.\n5. Выброс оценивается относительно ожидаемого уровня «тренд × сезонность» и сначала проверяется по источнику.\n6. Структурный сдвиг – устойчивый новый режим, подтверждаемый последующими наблюдениями.\n7. Лаговые зависимости требуют выравнивания по дате и соблюдения информационного момента.\n\n## Практика: диагностика ряда объема продаж\n\n**Задача.** Выполнить диагностику ряда по листам книги и сформулировать заключение без причинных утверждений, не обеспеченных анализом.\n\n**Файл.** [lesson-6.1.xlsx](materials/lesson-6.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Ряд используется на занятии 6.2.\n\n**Что нужно сделать.**\n\n1. Сопоставить Pearson и Spearman для пар «объем – выручка» и «цена – переменные затраты» и записать причину высокой связи.\n2. Построить регрессию выручки по времени и записать наклон с единицей и R².\n3. Найти сезонные индексы, отфильтровать строки со статусом «Проверить» и принять решение по каждому выбросу после чтения примечаний.\n4. Сравнить режимы до и после июля 2024 года и сформулировать признак, отличающий сдвиг от выброса.\n5. Проверить лаги 0–3, выбрать наиболее выраженный и записать вывод без слов «вызывает» и «приводит к».\n\n**Результат.** Заполненная книга и заключение из 5–7 предложений о тренде, сезонности, выбросах, сдвиге и лаге.\n", "6.2": "---\ntitle: \"Прогнозирование и оценка качества\"\nsummary: \"Разделение train и holdout по времени, линейный прогноз как базовая модель, ETS, метрики MAE, RMSE и MAPE, rolling backtest, рабочий горизонт и интервальные оценки.\"\nsource: \"materials/lesson-6.2.xlsx\"\nconcepts:\n  - \"Train и holdout :: Разделение ряда по времени: на train строится модель, holdout считается неизвестным будущим и служит для проверки.\"\n  - \"Origin :: Последняя дата, доступная модели в момент построения прогноза.\"\n  - \"Базовая модель (baseline) :: Простая модель, которую более сложный метод обязан обыграть на проверочных данных.\"\n  - \"ETS :: Семейство моделей экспоненциального сглаживания, формирующих прогноз из уровня, тренда и сезонной компоненты.\"\n  - \"MAE :: Средний абсолютный размер ошибки в единицах ряда.\"\n  - \"RMSE :: Корень из среднего квадрата ошибки; сильнее реагирует на крупные промахи.\"\n  - \"MAPE :: Средняя абсолютная ошибка в процентах факта. Неустойчива при фактических значениях около нуля.\"\n  - \"Rolling backtest :: Повторная историческая проверка в нескольких origin: модель строится по истории до origin и оценивается на следующих периодах.\"\n  - \"Расширяющееся окно :: Схема backtest, в которой обучающая выборка растет с каждым origin.\"\n  - \"Рабочий горизонт :: Максимальная дальность прогноза, подтвержденная backtest по заранее заданному критерию. Отличается от технического горизонта.\"\n  - \"Полуширина интервала :: Значение, возвращаемое ПРЕДСКАЗ.ETS.ДОВИНТЕРВАЛ: границы равны прогнозу плюс и минус полуширина.\"\n---\n\n# Прогнозирование и оценка качества\n\n## Цели и требования\n\nЗанятие продолжает диагностику 6.1 на том же ряду из 48 месяцев: переход от описания структуры к проверяемому прогнозу должен быть виден отдельно от эффекта смены данных. Диагностика установила, что прогнозная модель обязана учитывать: растущий уровень, годовую сезонность, два декабрьских события, сдвиг режима затрат с июля 2024 года и связь с маркетингом предыдущего месяца.\n\n> [!IMPORTANT]\n> Качество прогнозной модели нельзя оценивать на тех же наблюдениях, на которых она строилась. Высокий R² на истории показывает лишь, что модель описывает уже виденные данные.\n\nПосле занятия нужно уметь:\n\n- разделять ряд на train и holdout по времени и контролировать информационный момент;\n- строить линейный прогноз как базовую модель и прогноз ETS;\n- рассчитывать MAE, RMSE и MAPE и выбирать метрику заранее;\n- читать результаты rolling backtest по горизонтам и определять рабочий горизонт;\n- строить интервальные оценки и оформлять протокол выбора модели.\n\n> [!NOTE]\n> Используются `ПРЕДСКАЗ.ЛИНЕЙН`, `ПРЕДСКАЗ.ETS`, `ПРЕДСКАЗ.ETS.ДОВИНТЕРВАЛ`, `СУММПРОИЗВ`, `СУММЕСЛИМН`, `СЧЁТЕСЛИМН`, `КОРЕНЬ`. В английском интерфейсе: `FORECAST.LINEAR`, `FORECAST.ETS`, `FORECAST.ETS.CONFINT`, `SUMPRODUCT`, `SUMIFS`, `COUNTIFS`, `SQRT`. Требуется Excel 2021 или Microsoft 365.\n\nКурс не охватывает теорию прогнозирования полностью. Линейный прогноз и ETS выбраны как два контрастных метода, доступных в Excel. Основное внимание уделяется архитектуре проверки.\n\n## 1. Train, holdout и информационный момент\n\nДля временного ряда случайное перемешивание перед разделением недопустимо: если в обучающую часть попадут наблюдения конца 2025 года, а оценка выполняется на начале 2024, модель получит сведения из будущего, и оценка не будет соответствовать реальному использованию.\n\n- **Train** – январь 2022 – декабрь 2024, 36 месяцев. Только на них строится модель.\n- **Holdout** – январь – декабрь 2025, 12 месяцев; при построении считаются неизвестным будущим.\n\nМодель строится по train и один раз переносится на holdout, после чего прогноз сравнивается с фактом. Holdout имитирует один исторический запуск: в декабре 2024 года построена модель для следующего года.\n\n**Origin** – последняя дата, доступная модели при построении прогноза. Для holdout он один (декабрь 2024), для rolling backtest их несколько. Любой входной показатель должен быть известен не позже origin.\n\n> [!WARNING]\n> Показатель, который становится известен лишь в конце прогнозируемого месяца, нельзя использовать для прогноза этого месяца, даже при очень высокой корреляции. Проверка должна воспроизводить реальный информационный режим.\n\n```quiz\nquestion: Почему для временного ряда нельзя случайно перемешать наблюдения перед разделением на train и holdout?\nA: Excel не умеет работать с перемешанными датами в функциях прогнозирования\nB: Перемешивание нарушает требование равного числа наблюдений в train и holdout\nC: Модель может обучиться на поздних периодах и проверяться на ранних, то есть получит сведения из будущего\nD: После перемешивания невозможно рассчитать сезонные индексы, но прогноз останется корректным\ncorrect: C\nexplanation: Разделение должно воспроизводить реальное использование прогноза: модель знает только прошлое относительно момента построения.\n```\n\n## 2. Линейный прогноз как базовая модель\n\nПеред сложным методом строится **baseline** – простая модель, которую новый метод обязан обыграть на проверочных данных. Если усложнение не дает выигрыша на holdout, оно не обосновано.\n\nBaseline – линейный прогноз объема по времени. На train оценивается прямая, в нее подставляются будущие значения `t`:\n\n```excel\n=ПРЕДСКАЗ.ЛИНЕЙН(B5;Data!$E$5:$E$40;Data!$B$5:$B$40)\n```\n\n`B5` – номер прогнозируемого месяца, `Data!$E$5:$E$40` – объем train (36 значений), `Data!$B$5:$B$40` – номера месяцев train. Тот же результат даст `a + b × t` из `НАКЛОН` и `ОТРЕЗОК`.\n\n### Характер ошибки\n\nЛинейная модель не знает, что такое декабрь: сезонный рисунок она воспринимает как случайное отклонение вокруг прямой. Для слабых зимних месяцев прогноз завышен (январь 2025: прогноз 11 452, факт 9 973), сильный декабрь недооценен (прогноз 12 648, факт 13 518).\n\nR² тренда выручки на занятии 6.1 (около 80 %) был рассчитан на истории. Здесь проверяется другое качество – работа за пределами train. Baseline показывает, **что именно** сложная модель должна добавить: перенос сезонного рисунка на будущие периоды.\n\n```quiz\nquestion: Зачем строить линейную модель, если известно, что она не учитывает сезонность?\nA: Линейная модель всегда точнее на коротких горизонтах\nB: Она служит базой сравнения: более сложный метод обязан обыграть ее на holdout, иначе усложнение не обосновано\nC: Excel требует построить линейный прогноз перед вызовом ETS\nD: Линейная модель дает сезонные индексы для ETS\ncorrect: B\nexplanation: Baseline задает точку отсчета и показывает, какую структуру ряда сложный метод должен добавить.\n```\n\n## 3. ETS: уровень, тренд и сезонность\n\nETS – семейство моделей экспоненциального сглаживания, где прогноз формируется из трех обновляемых компонент: уровня, тренда и сезонности. Если декабрь несколько лет подряд выше локального уровня, этот рисунок переносится на следующий декабрь как сезонная компонента.\n\n```excel\n=ПРЕДСКАЗ.ETS(A5;Data!$E$5:$E$40;Data!$A$5:$A$40;12;1;1)\n```\n\nАргументы: `A5` – прогнозируемая дата; значения train; временная шкала train; `12` – сезонность (месячные данные, годовой цикл); последние два – заполнение пропусков и агрегация дубликатов.\n\nСезонность задана явно: Excel может определить период автоматически, но на учебном ряду цикл известен, и гипотеза должна быть видна. В рабочих задачах автоматический выбор проверяют: алгоритм может найти технический период без бизнес-смысла.\n\n### Требования к ряду\n\n**Регулярность шкалы.** Пропущенный месяц – отсутствие наблюдения, а не ноль; ETS опирается на равномерный шаг времени.\n\n**Дубликаты дат.** Две строки с одной датой требуют правила агрегации.\n\n### Сложность не доказывает качество\n\nETS не признается правильной только потому, что учитывает сезонность. Критерий прежний – ошибка на периодах, не участвовавших в построении. Метод продолжает закономерности истории: если сезонность изменится или произойдет новый сдвиг, модель устареет. Поэтому backtest – часть сопровождения модели, а не однократный сертификат.\n\n```quiz\nquestion: Студент указал для ПРЕДСКАЗ.ETS диапазон значений Data!$E$5:$E$52 (все 48 месяцев). Что произойдет с оценкой качества?\nA: Функция сама отбросит периоды после origin\nB: Прогноз станет точнее, поскольку используется больше данных\nC: Holdout попадет в обучающие данные, и метрики перестанут быть оценкой работы на неизвестном периоде\nD: Excel вернет ошибку из-за длины шкалы\ncorrect: C\nexplanation: Включение holdout в train разрушает имитацию исторического запуска: метрики рассчитаны на виденных данных и завышены.\n```\n\n## 4. Метрики качества\n\nПосле построения прогнозов считается ошибка каждого периода: факт минус прогноз. Простое усреднение знаковых ошибок погасит переоценки и недооценки, поэтому применяют преобразования:\n\n```excel\nMAE  = среднее(|факт − прогноз|)\nRMSE = корень(среднее((факт − прогноз)²))\nMAPE = среднее(|факт − прогноз| / |факт|)\n```\n\n- **MAE** – средний абсолютный промах в единицах ряда («в среднем модель ошибается на 829 единиц»).\n- **RMSE** – также в единицах ряда, но возведение в квадрат усиливает крупные ошибки; полезна, когда крупный промах особенно дорог.\n- **MAPE** – ошибка в процентах факта, позволяет сравнивать ряды разного масштаба; при фактических значениях около нуля неустойчива, при нуле не определена.\n\n### Результаты на holdout\n\n| Модель | MAE, ед. | RMSE, ед. | MAPE |\n| --- | --- | --- | --- |\n| Линейная | 829 | 955 | 7,61 % |\n| ETS (контрольная реализация) | около 264 | около 351 | около 2,22 % |\n\nЗначения линейной модели детерминированы и должны совпасть. ETS в Excel использует внутреннюю оптимизацию, поэтому результат может немного отличаться от контрольного: проверяется порядок качества (MAPE ETS существенно ниже линейного, около 2–3 %), а не совпадение до единицы. MAPE ETS около 8 % указывает на ошибку в диапазонах.\n\nRMSE заметно превышает MAE: у линейной модели 955 против 829. Это признак нескольких крупных промахов, прежде всего недооцененного декабря (870 ед.).\n\n### Выбор метрики\n\nУниверсальной метрики нет. Если ошибка в полторы тысячи единиц означает срыв поставок, важнее RMSE; при сравнении регионов разного объема удобна относительная метрика.\n\n> [!WARNING]\n> Метрика выбирается до просмотра результатов. Фраза «на MAE выигрывает модель A, поэтому смотрим на MAE» подбирает проверку под результат. Это дисциплина предварительной фиксации критерия из занятия 5.2.\n\n```quiz\nquestion: У линейной модели MAE равен 829, а RMSE равен 955 единиц. О чем говорит это соотношение?\nA: В расчете ошибка: RMSE не может превышать MAE\nB: Модель систематически завышает прогноз во всех месяцах holdout\nC: Среди ошибок есть несколько крупных промахов, которые квадрат ошибки подчеркивает сильнее модуля\nD: Ряд содержит фактические значения около нуля\ncorrect: C\nexplanation: RMSE не меньше MAE, а заметный разрыв указывает на неоднородность ошибок: несколько крупных отклонений влияют на RMSE сильнее.\n```\n\n## 5. Rolling backtest\n\nОдин holdout проверяет ровно один год, а 2025 мог оказаться особенно легким или трудным. **Rolling backtest** повторяет исторический эксперимент: выбирается origin, модель строится по истории до него, прогнозируются будущие периоды, затем origin сдвигается вперед.\n\n### Ручной фрагмент\n\nНа листе `Rolling` выполняются шесть одноступенчатых прогнозов. Для первого origin train заканчивается декабрем 2024 и прогнозируется январь 2025; для следующего январский факт включается в train, прогнозируется февраль, и так далее. Такая схема – **расширяющееся окно**: обучающая выборка растет. Альтернатива – окно фиксированной длины, при котором старые периоды отбрасываются; она полезна при сильных структурных изменениях.\n\nГраницы train записаны отдельными столбцами (`J`, `K`: первая и последняя строка), чтобы отсутствие утечки проверялось по конкретному диапазону формулы. Модель прогноза февраля не может видеть март, апрель и факт самого февраля.\n\n### Подготовленный расчет\n\nПолный backtest выполнен на листе `BacktestData`: 13 origin и горизонты 1, 3, 6 и 12 месяцев (52 прогноза). Агрегированные метрики по горизонтам находятся на листе `Horizon`. Ошибки на разных горизонтах – разные объекты: модель может быть пригодна на коротком горизонте и непригодна на длинном.\n\n```quiz\nquestion: Чем rolling backtest отличается от одного holdout?\nA: Rolling backtest использует более сложную модель\nB: Holdout проверяет модель в одной точке отсечения, rolling backtest – в нескольких origin с повторным построением модели\nC: В rolling backtest обучающая выборка всегда имеет фиксированную длину\nD: Holdout рассчитывает MAE, а rolling backtest – RMSE и MAPE\ncorrect: B\nexplanation: Различие в процедуре: оценка по одному году зависит от выбранного года, повторение эксперимента дает более устойчивую оценку.\n```\n\n## 6. Рабочий горизонт и интервалы\n\n### Выбор горизонта\n\nРезультаты ETS по листу `Horizon` (13 прогнозов на каждый горизонт):\n\n| Горизонт, мес. | RMSE, ед. | MAPE | Критерий |\n| --- | --- | --- | --- |\n| 1 | 340 | 2,69 % | Проходит |\n| 3 | 328 | 2,45 % | Проходит |\n| 6 | 359 | 2,64 % | Проходит |\n| 12 | 451 | 2,96 % | Не проходит |\n\nКритерий задан до просмотра: **RMSE меньше 400 ед. и MAPE меньше 3 %**. Значения 400 и 3 % демонстрационные: в реальном проекте они следуют из допустимой стоимости ошибки. Максимальный рабочий горизонт – **6 месяцев**.\n\n> [!IMPORTANT]\n> Технический горизонт и рабочий горизонт различаются. Excel рассчитает прогноз и на 12, и на 24 месяца, но возможность получить число не подтверждает его качество. Месяцы за пределами подтвержденного горизонта остаются в таблице с пометкой «долгосрочный ориентир, не подтвержденный проверкой».\n\nЕсли процесс требует двенадцати месяцев, скрывать ухудшение метрики нельзя: меняют модель, данные, частоту пересмотра или способ использования прогноза.\n\n### Интервальные оценки\n\nТочечный прогноз дополняется интервалом. Функция `ПРЕДСКАЗ.ETS.ДОВИНТЕРВАЛ` возвращает **полуширину** интервала, а не границы:\n\n```excel\n=ПРЕДСКАЗ.ETS.ДОВИНТЕРВАЛ(A5;значения;шкала;0,95;12;1;1)\n\nНижняя граница = прогноз − полуширина\nВерхняя граница = прогноз + полуширина\n```\n\nЕсли прогноз равен 12 000, а функция вернула 800, границы равны 11 200 и 12 800.\n\nИнтервал 95 % не гарантирует попадания факта внутрь. Он построен при допущениях модели, и его покрытие проверяется на backtest по доле попавших фактов и по ширине. Слишком широкий интервал покроет почти все факты и будет бесполезен.\n\n### Эмпирический интервал линейной модели\n\nДля baseline в книге задан интервал `±1,96 × RMSE holdout`, полуширина около **1 872 ед.** (1,96 × 955).\n\n> [!WARNING]\n> Это не доверительный интервал линейной регрессии, а наглядная эвристика, связывающая историческую ошибку с диапазоном неопределенности. Переносить ее на рабочие задачи как строгий метод нельзя.\n\n### Переобучение после проверки\n\nПосле выбора метода и горизонта модель переобучается на всей истории, включая 2025 год, и строит прогноз на 2026. Метрики на этих же 48 месяцах **не пересчитываются**: остаются метрики holdout и backtest, иначе оценка вернется к данным, которые модель видела.\n\n```quiz\nquestion: ETS проходит критерий на горизонтах 1, 3 и 6 месяцев и не проходит на 12. Что это означает для прогноза на декабрь 2026 года?\nA: Прогноз на декабрь 2026 вычислить невозможно\nB: Прогноз вычисляется, но находится за пределами подтвержденного рабочего горизонта и должен быть так помечен\nC: Для декабря 2026 следует использовать линейную модель, так как ее RMSE на горизонте 12 ниже\nD: Критерий нужно смягчить до RMSE меньше 500, чтобы горизонт стал двенадцатимесячным\ncorrect: B\nexplanation: Возможность получить число не подтверждает качество. Смягчать критерий после просмотра результата недопустимо.\n```\n\n## 7. Использование ИИ: проверка протокола выбора модели\n\n```excel\nНиже приведен мой протокол выбора прогнозной модели:\n\n[ВСТАВЬТЕ ОПИСАНИЕ РЯДА, ГРАНИЦЫ TRAIN И HOLDOUT, МЕТОДЫ, ЗНАЧЕНИЯ МЕТРИК, РЕЗУЛЬТАТ BACKTEST, ГОРИЗОНТ И ОГРАНИЧЕНИЯ]\n\n1. Проверь, указано ли разделение train и holdout по времени и нет ли признаков перемешивания периодов.\n2. Найди места, где для прогноза периода используются сведения, ставшие известными позже этого периода.\n3. Проверь, рассчитаны ли метрики на периодах, не участвовавших в построении модели.\n4. Укажи, выбрана ли метрика до просмотра результатов или после, судя по формулировкам.\n5. Проверь, различаются ли технический и рабочий горизонт.\n6. Найди утверждения, в которых доверительный интервал трактуется как гарантия попадания факта.\n7. Проверь, указано ли, какие изменения данных потребуют повторной проверки модели.\n```\n\nХарактерный признак ошибки в теме – метрика качества, рассчитанная на всей истории после переобучения модели.\n\n## 8. Итоги занятия\n\nПолный цикл работы с прогнозом состоит из восьми шагов:\n\n1. Диагностика ряда: тренд, сезонность, выбросы, сдвиги, лаги.\n2. Отделение holdout по времени без утечки будущего.\n3. Базовая модель и альтернативный метод.\n4. Ошибки на holdout по метрикам, выбранным заранее.\n5. Rolling backtest в нескольких origin.\n6. Сравнение по горизонтам, рабочий горизонт отдельно от технического.\n7. Интервал к точечному прогнозу как проверяемый объект.\n8. Переобучение на всей истории с сохранением метрик backtest.\n\n## Практика: протокол выбора модели\n\n**Задача.** Сравнить линейный прогноз и ETS на holdout, проанализировать backtest по горизонтам, подготовить прогноз на 2026 год и оформить протокол выбора модели.\n\n**Файл.** [lesson-6.2.xlsx](materials/lesson-6.2.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла.\n\n**Что нужно сделать.**\n\n1. Проверить временное разделение и линейный прогноз 2025 года, рассчитать MAE, RMSE и MAPE.\n2. Заполнить прогноз ETS на holdout с сезонностью 12, рассчитать метрики и сравнить модели.\n3. Выполнить шесть шагов ручного rolling backtest на листе `Rolling`.\n4. По таблице `Horizon` определить рабочий горизонт и проверить пометки на листе `FutureForecast`.\n5. Заполнить ETS-прогноз 2026 с интервалом и записать протокол выбора модели из восьми позиций.\n\n**Результат.** Заполненная книга и протокол: ряд, границы train и holdout, методы, метрики, результат backtest, рабочий горизонт и критерий, способ интервальной оценки, ограничения, условия повторной проверки.\n", "7.1": "---\ntitle: \"VBA и автоматизация\"\nsummary: \"Макросы и формат xlsm, макрорекордер, объектная модель, динамическая граница данных, условия, циклы и параметризованные процедуры на примере классификации отклонений план-факт.\"\nsource: \"materials/lesson-7.1.xlsx\"\nconcepts:\n  - \"Макрос :: Процедура VBA, выполняющая последовательность действий над объектами Excel.\"\n  - \"Формат xlsm :: Формат книги с поддержкой макросов. Формат xlsx код VBA не хранит.\"\n  - \"Макрорекордер :: Средство записи действий пользователя в код VBA. Записывает зависимость от интерфейса, например Select и Selection.\"\n  - \"Option Explicit :: Директива модуля, требующая явного объявления всех переменных.\"\n  - \"Объектная модель :: Иерархия объектов Excel: приложение, книга, лист, диапазон, ячейка.\"\n  - \"ThisWorkbook :: Книга, в которой находится выполняемый код. Отличается от ActiveWorkbook, то есть книги, активной у пользователя.\"\n  - \"Квалифицированная ссылка :: Обращение по цепочке объектов, например ThisWorkbook.Worksheets(\\\"Отчет\\\").Range(\\\"A1\\\"), без опоры на активный лист.\"\n  - \"lastRow :: Номер последней строки данных, определяемый программой по обязательному опорному столбцу.\"\n  - \"Приоритет правил :: Порядок проверки ветвей If...ElseIf: сначала самое строгое условие.\"\n  - \"For и For Each :: Циклы перебора номеров и перебора объектов коллекции соответственно.\"\n  - \"Select Case :: Конструкция выбора действия по одному из заданных значений.\"\n  - \"Параметризованная процедура :: Процедура, получающая настройки аргументами, а не хранящая их в теле алгоритма.\"\n  - \"ByVal :: Передача аргумента по значению: процедура получает копию и не меняет исходную переменную.\"\n---\n\n# VBA и автоматизация\n\n## Цели и требования\n\nРасчеты предыдущих занятий выполнялись формулами и запросами. Здесь рассматривается задача иного типа: повторяемая последовательность действий над таблицей. Пример – классификация строк отчета план-факт по двум порогам с записью статуса, форматированием и контрольными количествами. Вручную такая операция выполняется за несколько минут, но при каждом обновлении данных повторяется заново и допускает ошибки.\n\nПосле занятия нужно уметь:\n\n- сохранять книгу с макросами и запускать код безопасно;\n- обращаться к листам и диапазонам без опоры на активный лист и выделение;\n- определять границу данных динамически;\n- записывать условия с учетом приоритета правил и граничных значений;\n- применять цикл к диапазону и выносить настройки в параметры процедуры.\n\n> [!WARNING]\n> Макросы запускаются только в файлах известного происхождения. Код VBA имеет доступ к файлам и настройкам компьютера, поэтому книгу из неизвестного источника нельзя открывать с включенными макросами. Отмена действий макроса клавишами Ctrl+Z невозможна: практика выполняется в рабочей копии.\n\n> [!NOTE]\n> Требуется Windows и Excel 2021 либо Microsoft 365. Редактор кода открывается клавишами Alt+F11. Синтаксис VBA не локализуется: ключевые слова пишутся по-английски.\n\nДанные: лист «Отчет» с заголовком в строке 4 и 48 строками данных (до строки 52). Идентификатор в столбце A, плановые и фактические выручка и затраты в столбцах E:H. Столбцы I:K заполняет процедура, блок N5:N9 содержит контрольные количества. Пороги находятся на листе «Параметры».\n\n## 1. Макросы, форматы и среда\n\nКод VBA хранится внутри книги. Формат xlsx его не сохраняет, поэтому рабочая копия записывается как «Книга Excel с поддержкой макросов» (xlsm). Исходный xlsx остается чистой копией.\n\nПроцедура без возвращаемого значения объявляется ключевым словом `Sub`:\n\n```excel\nOption Explicit\n\nSub HelloMacro()\n    MsgBox \"Макрос выполнен\"\nEnd Sub\n```\n\n`Option Explicit` в первой строке модуля требует объявлять каждую переменную. Опечатка в имени тогда превращается в ошибку компиляции, а не в новую пустую переменную с неверным результатом.\n\nПеременные объявляются оператором `Dim` с указанием типа:\n\n- `Worksheet`, `Range` – объекты Excel; присваиваются ключевым словом `Set`;\n- `Long` – целые числа, в том числе номера строк;\n- `Double` – числа с дробной частью: суммы, проценты, пороги;\n- `String` – текст.\n\n```excel\nDim ws As Worksheet\nDim lastRow As Long\nSet ws = ThisWorkbook.Worksheets(\"Отчет\")\nlastRow = 52\n```\n\nДля отладки процедура выполняется по шагам клавишей F8, результат промежуточных значений выводится командой `Debug.Print` в окно Immediate (Ctrl+G).\n\n```quiz\nquestion: Какой формат нужно выбрать при сохранении рабочей копии книги, чтобы код VBA сохранялся после закрытия?\nA: xlsx, так как код хранится в настройках приложения Excel\nB: xlsm, так как формат xlsx не хранит макросы\nC: csv, так как он поддерживает текстовый код\nD: Любой формат: код всегда сохраняется отдельным файлом\ncorrect: B\nexplanation: Код VBA является частью книги. Формат xlsx его не сохраняет, и при записи в этом формате код теряется.\n```\n\n## 2. Макрорекордер и его ограничения\n\nМакрорекордер записывает действия пользователя в код. Он показывает соответствие действий объектам и свойствам: полужирный шрифт соответствует `Font.Bold`, выравнивание – `HorizontalAlignment`.\n\nЗапись форматирования заголовка `A4:K4` дает код вида:\n\n```excel\nSub Macro1()\n    Range(\"A4:K4\").Select\n    Selection.Font.Bold = True\n    With Selection\n        .HorizontalAlignment = xlCenter\n    End With\nEnd Sub\n```\n\nВ записанном коде две зависимости, которые делают процедуру ненадежной:\n\n- адрес `A4:K4` записан явно и не учитывает изменение таблицы;\n- действие выполняется над выделением (`Selection`) на активном листе: при запуске на другом листе будет отформатирован не тот диапазон.\n\nРекордер используется как справочник по именам свойств. Рабочий код переписывается: выделение убирается, лист указывается явно.\n\n```excel\nSub FormatHeader()\n    Dim ws As Worksheet\n    Set ws = ThisWorkbook.Worksheets(\"Отчет\")\n\n    With ws.Range(\"A4:K4\")\n        .Font.Bold = True\n        .HorizontalAlignment = xlCenter\n    End With\nEnd Sub\n```\n\nКонструкция `With...End With` задает объект один раз для нескольких обращений. Комментарий в VBA начинается с апострофа.\n\n```quiz\nquestion: Почему записанный рекордером код с Select и Selection нельзя использовать как рабочую процедуру без правки?\nA: Select не поддерживается в формате xlsm\nB: Результат зависит от активного листа и текущего выделения, поэтому при другом состоянии интерфейса изменится другой диапазон\nC: Рекордер записывает код на другом языке\nD: Select выполняется в десять раз медленнее любой другой команды, но результат остается корректным\ncorrect: B\nexplanation: Процедура должна давать одинаковый результат независимо от того, какой лист активен и что выделено. Зависимость от интерфейса убирается явной ссылкой на объект.\n```\n\n## 3. Объектная модель\n\nExcel организует данные как иерархию: приложение, книга, лист, диапазон, ячейка. Обращение к ячейке записывается цепочкой:\n\n```excel\nThisWorkbook.Worksheets(\"Отчет\").Range(\"A5\").Value\n```\n\nТакая ссылка называется квалифицированной: каждый уровень указан явно. Она работает одинаково при любом активном листе.\n\n### ThisWorkbook и ActiveWorkbook\n\n`ThisWorkbook` – книга, в которой находится выполняемый код. `ActiveWorkbook` – книга, активная у пользователя в данный момент. Если одновременно открыто несколько файлов, эти объекты различаются. Для обращения к собственным данным и настройкам используется `ThisWorkbook`.\n\n### Range и Cells\n\n`Range(\"A5\")` задает ячейку или диапазон по адресу в виде текста. `Cells(строка, столбец)` задает ячейку по номерам, что удобно в цикле. Столбец допускается указывать буквой:\n\n```excel\nws.Cells(5, \"F\").Value\n```\n\nСвойство `.Value` читает или записывает значение ячейки.\n\n```quiz\nquestion: Книга с макросом и другая рабочая книга открыты одновременно, активна вторая. Какая запись обращается к листу «Параметры» книги с кодом?\nA: ActiveWorkbook.Worksheets(\"Параметры\")\nB: ThisWorkbook.Worksheets(\"Параметры\")\nC: Worksheets(\"Параметры\") без указания книги\nD: Application.Selection.Worksheets(\"Параметры\")\ncorrect: B\nexplanation: ThisWorkbook указывает на книгу с выполняемым кодом независимо от активной. ActiveWorkbook и ссылка без книги зависят от состояния интерфейса.\n```\n\n## 4. Динамическая граница данных\n\nФиксированный адрес `A4:K52` перестает работать при добавлении строк. Граница определяется программой: поиском последней заполненной ячейки от конца листа вверх.\n\n```excel\nDim lastRow As Long\nlastRow = ws.Cells(ws.Rows.Count, \"A\").End(xlUp).Row\n```\n\n`ws.Rows.Count` возвращает число строк листа, `Cells(…, \"A\")` указывает последнюю ячейку столбца A, `End(xlUp)` соответствует клавишам Ctrl+↑, `.Row` возвращает номер строки. Диапазон строится склейкой текста и числа:\n\n```excel\nSet rngData = ws.Range(\"A4:K\" & lastRow)\n```\n\nПри `lastRow` = 52 получается `A4:K52`, при 58 – `A4:K58`; код не меняется.\n\n### Опорный столбец\n\nСтолбец для определения границы должен быть заполнен для каждой записи до запуска процедуры. Столбец K со статусом не подходит: его заполняет сама процедура, при первом запуске он пуст. Идентификатор в столбце A обязателен для каждой строки.\n\n### Другие способы\n\n- `ws.Range(\"A4\").CurrentRegion` – непрерывная область; пустая строка или столбец прерывают ее.\n- `ws.ListObjects(\"имя\").DataBodyRange` – тело структурированной таблицы.\n\nВыбор определяется гарантированной структурой источника. Если под заголовком нет данных, `End(xlUp)` вернет строку заголовка; обработка такого входа рассматривается на занятии 7.2.\n\n```quiz\nquestion: Почему для определения lastRow выбран столбец A с идентификатором, а не столбец K со статусом?\nA: End(xlUp) работает только с первым столбцом листа\nB: Столбец K содержит текст, а End(xlUp) требует чисел\nC: Столбец K заполняет сама процедура, при первом запуске он пуст и граница определится неверно\nD: Столбец A оформлен как структурированная таблица\ncorrect: C\nexplanation: Опорный столбец должен быть заполнен до запуска и обязателен для каждой записи. Результат работы процедуры на роль опоры не подходит.\n```\n\n## 5. Условия If...ElseIf...Else\n\nДля каждой строки рассчитываются два относительных отклонения:\n\n```excel\nrevenueDelta = (factRevenue - planRevenue) / planRevenue\ncostDelta = (factCost - planCost) / planCost\n```\n\nНаправления ухудшения противоположны: для выручки неблагоприятно отрицательное отклонение, для затрат – положительное. Строка считается критичной, если выручка ниже плана не менее чем на порог либо затраты выше плана не менее чем на порог.\n\n```excel\nIf revenueDelta <= -revenueThreshold Or costDelta >= costThreshold Then\n    statusText = \"Критично\"\nElseIf revenueDelta < 0 Or costDelta > 0 Then\n    statusText = \"Отклонение\"\nElse\n    statusText = \"В норме\"\nEnd If\n```\n\n### Порядок ветвей\n\nВетви проверяются сверху вниз, выполняется первая истинная. Строка со снижением выручки на 12 % удовлетворяет и условию `revenueDelta < 0`. Если менее строгое правило поставить первым, строка получит статус «Отклонение», а до критического критерия проверка не дойдет. Правила располагаются по приоритету: от самого строгого к самому мягкому.\n\n### Or и And\n\n`Or` означает, что достаточно одного неблагоприятного признака. `And` потребовал бы провала по обоим показателям одновременно: строка с падением выручки на 14 % при нормальных затратах критичной бы не стала. Выбор оператора – бизнес-правило, а не синтаксис.\n\n### Границы\n\nОтклонение ровно минус 5 % по выручке попадает в «Критично» из-за оператора `<=`; затраты ровно плюс 5 % – из-за `>=`. Ошибка в знаке сравнения меняет результат только на границе.\n\n> [!TIP]\n> В учебных данных нет строк с отклонением ровно 5 %, поэтому случайный запуск ошибку знака не обнаружит. Граница проверяется отдельной процедурой с заданными значениями: план 1 000 000 и факт 950 000 должны дать «Критично», факт 960 000 – «Отклонение». Для десятичных долей, не представимых точно, сравнение на границе зависит от округления; проверка на заданных числах выявляет такие случаи.\n\nПеред циклом проверяются не менее четырех случаев: нормальная строка, умеренное отклонение, критическое снижение выручки, критическое превышение затрат. Пример смешанного случая – строка ID 26 (лист, строка 30): выручка ниже плана на 4,95 %, порог не пройден, затраты выше плана на 5,91 %. Статус «Критично» получен только за счет второго условия.\n\n```quiz\nquestion: В каскаде первым проверяется revenueDelta < 0, затем revenueDelta <= -revenueThreshold. Строка со снижением выручки на 12 % получает статус «Отклонение». Почему?\nA: Оператор <= не работает с отрицательными числами\nB: ElseIf выполняется, только если предыдущее условие ложно, а менее строгое правило оказалось истинным\nC: Порог не был передан в процедуру и равен нулю\nD: Для отрицательных отклонений нужен оператор And\ncorrect: B\nexplanation: Каскад останавливается на первой истинной ветви. Менее строгое условие перехватывает строку раньше, чем проверяется строгое.\n```\n\n## 6. Циклы For и For Each, Select Case\n\nАлгоритм, проверенный на отдельных строках, применяется ко всем записям от строки 5 до `lastRow`:\n\n```excel\nFor i = 5 To lastRow\n    ' действия для строки i\nNext i\n```\n\nПеременная `i` принимает значения 5, 6, … `lastRow` включительно. Внутри одной итерации выполняются все действия для текущей строки: чтение плана и факта, расчет двух отклонений, определение статуса, запись трех значений.\n\n```excel\nFor i = 5 To lastRow\n    revenueDelta = (ws.Cells(i, \"F\").Value - ws.Cells(i, \"E\").Value) _\n                   / ws.Cells(i, \"E\").Value\n    costDelta = (ws.Cells(i, \"H\").Value - ws.Cells(i, \"G\").Value) _\n                / ws.Cells(i, \"G\").Value\n\n    If revenueDelta <= -revenueThreshold Or costDelta >= costThreshold Then\n        statusText = \"Критично\"\n    ElseIf revenueDelta < 0 Or costDelta > 0 Then\n        statusText = \"Отклонение\"\n    Else\n        statusText = \"В норме\"\n    End If\n\n    ws.Cells(i, \"I\").Value = revenueDelta\n    ws.Cells(i, \"J\").Value = costDelta\n    ws.Cells(i, \"K\").Value = statusText\nNext i\n```\n\nЗнак подчеркивания в конце строки продолжает инструкцию на следующей строке. Переменные объявляются до цикла, значения присваиваются на каждой итерации. Если блок `If` оказался после `Next i`, все строки получат статус последней записи.\n\n### For Each и Select Case\n\nДля перебора объектов, например ячеек диапазона, удобнее `For Each`. Конструкция `Select Case` назначает действие по одному из готовых значений:\n\n```excel\nFor Each cell In ws.Range(\"K5:K\" & lastRow)\n    Select Case cell.Value\n        Case \"Критично\"\n            cell.Interior.Color = RGB(244, 204, 204)\n        Case \"Отклонение\"\n            cell.Interior.Color = RGB(255, 242, 204)\n        Case \"В норме\"\n            cell.Interior.Color = RGB(226, 240, 217)\n    End Select\nNext cell\n```\n\n`For` выбирается, когда нужен номер строки, `For Each` – когда нужен перебор объектов. `If` выражает интервалы и составные условия с порогами, `Select Case` – выбор по перечню готовых значений. Цвет является дополнительным сигналом: статус записан текстом.\n\nСтолбцы A:H – вход, процедура их не изменяет. Результат записывается в `I:K` и в контрольный блок. Области, которые разрешено изменять, определяются до запуска и служат критерием проверки.\n\nКонтрольные количества при порогах 5 %: 48 записей – 9 «Критично», 31 «Отклонение», 8 «В норме»; после добавления шести строк (54 записи) – 9, 34 и 11.\n\n```quiz\nquestion: После запуска все 54 строки получили статус «Отклонение», хотя значения в столбцах I и J рассчитаны правильно и различаются. Где ошибка?\nA: В условии вместо Or использован And\nB: Блок If расположен после цикла, и в K записывается статус, рассчитанный один раз\nC: Переменная statusText объявлена как Double\nD: lastRow определен по столбцу K\ncorrect: B\nexplanation: Различающиеся отклонения при одинаковом статусе означают, что расчет отклонений находится в цикле, а определение статуса – вне его.\n```\n\n## 7. Параметризованная процедура\n\nПорог 5 % можно записать прямо в условие, но при изменении требования значение придется искать в коде. Настройка и алгоритм разделяются: процедура получает пороги аргументами.\n\n```excel\nSub PrepareReport(ByVal revenueThreshold As Double, _\n                  ByVal costThreshold As Double)\n\n    ' общий алгоритм: lastRow, цикл, условия, запись, оформление\n\nEnd Sub\n\nSub RunReport()\n    PrepareReport _\n        ThisWorkbook.Worksheets(\"Параметры\").Range(\"B5\").Value, _\n        ThisWorkbook.Worksheets(\"Параметры\").Range(\"B6\").Value\nEnd Sub\n```\n\n`RunReport` читает настройки и запускает алгоритм, `PrepareReport` выполняет алгоритм. У каждой процедуры одна зона ответственности. Лист «Параметры» служит конфигурацией, VBA – исполнителем; даже вспомогательное обращение к листу настроек квалифицируется через `ThisWorkbook`.\n\n`ByVal` означает передачу значения: процедура работает с копией и не изменяет исходную ячейку или переменную. Сравнение `ByVal` и `ByRef` выходит за рамки занятия.\n\nПараметризация упрощает проверку: одну процедуру можно запустить с порогами 5 % и 7 % и сравнить контрольные количества. Значение параметра не должно быть пустым: пустая ячейка передается как 0, и правило с этим порогом срабатывает почти для каждой строки.\n\n```quiz\nquestion: Что дает вынесение порогов в параметры процедуры?\nA: Параметры выполняются быстрее констант в коде\nB: Изменение порога не требует правки алгоритма, а одну процедуру можно запускать с разными значениями для сравнения\nC: Без параметров процедуру нельзя вызвать из другой процедуры\nD: VBA не допускает числовых литералов внутри условий\ncorrect: B\nexplanation: Смысл параметризации – в разделении алгоритма и конфигурации: алгоритм остается неизменным, настройки задаются извне.\n```\n\n## 8. Использование ИИ: разбор ошибки и проверка кода\n\nЯзыковая модель применяется для объяснения сообщения об ошибке и поиска зависимости кода от состояния интерфейса. Контрольные количества она подтвердить не может: они проверяются запуском.\n\n```excel\nНиже приведена моя процедура VBA для Excel и описание задачи:\n\n[ВСТАВЬТЕ КОД ПРОЦЕДУРЫ, ТЕКСТ ОШИБКИ (ЕСЛИ ЕСТЬ), ОПИСАНИЕ СТРУКТУРЫ ЛИСТА И ПРАВИЛ КЛАССИФИКАЦИИ]\n\n1. Найди места, где код зависит от активного листа, активной книги или выделения, и предложи квалифицированные ссылки.\n2. Проверь, нет ли жестко заданных номеров строк и столбцов, которые должны определяться динамически.\n3. Проверь порядок ветвей условия: не перехватывает ли менее строгое правило строки, предназначенные строгому.\n4. Проверь, что вся логика обработки строки находится внутри цикла.\n5. Укажи значения, которые являются настройкой и должны передаваться параметрами.\n6. Объясни текст ошибки и назови конкретную причину.\n7. Не предлагай обработку ошибок через On Error Resume Next.\n```\n\nПредложенный код проверяется запуском на учебной копии и сверкой контрольных количеств. Характерный признак ненадежного совета в этой теме – предложение подавить ошибку вместо устранения причины.\n\n## 9. Итоги занятия\n\n1. Код VBA является частью книги и требует формата xlsm; макросы запускаются только в файлах известного происхождения.\n2. Макрорекордер показывает имена объектов и свойств, но записывает зависимость от интерфейса, которую нужно убирать.\n3. Надежная процедура обращается к объекту по цепочке книга, лист, диапазон; `ThisWorkbook` указывает на книгу с кодом.\n4. Граница данных определяется динамически по обязательному опорному столбцу.\n5. В каскаде `If...ElseIf` правила расположены по приоритету; знаки сравнения проверяются на граничных значениях.\n6. Вся логика обработки строки находится внутри цикла; `For` перебирает номера, `For Each` – объекты.\n7. Настройки передаются параметрами, процедуры разделены по зонам ответственности.\n\n## Практика: макрос классификации отклонений\n\n**Задача.** Написать процедуру, которая классифицирует строки отчета план-факт по двум порогам, не зависит от активного листа и обрабатывает добавленные строки без правки кода, затем добавить новое правило с отдельным порогом.\n\n**Файл.** [lesson-7.1.xlsx](materials/lesson-7.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Работа выполняется в рабочей копии xlsm.\n\n**Что нужно сделать.**\n\n1. Сохранить рабочую копию в формате xlsm и записать процедуру форматирования заголовка с явной ссылкой на лист.\n2. Определить `lastRow` по столбцу A и проверить логику условия на отдельных строках и на граничном значении.\n3. Записать цикл по строкам с раскраской статусов и контрольным блоком N5:N8.\n4. Оформить `PrepareReport` и `RunReport` с параметрами, добавить шесть строк и проверить результат при порогах 5 % и 7 %.\n5. Добавить параметр 8 % и статус «Расходы критично», определить его место в каскаде и сверить количества.\n\n**Результат.** Книга xlsm с процедурами `PrepareReport` и `RunReport`, контрольным блоком N5:N9 и заполненным листом «Контроль»; столбцы A:H не изменены.\n", "7.2": "---\ntitle: \"Автоматизация регулярной отчетности и расчетов\"\nsummary: \"Регулярный процесс и контракт входа, пользовательские функции без побочных действий, обработка ошибок и журнал, пакетная обработка листов и файлов с гарантированным закрытием источников, выбор между формулами, Power Query и VBA.\"\nsource: \"materials/lesson-7.2.xlsx\"\nconcepts:\n  - \"Регулярный процесс :: Процесс, повторяющийся на новых данных с неизменной логикой и без правки кода.\"\n  - \"Контракт входа :: Условия, которым должен соответствовать источник: расположение, лист, обязательные заголовки, типы значений. При нарушении расчет не выполняется, причина фиксируется.\"\n  - \"Идемпотентность :: Свойство процедуры: повторный запуск на тех же входах не накапливает дубликаты и не меняет исходные данные.\"\n  - \"Function и Sub :: Function вычисляет и возвращает значение, Sub выполняет действия.\"\n  - \"Пользовательская функция (UDF) :: Функция VBA, вызываемая из ячейки. Должна быть чистым вычислением без побочных действий.\"\n  - \"CVErr :: Функция VBA, возвращающая значение ошибки Excel, например CVErr(xlErrValue) для #ЗНАЧ!.\"\n  - \"On Error GoTo :: Передача управления на метку обработчика при ошибке выполнения.\"\n  - \"CleanExit и Resume :: Метка безопасного завершения и оператор возврата к ней после обработки ошибки.\"\n  - \"Журнал :: Лист, в который процедура записывает время, источник, этап, код и описание ошибки.\"\n  - \"Оркестратор :: Процедура, выбирающая объекты и передающая каждый рабочей процедуре; не содержит логики расчета.\"\n  - \"Фильтр области :: Признак, по которому пакетная обработка отбирает целевые листы или файлы: префикс имени, имя таблицы, список.\"\n  - \"Dir :: Функция перебора файлов папки по маске: первый вызов с маской, следующие без аргументов, пустая строка означает конец.\"\n  - \"Err.Raise :: Явное создание ошибки выполнения, например при нарушении контракта данных.\"\n  - \"Освобождение ресурсов :: Закрытие открытых внешних книг при любом исходе: успехе или ошибке.\"\n---\n\n# Автоматизация регулярной отчетности и расчетов\n\n## Цели и требования\n\nЗанятие продолжает 7.1. Адресация объектов, динамическая граница, условия, циклы и параметры позволяют автоматизировать расчет на одном листе. Здесь те же конструкции переводятся в устойчивый регламентный процесс. Финансовая логика не усложняется: формула отклонения прежняя. Меняется надежность исполнения: поведение при неверном источнике, применение одного алгоритма к серии объектов, закрытие файлов, выбор инструмента.\n\nПосле занятия нужно уметь:\n\n- описывать контракт входа и обосновывать отказ от расчета при его нарушении;\n- создавать пользовательскую функцию без побочных действий;\n- обрабатывать ошибки через единый выход и вести журнал;\n- применять одну процедуру к нескольким листам и файлам с явным фильтром области;\n- выбирать между формулами, Power Query и VBA.\n\n> [!NOTE]\n> Требуется Windows и Excel 2021 либо Microsoft 365. Материалы: книга [lesson-7.2.xlsx](materials/lesson-7.2.xlsx) и архив с четырьмя файлами выгрузок [lesson-7.2-exports.zip](materials/lesson-7.2-exports.zip). Архив распаковывается в локальную папку, книга сохраняется как xlsm, путь к папке записывается в ячейку B8 листа «Параметры».\n\n> [!IMPORTANT]\n> Два из четырех файлов выгрузок дефектны намеренно: в `03_March_error.xlsx` отсутствует столбец «Факт затрат, руб.», в `04_April_type.xlsx` одно значение выручки записано текстом. Файлы не исправляются: процедура должна обнаружить дефект, записать причину в журнал и продолжить обработку.\n\nЗанятие не является курсом программирования. Новых конструкций немного: `Function`, `On Error GoTo`, `Dir`, `Err.Raise`. Основной результат – архитектура повторяемого процесса.\n\n## 1. От макроса к регулярному процессу\n\nПроцесс регулярен, если повторяется на новых данных с одинаковой логикой. Если каждый месяц приходится открывать редактор и менять номер строки, путь или имя листа, процесс не доведен до регламентного состояния.\n\n### Успех выполнения и полнота результата\n\nТридцать филиалов присылают файлы, один содержит неверный заголовок. Остановка без объяснения оставляет неизвестным, какая часть данных обработана. Пропуск файла без отметки опаснее: процедура завершится без ошибок, и сумма по 29 филиалам будет принята за сумму по тридцати. Поэтому журнал и счетчик обработанных источников являются частью контроля, а не сервисной функцией.\n\n### Контракт входа\n\nПроцесс не обязан обрабатывать любой файл. Контракт определяет: где находятся источники, как называется лист, какие заголовки обязательны, какого типа значения. При нарушении контракта корректное поведение – отказ от расчета с записью причины.\n\n### Идемпотентность\n\nПовторный запуск на тех же входах не должен накапливать дубликаты и менять исходные данные. Поэтому выходная область очищается перед записью, а входные данные открываются только для чтения.\n\nСхема, к которой привязан весь материал занятия:\n\n```excel\nполучить объект → проверить вход → выполнить расчет →\nзафиксировать результат → при ошибке сохранить контекст →\nв любом случае выполнить cleanup\n```\n\n```quiz\nquestion: Процедура обработала 29 файлов из 30, один пропущен без записи, ошибок не возникло. Почему результат считается опасным?\nA: VBA не обрабатывает более 25 файлов за запуск\nB: Пользователь примет сумму по 29 источникам за полный результат, не имея признака неполноты\nC: Пропущенный файл останется открытым\nD: Порядок файлов при следующем запуске изменится\ncorrect: B\nexplanation: Успешное завершение процедуры не означает полноты результата. Процесс, способный пропустить вход без явного признака, превращает неполные данные в внешне корректный отчет.\n```\n\n## 2. Пользовательские функции\n\nНа 7.1 статус рассчитывался внутри `Sub`. Если та же логика нужна в ячейках листа, создается `Function` – пользовательская функция (UDF). Она похожа на встроенную: интерфейс определяют аргументы и возвращаемое значение, а не последовательность действий.\n\n```excel\nPublic Function VarianceStatus( _\n    ByVal planRevenue As Double, _\n    ByVal factRevenue As Double, _\n    ByVal planCost As Double, _\n    ByVal factCost As Double, _\n    ByVal revenueThreshold As Double, _\n    ByVal costThreshold As Double) As Variant\n```\n\n`Double` подходит для денежных и процентных величин. `ByVal` фиксирует, что функция получает значения и не меняет переменные вызывающего кода. `Variant` нужен, потому что результат бывает двух видов: текст статуса или ошибка Excel.\n\n### Функция без побочных действий\n\n> [!IMPORTANT]\n> Во время пересчета листа функция не должна открывать книги, форматировать соседние ячейки, удалять строки, активировать листы, показывать окна. Порядок пересчета определяет Excel, побочные действия делают результат непредсказуемым. Правило: аргументы на вход, результат на выход.\n\n### Зависимости\n\nФункция участвует в графе зависимостей только через переданные аргументы. Если внутри нее прочитать другую ячейку через `Range`, не передав аргументом, значение ячейки изменится, а функция не пересчитается. Поэтому пороги также передаются аргументами, например ссылками на `Параметры!$B$5` и `Параметры!$B$6`. При изменении порога Excel пересчитает функцию сам.\n\n### Контролируемая ошибка\n\nНулевой план делает относительное отклонение неопределенным. Функция сообщает об этом стандартной ошибкой:\n\n```excel\nIf planRevenue <= 0 Or planCost <= 0 Then\n    VarianceStatus = CVErr(xlErrValue)\n    Exit Function\nEnd If\n```\n\nПустая строка скрыла бы проблему: ее нельзя отличить от незаполненной ячейки. Если в аргумент типа `Double` передан текст, Excel возвращает #ЗНАЧ! до вызова кода функции.\n\n### Нужна ли UDF\n\nЕсли правило прозрачно выражается стандартными функциями или `LET`, VBA требует обоснования: код имеет стоимость – формат xlsm, политика безопасности, сопровождение, необходимость входить в редактор для правки. UDF оправдана при сложной логике, повторяющейся в нескольких местах.\n\n```quiz\nquestion: В UDF добавлена строка, окрашивающая соседнюю ячейку в красный цвет при статусе «Критично». Почему это ошибка проектирования?\nA: VBA не позволяет менять цвет из функции\nB: Функция обязана возвращать String\nC: Функция должна быть чистым вычислением: порядок пересчета определяет Excel, побочные действия делают модель непредсказуемой\nD: Окрашивание допустимо только через условное формат
