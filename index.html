НДОТКЛОН.В`, `СРЗНАЧ`, `СЧЁТЕСЛИ`, `КОРРЕЛ`, `СУММПРОИЗВ`. В английском интерфейсе: `RAND`, `NORM.INV`, `LOGNORM.INV`, `PERCENTILE.INC`, `STDEV.S`, `AVERAGE`, `COUNTIF`, `CORREL`, `SUMPRODUCT`. Модель – учебная NPV из занятия 4.1.\n\n## 1. Принцип метода и схема модели\n\nСхема симуляции:\n\n1. Определить входы с неопределенностью и задать распределение каждого.\n2. Для каждой итерации получить случайный набор входов.\n3. Рассчитать выход (NPV) по детерминированной модели.\n4. Повторить N раз и изучить распределение выхода.\n\nВ модели листа `Simulation` неопределенность задана для трех входов; остальные параметры детерминированы (лист «Параметры»: инвестиции 30 млн руб., ставка 15 %, налог 20 %, постоянные затраты 18 млн руб. в первом году, темпы роста объема, цены, переменных затрат и постоянных затрат 4, 3, 3 и 4 %).\n\n| Вход | Распределение | Параметры |\n|---|---|---|\n| Объем, ед. | Треугольное | минимум 65 000, мода 80 000, максимум 90 000 |\n| Цена, руб. | Нормальное | среднее 1 200, σ 100 |\n| Переменные затраты, руб./ед. | Логнормальное | медиана 700, σ логарифма 0,08 |\n\nМодель NPV для итерации: операционная прибыль каждого года (`объем × цена − объем × затраты − постоянные затраты`, с ростом по годам), налог только на положительную прибыль, дисконтирование по ставке 15 % и вычет инвестиций:\n\n```excel\nОП год t:  = Объем*(1+gv)^(t-1) * Цена*(1+gp)^(t-1)\n           - Объем*(1+gv)^(t-1) * Затраты*(1+gvc)^(t-1)\n           - ПостЗатр*(1+gfc)^(t-1)\nNPV:       = -Инвестиции + СУММПРОИЗВ((ОП - (ОП>0)*ОП*Налог) / (1+Ставка)^Годы)\n```\n\nДетерминированный расчет на модальных значениях (строка 3 листа `Simulation`) дает NPV 39 602 574 руб.\n\n```quiz\nquestion: Что является результатом симуляции Монте-Карло в отличие от сценарного анализа?\nA: Одно наиболее вероятное значение NPV\nB: Распределение NPV с оценками перцентилей и вероятностей\nC: Таблица из трех сценариев с заданными весами\nD: Точное значение NPV без погрешности\ncorrect: B\nexplanation: Симуляция строит распределение результата по множеству случайных наборов входов. Из него определяются среднее, разброс, перцентили и вероятности событий, например убытка.\n```\n\n## 2. Выбор распределений\n\nРаспределение должно отражать природу величины и имеющуюся информацию:\n\n| Распределение | Когда использовать | Параметры |\n|---|---|---|\n| Равномерное | Известны только границы, внутри все значения равновероятны | Минимум, максимум |\n| Треугольное | Есть экспертная оценка: минимум, наиболее вероятное и максимум | Минимум, мода, максимум |\n| Нормальное | Симметричные отклонения вокруг среднего (цены, курсы за короткий период) | Среднее, σ |\n| Логнормальное | Положительная величина с правой асимметрией (затраты, цены сырья) | Медиана (или среднее), σ логарифма |\n\nПравила:\n\n- границы распределения должны исключать физически невозможные значения: объем и затраты не могут быть отрицательными; нормальное распределение допускает любые значения, поэтому σ ограничивается так, чтобы вероятность невозможных значений была пренебрежимо мала;\n- параметры задаются на основе данных или документированной экспертной оценки; выбор «по привычке» превращает симуляцию в иллюстрацию допущений;\n- асимметричное распределение смещает среднее относительно моды: для объема среднее равно `(65 000 + 80 000 + 90 000) / 3 = 78 333`, что ниже моды 80 000.\n\n## 3. Генерация значений: СЛЧИС и обратные функции\n\nФункция `СЛЧИС()` возвращает равномерное число из интервала [0; 1). Значение с нужным распределением получается подстановкой этого числа в обратную функцию распределения (метод обратного преобразования):\n\n```excel\nНормальное:      =НОРМ.ОБР(U; среднее; σ)\nЛогнормальное:   =ЛОГНОРМ.ОБР(U; LN(медиана); σ_лог)\nТреугольное:     =ЕСЛИ(U < (мода-мин)/(макс-мин);\n                      мин + КОРЕНЬ(U*(макс-мин)*(мода-мин));\n                      макс - КОРЕНЬ((1-U)*(макс-мин)*(макс-мода)))\n```\n\nУ треугольного распределения нет готовой функции Excel; формула делит интервал U на две ветви. Для объема точка деления равна `(80 000 − 65 000) / (90 000 − 65 000) = 0,6`.\n\nДля параметра `ЛОГНОРМ.ОБР` второй аргумент – среднее логарифма, равное `LN(медиана)`; медиана 700 соответствует `LN(700)`. Среднее логнормального распределения выше медианы: `медиана × EXP(σ²/2)`.\n\nКаждому входу выделяется отдельное равномерное число (столбцы U1, U2, U3): использование одного числа для двух входов создает жесткую корреляцию между ними.\n\n> [!WARNING]\n> `СЛЧИС()` пересчитывается при каждом изменении листа и при F9. Результаты симуляции на `СЛЧИС()` нельзя сравнивать между запусками, фиксировать в отчете и проверять. В учебной модели числа U1–U3 сохранены как значения: симуляция воспроизводима, и контрольные значения совпадают у всех.\n\n```quiz\nquestion: Для какой цели в формуле логнормального распределения используется LN(медиана)?\nA: Для получения медианы из среднего\nB: Для передачи в ЛОГНОРМ.ОБР среднего значения логарифма величины\nC: Для ограничения значений снизу нулем\nD: Для перевода результата в проценты\ncorrect: B\nexplanation: Функция ЛОГНОРМ.ОБР принимает параметры логарифма величины. Медиане логнормального распределения соответствует среднее логарифма, равное LN(медиана).\n```\n\n## 4. Построение симуляции в Excel\n\nСтруктура листа `Simulation` (строки 6–1005, по одной итерации в строке):\n\n| Столбцы | Содержание |\n|---|---|\n| A | Номер итерации |\n| B:D | U1, U2, U3: равномерные числа (значения) |\n| E, F, G | Объем, цена, переменные затраты: обратные функции от U1, U2, U3 |\n| H:L | Операционная прибыль по годам 1–5 |\n| M | NPV итерации |\n\nПравила построения:\n\n1. Параметры распределений хранятся на листе «Параметры» и входят в формулы абсолютными ссылками; значения не вшиваются.\n2. Формулы итерации записываются один раз и копируются на все строки; контроль – сравнение формулы в первой и последней строке.\n3. Строка 3 (базовый сценарий) использует тот же механизм на модальных значениях и воспроизводит детерминированную NPV; расхождение означает ошибку в формуле.\n4. Число итераций выбирается заранее; для учебной модели N = 1000.\n5. Промежуточные расчеты (по годам) выводятся в столбцах: это упрощает проверку отдельной строки вручную.\n\nПроверка модели: значения входов в каждой строке должны лежать в допустимых границах (объем в диапазоне 65 000–90 000, цена и затраты положительны), а `СРЗНАЧ` по столбцу объема должно быть близко к теоретическому среднему 78 333. На учебном наборе среднее объема равно 78 159, среднее цены – 1 202,8, среднее затрат – 705,3.\n\n## 5. Статистики результата\n\nДля столбца NPV (M6:M1005) рассчитываются характеристики распределения.\n\n| Показатель | Формула | Значение |\n|---|---|---|\n| Среднее | `СРЗНАЧ` | 36 135 548 |\n| Стандартное отклонение | `СТАНДОТКЛОН.В` | 27 371 972 |\n| Минимум | `МИН` | −47 226 115 |\n| Максимум | `МАКС` | 155 531 165 |\n| Перцентиль 5 % | `ПРОЦЕНТИЛЬ.ВКЛ(…; 0,05)` | −8 285 841 |\n| Медиана | `ПРОЦЕНТИЛЬ.ВКЛ(…; 0,5)` | 35 501 675 |\n| Перцентиль 95 % | `ПРОЦЕНТИЛЬ.ВКЛ(…; 0,95)` | 80 983 390 |\n| Вероятность NPV < 0 | `СЧЁТЕСЛИ(M6:M1005; \"<0\") / СЧЁТ(M6:M1005)` | 0,089 |\n\nИнтерпретация:\n\n- 90 % исходов лежат в интервале от −8,3 до 81,0 млн руб. (P5–P95); ширина интервала показывает риск существенно лучше, чем один сценарий;\n- вероятность убытка 8,9 % – доля итераций с NPV ниже нуля; она оценивает риск непосредственно в единицах решения;\n- среднее (36,1 млн руб.) ниже детерминированной NPV (39,6 млн руб.): объем распределен асимметрично со средним ниже моды, а убыточные годы не уменьшают налог из-за ограничения `ОП > 0`. Детерминированный расчет на модальных значениях не равен среднему результату;\n- медиана близка к среднему, поэтому распределение NPV почти симметрично.\n\n> [!NOTE]\n> Для решения «принять проект или нет» используются среднее и вероятность убытка вместе: положительное среднее при заметной вероятности потерь означает, что проект зависит от допустимого уровня риска, а не от одного значения.\n\n```quiz\nquestion: P5 NPV равен −8,3 млн руб., P95 равен 81,0 млн руб. Что означают эти значения?\nA: С вероятностью 5 % NPV ниже −8,3 млн руб., с вероятностью 5 % выше 81,0 млн руб.\nB: NPV лежит строго между −8,3 и 81,0 млн руб.\nC: Среднее NPV равно полусумме этих значений\nD: Вероятность убытка равна 5 %\ncorrect: A\nexplanation: P5 и P95 – границы центральных 90 % исходов. Вероятность выхода за них составляет по 5 % с каждой стороны; на учебном наборе вероятность убытка равна 8,9 %, а не 5 %.\n```\n\n## 6. Сходимость и число итераций\n\nКаждая статистика симуляции – оценка с погрешностью, зависящей от числа итераций. Для среднего погрешность оценивается стандартной ошибкой `σ / √N`: при σ = 27,4 млн руб. и N = 1000 она равна 0,87 млн руб. Приближенный 95 % интервал для среднего – `среднее ± 2 × ошибка`, то есть ±1,7 млн руб.\n\nНакопленное среднее по первым N итерациям:\n\n| N | 100 | 250 | 500 | 1000 |\n|---|---|---|---|---|\n| Среднее NPV, руб. | 37 207 578 | 36 980 826 | 36 093 330 | 36 135 548 |\n\nКолебания уменьшаются с ростом N; точность растет медленно: для уменьшения ошибки вдвое требуется вчетверо больше итераций.\n\nПрактические правила:\n\n- число итераций выбирается по требуемой точности нужной статистики; хвостовые показатели (P5, P95, вероятность убытка) сходятся медленнее среднего, и для них требуется больше итераций;\n- сходимость проверяется диаграммой накопленного среднего и повторной симуляцией с другим набором чисел;\n- при замене `U` на `СЛЧИС()` среднее при пересчете меняется в пределах примерно ±2 стандартных ошибок; различия между запусками, меньшие этой величины, не интерпретируются.\n\n## 7. Вклад входов и корреляции\n\nКорреляция между входом и NPV по итерациям показывает, какой вход сильнее связан с результатом:\n\n| Вход | Корреляция с NPV |\n|---|---|\n| Объем | 0,233 |\n| Цена | 0,818 |\n| Переменные затраты | −0,491 |\n\nОсновной фактор риска – цена. Результат согласуется с чувствительностью из занятия 4.1: цена и затраты определяют разброс сильнее объема. Знак корреляции отражает направление связи: рост затрат снижает NPV.\n\nОграничения интерпретации:\n\n- вклад входа в разброс зависит от ширины его распределения: расширение σ цены со 100 до 150 повышает ее вклад и вероятность убытка, хотя модель не изменилась;\n- корреляция измеряет линейную связь и не разделяет эффекты входов, если они сами связаны;\n- в учебной модели входы независимы. В реальных данных цена и объем обычно связаны отрицательно, а затраты и цена – положительно; независимое моделирование занижает или завышает риск в зависимости от знака связи. Корреляции между входами моделируются отдельно (например, через общий коэффициент или копулы), и в Excel без надстроек это выходит за рамки занятия.\n\n```quiz\nquestion: Корреляция NPV с ценой равна 0,818, с объемом – 0,233. Какой вывод корректен?\nA: Объем не влияет на NPV\nB: Разброс NPV в этой симуляции связан с ценой сильнее, чем с объемом\nC: Рост цены на 1 % увеличивает NPV на 0,818 %\nD: Цену нельзя менять, объем можно\ncorrect: B\nexplanation: Корреляция показывает силу линейной связи на заданных распределениях входов. Она не равна эластичности и зависит от ширины распределений; объем влияет на NPV, но его вклад в разброс меньше.\n```\n\n## 8. Границы применимости\n\nСимуляция Монте-Карло не добавляет информации сверх допущений модели. Основные ограничения:\n\n1. **Выбор распределений.** Другие параметры или форма распределения меняют перцентили и вероятность убытка. Результат сопровождается перечнем допущений.\n2. **Независимость входов.** Отсутствие корреляций между входами – допущение, которое нужно проверять.\n3. **Структура модели.** Ошибка в детерминированной модели воспроизводится во всех итерациях.\n4. **Постоянство параметров во времени.** В учебной модели отклонения цены и затрат действуют на все годы одинаково; в реальности значения меняются по годам независимо.\n5. **Хвосты распределения.** Редкие события (стресс) в нормальной модели недооцениваются; для них применяются стресс-тесты (занятие 5.2).\n6. **Воспроизводимость.** Результаты с `СЛЧИС()` нельзя проверить; в отчет включаются зерно (фиксированный набор чисел) и число итераций.\n\nСимуляция, сценарии и чувствительность дополняют друг друга: чувствительность выделяет факторы, сценарии задают осмысленные состояния мира, стресс-тесты проверяют пределы, симуляция количественно оценивает риск при заданных распределениях.\n\n## 9. Использование ИИ: ревизия допущений симуляции\n\nИИ помогает проверить допущения, но числа распределения должны подтверждаться данными. Запрос:\n\n```excel\nДана симуляция Монте-Карло NPV проекта на 1000 итерациях.\nВходы: объем – треугольное (65000; 80000; 90000), цена – нормальное (1200; σ 100), переменные затраты – логнормальное (медиана 700; σ логарифма 0,08). Входы независимы.\nРезультат: среднее 36,1 млн руб., σ 27,4 млн руб., P5 −8,3 млн руб., P95 81,0 млн руб., вероятность убытка 8,9 %.\nУкажи допущения, которые наиболее вероятно искажают результат, перечисли данные, которые нужны для проверки каждого, и предложи способ проверки в Excel. Не пересчитывай результат.\n```\n\nПредложенные проверки выполняются на модели: изменение параметров распределения и повторный расчет статистик.\n\n## 10. Итоги занятия\n\n- Метод Монте-Карло преобразует вероятностные описания входов в распределение результата; из него получают среднее, перцентили и вероятность убытка.\n- Значения с нужным распределением строятся из равномерных чисел обратными функциями; для воспроизводимости числа фиксируются.\n- Среднее симуляции отличается от детерминированной NPV на модальных значениях; вероятность убытка и интервал P5–P95 дополняют среднее.\n- Точность оценивается стандартной ошибкой и диаграммой сходимости; хвостовые статистики требуют больше итераций.\n- Корреляции входов с результатом показывают основной фактор риска, но результат зависит от выбранных распределений и допущения о независимости.\n\n## Практика: симуляция NPV проекта\n\n**Задача.** Проверить готовую модель Монте-Карло на 1000 итераций, рассчитать статистики результата, оценить сходимость и определить основной фактор риска.\n\n**Файл.** [lesson-9.2.xlsx](materials/lesson-9.2.xlsx). Пошаговые инструкции находятся на листе «Задание», контрольные значения – на листе «Контроль» внутри книги.\n\n**Что нужно сделать.**\n\n1. Проверить формулы листа `Simulation`: базовую строку 3, обратные функции входов и фиксированность чисел U1–U3.\n2. Рассчитать на листе «Результаты» среднее, σ, минимум, максимум, перцентили 5, 50 и 95 %, вероятность убытка и стандартную ошибку среднего.\n3. Заполнить таблицу сходимости (N = 100, 250, 500, 1000), построить диаграмму и оценить нестабильность на копии листа с `СЛЧИС()`.\n4. Рассчитать корреляции NPV с входами, определить основной фактор и оценить влияние увеличения σ цены до 150.\n5. Записать вывод для решения (среднее, интервал P5–P95, вероятность убытка, основной фактор) и два ограничения метода.\n\n**Результат.** Книга с рассчитанными статистиками и заполненным листом «Контроль».\n"}, "tests": {"midterm": "---\ntitle: \"Промежуточный тест: дни 1–5\"\nsummary: \"Пятнадцать вопросов для самопроверки по дням 1–5: архитектура книги и формулы, Power Query, модель данных и DAX, чувствительность, сценарии и стресс-тесты. Ответ выбирается без подсказок; после проверки к неверным ответам нужно вернуться в соответствующее занятие.\"\n---\n\n# Промежуточный тест: дни 1–5\n\n## День 1. Архитектура книги и формулы: вопрос 1\n\n```quiz\nquestion: Что такое молчаливая ошибка?\nA: Ошибка, при которой Excel выводит #ЗНАЧ!, но книга продолжает работать\nB: Неверный результат, при котором Excel не выводит сообщения об ошибке\nC: Ошибка в формуле, скрытая функцией ЕСЛИОШИБКА по умолчанию\nD: Ошибка, возникающая только при пересчете в режиме «Вручную»\ncorrect: B\nexplanation: Молчаливая ошибка не сопровождается сообщением: формула вычисляется, но результат неверен. Поэтому нужны контрольные суммы и диагностика (занятие 1.1).\n```\n\n## День 1. Архитектура книги и формулы: вопрос 2\n\n```quiz\nquestion: В формуле налога записано `=B5*0,2`. Как следует поступить по правилу об изменяемых числах?\nA: Оставить как есть: константа 0,2 понятна из контекста\nB: Заменить на значение, записанное в ячейке слоя предпосылок, и сослаться на нее по имени или адресу\nC: Заменить 0,2 на 20 %: так формула станет читаемее\nD: Скрыть столбец с формулой, чтобы значение не изменили случайно\ncorrect: B\nexplanation: Изменяемая величина записывается в одной ячейке предпосылок. При изменении ставки правится одна ячейка, а не каждая формула.\n```\n\n## День 1. Архитектура книги и формулы: вопрос 3\n\n```quiz\nquestion: Как правильно рассчитать средневзвешенную цену по строкам, если веса находятся в диапазоне B2:B10, а цены в C2:C10?\nA: =СРЗНАЧ(C2:C10)\nB: =СУММПРОИЗВ(B2:B10;C2:C10)/СУММ(B2:B10)\nC: =СУММ(B2:B10*C2:C10)\nD: =СУММПРОИЗВ(B2:B10;C2:C10)/СЧЁТ(C2:C10)\ncorrect: B\nexplanation: Сумма произведений весов на значения делится на сумму весов. Простое среднее игнорирует веса, деление на число строк не нормирует их.\n```\n\n## День 2. Power Query: вопрос 1\n\n```quiz\nquestion: Почему отмену свертывания (unpivot) выполняют по варианту «Отменить свертывание других столбцов»?\nA: Так формируется меньше строк\nB: При появлении нового месяца новый столбец автоматически попадает в данные без правки запроса\nC: Этот вариант быстрее для источников из папки\nD: Другие варианты не поддерживают тип «Текст»\ncorrect: B\nexplanation: Выбор столбцов с названиями месяцев закрепляет их в запросе. Вариант «других столбцов» фиксирует только неизменяемые столбцы, остальные становятся строками.\n```\n\n## День 2. Power Query: вопрос 2\n\n```quiz\nquestion: В столбце «Сумма» источник содержит заполнители «н/д» и «-». Во что их следует преобразовать?\nA: В ноль: данных нет, значит значение нулевое\nB: В null: отсутствующее значение не участвует в подсчете количества и среднего\nC: В пустую строку, оставив столбец текстовым\nD: Удалить строки с такими значениями\ncorrect: B\nexplanation: Ноль искажает среднее и количество, а удаление строк меняет число записей. Отсутствие данных кодируется null.\n```\n\n## День 2. Power Query: вопрос 3\n\n```quiz\nquestion: Фактические продажи по точкам и месяцам объединяются с планом. Прямое слияние с транзакциями дублирует план. Что делать?\nA: Использовать внутреннее соединение вместо левого внешнего\nB: Сначала сгруппировать факт до уровня «точка × месяц», затем слить с планом по двум ключам\nC: Удалить дубликаты в плане после слияния\nD: Заменить слияние добавлением запросов\ncorrect: B\nexplanation: План имеет гранулярность «точка × месяц», транзакции мельче. Перед слиянием уровни детализации выравнивают, иначе значение плана повторяется для каждой транзакции.\n```\n\n## День 3. Модель данных и DAX: вопрос 1\n\n```quiz\nquestion: Почему плоская таблица может давать верный общий итог и неверный разрез по регионам?\nA: Итог в плоской таблице всегда завышен\nB: Атрибут региона хранится в каждой строке факта и может расходиться для одной точки; разрез строится по ошибочным значениям\nC: Сводная таблица не умеет группировать текстовые поля\nD: Региональные итоги не суммируются в общий\ncorrect: B\nexplanation: В плоской таблице атрибуты повторены в каждой строке, поэтому одна точка может оказаться в двух регионах. В модели данных регион хранится один раз в справочнике.\n```\n\n## День 3. Модель данных и DAX: вопрос 2\n\n```quiz\nquestion: Каким условием определяется связь «один ко многим» между справочником точек и таблицей фактов?\nA: Код точки в справочнике уникален, в таблице фактов повторяется\nB: Код точки уникален в обеих таблицах\nC: Код точки может повторяться в справочнике, но не в таблице фактов\nD: Обе таблицы содержат одинаковое число строк\ncorrect: A\nexplanation: На стороне «один» (справочник) ключ уникален, на стороне «многие» (факты) повторяется. Дубликат в справочнике делает связь невозможной.\n```\n\n## День 3. Модель данных и DAX: вопрос 3\n\n```quiz\nquestion: Как корректно вычислить среднюю цену в мере DAX, если в таблице есть выручка и количество?\nA: AVERAGE(FactSales[Цена строки])\nB: DIVIDE(SUM(FactSales[Выручка]); SUM(FactSales[Количество]))\nC: SUM(FactSales[Цена строки]) / COUNTROWS(FactSales)\nD: MAX(FactSales[Цена строки])\ncorrect: B\nexplanation: Средняя цена – отношение суммарной выручки к суммарному количеству. Среднее из средних цен строк игнорирует различие весов и завышает результат.\n```\n\n## День 4. Чувствительность: вопрос 1\n\n```quiz\nquestion: Значения цены записаны в столбце по вертикали. Какое поле диалога «Таблица данных» заполняется для однофакторной таблицы?\nA: «Подставлять значения по строкам в»\nB: «Подставлять значения по столбцам в»\nC: Оба поля\nD: Ни одно: Excel определяет ячейку автоматически\ncorrect: B\nexplanation: Поле выбирается по расположению списка тестовых значений: вертикальный список – по столбцам.\n```\n\n## День 4. Чувствительность: вопрос 2\n\n```quiz\nquestion: Эластичность NPV по цене равна 7,35. Как это читать?\nA: Около базовой точки рост цены на 1 % изменяет NPV примерно на 7,35 % при прочих равных\nB: Рост цены на 7,35 руб. увеличивает NPV на 1 млн руб.\nC: Вероятность роста NPV равна 7,35 %\nD: NPV в 7,35 раза превышает выручку\ncorrect: A\nexplanation: Эластичность – отношение относительных изменений результата и предпосылки. Это локальная характеристика, а не вероятность.\n```\n\n## День 4. Чувствительность: вопрос 3\n\n```quiz\nquestion: Что обязательно выполняется после «Подбора параметра» на модели?\nA: Ничего: результат сохраняется для следующих расчетов\nB: Найденное значение записывается отдельно, предпосылка возвращается к базе, проверяется базовый NPV\nC: Модель закрывается без сохранения\nD: Подбор повторяется до совпадения с целью\ncorrect: B\nexplanation: Подбор параметра записывает найденное значение во входную ячейку и тем самым меняет модель. Без возврата к базе следующие расчеты выполняются на искаженной точке.\n```\n\n## День 5. Сценарии и стресс-тесты: вопрос 1\n\n```quiz\nquestion: Чем сценарий отличается от однофакторной чувствительности?\nA: Сценарий задает вероятность каждого исхода\nB: Сценарий меняет согласованный набор предпосылок, чувствительность – одну при неизменных остальных\nC: Сценарий применяется только к затратам\nD: Сценарий строится только с помощью таблицы данных\ncorrect: B\nexplanation: Различие в постановке: сценарий описывает целостное состояние, где предпосылки связаны общей причиной. Вероятность сценарию не приписывается.\n```\n\n## День 5. Сценарии и стресс-тесты: вопрос 2\n\n```quiz\nquestion: После переключения сценария выручка 2024 года изменилась. Что это означает?\nA: Так и должно быть: сценарий меняет всю шкалу времени\nB: Фактический слой подключен к сценарным предпосылкам ошибочно\nC: Изменилась ставка дисконтирования\nD: Нужно обновить список проверки данных\ncorrect: B\nexplanation: Исторические данные не зависят от предположений о будущем. Неизменность факта – основной инвариант сценарной модели.\n```\n\n## День 5. Сценарии и стресс-тесты: вопрос 3\n\n```quiz\nquestion: Для NPV = 0 критический коэффициент интенсивности k равен 47,5 %. Какая формулировка корректна?\nA: Вероятность отрицательного NPV составляет 47,5 %\nB: При прохождении 47,5 % пути от базы к полному стрессу NPV пересекает ноль при заданном стресс-векторе\nC: Модель выдерживает любой стресс до 47,5 % по всем KPI\nD: В 47,5 % случаев NPV окажется ниже нуля\ncorrect: B\nexplanation: Коэффициент k – индекс интенсивности заданного вектора, а не вероятность. Он определен только вместе с KPI и порогом.\n```\n", "final": "---\ntitle: \"Итоговый тест: дни 6–9\"\nsummary: \"Двадцать вопросов для самопроверки по дням 6–9: статистика и прогнозирование, автоматизация на VBA, дашборды и BI, оптимизация и Monte Carlo, а также сквозные вопросы курса. После проверки к неверным ответам нужно вернуться в соответствующее занятие.\"\n---\n\n# Итоговый тест: дни 6–9\n\n## День 6. Статистика и прогнозирование: вопрос 1\n\n```quiz\nquestion: Почему качество прогнозной модели нельзя оценивать на тех же данных, на которых она строилась?\nA: Потому что на истории модель всегда дает нулевую ошибку\nB: Потому что Excel не позволяет считать ошибку на истории\nC: Потому что история всегда содержит выбросы\nD: Потому что хорошее совпадение с историей показывает лишь описание уже виденных данных, а не способность прогнозировать\ncorrect: D\nexplanation: Для проверки прогноза нужен holdout: период, который модель не видела. Совпадение с обучающей выборкой не доказывает качества на будущем.\n```\n\n## День 6. Статистика и прогнозирование: вопрос 2\n\n```quiz\nquestion: Для какого случая MAPE ненадежна?\nA: Когда фактические значения близки к нулю\nB: Когда ряд имеет тренд\nC: Когда ряд имеет сезонность\nD: Когда горизонт прогноза превышает год\ncorrect: A\nexplanation: MAPE делит ошибку на факт; при значениях около нуля процентная ошибка становится очень большой и нестабильной.\n```\n\n## День 6. Статистика и прогнозирование: вопрос 3\n\n```quiz\nquestion: Что такое rolling backtest?\nA: Прогноз на один период вперед по всей истории\nB: Подбор параметров ETS по минимуму ошибки на истории\nC: Сглаживание ряда скользящим средним\nD: Повторная проверка модели в нескольких origin с оценкой на следующих периодах\ncorrect: D\nexplanation: Rolling backtest строит модель по истории до каждого origin и оценивает прогноз на следующих периодах; это дает оценку по горизонтам.\n```\n\n## День 6. Статистика и прогнозирование: вопрос 4\n\n```quiz\nquestion: Что показывает рабочий горизонт?\nA: Максимальную дальность, на которой backtest подтверждает приемлемое качество по заранее заданному критерию\nB: Максимальную дальность прогноза, которую позволяет построить Excel\nC: Число периодов в обучающей выборке\nD: Период, за который ряд полностью обновляется\ncorrect: A\nexplanation: Рабочий горизонт определяется по результатам backtest и заданному критерию качества, а технический горизонт лишь описывает возможности функции.\n```\n\n## День 7. Автоматизация на VBA: вопрос 1\n\n```quiz\nquestion: Зачем в макросе определяют последнюю заполненную строку, а не записывают номер строки в код?\nA: Код продолжает работать при изменении числа строк в данных\nB: Это ускоряет открытие книги\nC: Это защищает книгу от изменений\nD: Это требуется синтаксисом VBA\ncorrect: A\nexplanation: Фиксированный номер строки перестает соответствовать данным после их роста или сокращения. Расчет последней строки делает код устойчивым.\n```\n\n## День 7. Автоматизация на VBA: вопрос 2\n\n```quiz\nquestion: Почему параметры расчета (например, порог отклонения) выносят в ячейки листа, а не в код макроса?\nA: Чтобы макрос работал быстрее\nB: Чтобы изменять правило без правки кода и сохранить прозрачность модели\nC: Чтобы макрос можно было запускать без включения макросов\nD: Потому что VBA не поддерживает константы\ncorrect: B\nexplanation: Параметры в ячейках изменяются пользователем без обращения к коду и видны в модели. Значения в коде скрыты и требуют правки процедуры.\n```\n\n## День 7. Автоматизация на VBA: вопрос 3\n\n```quiz\nquestion: Для чего ведется журнал выполнения автоматизации?\nA: Для увеличения скорости обработки\nB: Для замены контрольных сумм\nC: Для защиты кода паролем\nD: Для фиксации того, что обработано и какие ошибки возникли, чтобы результат можно было проверить\ncorrect: D\nexplanation: Журнал записывает обработанные объекты, время и ошибки; без него невозможно установить, что именно сделал макрос и где он остановился.\n```\n\n## День 7. Автоматизация на VBA: вопрос 4\n\n```quiz\nquestion: При пакетной обработке файлов один файл содержит ошибку формата. Какое поведение корректно?\nA: Записать ошибку в журнал, пропустить файл и продолжить обработку остальных\nB: Остановить всю обработку без сообщения\nC: Заменить ошибочные значения нулями\nD: Удалить файл из папки\ncorrect: A\nexplanation: Обработка должна быть устойчивой: ошибка фиксируется, остальные файлы обрабатываются, итог показывает, какие файлы не вошли в расчет.\n```\n\n## День 8. Дашборды и BI: вопрос 1\n\n```quiz\nquestion: Что является основным требованием к управленческому дашборду?\nA: Максимальное число диаграмм на одном экране\nB: Использование только круговых диаграмм\nC: Отсутствие фильтров\nD: Ответ на заранее определенные управленческие вопросы с контрольными числами, сверенными с моделью\ncorrect: D\nexplanation: Дашборд строится от вопросов пользователя, а его показатели сверяются с расчетной моделью. Число визуальных элементов не является целью.\n```\n\n## День 8. Дашборды и BI: вопрос 2\n\n```quiz\nquestion: Почему доля или процентный показатель не должен суммироваться по группам?\nA: Потому что Excel не суммирует проценты\nB: Потому что проценты нельзя фильтровать\nC: Потому что сумма долей групп не равна доле итога; показатель нужно пересчитывать из числителя и знаменателя\nD: Потому что проценты хранятся как текст\ncorrect: C\nexplanation: Отношение в итоге равно отношению сумм, а не сумме отношений. В BI показатель задается формулой агрегации числителя и знаменателя.\n```\n\n## День 8. Дашборды и BI: вопрос 3\n\n```quiz\nquestion: Что необходимо выполнить при переносе модели из Excel в BI-систему?\nA: Ничего: результаты совпадут автоматически\nB: Удалить все вычисляемые показатели\nC: Заменить все диаграммы таблицами\nD: Приемку: сравнить значения BI и Excel в нескольких контекстах фильтров\ncorrect: D\nexplanation: Различия в агрегации, типах и фильтрах приводят к расхождениям. Приемка по нескольким контекстам выявляет их до использования дашборда.\n```\n\n## День 8. Дашборды и BI: вопрос 4\n\n```quiz\nquestion: Какова основная роль слоя данных (датасета) в BI?\nA: Оформление дашборда\nB: Рассылка отчетов\nC: Единое определение полей и показателей для всех чартов\nD: Хранение паролей пользователей\ncorrect: C\nexplanation: Датасет содержит типы, роли полей и показатели; чарты используют их повторно, поэтому определение показателя не копируется в каждый отчет.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 1\n\n```quiz\nquestion: Решена линейная задача симплекс-методом. Теневая цена ограничения равна 0. Что это означает?\nA: Ограничение нарушено\nB: Ограничение не является активным: увеличение лимита не повысит цель\nC: Задача не имеет решения\nD: Решение найдено неверно\ncorrect: B\nexplanation: Нулевая теневая цена означает, что ограничение не сужает оптимум; ресурс использован не полностью.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 2\n\n```quiz\nquestion: В задаче выбора проектов жадное правило по индексу рентабельности дало NPV 44,5, а Solver с бинарными переменными – 47,1. Как объясняется разница?\nA: Solver ошибается из-за округления\nB: Бинарные переменные допускают доли проектов\nC: Жадное правило не учитывает остаток бюджета и не гарантирует оптимума\nD: Индекс рентабельности рассчитан неверно\ncorrect: C\nexplanation: Правило выбирает проекты по очереди и не анализирует сочетания; точное решение перебирает допустимые наборы и учитывает использование всего бюджета.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 3\n\n```quiz\nquestion: Какое значение целевой функции в задаче с долями проектов (0 ≤ x ≤ 1) по сравнению с бинарной задачей?\nA: Меньше или равно\nB: Больше или равно\nC: Всегда равно\nD: Не сравнивается\ncorrect: B\nexplanation: Допустимое множество релаксации шире, поэтому максимум не меньше. Значение релаксации служит верхней границей целочисленного оптимума.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 4\n\n```quiz\nquestion: Симуляция Monte Carlo построена на формулах с СЛЧИС(). Что нужно сделать, чтобы результаты можно было проверить и воспроизвести?\nA: Ничего: СЛЧИС() дает одинаковые числа\nB: Увеличить число формул СЛЧИС() в два раза\nC: Зафиксировать случайные числа значениями и указать число итераций\nD: Пересчитать книгу вручную через F9 до совпадения\ncorrect: C\nexplanation: СЛЧИС() меняется при каждом пересчете. Сохраненные значения U(0;1) делают результат воспроизводимым и проверяемым.\n```\n\n## Сквозные вопросы: вопрос 1\n\n```quiz\nquestion: Модель, построенная в Excel, выдает правдоподобные числа. Какое действие наиболее надежно подтверждает ее корректность?\nA: Оформление листов по единому стилю\nB: Контрольные значения, воспроизводимые независимым расчетом\nC: Защита листов паролем\nD: Отсутствие сообщений об ошибках\ncorrect: B\nexplanation: Правдоподобие и отсутствие ошибок не гарантируют верности. Независимый расчет контрольных значений выявляет молчаливые ошибки.\n```\n\n## Сквозные вопросы: вопрос 2\n\n```quiz\nquestion: Какой инструмент подходит для вопроса «при каком значении цены NPV станет равен нулю»?\nA: Монте-Карло с 1000 итераций\nB: Круговая диаграмма\nC: Поиск критического значения (подбор параметра)\nD: Сводная таблица\ncorrect: C\nexplanation: Критическое значение находится решением уравнения NPV(цена) = 0, например подбором параметра. Симуляция оценивает распределение, а не конкретную точку.\n```\n\n## Сквозные вопросы: вопрос 3\n\n```quiz\nquestion: Какой вопрос лучше всего решается оптимизацией, а не сценарным анализом?\nA: Какой будет NPV при падении цены на 10 %?\nB: Какие значения управляемых переменных дают максимальную цель при ограничениях?\nC: Как изменится прибыль при росте ставки?\nD: Какова вероятность убытка?\ncorrect: B\nexplanation: Оптимизация подбирает управляемые переменные при ограничениях. Остальные вопросы описывают последствия заданных значений или вероятность событий.\n```\n\n## Сквозные вопросы: вопрос 4\n\n```quiz\nquestion: Какой набор методов отвечает на вопрос «какова вероятность убытка проекта при заданных распределениях входов»?\nA: Монте-Карло с распределениями входов\nB: Анализ чувствительности по одному фактору\nC: Сценарии «базовый, оптимистичный, пессимистичный»\nD: Оптимизация Solver\ncorrect: A\nexplanation: Вероятность события определяется по распределению результата, которое дает симуляция. Чувствительность и сценарии вероятностей не оценивают.\n```\n"}, "exam": ""}};

function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function inlineMarkdown(text){
  const codes=[];
  let v=String(text??"").replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return `\u0000${codes.length-1}\u0000`;});
  v=escapeHtml(v);
  v=v.replace(/\[([^\]]+)\]\(((?:https?:|materials\/)[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  v=v.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  v=v.replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?!\w)/g,"$1<em>$2</em>");
  v=v.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${escapeHtml(codes[Number(i)])}</code>`);
  return v;
}
const PY_RE=/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|[fFrRbB]?"(?:\\.|[^"\\\n])*"|[fFrRbB]?'(?:\\.|[^'\\\n])*')|\b(def|return|if|elif|else|for|while|in|import|from|as|with|lambda|True|False|None|and|or|not|class|try|except|finally|pass|break|continue|is|raise|yield|del|global)\b|\b(print|len|range|sum|min|max|sorted|list|dict|set|tuple|int|float|str|bool|type|enumerate|zip|map|filter|round|abs|open|isinstance|display)\b(?=\()|\b(\d+(?:\.\d+)?(?:e-?\d+)?)\b/g;
function highlightPython(code){
  let out="",last=0,m;PY_RE.lastIndex=0;
  while((m=PY_RE.exec(code))){
    out+=escapeHtml(code.slice(last,m.index));
    const cls=m[1]?"c":m[2]?"s":m[3]?"k":m[4]?"b":"n";
    out+=`<span class="tok-${cls}">${escapeHtml(m[0])}</span>`;
    last=m.index+m[0].length;
  }
  return out+escapeHtml(code.slice(last));
}
let PARSE_LANG="ru";
function splitRow(line){return line.trim().replace(/\\\|/g,"\u0001").replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim().replace(/\u0001/g,"|"));}
function markdownToHtml(markdown){
  const lines=String(markdown||"").replace(/\r\n?/g,"\n").split("\n");
  const html=[];let paragraph=[],listType=null,listItems=[],inCode=false,codeLang="",codeLines=[];
  const flushP=()=>{if(paragraph.length){html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);paragraph=[];}};
  const flushL=()=>{if(listType&&listItems.length){html.push(`<${listType} class="rich-list">${listItems.map(i=>`<li>${inlineMarkdown(i)}</li>`).join("")}</${listType}>`);}listType=null;listItems=[];};
  const flushC=()=>{
    const raw=codeLines.join("\n");
    if(codeLang==="formula")html.push(`<div class="formula">${escapeHtml(raw).replace(/\n/g,"<br>")}</div>`);
    else{const body=(codeLang==="python"||codeLang==="py")?highlightPython(raw):escapeHtml(raw);
      html.push(`<div class="code-block"><button type="button" class="code-copy">${UI[PARSE_LANG].copy}</button><pre><code>${body}</code></pre></div>`);}
    inCode=false;codeLang="";codeLines=[];
  };
  for(let i=0;i<lines.length;i++){
    const raw=lines[i],tr=raw.trim();
    if(tr.startsWith("```")){if(inCode)flushC();else{flushP();flushL();inCode=true;codeLang=tr.slice(3).trim().split(/\s+/)[0].toLowerCase();}continue;}
    if(inCode){codeLines.push(raw);continue;}
    if(!tr){flushP();flushL();continue;}
    const alert=tr.match(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
    if(alert||tr.startsWith(">")){
      flushP();flushL();
      const body=[];
      if(alert){if(alert[2])body.push(alert[2]);}else body.push(tr.replace(/^>\s?/,""));
      while(i+1<lines.length&&lines[i+1].trim().startsWith(">")){i++;body.push(lines[i].trim().replace(/^>\s?/,""));}
      const kind=alert?alert[1].toUpperCase():"";
      const warn=["WARNING","CAUTION"].includes(kind);
      const label=alert?(warn?UI[PARSE_LANG].caution:UI[PARSE_LANG].attention):"";
      html.push(`<div class="callout${warn?" warning":""}">${label?`<strong>${label}</strong>`:""}<span>${inlineMarkdown(body.join(" "))}</span></div>`);
      continue;
    }
    if(tr.startsWith("|")&&i+1<lines.length&&/^\|?\s*:?-{2,}/.test(lines[i+1].trim())){
      flushP();flushL();
      const head=splitRow(tr);i++;const rows=[];
      while(i+1<lines.length&&lines[i+1].trim().startsWith("|")){i++;rows.push(splitRow(lines[i]));}
      html.push(`<div class="md-table-wrap"><table class="md-table"><thead><tr>${head.map(h=>`<th>${inlineMarkdown(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inlineMarkdown(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const ul=tr.match(/^[-*]\s+(.+)$/);
    if(ul){flushP();if(listType&&listType!=="ul")flushL();listType="ul";listItems.push(ul[1]);continue;}
    const ol=tr.match(/^\d+[.)]\s+(.+)$/);
    if(ol){flushP();if(listType&&listType!=="ol")flushL();listType="ol";listItems.push(ol[1]);continue;}
    const h3=tr.match(/^###\s+(.+)$/);
    if(h3){flushP();flushL();html.push(`<h3>${inlineMarkdown(h3[1])}</h3>`);continue;}
    if(listType&&/^\s{2,}\S/.test(raw)){listItems[listItems.length-1]+=" "+tr;continue;}
    paragraph.push(tr);
  }

}
function parseFrontmatter(md){
  const text=String(md||"").replace(/\r\n?/g,"\n");
  if(!text.startsWith("---\n"))return{meta:{},body:text};
  const end=text.indexOf("\n---",4);if(end<0)return{meta:{},body:text};
  const meta={};let listKey=null;
  for(const line of text.slice(4,end).split("\n")){
    const li=line.match(/^\s*-\s+(.+)$/);
    if(li&&listKey){let v=li[1].trim();if(/^".*"$/.test(v))v=v.slice(1,-1);meta[listKey].push(v);continue;}
    const m=line.match(/^([A-Za-z0-9_-]+):\s*(.*)$/);if(!m){listKey=null;continue;}
    let v=m[2].trim();
    if(v===""){meta[m[1]]=[];listKey=m[1];continue;}
    listKey=null;if(/^".*"$/.test(v))v=v.slice(1,-1);meta[m[1]]=v;
  }
  return{meta,body:text.slice(end+4).replace(/^\n+/,"")};
}
function parseQuiz(content){
  const re=/```quiz\s*\n([\s\S]*?)```/i,m=String(content||"").match(re);
  if(!m)return{body:content,quiz:null};
  const data={},opts={};
  for(const line of m[1].split("\n")){const x=line.match(/^\s*([^:]+):\s*(.*)$/);if(!x)continue;const k=x[1].trim();
    if(/^[ABCD]$/i.test(k))opts[k.toUpperCase()]=x[2].trim();else data[k.toLowerCase()]=x[2].trim();}
  const L=["A","B","C","D"],correct=L.indexOf(String(data.correct||"").trim().toUpperCase());
  const quiz=data.question&&L.every(l=>typeof opts[l]==="string")&&correct>=0?{question:data.question,options:L.map(l=>opts[l]),correct,explanation:data.explanation||""}:null;
  return{body:String(content).replace(re,"").trim(),quiz};
}
function splitSections(body){
  const lines=body.split("\n"),out=[];let h1="",title=null,buf=[];
  const push=()=>{const c=buf.join("\n").trim();if(title!==null||c)out.push({title:title||"",raw:c});buf=[];};
  let inCode=false;
  for(const line of lines){
    if(line.trim().startsWith("```"))inCode=!inCode;
    if(!inCode){
      const a=line.match(/^#\s+(.+)$/);if(a&&!h1){h1=a[1].trim();continue;}
      const b=line.match(/^##\s+(.+)$/);if(b){push();title=b[1].trim();continue;}
    }
    buf.push(line);
  }
  push();
  return{h1,sections:out.filter(s=>s.title)};
}
const PRACTICE_RE=/^(practice|практика)(?=[\s:·–-]|$)/i;
function parseLesson(md,id){
  const{meta,body}=parseFrontmatter(md),{h1,sections}=splitSections(body);
  const pIdx=sections.findIndex(s=>PRACTICE_RE.test(s.title));
  const content=sections.filter((_,i)=>i!==pIdx);
  const concepts=(meta.concepts||[]).map(x=>{const[term,def]=x.split("::").map(s=>s.trim());return{term,def:def||""};});
  const conceptRefs=concepts.map(c=>{
    const needle=c.term.toLocaleLowerCase();
    let s=content.findIndex(sec=>(sec.title+"\n"+sec.raw).toLocaleLowerCase().includes(needle));
    return{...c,section:s<0?0:s};
  });
  return{
    id,title:meta.title||h1,summary:meta.summary||"",source:meta.source||"",
    sections:content.map(s=>{const q=parseQuiz(s.raw);return{title:s.title,html:markdownToHtml(q.body),quiz:q.quiz};}),
    conceptRefs,
    practice:pIdx>=0?{title:sections[pIdx].title,html:markdownToHtml(sections[pIdx].raw)}:null
  };
}
function parseExam(md){
  const{meta,body}=parseFrontmatter(md);const blocks=[];let cur=null,q=null,inCode=false;
  for(const line of body.split("\n")){
    if(line.trim().startsWith("```"))inCode=!inCode;
    const b=!inCode&&line.match(/^##\s+(.+)$/),h=!inCode&&line.match(/^###\s+(.+)$/);
    if(b){cur={title:b[1].trim(),items:[]};blocks.push(cur);q=null;continue;}
    if(h&&cur){q={q:h[1].trim(),raw:[]};cur.items.push(q);continue;}
    if(q)q.raw.push(line);
  }
  blocks.forEach(bl=>bl.items.forEach(it=>{it.html=markdownToHtml(it.raw.join("\n"));delete it.raw;}));
  return{title:meta.title||"",summary:meta.summary||"",blocks};
}
function buildCourse(l){

  return{title:src.title,overview:markdownToHtml(src.overview),parts,tests,exam:parseExam(src.exam)};
}

const C=()=>COURSES[lang];

/* ---------- State ---------- */
let profile=null,activeLessonId=STRUCT.parts[0].lessons[0],activeTestId=null,currentMode="overview",examFilter="all";

function allLessons(){return C().parts.flatMap(p=>p.lessons.map(l=>({...l,part:p.part,partTitle:p.title})));}
function allLessonIds(){return STRUCT.parts.flatMap(p=>p.lessons);}
function allTests(){return C().parts.filter(p=>p.afterTest).map(p=>({...p.afterTest,afterPart:p.part}));}
function currentLesson(){return allLessons().find(x=>x.id===activeLessonId)||allLessons()[0];}
function currentQuizPage(){return currentMode==="test"?C().tests[activeTestId]:currentLesson();}
function nowIso(){return new Date().toISOString();}
function iconSvg(name){
  const icons={
    file:'<svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg>',
    quiz:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9.4a2.6 2.6 0 1 1 4.2 2c-1 .7-1.9 1.1-1.9 2.4"/><path d="M12 17h.01"/></svg>',
    homework:'<svg viewBox="0 0 24 24"><path d="M8 5h8"/><path d="M9 3h6v4H9z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M8 11h8M8 15h6"/></svg>'
  };
  return `<span class="ui-icon">${icons[name]||""}</span>`;
}
function lsGet(k){try{return localStorage.getItem(k);}catch{return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}

function loadState(){
  let p=null;try{p=JSON.parse(lsGet(STATE_KEY)||"null");}catch{}
  const ids=allLessonIds();
  p=p&&typeof p==="object"?p:{};
  p.settings=p.settings||{theme:"light"};
  p.lastOpenedLesson=ids.includes(p.lastOpenedLesson)?p.lastOpenedLesson:ids[0];
  p.completedLessons=Array.isArray(p.completedLessons)?p.completedLessons.filter(id=>ids.includes(id)):[];
  p.quizResults=p.quizResults&&typeof p.quizResults==="object"?p.quizResults:{};
  p.examKnown=p.examKnown&&typeof p.examKnown==="object"?p.examKnown:{};
  return p;
}
function saveState(){lsSet(STATE_KEY,JSON.stringify(profile));}

/* ---------- Theme & language ---------- */
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  profile.settings.theme=theme;saveState();
  document.getElementById("themeLabel").textContent=theme==="dark"?t("themeLight"):t("themeDark");
  document.getElementById("themeIcon").textContent=theme==="dark"?"☀":"◐";
}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");}
function applyStaticI18n(){
  document.documentElement.lang=t("htmlLang");
  document.title=`${C().title} – ${t("brandSubtitle")}`;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b.dataset.lang===lang));
  document.getElementById("themeLabel").textContent=document.documentElement.dataset.theme==="dark"?t("themeLight"):t("themeDark");
  document.getElementById("programStats").textContent=`${allLessons().length} ${t("modules")} · ${allTests().length} ${t("tests")}`;
}
function setLang(l){
  lang=l==="en"?"en":"ru";lsSet(LANG_KEY,lang);
  const y=window.scrollY;renderAll();window.scrollTo({top:y});
}

/* ---------- Learned ---------- */
function isLearned(id){return profile.completedLessons.includes(id);}
function toggleLearned(){
  if(isLearned(activeLessonId))profile.completedLessons=profile.completedLessons.filter(x=>x!==activeLessonId);
  else profile.completedLessons.push(activeLessonId);
  saveState();renderProgram();
  const b=document.getElementById("toggleLearnedBottom"),d=isLearned(activeLessonId);
  b.textContent=d?t("learned"):t("markLearned");b.classList.toggle("done",d);
}

/* ---------- Program ---------- */
function testButton(test,ctx="sidebar"){
  if(!test)return"";
  const active=currentMode==="test"&&activeTestId===test.id;
  return `<button type="button" class="schedule-test ${ctx==="overview"?"schedule-test-overview":""} ${active?"active":""}" data-course-test="${escapeHtml(test.id)}"><span class="schedule-test-icon">${iconSvg("quiz")}</span><span>${escapeHtml(test.title)}</span></button>`;
}
function bindTests(){document.querySelectorAll("[data-course-test]").forEach(b=>b.addEventListener("click",()=>openTest(b.dataset.courseTest)));}
function renderProgram(){
  const nav=document.getElementById("programNav");
  nav.innerHTML=C().parts.map(p=>`<section class="day-block"><div class="day-head"><span class="day-num">${t("part")} ${p.part}</span></div><span class="day-title">${escapeHtml(p.title)}</span>
    ${p.lessons.map(l=>`<button type="button" class="lesson-link ${l.id===activeLessonId&&currentMode==="lesson"?"active":""}" data-lesson="${l.id}"><span class="lesson-code">${l.id}</span><span class="lesson-link-copy">${escapeHtml(l.title)}</span><span class="lesson-done">${isLearned(l.id)?"✓":""}</span></button>`).join("")}
    ${testButton(p.afterTest)}</section>`).join("");
  nav.querySelectorAll("[data-lesson]").forEach(b=>b.addEventListener("click",()=>openLesson(b.dataset.lesson)));
  bindTests();
}

/* ---------- Quizzes ---------- */
function pageKey(){return currentMode==="test"?`test-${activeTestId}`:activeLessonId;}
function quizResult(key,qid){return profile.quizResults[key]?.[qid]||{attempts:0,passed:false,retry:false};}
function setQuizResult(key,qid,v){profile.quizResults[key]=profile.quizResults[key]||{};profile.quizResults[key][qid]=v;saveState();}
function quizStats(page,key){
  const qs=(page.sections||[]).map((s,i)=>s.quiz?i:null).filter(x=>x!==null);
  return{total:qs.length,passed:qs.filter(i=>quizResult(key,`section-${i+1}`).passed).length};
}
function quizSummaryHtml(page,key){
  const s=quizStats(page,key);if(!s.total)return"";
  return `<div class="quiz-summary ${s.passed===s.total?"complete":""}"><div class="quiz-summary-main"><div class="quiz-summary-title">${iconSvg("quiz")}<span>${t("selfCheck")}</span></div><strong>${s.passed} ${t("of")} ${s.total}</strong></div><div class="quiz-dots">${Array.from({length:s.total},(_,i)=>`<i class="${i<s.passed?"done":""}"></i>`).join("")}</div></div>`;
}
function quizHtml(quiz,index){
  if(!quiz)return"";
  const r=quizResult(pageKey(),`section-${index+1}`),q=inlineMarkdown(quiz.question);
  if(r.passed)return `<div class="inline-quiz quiz-passed" data-quiz="${index}"><div class="quiz-kicker">${iconSvg("quiz")}<span>${t("selfCheck")} · ${t("passed")}</span></div><div class="quiz-question">${q}</div><div class="quiz-success"><b>${t("correct")}: ${inlineMarkdown(quiz.options[quiz.correct])}</b><span>${inlineMarkdown(quiz.explanation)}</span><small>${t("attempts")}${r.attempts}</small></div></div>`;
  if(r.retry)return `<div class="inline-quiz quiz-retry" data-quiz="${index}"><div class="quiz-kicker">${iconSvg("quiz")}<span>${t("selfCheck")}</span></div><div class="quiz-question">${q}</div><div class="quiz-error"><b>${t("wrong")}</b><span>${t("wrongHint")}</span></div><button class="quiz-retry-btn" data-retry="${index}" type="button">${t("retry")}</button><div class="quiz-attempts">${t("attempts")}${r.attempts}</div></div>`;
  return `<div class="inline-quiz" data-quiz="${index}"><div class="quiz-kicker">${iconSvg("quiz")}<span>${t("selfCheck")}</span></div><div class="quiz-question">${q}</div><div class="quiz-options">${quiz.options.map((o,i)=>`<button type="button" class="quiz-option" data-value="${i}"><span>${String.fromCharCode(65+i)}</span><div>${inlineMarkdown(o)}</div></button>`).join("")}</div>${r.attempts?`<div class="quiz-attempts">${t("attempts")}${r.attempts}</div>`:""}</div>`;
}
function rerenderQuizPage(){const y=window.scrollY;if(currentMode==="test")renderTestPage();else renderReader();window.scrollTo({top:y});}
function answerQuiz(i,value){
  const page=currentQuizPage(),quiz=page.sections[i].quiz,key=pageKey(),qid=`section-${i+1}`,old=quizResult(key,qid),ok=Number(value)===quiz.correct;
  setQuizResult(key,qid,{attempts:(old.attempts||0)+1,passed:ok,retry:!ok,lastAttemptAt:nowIso()});rerenderQuizPage();
}
function retryQuiz(i){const key=pageKey(),qid=`section-${i+1}`;setQuizResult(key,qid,{...quizResult(key,qid),retry:false});rerenderQuizPage();}

/* ---------- Reader ---------- */
function conceptHtml(l){
  if(!l.conceptRefs?.length)return"";
  return `<div class="concept-strip"><span class="concept-strip-label">${t("keyConcepts")}</span><div class="concept-chips">${l.conceptRefs.map(x=>`<button type="button" data-local-section="${x.section}" title="${escapeHtml(x.def)}">${escapeHtml(x.term)}</button>`).join("")}</div></div>`;
}
function sourceHtml(l){
  if(!l.source)return"";
  return `<div class="source-card"><span class="material-kicker">${iconSvg("file")}<span>${t("sources")}</span></span>${String(l.source).split(/\s*;\s*/).filter(Boolean).map(f=>`<a class="source-link" href="${escapeHtml(f)}" target="_blank" rel="noopener" download>${escapeHtml(f)}</a>`).join("")}</div>`;
}
function practiceHtml(l){
  if(!l.practice)return"";
  return `<section class="final-assignment" data-practice="1"><div class="assignment-label">${iconSvg("homework")}<span>${t("practice")}</span></div><h2>${escapeHtml((t=>t?t[0].toLocaleUpperCase()+t.slice(1):"")(l.practice.title.replace(PRACTICE_RE,"").replace(/^[\s:·–-]+/,""))||t("practiceTitle"))}</h2><div class="assignment-content">${l.practice.html}</div></section>`;
}
function pagerHtml(l){
  const arr=allLessons(),i=arr.findIndex(x=>x.id===l.id),p=arr[i-1],n=arr[i+1];
  return `<nav class="lesson-pager">${p?`<button class="pager-btn" data-go="${p.id}"><span>${t("prev")}</span><b>${escapeHtml(p.id+" · "+p.title)}</b></button>`:"<span></span>"}${n?`<button class="pager-btn right" data-go="${n.id}"><span>${t("next")}</span><b>${escapeHtml(n.id+" · "+n.title)}</b></button>`:""}</nav>`;
}
function sectionsHtml(page,prefix){
  return (page.sections||[]).map((s,i)=>`<section class="article-section" id="${prefix}-${i}" data-section-index="${i}"><h2>${inlineMarkdown(s.title)}</h2>${s.html}${quizHtml(s.quiz,i)}</section>`).join("");
}
function renderReader(){
  const l=currentLesson();
  document.getElementById("reader").innerHTML=`<article class="article"><div class="article-kicker"><span>${t("part")} ${l.part}</span><span class="dot"></span><span>${t("module")} ${escapeHtml(l.id)}</span></div><h1>${escapeHtml(l.title)}</h1>${l.summary?`<p class="article-lead">${inlineMarkdown(l.summary)}</p>`:""}${conceptHtml(l)}${quizSummaryHtml(l,l.id)}${sourceHtml(l)}${sectionsHtml(l,`sec-${l.id}`)}${practiceHtml(l)}<div class="lesson-finish"><button class="learned-btn large ${isLearned(l.id)?"done":""}" id="toggleLearnedBottom" type="button">${isLearned(l.id)?t("learned"):t("markLearned")}</button></div>${pagerHtml(l)}</article>`;
  bindReaderEvents();
}
function bindReaderEvents(){
  document.querySelectorAll(".inline-quiz .quiz-option").forEach(b=>b.addEventListener("click",()=>answerQuiz(Number(b.closest(".inline-quiz").dataset.quiz),b.dataset.value)));
  document.querySelectorAll("[data-retry]").forEach(b=>b.addEventListener("click",()=>retryQuiz(Number(b.dataset.retry))));
  document.getElementById("toggleLearnedBottom")?.addEventListener("click",toggleLearned);
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>openLesson(b.dataset.go)));
  document.querySelectorAll("[data-local-section]").forEach(b=>b.addEventListener("click",()=>scrollToSection(activeLessonId,Number(b.dataset.localSection))));
  document.querySelectorAll(".code-copy").forEach(b=>b.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText(b.nextElementSibling.textContent);const old=b.textContent;b.textContent=t("copied");setTimeout(()=>{b.textContent=old;},1200);}catch{}
  }));
}
function openLesson(id){activeTestId=null;activeLessonId=id;profile.lastOpenedLesson=id;currentMode="lesson";saveState();renderAll();window.scrollTo({top:0});}
function scrollToSection(lessonId,idx){
  const go=()=>requestAnimationFrame(()=>{const el=document.getElementById(`sec-${lessonId}-${idx}`);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.classList.add("section-highlight");setTimeout(()=>el.classList.remove("section-highlight"),1800);}});
  if(activeLessonId!==lessonId||currentMode!=="lesson"){activeLessonId=lessonId;profile.lastOpenedLesson=lessonId;currentMode="lesson";saveState();renderAll();}
  go();
}
function openTest(id){activeTestId=id;currentMode="test";renderAll();window.scrollTo({top:0});}
function renderTestPage(){
  const page=C().tests[activeTestId],meta=allTests().find(x=>x.id===activeTestId);
  document.getElementById("reader").innerHTML=`<article class="article test-article"><div class="article-kicker"><span>${t("testKicker")}</span>${meta?`<span class="dot"></span><span>${t("afterPart")} ${meta.afterPart}</span>`:""}</div><h1>${escapeHtml(page.title)}</h1>${page.summary?`<p class="article-lead">${inlineMarkdown(page.summary)}</p>`:""}${quizSummaryHtml(page,`test-${activeTestId}`)}${sectionsHtml(page,`test-sec-${activeTestId}`)}</article>`;
  bindReaderEvents();
}
function renderOverview(){
  const c=C();
  document.getElementById("reader").innerHTML=`<article class="article overview-article"><div class="article-kicker"><span>${t("overviewKicker")}</span></div><h1>${escapeHtml(c.title)}</h1><div class="overview-body">${c.overview}</div><section class="article-section"><h2>${t("program")}</h2><div class="course-map">${c.parts.map(p=>`<div class="course-map-row"><b>${t("part")} ${p.part}</b><span>${escapeHtml(p.title)}</span><div>${p.lessons.map(l=>`<button data-static-go="${l.id}">${isLearned(l.id)?"✓ ":""}${escapeHtml(l.id+" · "+l.title)}</button>`).join("")}${testButton(p.afterTest,"overview")}</div></div>`).join("")}</div></section></article>`;
  document.querySelectorAll("[data-static-go]").forEach(b=>b.addEventListener("click",()=>openLesson(b.dataset.staticGo)));
  bindTests();
}
function renderGlossary(filter=""){
  const f=filter.trim().toLocaleLowerCase();
  const groups=allLessons().map(l=>({l,items:l.conceptRefs.filter(x=>!f||(x.term+" "+x.def).toLocaleLowerCase().includes(f))})).filter(g=>g.items.length);
  const reader=document.getElementById("reader");
  const listHtml=groups.map(g=>`<section class="glossary-lesson-group"><div class="glossary-lesson-head"><span>${t("module")} ${escapeHtml(g.l.id)}</span><h2>${escapeHtml(g.l.title)}</h2></div><div class="glossary-grid">${g.items.map(x=>`<button class="glossary-card" data-section-lesson="${g.l.id}" data-section-index="${x.section}"><b>${escapeHtml(x.term)}</b><span class="glossary-def">${inlineMarkdown(x.def)}</span><small>${escapeHtml(g.l.sections[x.section]?.title||g.l.title)}</small></button>`).join("")}</div></section>`).join("");
  if(!reader.querySelector("#glossarySearch")){
    reader.innerHTML=`<article class="article overview-article"><div class="article-kicker"><span>${t("glossaryKicker")}</span></div><h1>${t("glossaryTitle")}</h1><p class="article-lead">${t("glossaryLead")}</p><input class="glossary-search" id="glossarySearch" type="search" placeholder="${t("glossarySearch")}"><div class="glossary-lessons" id="glossaryList"></div></article>`;
    reader.querySelector("#glossarySearch").addEventListener("input",e=>renderGlossary(e.target.value));
  }
  reader.querySelector("#glossaryList").innerHTML=listHtml;
  reader.querySelectorAll("[data-section-lesson]").forEach(b=>b.addEventListener("click",()=>scrollToSection(b.dataset.sectionLesson,Number(b.dataset.sectionIndex))));
}
function renderExam(){
  const ex=C().exam;let n=0;
  const total=ex.blocks.reduce((s,b)=>s+b.items.length,0),known=ex.blocks.reduce((s,b,bi)=>s+b.items.filter((_,qi)=>profile.examKnown[`${bi}-${qi}`]).length,0);
  const body=ex.blocks.map((b,bi)=>{
    const items=b.items.map((it,qi)=>{n++;const id=`${bi}-${qi}`,k=!!profile.examKnown[id];
      if(examFilter==="unknown"&&k)return"";
      return `<details class="exam-q ${k?"known":""}" data-exam="${id}"><summary><span class="exam-num">${n}</span><span>${inlineMarkdown(it.q)}</span><button type="button" class="exam-known" data-known="${id}">${k?t("examKnownDone"):t("examKnown")}</button></summary><div class="exam-answer">${it.html}</div></details>`;}).join("");
    return items?`<h2 class="exam-block-title">${escapeHtml(b.title)}</h2>${items}`:"";
  }).join("");
  document.getElementById("reader").innerHTML=`<article class="article overview-article"><div class="article-kicker"><span>${t("examKicker")}</span></div><h1>${escapeHtml(ex.title||t("examTitle"))}</h1><p class="article-lead">${inlineMarkdown(ex.summary||t("examLead"))}</p><div class="exam-progress"><strong>${t("examProgress")}: ${known} ${t("of")} ${total}</strong><div class="track"><div class="bar" style="width:${total?known/total*100:0}%"></div></div></div><div class="exam-tools"><button type="button" data-filter="all" class="${examFilter==="all"?"active":""}">${t("all")}</button><button type="button" data-filter="unknown" class="${examFilter==="unknown"?"active":""}">${t("unknown")}</button><button type="button" data-expand="1">${t("expandAll")}</button><button type="button" data-expand="0">${t("collapseAll")}</button></div>${body}</article>`;
  const r=document.getElementById("reader");
  r.querySelectorAll("[data-known]").forEach(b=>b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();const id=b.dataset.known;
    profile.examKnown[id]=!profile.examKnown[id];if(!profile.examKnown[id])delete profile.examKnown[id];saveState();
    const open=[...r.querySelectorAll("details[open]")].map(d=>d.dataset.exam),y=window.scrollY;renderExam();
    open.forEach(o=>r.querySelector(`details[data-exam="${o}"]`)?.setAttribute("open",""));window.scrollTo({top:y});}));
  r.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{examFilter=b.dataset.filter;renderExam();}));
  r.querySelectorAll("[data-expand]").forEach(b=>b.addEventListener("click",()=>r.querySelectorAll("details.exam-q").forEach(d=>d.open=b.dataset.expand==="1")));
}

/* ---------- Render ---------- */
function renderAll(){
  applyStaticI18n();renderProgram();
  if(currentMode==="lesson")renderReader();
  else if(currentMode==="test")renderTestPage();
  else if(currentMode==="glossary"){document.getElementById("reader").innerHTML="";renderGlossary();}
  else if(currentMode==="exam")renderExam();
  else renderOverview();
}
function goMode(m){activeTestId=null;currentMode=m;renderAll();window.scrollTo({top:0});}

/* ---------- Events ---------- */
document.getElementById("themeToggle").addEventListener("click",toggleTheme);
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.getElementById("showOverview").addEventListener("click",()=>goMode("overview"));
document.getElementById("showGlossary").addEventListener("click",()=>goMode("glossary"));
document.getElementById("showExam").addEventListener("click",()=>goMode("exam"));

profile=loadState();
activeLessonId=profile.lastOpenedLesson;
applyTheme(profile.settings.theme==="dark"?"dark":"light");
renderAll();
})();

</script>
</body>
</html>
