<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Инструменты для анализа финансовых данных I</title>
  <style>
:root{
  --bg:#f4f6f9;
  --panel:#ffffff;
  --panel-soft:#f7f8fb;
  --panel-hover:#f0f2f7;
  --text:#171a22;
  --muted:#717784;
  --faint:#a3a8b2;
  --line:#e3e6ec;
  --line-strong:#d3d7df;
  --accent:#6c5ce7;
  --accent-2:#536dfe;
  --accent-soft:#efedff;
  --accent-text:#4938ba;
  --code:#121620;
  --code-text:#edf0f7;
  --warning:#fff7e6;
  --warning-line:#e5a43b;
  --danger:#cf4a54;
  --shadow:0 10px 32px rgba(30,38,55,.055);
  --shadow-lg:0 16px 48px rgba(30,38,55,.075);
}

html[data-theme="dark"]{
  --bg:#0c0f14;
  --panel:#12161d;
  --panel-soft:#171c24;
  --panel-hover:#1d2330;
  --text:#eef1f6;
  --muted:#9aa2af;
  --faint:#697281;
  --line:#262d38;
  --line-strong:#343d4b;
  --accent:#a692ff;
  --accent-2:#8196ff;
  --accent-soft:#26223d;
  --accent-text:#c7bbff;
  --code:#090c11;
  --code-text:#f2f4f8;
  --warning:#2a2114;
  --warning-line:#d79b3b;
  --danger:#ff7c85;
  --shadow:none;
  --shadow-lg:none;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-width:320px;
  background:
    radial-gradient(circle at 15% 0%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 24rem),
    var(--bg);
  color:var(--text);
  font:14px/1.65 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  transition:background .18s ease,color .18s ease;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}

.app{
  width:min(1780px,100%);
  margin:0 auto;
  padding:14px;
}

.topbar{
  height:62px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  position:sticky;
  top:10px;
  z-index:30;
  backdrop-filter:blur(20px);
}

.brand{
  min-width:0;
  display:flex;
  align-items:center;
  gap:11px;
}
.brand-icon{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  color:#fff;
  font-size:13px;
  font-weight:800;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 24%,transparent);
}
.brand-title{
  font-size:13px;
  font-weight:760;
  line-height:1.2;
  white-space:nowrap;
}
.brand-subtitle{
  color:var(--muted);
  font-size:11px;
  line-height:1.3;
  margin-top:2px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.theme-switch,
.export-btn{
  min-height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel-soft);
  color:var(--text);
  padding:7px 10px;
  display:flex;
  align-items:center;
  gap:7px;
  transition:.15s ease;
}
.theme-switch:hover,
.export-btn:hover{
  border-color:var(--line-strong);
  background:var(--panel-hover);
}
.export-btn{
  background:var(--text);
  color:var(--panel);
  border-color:var(--text);
  padding-inline:12px;
}
.export-btn b{
  font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  opacity:.66;
}

.workspace{
  display:grid;
  grid-template-columns:278px minmax(0,1fr) 310px;
  gap:12px;
  align-items:start;
  padding-top:12px;
}

.program,
.reader,
.notes-panel{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:18px;
  box-shadow:var(--shadow);
}

.program{
  position:sticky;
  top:84px;
  max-height:calc(100vh - 96px);
  overflow:auto;
  padding:17px 11px 20px;
}
.program::-webkit-scrollbar,
.notes-list::-webkit-scrollbar{width:5px}
.program::-webkit-scrollbar-thumb,
.notes-list::-webkit-scrollbar-thumb{
  background:var(--line-strong);
  border-radius:999px;
}

.panel-title{
  padding:2px 8px 15px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
}
.panel-title>span{
  font-size:12px;
  font-weight:760;
}
.panel-title small{
  font-size:10px;
  font-weight:500;
  color:var(--faint);
  white-space:nowrap;
}

.day-block{
  padding:11px 0 12px;
  border-top:1px solid var(--line);
}
.day-head{
  padding:0 8px 7px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.day-date{
  color:var(--accent-text);
  font:760 10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:.03em;
}
.day-num{
  color:var(--faint);
  font-size:9px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.09em;
}

.lesson-link{
  width:100%;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  padding:8px 9px;
  display:grid;
  grid-template-columns:28px 1fr;
  gap:5px;
  text-align:left;
  line-height:1.34;
  font-size:12px;
  transition:.14s ease;
}
.lesson-link:hover{
  color:var(--text);
  background:var(--panel-soft);
}
.lesson-link.active{
  color:var(--text);
  background:var(--accent-soft);
  box-shadow:inset 3px 0 0 var(--accent);
}
.lesson-code{
  color:var(--faint);
  font:700 9px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.lesson-link.active .lesson-code{color:var(--accent-text)}

.reader{
  min-width:0;
  min-height:calc(100vh - 96px);
  padding:0;
  overflow:hidden;
}

.article{
  width:min(900px,100%);
  margin:0 auto;
  padding:48px 58px 88px;
}
.article-kicker{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:13px;
  color:var(--muted);
  font-size:10px;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.article-kicker .dot{
  width:3px;
  height:3px;
  background:var(--line-strong);
  border-radius:50%;
}
.article h1{
  margin:0;
  max-width:800px;
  font-size:clamp(29px,3.1vw,43px);
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:770;
}
.article-lead{
  max-width:750px;
  margin:16px 0 26px;
  color:var(--muted);
  font-size:15px;
  line-height:1.68;
}
.material-link{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin:0 0 35px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel-soft);
  color:var(--text);
  text-decoration:none;
  font-size:11px;
  font-weight:720;
  transition:.15s ease;
}
.material-link:hover{
  border-color:var(--line-strong);
  background:var(--panel-hover);
}

.article-section{
  position:relative;
  padding:27px 0 22px;
  border-top:1px solid var(--line);
}
.article-section h2{
  margin:0 0 13px;
  padding-left:15px;
  position:relative;
  font-size:19px;
  line-height:1.28;
  letter-spacing:-.015em;
  font-weight:740;
}
.article-section h2::before{
  content:"";
  position:absolute;
  left:0;
  top:.22em;
  width:4px;
  height:1.05em;
  border-radius:999px;
  background:linear-gradient(var(--accent),var(--accent-2));
}
.article-section p{
  max-width:790px;
  margin:0 0 13px;
  color:color-mix(in srgb,var(--text) 92%,var(--muted));
}
.article-section strong,
.article-section b{font-weight:720}

.callout{
  margin:18px 0;
  padding:14px 15px 14px 45px;
  position:relative;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-soft);
}
.callout::before{
  content:"i";
  position:absolute;
  left:14px;
  top:14px;
  width:20px;
  height:20px;
  display:grid;
  place-items:center;
  border-radius:6px;
  background:var(--accent-soft);
  color:var(--accent-text);
  font-size:11px;
  font-weight:800;
}
.callout strong{
  display:block;
  margin-bottom:2px;
}
.callout span{
  color:var(--muted);
}
.callout.warning{
  background:var(--warning);
  border-color:color-mix(in srgb,var(--warning-line) 38%,var(--line));
}
.callout.warning::before{
  content:"!";
  background:color-mix(in srgb,var(--warning-line) 16%,transparent);
  color:var(--warning-line);
}

.concept-grid{
  margin:18px 0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.concept-grid>div{
  min-height:102px;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-soft);
}
.concept-grid b{
  display:block;
  margin-bottom:5px;
  font-size:12px;
}
.concept-grid span{
  display:block;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}

.formula{
  margin:17px 0;
  padding:14px 16px 14px 19px;
  border-radius:11px;
  overflow:auto;
  border:1px solid color-mix(in srgb,var(--accent) 22%,#2a3140);
  border-left:3px solid var(--accent);
  background:var(--code);
  color:var(--code-text);
  font:12px/1.7 "Cascadia Code",Consolas,ui-monospace,SFMono-Regular,monospace;
}

.future-box{
  margin-top:28px;
  padding:15px;
  border:1px dashed var(--line-strong);
  border-radius:12px;
  color:var(--muted);
  background:var(--panel-soft);
  font-size:12px;
}

.notes-panel{
  position:sticky;
  top:84px;
  height:calc(100vh - 96px);
  min-width:0;
  padding:17px;
  display:flex;
  flex-direction:column;
}
.notes-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}
.panel-label{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.notes-lesson{
  margin-top:4px;
  max-width:210px;
  font-size:12px;
  font-weight:750;
  line-height:1.35;
}
.add-note{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border:0;
  border-radius:10px;
  color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  font-size:19px;
  box-shadow:0 7px 17px color-mix(in srgb,var(--accent) 22%,transparent);
}
.add-note:hover{filter:brightness(1.04)}

.notes-hint{
  margin:10px 0 13px;
  color:var(--faint);
  font-size:10.5px;
  line-height:1.45;
}
.notes-list{
  min-height:0;
  flex:1;
  overflow:auto;
  padding-right:3px;
}
.note-card{
  margin-bottom:9px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel-soft);
}
.note-toolbar{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:7px;
}
.note-title{
  min-width:0;
  flex:1;
  border:0;
  outline:none;
  padding:0;
  background:transparent;
  color:var(--text);
  font-size:11px;
  font-weight:750;
}
.note-title::placeholder{color:var(--faint)}
.note-delete{
  border:0;
  background:transparent;
  color:var(--faint);
  padding:2px 3px;
  border-radius:5px;
  font-size:10px;
}
.note-delete:hover{
  color:var(--danger);
  background:var(--panel-hover);
}
.note-text{
  width:100%;
  min-height:115px;
  resize:vertical;
  border:1px solid transparent;
  border-radius:9px;
  outline:none;
  padding:9px 10px;
  background:var(--panel);
  color:var(--text);
  line-height:1.55;
  font-size:11.5px;
}
.note-text:focus{
  border-color:color-mix(in srgb,var(--accent) 52%,var(--line));
  box-shadow:0 0 0 3px var(--accent-soft);
}
.notes-empty{
  display:none;
  padding:12px 0;
  color:var(--faint);
  font-size:11px;
}
.notes-empty.visible{display:block}
.notes-export{
  width:100%;
  margin-top:10px;
  min-height:36px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
  color:var(--text);
  font-size:11px;
  font-weight:700;
}
.notes-export:hover{
  border-color:var(--line-strong);
  background:var(--panel-hover);
}

@media(max-width:1220px){
  .workspace{grid-template-columns:250px minmax(0,1fr)}
  .notes-panel{
    grid-column:1/-1;
    position:static;
    height:auto;
    min-height:250px;
  }
  .notes-list{overflow:visible}
}
@media(max-width:820px){
  .app{padding:8px}
  .topbar{
    position:static;
    height:auto;
    padding:11px;
    align-items:flex-start;
  }
  .brand-title{white-space:normal}
  .brand-subtitle{display:none}
  .theme-switch span:last-child{display:none}
  .workspace{grid-template-columns:1fr}
  .program{
    position:static;
    max-height:none;
  }
  .reader{min-height:0}
  .article{padding:34px 20px 65px}
  .article h1{font-size:31px}
  .concept-grid{grid-template-columns:1fr}
  .notes-panel{position:static;height:auto}
}


.rich-list{margin:14px 0 18px;padding-left:21px}
.rich-list li{margin:7px 0;color:color-mix(in srgb,var(--text) 90%,var(--muted))}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:18px 0}
.compare>div{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel-soft)}
.compare span{display:block;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.compare code{display:block;font:11px/1.55 "Cascadia Code",Consolas,monospace;overflow-wrap:anywhere}
.compare small{display:block;color:var(--muted);margin-top:7px;line-height:1.5}
.tool-table{display:grid;gap:7px;margin:17px 0}
.tool-table>div{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tool-table b{font-size:12px}.tool-table span{color:var(--muted);font-size:12px}

.inline-quiz{margin:24px 0 8px;padding:16px;border:1px solid color-mix(in srgb,var(--accent) 23%,var(--line));border-radius:13px;background:color-mix(in srgb,var(--accent-soft) 46%,var(--panel))}
.quiz-kicker{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--accent-text);margin-bottom:6px}
.quiz-question{font-weight:720;font-size:13px;margin-bottom:11px}
.quiz-options{display:grid;gap:6px}
.quiz-option{width:100%;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);padding:8px 10px;font-size:11.5px}
.quiz-option>span{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;background:var(--panel-soft);font:700 9px/1 ui-monospace,monospace;color:var(--muted)}
.quiz-option:hover{border-color:var(--line-strong);background:var(--panel-hover)}
.quiz-option.correct{border-color:#55a878;background:color-mix(in srgb,#55a878 10%,var(--panel))}
.quiz-option.wrong{border-color:#d56b72;background:color-mix(in srgb,#d56b72 9%,var(--panel))}
.quiz-feedback{min-height:18px;margin-top:9px;color:var(--muted);font-size:11px}
.quiz-feedback strong{color:var(--text)}

.final-assignment{margin:42px 0 10px;padding:24px;border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:16px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent-soft) 60%,var(--panel)),var(--panel))}
.assignment-label{display:inline-block;font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-text);margin-bottom:6px}
.final-assignment h2{font-size:23px;margin:0 0 9px;letter-spacing:-.02em}
.final-assignment h3{font-size:12px;margin:21px 0 7px}
.assignment-note{color:var(--muted);font-size:12px}
.assignment-list{margin:0;padding-left:22px}
.assignment-list li{margin:7px 0;font-size:12px}
.assignment-list.optional li{color:var(--muted)}
.acceptance{margin-top:20px;padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.acceptance>strong{display:block;font-size:11px;margin-bottom:7px}
.acceptance .assignment-list{margin-bottom:0}

.material-link{border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));color:var(--accent-text);background:var(--accent-soft)}
.material-link:hover{background:color-mix(in srgb,var(--accent-soft) 76%,var(--panel))}


@media(max-width:820px){
  .compare{grid-template-columns:1fr}
  .tool-table>div{grid-template-columns:1fr;gap:3px}
}


.compact-action{
  font-size:10px;
  padding-inline:9px;
}

.lesson-progress{
  margin:13px 0 4px;
  padding:10px 0 11px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.lesson-progress-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:10px;
  margin-bottom:7px;
}
.lesson-progress-head strong{
  color:var(--text);
  font-size:10px;
}
.lesson-progress-track{
  height:5px;
  overflow:hidden;
  border-radius:999px;
  background:var(--panel-hover);
}
.lesson-progress-bar{
  width:0;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  transition:width .18s ease;
}

.material-card{
  margin:0 0 34px;
  padding:13px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));
  border-radius:12px;
  background:color-mix(in srgb,var(--accent-soft) 42%,var(--panel));
}
.material-copy{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.material-kicker{
  color:var(--accent-text);
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.material-copy strong{
  font-size:12px;
}
.material-copy small{
  color:var(--muted);
  font-size:10px;
  overflow-wrap:anywhere;
}
.material-copy code{
  font-family:"Cascadia Code",Consolas,monospace;
}
.material-actions{
  display:flex;
  gap:7px;
  flex:0 0 auto;
}
.material-card .material-link{
  margin:0;
}
.material-secondary{
  min-height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel);
  color:var(--muted);
  padding:7px 10px;
  font-size:10px;
  font-weight:700;
}
.material-secondary:hover{
  color:var(--text);
  border-color:var(--line-strong);
  background:var(--panel-hover);
}

@media(max-width:820px){
  .compact-action{display:none}
  .material-card{
    align-items:flex-start;
    flex-direction:column;
  }
  .material-actions{
    width:100%;
    flex-wrap:wrap;
  }
}

/* v9 action color system and glossary layout */
:root{
  --done:#19b8b0;
  --done-soft:#e7f9f7;
  --quiz:#f28c28;
  --quiz-soft:#fff1e3;
  --homework:#b83d68;
  --homework-soft:#fbeaf0;
  --practice:#2f8f68;
  --practice-soft:#eaf6f0;
}
html[data-theme="dark"]{
  --done:#45d0c8;
  --done-soft:#153432;
  --quiz:#ffad55;
  --quiz-soft:#352516;
  --homework:#e06b93;
  --homework-soft:#341c27;
  --practice:#67c99b;
  --practice-soft:#183128;
}

/* two navigation actions: Overview + Glossary */
.sidebar-tool-row{grid-template-columns:repeat(2,1fr)}

/* completed = turquoise */
.lesson-done{color:var(--done)!important}
.learned-btn.done{
  color:var(--done)!important;
  border-color:color-mix(in srgb,var(--done) 55%,var(--line))!important;
  background:var(--done-soft)!important;
}
.learned-btn.done:hover{background:color-mix(in srgb,var(--done-soft) 84%,var(--done))!important}

/* self-check = orange */
.quiz-summary{
  border-color:color-mix(in srgb,var(--quiz) 40%,var(--line))!important;
  background:var(--quiz-soft)!important;
}
.quiz-summary span,.quiz-kicker{color:var(--quiz)!important}
.quiz-dots i.done{background:var(--quiz)!important}
.inline-quiz{
  border-color:color-mix(in srgb,var(--quiz) 42%,var(--line))!important;
  background:color-mix(in srgb,var(--quiz-soft) 72%,var(--panel))!important;
}
.quiz-option:hover{border-color:color-mix(in srgb,var(--quiz) 56%,var(--line))!important}
.quiz-retry-btn{border-color:color-mix(in srgb,var(--quiz) 44%,var(--line))!important;color:var(--quiz)!important}
.quiz-success{
  background:var(--quiz-soft)!important;
  border-color:color-mix(in srgb,var(--quiz) 42%,var(--line))!important;
}
.quiz-success b{color:var(--quiz)!important}

/* homework = berry */
.final-assignment{
  border-color:color-mix(in srgb,var(--homework) 43%,var(--line))!important;
  background:linear-gradient(145deg,color-mix(in srgb,var(--homework-soft) 78%,var(--panel)),var(--panel))!important;
}
.final-assignment .assignment-label,.submission-kicker{color:var(--homework)!important}
.final-assignment .acceptance{border-color:color-mix(in srgb,var(--homework) 22%,var(--line))!important}
.submission-box{border-color:color-mix(in srgb,var(--homework) 30%,var(--line))!important}
.submission-status:focus,.submission-note:focus{border-color:var(--homework)!important;box-shadow:0 0 0 3px var(--homework-soft)}

/* practical file = green information card; no action buttons */
.material-card.material-info{
  border-color:color-mix(in srgb,var(--practice) 42%,var(--line))!important;
  background:var(--practice-soft)!important;
  padding:14px 15px!important;
}
.material-card.material-info .material-kicker{color:var(--practice)!important}
.material-card.material-info .material-copy strong{font-size:12px}
.material-card.material-info .material-copy small{margin-top:2px}

/* quote toolbar: theme-aware surface + bright outline */
.selection-toolbar{
  border:2px solid var(--accent)!important;
  background:var(--panel)!important;
  box-shadow:0 8px 28px color-mix(in srgb,var(--accent) 28%,transparent)!important;
  padding:3px!important;
}
.selection-toolbar button{
  background:var(--panel)!important;
  color:var(--text)!important;
  border:0!important;
  font-weight:800!important;
}
.selection-toolbar button:hover{background:var(--accent-soft)!important;color:var(--accent-text)!important}

/* glossary: course order, 4 columns desktop */
.glossary-lessons{display:grid;gap:26px;margin-top:24px}
.glossary-lesson-group{padding-top:4px}
.glossary-lesson-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.glossary-lesson-head span{color:var(--accent-text);font:700 9px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap}
.glossary-lesson-head h2{margin:0!important;font-size:14px!important;color:var(--text)!important}
.glossary-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important;margin-top:0!important}
.glossary-card{
  display:block!important;width:100%;min-height:86px;text-align:left!important;
  padding:11px 12px!important;border:1px solid var(--line)!important;border-radius:11px!important;
  background:var(--panel-soft)!important;color:var(--text)!important;
}
.glossary-card:hover{border-color:var(--accent)!important;background:var(--accent-soft)!important}
.glossary-card b{display:block;margin:0 0 6px!important;font-size:11px!important;line-height:1.35}
.glossary-card small{display:block;color:var(--muted);font-size:9px;line-height:1.4}

.profile-menu-action.fallback-save{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));color:var(--accent-text);background:var(--accent-soft)}

@media(max-width:1250px){.glossary-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:950px){.glossary-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media(max-width:640px){.glossary-grid{grid-template-columns:1fr!important}.glossary-lesson-head{display:block}.glossary-lesson-head span{display:block;margin-bottom:4px}}


/* v10: neutral file card, explicit icons, distinct warnings */
:root{
  --file-surface:#f1f3f6;
  --file-border:#cfd4dc;
  --file-icon:#69717e;
  --danger-note:#d9545d;
  --danger-note-soft:#fff0f1;
}
html[data-theme="dark"]{
  --file-surface:#191e26;
  --file-border:#343c49;
  --file-icon:#aab2be;
  --danger-note:#ff7b84;
  --danger-note-soft:#321d21;
}

.ui-icon{width:15px;height:15px;display:inline-grid;place-items:center;flex:0 0 auto}

.material-card.material-info{
  border-color:var(--file-border)!important;
  background:var(--file-surface)!important;

.material-card.material-info .material-kicker{
  color:var(--file-icon)!important;
  display:flex;align-items:center;gap:6px;
}
.material-card.material-info .material-copy strong{color:var(--text)!important}
.material-card.material-info .material-copy small{color:var(--muted)!important}

.quiz-summary>div:first-child>span,
.quiz-kicker,
.assignment-label,
.submission-kicker{
  display:flex;align-items:center;gap:6px;
}
.quiz-summary .ui-icon,.quiz-kicker .ui-icon{color:var(--quiz)}
.assignment-label .ui-icon,.submission-kicker .ui-icon{color:var(--homework)}

/* warning/caution is red-coral, intentionally separate from orange self-check */
.callout.warning{
  background:var(--danger-note-soft)!important;
  border-color:color-mix(in srgb,var(--danger-note) 48%,var(--line))!important;
}
.callout.warning::before{
  background:color-mix(in srgb,var(--danger-note) 14%,transparent)!important;
  color:var(--danger-note)!important;
}

.resume-profile{
  margin:0 0 18px;padding:14px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));
  border-radius:13px;background:var(--accent-soft);display:grid;gap:11px;
}
.resume-profile[hidden]{display:none!important}
.resume-profile>div{display:flex;flex-direction:column;gap:3px}
.resume-profile span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text);font-weight:800}
.resume-profile b{font-size:12px}
.resume-profile small{color:var(--muted);font-size:10px;line-height:1.45}


/* v11: adaptive formulas */
:root{
  --formula-bg:#f4f2ff;
  --formula-text:#28233f;
  --formula-border:#cfc7ff;
}

  --formula-bg:#1d1a2c;
  --formula-text:#f1eefc;
  --formula-border:#4b426d;
}
.formula{
  background:var(--formula-bg)!important;
  color:var(--formula-text)!important;
  border-color:var(--formula-border)!important;
  border-left-color:var(--accent)!important;
}

/* v11: successful self-check becomes turquoise */
.inline-quiz.quiz-passed{
  border-color:color-mix(in srgb,var(--done) 54%,var(--line))!important;
  background:var(--done-soft)!important;
}
.inline-quiz.quiz-passed .quiz-kicker{
  color:var(--done)!important;
}
.inline-quiz.quiz-passed .quiz-kicker .ui-icon{
  color:var(--done)!important;
}
.inline-quiz.quiz-passed .quiz-success{

  border-color:color-mix(in srgb,var(--done) 42%,var(--line))!important;

.inline-quiz.quiz-passed .quiz-success b{

ющему разделу.\n\n### Требования\n\nMicrosoft Excel 2021 или Microsoft 365 под Windows. Названия команд приведены по русскому интерфейсу.\n", "lessons": {"1.1": "---\ntitle: \"Архитектура рабочей книги и средства контроля расчетов\"\nsummary: \"Слоистая структура расчетной книги, оформление предпосылок, структурированные таблицы, цветовые соглашения, контрольные суммы и встроенные средства диагностики Excel.\"\nsource: \"materials/lesson-1.1.xlsx\"\nconcepts:\n  - \"Слои книги :: Разделение книги на данные, предпосылки, расчеты и представление по характеру и частоте изменений.\"\n  - \"Предпосылка :: Управляемая величина (ставка, норматив, коэффициент), записанная в одной ячейке с указанием источника; формулы ссылаются на эту ячейку.\"\n  - \"Числовая константа в формуле :: Изменяемое число, записанное непосредственно в формуле, например `=C8*0,15`. В расчетном слое является дефектом.\"\n  - \"Структурированная таблица :: Именованный диапазон с автоматическим расширением, вычисляемыми столбцами и ссылками на столбцы по названиям. Создается командой Ctrl+T.\"\n  - \"Именованный диапазон :: Имя, присвоенное ячейке или диапазону. Для предпосылок область действия задается «Книга».\"\n  - \"Контрольная сумма :: Формула, проверяющая равенство, которое выполняется при корректном расчете, и выводящая результат проверки.\"\n  - \"Молчаливая ошибка :: Неверный результат, при котором Excel не выводит сообщения об ошибке.\"\n---\n\n# Архитектура рабочей книги и средства контроля расчетов\n\n## Цели и требования\n\nВ Excel нет автоматической проверки расчетов, поэтому неверный результат часто появляется без всяких сообщений об ошибке. На занятии разбирается, как строить книги, в которых такие дефекты маловероятны, и как находить их в готовых книгах.\n\nПосле занятия нужно уметь:\n\n- разделять содержимое книги на четыре слоя и находить элементы, лежащие не в своем слое;\n- выносить предпосылки в отдельные именованные ячейки и ссылаться на них в формулах;\n- создавать структурированные таблицы и применять структурированные ссылки;\n- применять цветовое кодирование и документировать источник вводимых значений;\n- формировать контрольные суммы;\n- искать дефекты встроенными средствами Excel.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. Названия команд приведены по русскому интерфейсу. Учебный файл `lesson-1.1.xlsx` содержит отчет вымышленной розничной сети «Северный двор» за I квартал 2026 г.: лист «Отчет» (8 торговых точек), лист «Данные доп» (выгрузка из учетной системы) и лист «Свод» (сводные показатели). Файл содержит преднамеренные дефекты, исправления в него на этом этапе не вносятся.\n\n## 1. Молчаливые ошибки на примере учебной книги\n\nМолчаливая ошибка – это неверный результат, о котором Excel не сообщает. Формулы считаются, файл открывается, числа выглядят правдоподобно. Такие ошибки опаснее видимых (`#ДЕЛ/0!`, `#ИМЯ?`): их не замечают, и неверный результат попадает в отчет.\n\nВ учебной книге присутствуют два типичных случая.\n\n**Случай 1. Предпосылка не участвует в расчете.** На листе «Отчет» в ячейке B5 указан норматив аренды 15 %. При замене значения на 18 % итоговая прибыль не изменяется. Причина – формула аренды содержит норматив в виде числа:\n\n```formula\n=C8*0,15\n```\n\nЯчейка B5 выглядит как предпосылка, но формулы на нее не ссылаются. Так же устроена ставка НДС: в столбце D она записана как `=C8/1,2`, а ячейка B4 нигде не используется.\n\n**Случай 2. Диапазон суммирования не охватывает все строки.** Выручка восьми точек (диапазон C8:C15) составляет 67 835 000 руб., итоговая строка показывает 63 575 000 руб. Расхождение 4 260 000 руб. равно выручке точки № 8 «Луговая». Итоговую формулу составили до добавления восьмой строки и не обновили:\n\n```formula\n=СУММ(C8:C14)\n```\n\n> [!WARNING]\n> Если Excel не сообщает об ошибке, это не значит, что расчет верен. Правильность проверяют отдельно: контрольными суммами, изменением входных данных, трассировкой зависимостей.\n\nКнига считается надежной, если ее результат остается верным после изменения данных и предпосылок и если другой человек может проверить расчет без помощи автора.\n\n### Порядок проверки незнакомой книги\n\n1. Просмотреть листы и понять, какие из них участвуют в расчете.\n2. Включить показ формул (`Ctrl+``) и сравнить формулы в расчетных столбцах.\n3. Найти числа, введенные вручную в расчетных областях: F5 → «Выделить» → «Константы».\n4. Для каждой предпосылки найти зависимые ячейки.\n5. Изменить одно исходное значение и записать, какие показатели не пересчитались.\n6. Сверить итоги с независимым подсчетом: суммой в строке состояния или сводной таблицей.\n\n```quiz\nquestion: После изменения значения в ячейке B5 итоговая прибыль не изменилась. Что это означает?\nA: Включен ручной режим пересчета\nB: Ячейка B5 защищена от изменений\nC: Формулы не ссылаются на B5, норматив записан в них числом\nD: Формат ячейки B5 не допускает ввод процентов\ncorrect: C\nexplanation: Если формулы ссылаются на ячейку, ее изменение влияет на результат. Отсутствие реакции означает отсутствие связи. При ручном режиме пересчета (Формулы → Параметры вычислений) не обновлялись бы все формулы книги, а не результаты, зависящие от одной ячейки.\n```\n\n## 2. Слоистая архитектура\n\nРасчетная книга состоит из четырех слоев. Они различаются тем, откуда приходят изменения и как часто они вносятся.\n\n| Слой | Содержимое | Характер изменений | Пример из учебной книги |\n|---|---|---|---|\n| Данные | Первичные сведения из внешних источников | Обновляются целиком, регулярно | Выручка и прочие расходы по точкам |\n| Предпосылки | Управляемые величины: ставки, нормативы, коэффициенты | Изменяются точечно, на основании решения | НДС, норматив аренды, доля ФОТ, индекс роста |\n| Расчеты | Формулы, преобразующие данные и предпосылки в результат | Изменяются при пересмотре методики | Выручка без НДС, аренда, прибыль, маржа |\n| Представление | Отчеты, сводки, графики | Изменяются при изменении формы выдачи | Лист «Свод» |\n\nСлои разделяют так, чтобы обновление данных не требовало правки формул, смена предпосылки не требовала правки данных, а изменение формы отчета не затрагивало расчеты.\n\nЧто дает разделение слоев:\n\n1. **Единственность источника.** Каждая изменяемая величина записывается один раз, остальные ячейки ссылаются на нее.\n2. **Сценарный анализ.** Если предпосылки собраны в одном месте, их набор можно заменить целиком и сравнить результаты.\n3. **Заменяемость данных.** Новая выгрузка загружается без изменения формул.\n4. **Проверяемость.** Можно узнать, откуда взято каждое значение.\n\n### Правило о числовых константах\n\nИзменяемое число внутри расчетной формулы – дефект. Допустимы числа, которые следуют из определения показателя и не пересматриваются: 12 месяцев в году, 100 при переводе доли в проценты, 1000 при переводе рублей в тысячи. Ставка налога, норматив аренды, доля ФОТ и индекс роста – управляемые величины, их хранят в слое предпосылок.\n\nЧисловые константы в учебной книге:\n\n| Расположение | Константа | Последствие |\n|---|---|---|\n| Столбец D | `/1,2` (ставка НДС) | При изменении ставки нужно править формулы в восьми строках |\n| Столбец E | `*0,15` (норматив аренды) | Предпосылка B5 существует, но не используется |\n| Столбец F | `*0,22` (доля ФОТ) | Отдельной предпосылки нет |\n| Ячейка C21 | `*1,07` (индекс роста выручки) | Источник значения не указан |\n\nОтдельные случаи:\n\n- **E13.** Множитель `0,18` вместо `0,15`. По одной книге нельзя понять, ошибка это или особое условие договора. Дефект здесь в том, что нет пояснения.\n- **E11.** Вместо формулы введено число 1 691 250. Сейчас оно совпадает с результатом расчета (11 275 000 × 0,15), поэтому сверка итогов дефект не покажет. Но при изменении выручки точки № 4 значение в E11 не пересчитается.\n- **C19.** «Средняя маржа по точкам» считается как простое среднее: точки с разной выручкой получают одинаковый вес. Маржа по сети – это прибыль сети, деленная на выручку сети без НДС. Результаты различаются: 47,03 % и 47,86 %.\n\n> [!NOTE]\n> Дефект сопровождаемости – это и неверное значение, и невозможность понять, верно ли оно. Поэтому любое исключение из общего правила (как E13) сопровождают пояснением.\n\nОпаснее всего дефекты, которые на текущих данных дают верный результат, а после изменения данных – неверный. Их находят не просмотром, а изменением данных.\n\n```quiz\nquestion: Какая константа допустима внутри расчетной формулы?\nA: Ставка НДС 20 % в формуле выручки без НДС\nB: Норматив аренды 15 % в формуле аренды\nC: Число 12 в формуле перевода годового показателя в месячный\nD: Индекс роста выручки 1,07 в формуле плана\ncorrect: C\nexplanation: Число месяцев в году следует из определения показателя и не пересматривается. Ставка налога, норматив аренды и индекс роста являются управляемыми величинами и размещаются в слое предпосылок.\n```\n\n## 3. Предпосылки и именованные диапазоны\n\nПредпосылки размещаются на отдельном листе («Предпосылки») в виде таблицы со столбцами: название, значение, единица измерения или период действия, источник. Значение вводится один раз.\n\n| Название | Значение | Источник |\n|---|---|---|\n| Ставка НДС | 20 % | Налоговый кодекс РФ, ст. 164 |\n| Норматив аренды от выручки | 15 % | Типовой договор аренды, редакция 2025 г. |\n| Доля ФОТ от выручки без НДС | 22 % | Штатное расписание, утверждено 10.01.2026 |\n| Индекс роста выручки | 1,07 | Решение бюджетного комитета, протокол № 3 от 12.01.2026 |\n\nВ источнике указывают, откуда взято значение, когда оно установлено и кем (каким документом) утверждено. По записи «индекс 1,07» нельзя понять, актуально ли значение. По записи «индекс роста выручки 7 % – решение бюджетного комитета от 12.01.2026» – можно.\n\n### Присвоение имен\n\nИмя присваивается выделенной ячейке одним из способов:\n\n- ввод имени в поле имен слева от строки формул с подтверждением клавишей Enter;\n- «Формулы» → «Присвоить имя» или диспетчер имен (**Ctrl+F3**);\n- выделение блока из подписей и значений и команда «Создать из выделенного» (**Ctrl+Shift+F3**): имена создаются по подписям.\n\nФормула с именем:\n\n```formula\n=C8*Норматив_аренды\n```\n\nТребования к именам:\n\n- имя не начинается с цифры и не содержит пробелов (для разделения слов используется подчеркивание);\n- имя не совпадает с адресом ячейки (`Q1`, `R2C3`, `НДС1` недопустимы);\n- регистр букв не различается.\n\nОбласть действия имени задается при создании. Для предпосылок выбирается **«Книга»**. Имя с областью «Лист» работает только на своем листе: на другом листе формула с таким именем возвращает `#ИМЯ?`, хотя записана верно.\n\nКлавиша **F3** при вводе формулы открывает список имен для вставки. Кнопка «Вставить список» формирует на листе перечень имен и адресов, что используется при документировании.\n\nИмя, которое ссылается на число (`=0,15`), а не на ячейку, не используют: предпосылка должна быть видна на листе.\n\n> [!WARNING]\n> Именуются предпосылки и величины, на которые выполняется много ссылок. Именование всех ячеек ухудшает читаемость.\n\n### Проверка данных\n\nКоманда «Данные» → «Проверка данных» ограничивает допустимые значения ячейки. Для долей применяется тип «Действительное», условие «между», границы от 0 до 1. Вкладка «Сообщение для ввода» содержит пояснение, отображаемое при выборе ячейки; вкладка «Сообщение об ошибке» – текст при недопустимом вводе. Тип оповещения «Остановка» блокирует ввод, «Предупреждение» допускает ввод после подтверждения.\n\nПроверка действует только на новый ввод. Значения, введенные до ограничения, находят командой «Обвести неверные данные».\n\nЧастая ошибка – ввод не в том порядке величины (20 вместо 0,2). Ограничение «от 0 до 1» такой ввод не пропустит.\n\n```quiz\nquestion: Формула с именем `Ставка_НДС` возвращает `#ИМЯ?`, хотя имя существует и написано без опечаток. Какая причина наиболее вероятна?\nA: Имя содержит символ подчеркивания\nB: Имя создано с областью действия «Лист» и недоступно на другом листе\nC: Ячейка со ставкой имеет процентный формат\nD: Имя создано позже, чем формула\ncorrect: B\nexplanation: Имя с областью «Лист» используется только на своем листе. Для предпосылок выбирается область «Книга». Подчеркивание допустимо, формат ячейки и порядок создания на доступность имени не влияют.\n```\n\n## 4. Структурированные таблицы\n\nДиапазон данных преобразуется в таблицу командой **Ctrl+T** («Вставка» → «Таблица») с признаком «Таблица с заголовками». Имя таблицы (по умолчанию `Таблица1`) изменяется на вкладке «Конструктор», например на `Точки`.\n\nСвойства таблицы, существенные для надежности расчета:\n\n1. Таблица расширяется при добавлении строки под ней. Ссылки на таблицу охватывают новую строку без изменения формул. Это исключает дефект вида `=СУММ(C8:C14)`.\n2. Формула вычисляемого столбца автоматически копируется на весь столбец, включая новые строки.\n3. Число, введенное вручную в вычисляемый столбец, становится заметным исключением: Excel помечает такую ячейку. Так находят ячейки вида E11.\n4. К столбцам таблицы можно обращаться по названиям.\n\n### Структурированные ссылки\n\nОбычная ссылка и структурированная ссылка для расчета прибыли:\n\n```formula\n=D8-E8-F8-G8\n=[@[Выручка без НДС, руб.]]-[@[Аренда, руб.]]-[@[ФОТ, руб.]]-[@[Прочие расходы, руб.]]\n```\n\nВ структурированной ссылке видно, что это за величина, и она не зависит от положения столбца: при вставке нового столбца ссылка остается верной.\n\n| Запись | Значение |\n|---|---|\n| `[@Столбец]` | значение из текущей строки таблицы |\n| `Точки[Столбец]` | все значения столбца (без заголовка и итогов) |\n| `Точки[[#Заголовки];[Столбец]]` | ячейка заголовка столбца |\n| `Точки[[#Итого];[Столбец]]` | ячейка строки итогов |\n| `Точки[@[Столбец 1]:[Столбец 3]]` | диапазон столбцов в текущей строке |\n\nЕсли название столбца содержит пробелы, запятые или скобки, оно заключается в дополнительные квадратные скобки: `[@[Выручка без НДС, руб.]]`. При вводе формулы щелчком мыши по ячейкам Excel формирует запись автоматически.\n\nСтрока итогов включается на вкладке «Конструктор». В ней применяется функция `ПРОМЕЖУТОЧНЫЕ.ИТОГИ`, которая не учитывает строки, скрытые фильтром.\n\n### Объединенные ячейки\n\nТаблицу нельзя создать на диапазоне с объединенными ячейками. Объединение мешает сортировке и фильтрации, ломает копирование формул и перемещение по ячейкам стрелками. Для заголовков вместо него используют выравнивание по центру выделения (Формат ячеек → Выравнивание → по горизонтали: по центру выделения): ячейки остаются раздельными.\n\n```quiz\nquestion: Что происходит при добавлении строки в конец структурированной таблицы?\nA: Формулы вычисляемых столбцов копируются в новую строку, ссылки на таблицу охватывают ее\nB: Значения новой строки заполняются средними по столбцам\nC: Excel запрашивает подтверждение пересчета книги\nD: Ничего, формулы необходимо копировать вручную\ncorrect: A\nexplanation: Это основное свойство таблицы. Формулы вычисляемых столбцов продолжаются автоматически, ссылки вида `Точки[Выручка]` учитывают новые строки без изменения.\n```\n\n## 5. Цветовое кодирование и документирование\n\nЦвет шрифта обозначает тип содержимого ячейки без анализа формулы.\n\n| Цвет шрифта | Содержимое ячейки |\n|---|---|\n| Синий | значение введено вручную: исходные данные и предпосылки |\n| Черный | формула со ссылками на ячейки того же листа |\n| Зеленый | формула со ссылкой на другой лист той же книги |\n| Красный | ссылка на другой файл |\n\nКрасный цвет требует повышенного внимания: внешний файл может быть перемещен или изменен, а сохраненное значение – устареть.\n\nЦвет лучше задавать стилями ячеек («Главная» → «Стили ячеек» → «Создать стиль ячейки»), а не вручную: тогда правило можно изменить в одном месте. Достаточно трех стилей: «Ввод» (синий шрифт), «Формула» (по умолчанию), «Связь» (зеленый шрифт).\n\nКроме того, единицы измерения указывают в заголовках столбцов («руб.», «тыс. руб.», «%»), а заголовки закрепляют командой «Вид» → «Закрепить области».\n\n### Журнал изменений и имя файла\n\nЖурнал изменений ведут на отдельном листе: дата, автор, что изменено, почему. Имя файла начинают с даты в формате `ГГГГ-ММ-ДД`: версии сортируются по времени, и не появляются названия вроде «отчет_итог_финал_2 (правки)» (такое имя стоит в ячейке A2 учебной книги).\n\n### Формат отображения и значение\n\nЧисловой формат меняет только то, как число выглядит. Ячейка может показывать `1,2`, а хранить 1,2345. Округлять нужно функцией `ОКРУГЛ`, а не форматом. Число, записанное как текст (например, `1 240 500,00` в выгрузке на листе «Данные доп»), выглядит как число, но функция `СУММ` его не учитывает. Признаки: выравнивание по левому краю и зеленый индикатор в углу ячейки.\n\n```quiz\nquestion: Ячейка содержит формулу `=Лист2!B5*Курс`. Каким цветом оформляется ее шрифт по принятому соглашению?\nA: Синим\nB: Черным\nC: Зеленым\nD: Красным\ncorrect: C\nexplanation: Формула ссылается на другой лист той же книги, для таких ячеек принят зеленый шрифт. Синий используется для вводимых значений, черный – для формул в пределах листа, красный – для внешних ссылок.\n```\n\n## 6. Средства диагностики Excel\n\n### Режим отображения формул\n\nСочетание **Ctrl+`** (клавиша слева от «1») включает отображение формул вместо значений. В столбце аренды значение 1 691 250 в ячейке E11 отличается от окружающих формул. Повторное нажатие возвращает отображение значений.\n\n### Выделение групп ячеек\n\nПорядок: выделить диапазон, нажать **F5**, нажать «Выделить», выбрать тип ячеек.\n\n| Тип | Результат |\n|---|---|\n| Константы | ячейки с введенными значениями (в диапазоне E8:E15 выделяется E11) |\n| Формулы → Ошибки | ячейки с ошибочными значениями |\n| Отличия по столбцам | ячейки, формулы которых отличаются от активной ячейки по структуре ссылок |\n\nКоманда лишь показывает факт. Константа в слое данных – не дефект, а константа в расчетном столбце требует разбора.\n\n### Трассировка зависимостей\n\nКоманды «Формулы» → «Влияющие ячейки» и «Зависимые ячейки» показывают связи стрелками. У ячейки B5 зависимых ячеек нет, значит, предпосылка не используется. Стрелки удаляются командой «Убрать стрелки». Сочетания **Ctrl+[** и **Ctrl+]** переходят к влияющим и зависимым ячейкам соответственно.\n\n### Вычисление формулы\n\nКоманда «Формулы» → «Вычислить формулу» выполняет формулу по шагам. Для проверки фрагмента его выделяют в строке формул и нажимают **F9**: фрагмент заменяется значением. После проверки нажимается Esc, иначе формула сохранится с подставленным значением.\n\n### Окно контрольного значения\n\nОкно контрольного значения («Формулы» → «Окно контрольного значения») показывает выбранные ячейки на любом листе. В него добавляют итоги и контрольные суммы.\n\n### Проверка наличия ошибок\n\nКоманда «Формулы» → «Проверка наличия ошибок» и зеленые индикаторы в углах ячеек сообщают, например, о формуле, которая не охватывает соседние ячейки, о числе, сохраненном как текст, о формуле, не похожей на соседние. Правила настраиваются в «Файл» → «Параметры» → «Формулы». Эти подсказки не заменяют полной проверки книги.\n\n```quiz\nquestion: Что выделяет команда F5 → «Выделить» → «Константы» в расчетном столбце, одна ячейка которого введена вручную?\nA: Все формулы столбца\nB: Только ячейку с введенным значением\nC: Выводит сообщение об ошибке из-за смешения типов\nD: Только ячейки с ошибками\ncorrect: B\nexplanation: Команда выделяет ячейки со значениями, а не формулами. В однородном расчетном столбце это ячейки-исключения. Решение, является ли значение дефектом, принимает пользователь.\n```\n\n## 7. Контрольные суммы\n\nКонтрольная сумма – это формула, которая проверяет равенство, обязанное выполняться при верном расчете, и выводит результат словом. Для учебной книги нужны минимум три проверки:\n\n1. Сумма выручки по точкам равна итогу по сети.\n2. Выручка без НДС равна сумме прибыли и всех видов расходов.\n3. Показатели листа «Свод» равны итоговым показателям листа «Отчет».\n\nОбщий вид:\n\n```formula\n=ЕСЛИ(ОКРУГЛ(A-B;2)=0;\"OK\";\"РАСХОЖДЕНИЕ\")\n```\n\nОкругление нужно, потому что дробные числа хранятся приближенно, и разность двух одинаковых по смыслу величин может быть не нулем, а числом порядка 1E-9. Для сумм в рублях хватает двух знаков, для долей – шести.\n\nПравила для контрольных сумм:\n\n- Результаты всех проверок сводят в одну ячейку и размещают ее на видном месте листа: `=ЕСЛИ(СЧЁТЕСЛИ(B2:B4;\"OK\")=3;\"OK\";\"ЕСТЬ РАСХОЖДЕНИЯ\")`.\n- Значение «РАСХОЖДЕНИЕ» выделяется условным форматированием («Главная» → «Условное форматирование»).\n- Проверка сравнивает результат с величиной, полученной независимо. Формула `=C16-СУММ(C8:C14)` пропускает ту же строку, что и проверяемая, и всегда покажет «OK». Верный вариант получает сумму другим способом, например `=СУММ(Точки[Выручка с НДС, руб.])`.\n\n### ЕСЛИОШИБКА: обработка и скрытие ошибок\n\nВ ячейке C18 рентабельность по сети равна 0 %. Формула делит прибыль на пустую ячейку D17; ошибка `#ДЕЛ/0!` перехватывается функцией `ЕСЛИОШИБКА` и заменяется нулем:\n\n```formula\n=ЕСЛИОШИБКА(H16/D17;0)\n```\n\nНуль выглядит допустимым, но смысла не имеет: формула ссылается на пустую ячейку вместо итога выручки. Без `ЕСЛИОШИБКА` ошибка была бы видна сразу.\n\nПравило: `ЕСЛИОШИБКА` используют, когда причина ошибки известна и результат допустим по условиям задачи (например, искомого значения может не быть). Если функцию добавили только ради того, чтобы убрать сообщение, она скрывает дефект. Если причина известна, лучше проверить ее явно: `=ЕСЛИ(D16=0;\"нет данных\";H16/D16)`.\n\n```quiz\nquestion: Какая контрольная сумма выявит пропуск строки в итоговой формуле C16?\nA: `=ЕСЛИ(C16-СУММ(C8:C14)=0;\"OK\";\"РАСХОЖДЕНИЕ\")`\nB: `=ЕСЛИ(ОКРУГЛ(C16-СУММ(Точки[Выручка с НДС, руб.]);2)=0;\"OK\";\"РАСХОЖДЕНИЕ\")`\nC: `=ЕСЛИ(C16>0;\"OK\";\"РАСХОЖДЕНИЕ\")`\nD: `=ЕСЛИОШИБКА(C16;\"OK\")`\ncorrect: B\nexplanation: Проверка должна опираться на независимый способ получения суммы. Вариант A использует диапазон с тем же пропуском и всегда дает «OK». Варианты C и D не проверяют равенство.\n```\n\n## 8. Использование языковой модели для анализа формул\n\nЯзыковая модель помогает разобрать незнакомую формулу и составить список гипотез для проверки. Проверку в Excel она не заменяет.\n\nШаблон запроса:\n\n```\nПроанализируй формулу Excel:\n\n[ВСТАВЬТЕ ФОРМУЛУ]\n\n1. Опиши логику вычисления по шагам.\n2. Перечисли ячейки, от которых зависит результат, и параметры, подлежащие проверке.\n3. Найди числовые константы и раздели их на: вытекающие из определения показателя; изменяемые предпосылки, подлежащие выносу в отдельные ячейки.\n4. Укажи риски сопровождаемости.\n5. Предложи более читаемую запись, при необходимости с функцией ЛЕТ.\n6. Опиши способ проверки эквивалентности исходной и предложенной формул.\n```\n\nАдреса, имена, значения предпосылок и равенство результатов исходной и новой формулы проверяют в самой книге. Конфиденциальные данные организации в запрос не включают.\n\n## 9. Итоги занятия\n\n1. Книга состоит из четырех слоев: данные, предпосылки, расчеты, представление.\n2. Изменяемая числовая константа в расчетной формуле – дефект. Предпосылки записывают один раз, с источником, и дают им имена с областью «Книга».\n3. Данные хранят в структурированных таблицах и обращаются к ним по названиям столбцов.\n4. Тип содержимого ячейки обозначают цветом шрифта через стили ячеек.\n5. Каждое равенство, которое должно выполняться, оформляют контрольной суммой с округлением; проверка опирается на независимый способ получения величины.\n6. `ЕСЛИОШИБКА` не используют, чтобы убрать сообщение об ошибке, причина которой неизвестна.\n7. Отсутствие сообщений об ошибках не доказывает, что расчет верен.\n\n## Практика: проверка и исправление отчета «Северный двор»\n\n**Задача.** Отчет сети «Северный двор» за I квартал передается другому пользователю. Найдите дефекты файла, исправьте их и добавьте средства контроля.\n\n**Файл.** [lesson-1.1.xlsx](materials/lesson-1.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Работайте в этом файле: результатом является выполненный файл Excel.\n\n**Что нужно сделать.**\n\n1. Обследовать книгу и занести найденные дефекты на лист «Дефекты» (не менее 13).\n2. Вынести предпосылки на отдельный лист, присвоить им имена и заменить константы в формулах ссылками на имена.\n3. Преобразовать данные в структурированную таблицу и исправить итоги.\n4. Добавить цветовое кодирование, контрольные суммы и журнал изменений.\n5. По желанию: защитить лист и привести в порядок выгрузку на листе «Данные доп».\n\n**Результат.** Книга, в которой смена ставки пересчитывает весь отчет, а расхождения в итогах отображаются автоматически.\n", "1.2": "---\ntitle: \"Формулы и их поведение\"\nsummary: \"Поиск функцией ПРОСМОТРX, вычисления с условиями через СУММПРОИЗВ, динамические массивы, функция LET, модель пересчета Excel и волатильные функции.\"\nsource: \"materials/lesson-1.2.xlsx\"\nconcepts:\n  - \"ПРОСМОТРX :: Функция поиска значения в одном массиве и возврата соответствующего значения из другого. По умолчанию ищет точное совпадение.\"\n  - \"Режим сопоставления :: Пятый аргумент ПРОСМОТРX: что считать совпадением (0 – точное; -1 – точное или следующее меньшее; 1 – точное или следующее большее).\"\n  - \"Режим поиска :: Шестой аргумент ПРОСМОТРX: как выполняется поиск (с начала, с конца, двоичный). Не путать с режимом сопоставления.\"\n  - \"СУММПРОИЗВ :: Функция, которая перемножает массивы и суммирует произведения. Позволяет задавать условия арифметикой над массивами.\"\n  - \"Средневзвешенная величина :: Показатель, который учитывает вес наблюдений: `СУММПРОИЗВ(вес; значение)/СУММ(вес)`.\"\n  - \"Динамический массив :: Формула, результат которой занимает несколько ячеек (область развертывания).\"\n  - \"Оператор развертывания :: Запись `F5#`: вся область развертывания формулы, начинающейся в F5.\"\n  - \"LET :: Функция, которая задает внутри формулы именованные промежуточные величины. Область действия имен – только эта формула.\"\n  - \"Граф зависимостей :: Схема связей между ячейками, по которой Excel определяет, какие формулы пересчитывать после изменения.\"\n  - \"Волатильная функция :: Функция, которая пересчитывается при каждом пересчете книги независимо от изменения ее аргументов.\"\n---\n\n# Формулы и их поведение\n\n## Цели и требования\n\nНа занятии 1.1 критерии надежности применялись к книге в целом. Здесь они применяются к отдельным формулам. Формула считается надежной, если она:\n\n1. дает верный результат на текущих данных;\n2. остается верной при изменении значений и размера данных;\n3. понятна человеку, который ее не писал.\n\nПосле занятия нужно уметь:\n\n- искать значения функцией ПРОСМОТРX и правильно обрабатывать отсутствие совпадения;\n- считать суммы, количества и средневзвешенные величины с условиями через СУММПРОИЗВ;\n- использовать динамические массивы (УНИК, ФИЛЬТР) и ссылаться на них оператором `#`;\n- сокращать формулы и повторные вычисления функцией LET;\n- объяснять, как Excel пересчитывает книгу, и находить волатильные функции.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. В Excel 2016 и 2019 функций ПРОСМОТРX, LET и динамических массивов нет. Учебный файл `lesson-1.2.xlsx` содержит листы «Справочники» (номенклатура из 12 товаров, 8 торговых точек, шкала скидок), «Продажи» (реестр из 120 строк за I квартал 2026 г.), «Матрица» (выручка по точкам и месяцам), «Задания» (12 заданий с контролем) и «Пересчет» (учебные опыты).\n\n## 1. Связь с занятием 1.1\n\nПринципы архитектуры книги переносятся на формулы:\n\n- **Единственный источник.** Формула ссылается на параметр и не повторяет изменяемое число.\n- **Структурированные таблицы.** Формулы должны корректно работать при изменении объема данных.\n- **Проверяемость.** Промежуточные шаги сложного расчета можно просмотреть и проверить.\n- **Видимость ошибок.** Обрабатывается только ожидаемое состояние, остальные ошибки не скрываются.\n\n> [!WARNING]\n> Формула может быть записана верно и возвращать число, но оставаться ненадежной: зависеть от положения столбца, молча выбирать неверное совпадение, скрывать отсутствие данных или замедлять пересчет книги.\n\n## 2. ПРОСМОТРX: основные режимы\n\nПРОСМОТРX ищет значение в одном массиве и возвращает соответствующее значение из другого массива.\n\n```formula\n=ПРОСМОТРX(\n    искомое;\n    просматриваемый_массив;\n    возвращаемый_массив;\n    [если_не_найдено];\n    [режим_сопоставления];\n    [режим_поиска]\n)\n```\n\nОбязательны первые три аргумента.\n\n### Отличия от ВПР\n\n| Свойство | ВПР | ПРОСМОТРX |\n|---|---|---|\n| Где ищет | Только в первом столбце диапазона | В любом отдельном массиве |\n| Куда возвращает | Только вправо, по номеру столбца | Из любого отдельного массива |\n| Режим по умолчанию | Приближенный (если не указан четвертый аргумент) | Точный |\n| Ссылка на результат | Номер столбца, который сдвигается при изменении структуры | Диапазон, который сдвигается вместе с данными |\n\nДва последних отличия важнее остальных. Приближенный поиск по умолчанию в ВПР может вернуть правдоподобное, но неверное значение без сообщения об ошибке. Номер столбца в ВПР после вставки нового столбца начинает указывать не туда.\n\n### Неоднозначный ключ\n\nПРОСМОТРX – функция поиска, а не агрегирования. Если искомый код встречается в справочнике несколько раз, возвращается первое совпадение. Возможны два случая:\n\n- ключ должен быть уникальным, значит, повтор – дефект данных;\n- повторы допустимы по смыслу, значит, нужна фильтрация или агрегирование, а не поиск.\n\nФункция не определяет, допустим ли дубликат. Это решение принимается в модели данных.\n\n### Размерность массивов\n\nПросматриваемый и возвращаемый массивы должны совпадать по размеру: каждой позиции в первом соответствует позиция во втором. Если возвращаемый массив состоит из нескольких столбцов, результат разворачивается как динамический массив.\n\n### Аргумент «если не найдено»\n\nЧетвертый аргумент задает результат для единственной ситуации: совпадение не найдено.\n\n```formula\n=ПРОСМОТРX(код;коды;наименования;\"не найден\")\n```\n\n`ЕСЛИОШИБКА` перехватывает любые ошибки: деление на ноль, неверную ссылку, ошибку имени. Четвертый аргумент ПРОСМОТРX обрабатывает только отсутствие записи, поэтому остальные ошибки остаются видимыми.\n\n> [!WARNING]\n> Не всякое отсутствие совпадения нужно заменять нулем или пустой строкой. Если запись обязана существовать, «не найдено» – сигнал о проблеме в данных, и он должен оставаться заметным.\n\n```quiz\nquestion: Почему для ожидаемого отсутствия кода в справочнике предпочтительнее четвертый аргумент ПРОСМОТРX, а не ЕСЛИОШИБКА?\nA: Четвертый аргумент включает приближенный поиск\nB: Он обрабатывает только отсутствие совпадения и не скрывает прочие ошибки\nC: Он автоматически удаляет дубликаты ключей\nD: Он ускоряет поиск при любом размере данных\ncorrect: B\nexplanation: Четвертый аргумент охватывает единственную ситуацию – отсутствие совпадения. Остальные ошибки формулы остаются видимыми, и их можно диагностировать. ЕСЛИОШИБКА скрывает любые ошибки.\n```\n\n## 3. Двусторонний и приближенный поиск\n\n### Двусторонний поиск\n\nЗадача: получить значение на пересечении заданной строки и заданного столбца таблицы. Решение строится на том, что ПРОСМОТРX может вернуть массив. Внутренняя функция находит столбец по месяцу:\n\n```formula\n=ПРОСМОТРX(месяц;строка_месяцев;массив_значений)\n```\n\nРезультат – столбец значений нужного месяца. Внешняя функция выбирает из него строку по точке:\n\n```formula\n=ПРОСМОТРX(\n    точка;\n    столбец_точек;\n    ПРОСМОТРX(месяц;строка_месяцев;массив_значений)\n)\n```\n\n### F9: просмотр промежуточного результата\n\nЧтобы увидеть, что возвращает часть формулы, выделите ее в строке формул и нажмите **F9**: фрагмент заменится вычисленным значением. Для вложенной функции ПРОСМОТРX так видно весь возвращаемый столбец.\n\n> [!WARNING]\n> После просмотра нажмите **Esc**. Клавиша Enter оставит в формуле вычисленное значение вместо исходного фрагмента.\n\n### Приближенный поиск\n\nЕсли шкала задана нижними границами (например, скидка зависит от объема закупки), точного совпадения может не быть. Нужно найти точное значение или ближайшее меньшее. Для этого в пятом аргументе задается `-1`:\n\n```formula\n=ПРОСМОТРX(объем;границы;ставки;;-1)\n```\n\nДве точки с запятой подряд означают, что четвертый аргумент пропущен.\n\n### Режим сопоставления и режим поиска\n\n| Аргумент | Что определяет | Значения |\n|---|---|---|\n| Пятый: режим сопоставления | какое совпадение считать подходящим | `0` – точное; `-1` – точное или следующее меньшее; `1` – точное или следующее большее |\n| Шестой: режим поиска | как выполнять поиск | `1` – с начала; `-1` – с конца; `2` – двоичный по возрастанию; `-2` – двоичный по убыванию |\n\nЭто разные параметры. Сортировка данных обязательна только для двоичного поиска (`2`, `-2`). Сочетание сопоставления `-1` с обычным поиском сортировки не требует. Для небольших шкал порогов двоичный поиск не нужен, но отсортированную шкалу легче проверять.\n\n```quiz\nquestion: Шкала скидок задана нижними границами объема: 0, 500 000, 1 500 000, 3 000 000. Какой пятый аргумент ПРОСМОТРX вернет скидку для объема 2 450 000?\nA: 0 (точное совпадение)\nB: -1 (точное или следующее меньшее)\nC: 1 (точное или следующее большее)\nD: 2 (двоичный поиск)\ncorrect: B\nexplanation: Значения 2 450 000 в шкале нет. Нужна граница, не превышающая объем, то есть 1 500 000. Это режим -1. Режим 1 вернул бы границу 3 000 000, а режим 2 относится к порядку поиска, а не к выбору совпадения.\n```\n\n## 4. СУММПРОИЗВ и условия над массивами\n\nСУММПРОИЗВ нужна не только для суммирования произведений: она позволяет задавать условия арифметикой над массивами, в том числе вычисляемые.\n\n### Как работает условие\n\nСравнение диапазона со значением возвращает массив ИСТИНА/ЛОЖЬ. Арифметическая операция превращает ИСТИНА в 1, а ЛОЖЬ в 0. Произведение двух таких массивов равно 1 только там, где выполнены оба условия, то есть умножение дает логику «И»:\n\n```formula\n=СУММПРОИЗВ((условие1)*(условие2)*суммы)\n```\n\nСтроки, не удовлетворяющие условиям, умножаются на 0 и выпадают из суммы.\n\nДля логики «ИЛИ» массивы условий складывают. Если строка удовлетворяет обоим условиям, сумма равна 2, поэтому такой массив нужно проверять на промежуточном результате (F9).\n\n### СУММПРОИЗВ или СУММЕСЛИМН\n\nДля простых условий по готовым столбцам предпочтительна СУММЕСЛИМН: она короче и читается проще. СУММПРОИЗВ оправдана, если:\n\n- условие является результатом вычисления (готового столбца с признаком нет);\n- нужна арифметика над массивами;\n- считается взвешенный показатель.\n\nРасположение данных на другом листе – не повод заменять СУММЕСЛИМН на СУММПРОИЗВ.\n\n### Вычисляемое условие\n\nВ реестре продаж нет столбца с категорией товара. Категорию можно получить по коду через справочник, применив ПРОСМОТРX сразу ко всему столбцу кодов:\n\n```formula\n=СУММПРОИЗВ(\n    (Продажи!C4:C123=точка)\n    *(ПРОСМОТРX(Продажи!D4:D123;Справочники!A5:A16;Справочники!C5:C16)=категория)\n    *Продажи!G4:G123\n)\n```\n\nВсе массивы в формуле должны охватывать одни и те же строки. Ссылки на целые столбцы (миллион строк) в таких формулах замедляют пересчет.\n\n### Средневзвешенная величина\n\nПростое среднее цены по строкам не учитывает, что единиц продано разное количество. Верная средневзвешенная цена:\n\n```formula\n=СУММПРОИЗВ(количество;цена)/СУММ(количество)\n```\n\n> [!NOTE]\n> Прежде чем агрегировать относительный показатель, нужно определить его знаменатель. Если показатель – отношение A/B, то по группе его считают как СУММ(A)/СУММ(B), а не как среднее значений A/B по строкам. Это относится к цене, марже, доходности, ставкам.\n\nВ учебной книге простое среднее цены по реестру равно 166,83 руб., а средневзвешенная цена – 165,44 руб.\n\n```quiz\nquestion: В каком случае СУММПРОИЗВ предпочтительнее СУММЕСЛИМН?\nA: Нужно сложить один числовой столбец без условий\nB: Условие является результатом вычисления, готового столбца с признаком нет\nC: Данные находятся на другом листе\nD: Нужно заменить любую функцию СУММ\ncorrect: B\nexplanation: СУММПРОИЗВ позволяет задавать условие вычислением над массивом. Если условия заданы готовыми столбцами, СУММЕСЛИМН короче и проще. Положение данных на другом листе на выбор функции не влияет.\n```\n\n## 5. Динамические массивы\n\nФормула с динамическим массивом возвращает не одно значение, а массив, который занимает столько ячеек, сколько нужно. Занятую область называют **областью развертывания**.\n\n| Функция | Результат |\n|---|---|\n| УНИК | уникальные значения |\n| ФИЛЬТР | строки, удовлетворяющие условию |\n| СОРТ, СОРТПО | упорядоченный массив |\n| ПОСЛЕД | последовательность чисел |\n| СЛУЧМАССИВ | массив случайных чисел |\n\nНапример, `=УНИК(диапазон)` записывается в одну ячейку, а результат занимает несколько. Формула хранится только в первой ячейке, остальные ячейки области отдельно не редактируются.\n\n### Таблица на входе, массив на выходе\n\nИсходные данные хранят в структурированной таблице: она сама расширяет входной диапазон. Формулу с динамическим массивом размещают вне таблицы. Структура: таблица расширяет вход, динамическая формула расширяет результат, зависимые формулы ссылаются на всю область результата.\n\n### Оператор `#`\n\nЕсли динамическая формула начинается в ячейке F5, то запись `F5#` означает всю область развертывания независимо от ее размера:\n\n```formula\n=СУММ(F5#)\n=ЧСТРОК(F5#)\n```\n\nПри увеличении массива ссылка расширится сама.\n\n> [!WARNING]\n> Не ссылайтесь на динамический результат фиксированным диапазоном «с запасом» (`F5:F20`). Такая ссылка снова привязывает модель к текущему размеру.\n\n### Ошибка #ПЕРЕНОС!\n\nЕсли хотя бы одна ячейка будущей области развертывания занята, массив не строится, и Excel возвращает `#ПЕРЕНОС!`. Достаточно освободить занятую ячейку.\n\n### Несколько условий в ФИЛЬТР\n\nУсловия объединяют умножением:\n\n```formula\n=ФИЛЬТР(диапазон;(условие1)*(условие2);\"нет строк\")\n```\n\nФункция `И` не подходит: она сворачивает массив в одно значение. Третий аргумент ФИЛЬТР, как и четвертый аргумент ПРОСМОТРX, используют осознанно: если отсутствие строк допустимо, выводят сообщение; если оно сигнализирует о дефекте данных, его нейтральным текстом не маскируют.\n\n```quiz\nquestion: Формула `=УНИК(Справочники!C5:C16)` записана в J5 и возвращает 4 значения. Какая запись считает их количество и останется верной при росте списка?\nA: `=ЧСТРОК(J5:J8)`\nB: `=ЧСТРОК(J5#)`\nC: `=ЧСТРОК(J5)`\nD: `=СУММ(J5#)`\ncorrect: B\nexplanation: Оператор # охватывает всю область развертывания и расширяется вместе с ней. Диапазон J5:J8 привязан к текущему размеру. Ссылка J5 дает одну ячейку, а СУММ складывает значения, а не считает строки.\n```\n\n## 6. Функция LET\n\nLET объявляет внутри формулы именованные промежуточные величины:\n\n```formula\n=LET(\n    имя1;значение1;\n    имя2;значение2;\n    выражение_результата\n)\n```\n\nLET решает две задачи.\n\n**Читаемость.** Повторяющееся выражение вычисляется один раз, получает содержательное имя и используется по имени. В отличие от имен диспетчера имен, переменные LET существуют только внутри своей формулы и не засоряют список имен книги. Переменной может быть значение, диапазон или массив.\n\n**Меньше повторных вычислений.** Если сложное выражение встречается в формуле трижды, Excel вычисляет его три раза. Если оно объявлено как переменная LET, то вычисляется один раз. Это важно для больших массивов, повторных ПРОСМОТРX и ФИЛЬТР.\n\nПример для средневзвешенной цены:\n\n```formula\n=LET(\n    выручка;СУММПРОИЗВ(Продажи!E4:E123;Продажи!F4:F123);\n    количество;СУММ(Продажи!E4:E123);\n    выручка/количество\n)\n```\n\nLET нужна, если выражение длинное или дорогое и повторяется, или если формула состоит из нескольких содержательных шагов, которым полезно дать имена. Короткую формулу в один шаг оборачивать в LET не нужно.\n\n> [!NOTE]\n> Функция LAMBDA развивает идею LET и позволяет создавать собственные функции. В программу курса она не входит и в Excel 2021 недоступна.\n\n## 7. Разбор формулы с помощью языковой модели\n\nЯзыковая модель может помочь прочитать чужую формулу и подготовить черновой вариант упрощения.\n\n```\nНиже формула Excel:\n\n[ВСТАВЬТЕ ФОРМУЛУ]\n\n1. Опиши вычисление по этапам.\n2. Перечисли зависимости формулы.\n3. Найди повторяющиеся выражения.\n4. Найди числовые константы и укажи, чем они являются: изменяемыми предпосылками или величинами, вытекающими из определения показателя.\n5. Предложи эквивалентную запись через LET, если она улучшает читаемость или убирает повторные вычисления.\n6. Не меняй диапазоны, условия и знаки операций.\n7. Отдельно перечисли, что нужно проверить в Excel после преобразования.\n```\n\nНовую формулу нельзя считать эквивалентной без проверки. Порядок проверки:\n\n1. сравнить результаты старой и новой формулы на исходных данных;\n2. изменить несколько входных значений;\n3. убедиться, что результаты по-прежнему совпадают;\n4. отдельно проверить диапазоны, знаки операций и условия.\n\n## 8. Модель вычислений и волатильные функции\n\nНа стоимость пересчета влияет не только результат формулы, но и ее устройство.\n\n### Граф зависимостей\n\nExcel не пересчитывает всю книгу при каждом изменении. Он строит граф зависимостей между ячейками и после изменения значения пересчитывает только формулы, которые зависят от него напрямую или через цепочку других формул.\n\n### Режим вычислений\n\nРежим выбирается в «Формулы» → «Параметры вычислений». В автоматическом режиме формулы пересчитываются сразу после изменения данных. В ручном режиме данные уже изменены, а на экране остаются прежние результаты.\n\n| Клавиши | Действие |\n|---|---|\n| F9 | пересчитать измененные формулы и зависящие от них во всех открытых книгах |\n| Shift+F9 | пересчитать активный лист |\n| Ctrl+Alt+F9 | полный пересчет всех формул независимо от признака изменения |\n\n> [!WARNING]\n> Режим вычислений действует на все открытые книги. После опыта с ручным режимом верните «Автоматически», иначе вы можете работать с устаревшими значениями.\n\n### Волатильные функции\n\nВолатильные функции пересчитываются при каждом пересчете книги, даже если их аргументы не менялись. К ним относятся СЛЧИС, СЛУЧМЕЖДУ, СЕГОДНЯ, ТДАТА, СМЕЩ, ДВССЫЛ, а также ЯЧЕЙКА и ИНФОРМ в ряде режимов. Вместе с волатильной ячейкой пересчитываются все формулы, которые от нее зависят.\n\nПоэтому важно не только наличие волатильной функции, но и ее положение в графе зависимостей. Одна функция СЕГОДНЯ в заголовке практически не влияет на скорость. Большое число функций СМЕЩ в основе расчетной модели замедляет всю ветвь зависимых формул.\n\n### Что показывают опыты листа «Пересчет»\n\n**Опыт 1. СЛЧИС.** Изменение ячейки B6 меняет значение B7 (СЛЧИС), хотя B7 от B6 не зависит. Это признак волатильности.\n\n**Опыт 2. СМЕЩ и прямая ссылка.** Суммы в B13 (через СМЕЩ) и B14 (через прямой диапазон) равны, но B13 пересчитывается при каждом пересчете, а B14 – только при изменении реестра. Динамический диапазон лучше задавать структурированной таблицей: зависимость остается явной, а волатильная функция не нужна.\n\n**Опыт 3. ДВССЫЛ.** Функция получает адрес в виде текста. Трассировка влияющих ячеек такую связь не показывает, поэтому ДВССЫЛ ухудшает проверяемость книги (см. занятие 1.1).\n\n> [!NOTE]\n> Волатильная функция допустима, если без нее задача не решается и нет более прозрачного решения. В этом случае причина и стоимость применения должны быть понятны.\n\n### Диагностика медленной книги\n\n1. Определить режим вычислений.\n2. Найти волатильные функции.\n3. Оценить положение каждой в графе зависимостей.\n4. Найти повторяющиеся дорогие выражения.\n5. Только после этого менять формулы.\n\n```quiz\nquestion: Почему одна волатильная функция может иметь разную стоимость в разных местах книги?\nA: Excel случайно выбирает время ее пересчета\nB: Стоимость зависит от числа формул, зависящих от нее, которые тоже пересчитываются\nC: Любая волатильная функция всегда пересчитывает всю книгу\nD: Волатильность влияет только на размер файла\ncorrect: B\nexplanation: Волатильная функция пересчитывается при каждом пересчете, а вместе с ней пересчитывается вся цепочка зависимых формул. Поэтому важно, сколько формул находится ниже нее в графе зависимостей.\n```\n\n## 9. Итоги занятия\n\n1. ПРОСМОТРX по умолчанию ищет точное совпадение и принимает независимые массивы поиска и возврата.\n2. Ожидаемое отсутствие совпадения обрабатывается четвертым аргументом ПРОСМОТРX, а не скрывается через ЕСЛИОШИБКА.\n3. Режим сопоставления и режим поиска – разные параметры. Сортировка обязательна только для двоичного поиска.\n4. СУММПРОИЗВ нужна, когда условие получено вычислением или требуется арифметика над массивами; для простых условий используют СУММЕСЛИМН.\n5. Средневзвешенная величина не равна простому среднему.\n6. Формулу с динамическим массивом размещают вне структурированной таблицы, а на ее результат ссылаются оператором `#`.\n7. LET дает имена промежуточным величинам и убирает повторные вычисления внутри формулы.\n8. В ручном режиме вычислений на экране остаются устаревшие результаты; для диагностики служат F9, Shift+F9 и Ctrl+Alt+F9.\n9. Волатильные функции пересчитываются при каждом пересчете и тянут за собой зависимые формулы; риск определяется размером этой цепочки.\n\n## Практика: формулы в рабочей тетради занятия 1.2\n\n**Задача.** Выполнить 12 заданий на листе «Задания», провести опыты с пересчетом и сверить результаты с контрольными ячейками.\n\n**Файл.** [lesson-1.2.xlsx](materials/lesson-1.2.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Порядок работы» внутри файла. Формулы вводятся в желтые ячейки столбца C листа «Задания»; столбец E показывает «ОК», если результат совпал с контролем. Результатом является выполненный файл Excel.\n\n**Что нужно сделать.**\n\n1. Задания 1–5: поиск функцией ПРОСМОТРX, в том числе двусторонний и приближенный.\n2. Задания 6–8: суммы, количества и средневзвешенная цена через СУММПРОИЗВ.\n3. Задания 9–12: динамические массивы УНИК и ФИЛЬТР, функция LET.\n4. Опыты на листе «Пересчет»: волатильные функции и ручной режим вычислений. Наблюдения записываются на листе «Наблюдения».\n5. По желанию: сводка по регионам на динамических массивах.\n\n**Результат.** Во всех строках столбца «Проверка» на листе «Задания» стоит «ОК».\n", "2.1": "---\ntitle: \"Power Query: импорт и очистка данных\"\nsummary: \"Запрос как сохраненная последовательность преобразований: импорт выгрузки, типы данных и локаль, очистка и стандартизация текста, преобразование широкой таблицы в длинную, обновление на новой выгрузке.\"\nsource: \"materials/lesson-2.1.xlsx; materials/lesson-2.1-source.xlsx\"\nconcepts:\n  - \"Запрос :: Сохраненная последовательность преобразований данных (примененные шаги). При обновлении источника последовательность выполняется заново.\"\n  - \"Примененные шаги :: Список операций запроса в порядке выполнения. Каждый шаг принимает результат предыдущего и записывается выражением на языке M.\"\n  - \"Язык M :: Язык, на котором Power Query записывает шаги запроса. Действия интерфейса формируют M-код, который можно прочитать в строке формул и в расширенном редакторе.\"\n  - \"Тип данных :: Свойство столбца, определяющее допустимые операции: текст, целое и десятичное число, дата, дата и время, логический тип.\"\n  - \"Локаль источника :: Набор правил записи чисел и дат (десятичный разделитель, разделитель тысяч, порядок day-month-year). Задается при преобразовании типа командой «Использовать локаль».\"\n  - \"null :: Значение «данных нет». В отличие от нуля не участвует в подсчете количества и среднего.\"\n  - \"Неразрывный пробел :: Символ U+00A0, внешне неотличимый от обычного пробела. Часто используется как разделитель тысяч в выгрузках; обычная замена пробела его не затрагивает.\"\n  - \"Стандартизация текста :: Приведение значений к единому виду (пробелы, регистр, служебные символы) до сопоставления и удаления дубликатов.\"\n  - \"Широкий формат :: Таблица, в которой каждый период занимает отдельный столбец. Новый период меняет структуру таблицы.\"\n  - \"Длинный формат :: Таблица, в которой период хранится значением в столбце «Месяц». Новый период добавляет строки, структура не меняется.\"\n  - \"Отменить свертывание (unpivot) :: Преобразование столбцов в строки. Вариант «Отменить свертывание других столбцов» задает столбцы, которые остаются, и поэтому охватывает любые новые периоды.\"\n  - \"Воспроизводимость :: Свойство запроса давать корректный результат на следующей выгрузке без ручной правки шагов.\"\n---\n\n# Power Query: импорт и очистка данных\n\n## Цели и требования\n\nНа первом дне рассматривались книга и формулы. Теперь рассматривается слой данных: как первичная выгрузка попадает в книгу и в каком виде. От этого зависит всё последующее: связи в модели данных (занятие 3.1), сводные таблицы, формулы и отчеты.\n\nПосле занятия нужно уметь:\n\n- создавать запрос к листу другой книги и читать его примененные шаги;\n- приводить числа и даты к нужному типу с учетом локали источника;\n- заменять заполнители отсутствующих значений на null;\n- стандартизировать текст и удалять дубликаты в правильном порядке;\n- преобразовывать широкую таблицу в длинную;\n- проверять результат по количеству строк и контрольным суммам;\n- обновлять запрос на новой выгрузке без правки шагов.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. Power Query встроен в эти версии и не требует установки. Занятие использует два файла: `lesson-2.1-source.xlsx` (источник данных, не редактируется) и `lesson-2.1.xlsx` (рабочая книга с инструкцией на листе «Задание»). Подробнее в разделе «Практика».\n\n## 1. Место Power Query в архитектуре книги\n\nНа занятии 1.1 книга была разделена на четыре слоя: данные, предпосылки, расчеты, представление. Power Query относится к **слою данных**: он принимает первичные сведения в том виде, в каком они поступили из системы, и преобразует их в таблицу, пригодную для расчетов.\n\n### Ручная очистка и запрос\n\nПри ручной очистке пользователь удаляет служебные строки, исправляет форматы, приводит названия к одному написанию. Результат сохраняется в файле, а последовательность действий – нет. Когда через месяц приходит новая выгрузка, работа выполняется заново, и результат зависит от того, что именно человек вспомнил сделать.\n\nPower Query сохраняет **способ получения** результата. Запрос – это список шагов, который выполняется заново при каждом обновлении источника.\n\n> [!NOTE]\n> Запрос оценивается не по тому, обработал ли он сегодняшнюю выгрузку, а по тому, обработает ли он следующую без ручной правки. Это свойство называется воспроизводимостью.\n\n### Выбор инструмента\n\nИнструменты Excel решают разные задачи:\n\n| Задача | Инструмент |\n| --- | --- |\n| Взять данные из источника и привести к нужной форме | Power Query |\n| Рассчитать показатели по подготовленным данным | Формулы, сводные таблицы, модель данных |\n| Выполнить последовательность действий интерфейса, которую нельзя выразить иначе | VBA (занятие 7.1) |\n\n```quiz\nquestion: Что является главным преимуществом Power Query по сравнению с ручной очисткой одной выгрузки?\nA: Power Query всегда выполняет вычисления быстрее формул\nB: Power Query сохраняет последовательность преобразований и применяет ее к новым данным\nC: Power Query автоматически исправляет любые ошибки источника без настройки\nD: Power Query полностью заменяет формулы и VBA\ncorrect: B\nexplanation: Ценность запроса в воспроизводимости: описанная один раз последовательность шагов выполняется заново при обновлении источника.\n```\n\n## 2. Импорт и устройство редактора запросов\n\n### Источник не редактируется\n\nИсходный файл выгрузки используется только как источник. Результаты работы сохраняются в другой книге. Это то же разделение, что и на занятии 1.1: данные не смешиваются с расчетами.\n\nИмпорт листа другой книги выполняется так:\n\n1. На вкладке «Данные» выбрать «Получить данные» → «Из файла» → «Из книги Excel».\n2. Указать файл `lesson-2.1-source.xlsx`.\n3. В навигаторе выбрать лист «Продажи (выгрузка)».\n4. Нажать **«Преобразовать данные»**, а не «Загрузить». Команда «Загрузить» поместит выгрузку на лист без очистки.\n\nОткроется редактор запросов.\n\n### Области редактора\n\n- **Лента.** Вкладки «Главная», «Преобразование», «Добавление столбца». Почти каждая команда создает новый шаг.\n- **Область запросов** (слева). Список запросов книги.\n- **Предварительный просмотр** (в центре). Состояние данных на выбранном шаге.\n- **Примененные шаги** (справа). Основной объект работы: запрос читается как последовательность операций. Щелчок по шагу показывает данные на этом этапе.\n\n> [!WARNING]\n> Предварительный просмотр отображает лишь часть источника. На больших таблицах дефект, расположенный далеко от начала, в окне не виден. Контроль выполняется по количеству строк и суммам, а не по взгляду на первые строки.\n\n### Имена шагов\n\nАвтоматические имена («Измененный тип», «Измененный тип1», «Измененный тип2») быстро делают запрос нечитаемым. Шаги переименовываются по смыслу (команда «Переименовать» в контекстном меню шага):\n\n- «Удалена служебная шапка»;\n- «Отфильтрованы записи»;\n- «Стандартизованы точки»;\n- «Месяцы развернуты»;\n- «Установлен числовой тип».\n\nЭто тот же принцип сопровождаемости, что и именованные диапазоны на занятии 1.1: структуру должен быть способен прочитать человек, не писавший запрос.\n\n### Язык M\n\nКаждый шаг записан выражением на языке M. На вкладке «Вид» включается **строка формул**, в которой видно выражение выбранного шага. Например, шаг удаления верхних строк выглядит так:\n\n```excel\n= Table.Skip(Источник, 4)\n```\n\nПисать M-код вручную на занятии не требуется, но чтение выражения полезно: оно показывает, на какие имена столбцов и значения опирается шаг. Это основной способ найти причину ошибки.\n\n### Осмотр источника\n\nПеред первым преобразованием необходимо перечислить особенности источника. В выгрузке «Продажи (выгрузка)» их несколько:\n\n- четыре служебные строки в начале (название отчета, период, дата формирования, пустая с
