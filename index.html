ого числа для двух входов создает жесткую корреляцию между ними.\n\n> [!WARNING]\n> `СЛЧИС()` пересчитывается при каждом изменении листа и при F9. Результаты симуляции на `СЛЧИС()` нельзя сравнивать между запусками, фиксировать в отчете и проверять. В учебной модели числа U1–U3 сохранены как значения: симуляция воспроизводима, и контрольные значения совпадают у всех.\n\n```quiz\nquestion: Для какой цели в формуле логнормального распределения используется LN(медиана)?\nA: Для получения медианы из среднего\nB: Для передачи в ЛОГНОРМ.ОБР среднего значения логарифма величины\nC: Для ограничения значений снизу нулем\nD: Для перевода результата в проценты\ncorrect: B\nexplanation: Функция ЛОГНОРМ.ОБР принимает параметры логарифма величины. Медиане логнормального распределения соответствует среднее логарифма, равное LN(медиана).\n```\n\n## 4. Построение симуляции в Excel\n\nСтруктура листа `Simulation` (строки 6–1005, по одной итерации в строке):\n\n| Столбцы | Содержание |\n|---|---|\n| A | Номер итерации |\n| B:D | U1, U2, U3: равномерные числа (значения) |\n| E, F, G | Объем, цена, переменные затраты: обратные функции от U1, U2, U3 |\n| H:L | Операционная прибыль по годам 1–5 |\n| M | NPV итерации |\n\nПравила построения:\n\n1. Параметры распределений хранятся на листе «Параметры» и входят в формулы абсолютными ссылками; значения не вшиваются.\n2. Формулы итерации записываются один раз и копируются на все строки; контроль – сравнение формулы в первой и последней строке.\n3. Строка 3 (базовый сценарий) использует тот же механизм на модальных значениях и воспроизводит детерминированную NPV; расхождение означает ошибку в формуле.\n4. Число итераций выбирается заранее; для учебной модели N = 1000.\n5. Промежуточные расчеты (по годам) выводятся в столбцах: это упрощает проверку отдельной строки вручную.\n\nПроверка модели: значения входов в каждой строке должны лежать в допустимых границах (объем в диапазоне 65 000–90 000, цена и затраты положительны), а `СРЗНАЧ` по столбцу объема должно быть близко к теоретическому среднему 78 333. На учебном наборе среднее объема равно 78 159, среднее цены – 1 202,8, среднее затрат – 705,3.\n\n## 5. Статистики результата\n\nДля столбца NPV (M6:M1005) рассчитываются характеристики распределения.\n\n| Показатель | Формула | Значение |\n|---|---|---|\n| Среднее | `СРЗНАЧ` | 36 135 548 |\n| Стандартное отклонение | `СТАНДОТКЛОН.В` | 27 371 972 |\n| Минимум | `МИН` | −47 226 115 |\n| Максимум | `МАКС` | 155 531 165 |\n| Перцентиль 5 % | `ПРОЦЕНТИЛЬ.ВКЛ(…; 0,05)` | −8 285 841 |\n| Медиана | `ПРОЦЕНТИЛЬ.ВКЛ(…; 0,5)` | 35 501 675 |\n| Перцентиль 95 % | `ПРОЦЕНТИЛЬ.ВКЛ(…; 0,95)` | 80 983 390 |\n| Вероятность NPV < 0 | `СЧЁТЕСЛИ(M6:M1005; \"<0\") / СЧЁТ(M6:M1005)` | 0,089 |\n\nИнтерпретация:\n\n- 90 % исходов лежат в интервале от −8,3 до 81,0 млн руб. (P5–P95); ширина интервала показывает риск существенно лучше, чем один сценарий;\n- вероятность убытка 8,9 % – доля итераций с NPV ниже нуля; она оценивает риск непосредственно в единицах решения;\n- среднее (36,1 млн руб.) ниже детерминированной NPV (39,6 млн руб.): объем распределен асимметрично со средним ниже моды, а убыточные годы не уменьшают налог из-за ограничения `ОП > 0`. Детерминированный расчет на модальных значениях не равен среднему результату;\n- медиана близка к среднему, поэтому распределение NPV почти симметрично.\n\n> [!NOTE]\n> Для решения «принять проект или нет» используются среднее и вероятность убытка вместе: положительное среднее при заметной вероятности потерь означает, что проект зависит от допустимого уровня риска, а не от одного значения.\n\n```quiz\nquestion: P5 NPV равен −8,3 млн руб., P95 равен 81,0 млн руб. Что означают эти значения?\nA: С вероятностью 5 % NPV ниже −8,3 млн руб., с вероятностью 5 % выше 81,0 млн руб.\nB: NPV лежит строго между −8,3 и 81,0 млн руб.\nC: Среднее NPV равно полусумме этих значений\nD: Вероятность убытка равна 5 %\ncorrect: A\nexplanation: P5 и P95 – границы центральных 90 % исходов. Вероятность выхода за них составляет по 5 % с каждой стороны; на учебном наборе вероятность убытка равна 8,9 %, а не 5 %.\n```\n\n## 6. Сходимость и число итераций\n\nКаждая статистика симуляции – оценка с погрешностью, зависящей от числа итераций. Для среднего погрешность оценивается стандартной ошибкой `σ / √N`: при σ = 27,4 млн руб. и N = 1000 она равна 0,87 млн руб. Приближенный 95 % интервал для среднего – `среднее ± 2 × ошибка`, то есть ±1,7 млн руб.\n\nНакопленное среднее по первым N итерациям:\n\n| N | 100 | 250 | 500 | 1000 |\n|---|---|---|---|---|\n| Среднее NPV, руб. | 37 207 578 | 36 980 826 | 36 093 330 | 36 135 548 |\n\nКолебания уменьшаются с ростом N; точность растет медленно: для уменьшения ошибки вдвое требуется вчетверо больше итераций.\n\nПрактические правила:\n\n- число итераций выбирается по требуемой точности нужной статистики; хвостовые показатели (P5, P95, вероятность убытка) сходятся медленнее среднего, и для них требуется больше итераций;\n- сходимость проверяется диаграммой накопленного среднего и повторной симуляцией с другим набором чисел;\n- при замене `U` на `СЛЧИС()` среднее при пересчете меняется в пределах примерно ±2 стандартных ошибок; различия между запусками, меньшие этой величины, не интерпретируются.\n\n## 7. Вклад входов и корреляции\n\nКорреляция между входом и NPV по итерациям показывает, какой вход сильнее связан с результатом:\n\n| Вход | Корреляция с NPV |\n|---|---|\n| Объем | 0,233 |\n| Цена | 0,818 |\n| Переменные затраты | −0,491 |\n\nОсновной фактор риска – цена. Результат согласуется с чувствительностью из занятия 4.1: цена и затраты определяют разброс сильнее объема. Знак корреляции отражает направление связи: рост затрат снижает NPV.\n\nОграничения интерпретации:\n\n- вклад входа в разброс зависит от ширины его распределения: расширение σ цены со 100 до 150 повышает ее вклад и вероятность убытка, хотя модель не изменилась;\n- корреляция измеряет линейную связь и не разделяет эффекты входов, если они сами связаны;\n- в учебной модели входы независимы. В реальных данных цена и объем обычно связаны отрицательно, а затраты и цена – положительно; независимое моделирование занижает или завышает риск в зависимости от знака связи. Корреляции между входами моделируются отдельно (например, через общий коэффициент или копулы), и в Excel без надстроек это выходит за рамки занятия.\n\n```quiz\nquestion: Корреляция NPV с ценой равна 0,818, с объемом – 0,233. Какой вывод корректен?\nA: Объем не влияет на NPV\nB: Разброс NPV в этой симуляции связан с ценой сильнее, чем с объемом\nC: Рост цены на 1 % увеличивает NPV на 0,818 %\nD: Цену нельзя менять, объем можно\ncorrect: B\nexplanation: Корреляция показывает силу линейной связи на заданных распределениях входов. Она не равна эластичности и зависит от ширины распределений; объем влияет на NPV, но его вклад в разброс меньше.\n```\n\n## 8. Границы применимости\n\nСимуляция Монте-Карло не добавляет информации сверх допущений модели. Основные ограничения:\n\n1. **Выбор распределений.** Другие параметры или форма распределения меняют перцентили и вероятность убытка. Результат сопровождается перечнем допущений.\n2. **Независимость входов.** Отсутствие корреляций между входами – допущение, которое нужно проверять.\n3. **Структура модели.** Ошибка в детерминированной модели воспроизводится во всех итерациях.\n4. **Постоянство параметров во времени.** В учебной модели отклонения цены и затрат действуют на все годы одинаково; в реальности значения меняются по годам независимо.\n5. **Хвосты распределения.** Редкие события (стресс) в нормальной модели недооцениваются; для них применяются стресс-тесты (занятие 5.2).\n6. **Воспроизводимость.** Результаты с `СЛЧИС()` нельзя проверить; в отчет включаются зерно (фиксированный набор чисел) и число итераций.\n\nСимуляция, сценарии и чувствительность дополняют друг друга: чувствительность выделяет факторы, сценарии задают осмысленные состояния мира, стресс-тесты проверяют пределы, симуляция количественно оценивает риск при заданных распределениях.\n\n## 9. Использование ИИ: ревизия допущений симуляции\n\nИИ помогает проверить допущения, но числа распределения должны подтверждаться данными. Запрос:\n\n```excel\nДана симуляция Монте-Карло NPV проекта на 1000 итерациях.\nВходы: объем – треугольное (65000; 80000; 90000), цена – нормальное (1200; σ 100), переменные затраты – логнормальное (медиана 700; σ логарифма 0,08). Входы независимы.\nРезультат: среднее 36,1 млн руб., σ 27,4 млн руб., P5 −8,3 млн руб., P95 81,0 млн руб., вероятность убытка 8,9 %.\nУкажи допущения, которые наиболее вероятно искажают результат, перечисли данные, которые нужны для проверки каждого, и предложи способ проверки в Excel. Не пересчитывай результат.\n```\n\nПредложенные проверки выполняются на модели: изменение параметров распределения и повторный расчет статистик.\n\n## 10. Итоги занятия\n\n- Метод Монте-Карло преобразует вероятностные описания входов в распределение результата; из него получают среднее, перцентили и вероятность убытка.\n- Значения с нужным распределением строятся из равномерных чисел обратными функциями; для воспроизводимости числа фиксируются.\n- Среднее симуляции отличается от детерминированной NPV на модальных значениях; вероятность убытка и интервал P5–P95 дополняют среднее.\n- Точность оценивается стандартной ошибкой и диаграммой сходимости; хвостовые статистики требуют больше итераций.\n- Корреляции входов с результатом показывают основной фактор риска, но результат зависит от выбранных распределений и допущения о независимости.\n\n## Практика: симуляция NPV проекта\n\n**Задача.** Проверить готовую модель Монте-Карло на 1000 итераций, рассчитать статистики результата, оценить сходимость и определить основной фактор риска.\n\n**Файл.** [lesson-9.2.xlsx](materials/lesson-9.2.xlsx). Пошаговые инструкции находятся на листе «Задание», контрольные значения – на листе «Контроль» внутри книги.\n\n**Что нужно сделать.**\n\n1. Проверить формулы листа `Simulation`: базовую строку 3, обратные функции входов и фиксированность чисел U1–U3.\n2. Рассчитать на листе «Результаты» среднее, σ, минимум, максимум, перцентили 5, 50 и 95 %, вероятность убытка и стандартную ошибку среднего.\n3. Заполнить таблицу сходимости (N = 100, 250, 500, 1000), построить диаграмму и оценить нестабильность на копии листа с `СЛЧИС()`.\n4. Рассчитать корреляции NPV с входами, определить основной фактор и оценить влияние увеличения σ цены до 150.\n5. Записать вывод для решения (среднее, интервал P5–P95, вероятность убытка, основной фактор) и два ограничения метода.\n\n**Результат.** Книга с рассчитанными статистиками и заполненным листом «Контроль».\n"}, "tests": {"midterm": "---\ntitle: \"Промежуточный тест: дни 1–5\"\nsummary: \"Пятнадцать вопросов для самопроверки по дням 1–5: архитектура книги и формулы, Power Query, модель данных и DAX, чувствительность, сценарии и стресс-тесты. Ответ выбирается без подсказок; после проверки к неверным ответам нужно вернуться в соответствующее занятие.\"\n---\n\n# Промежуточный тест: дни 1–5\n\n## День 1. Архитектура книги и формулы: вопрос 1\n\n```quiz\nquestion: Что такое молчаливая ошибка?\nA: Ошибка, при которой Excel выводит #ЗНАЧ!, но книга продолжает работать\nB: Неверный результат, при котором Excel не выводит сообщения об ошибке\nC: Ошибка в формуле, скрытая функцией ЕСЛИОШИБКА по умолчанию\nD: Ошибка, возникающая только при пересчете в режиме «Вручную»\ncorrect: B\nexplanation: Молчаливая ошибка не сопровождается сообщением: формула вычисляется, но результат неверен. Поэтому нужны контрольные суммы и диагностика (занятие 1.1).\n```\n\n## День 1. Архитектура книги и формулы: вопрос 2\n\n```quiz\nquestion: В формуле налога записано `=B5*0,2`. Как следует поступить по правилу об изменяемых числах?\nA: Оставить как есть: константа 0,2 понятна из контекста\nB: Заменить на значение, записанное в ячейке слоя предпосылок, и сослаться на нее по имени или адресу\nC: Заменить 0,2 на 20 %: так формула станет читаемее\nD: Скрыть столбец с формулой, чтобы значение не изменили случайно\ncorrect: B\nexplanation: Изменяемая величина записывается в одной ячейке предпосылок. При изменении ставки правится одна ячейка, а не каждая формула.\n```\n\n## День 1. Архитектура книги и формулы: вопрос 3\n\n```quiz\nquestion: Как правильно рассчитать средневзвешенную цену по строкам, если веса находятся в диапазоне B2:B10, а цены в C2:C10?\nA: =СРЗНАЧ(C2:C10)\nB: =СУММПРОИЗВ(B2:B10;C2:C10)/СУММ(B2:B10)\nC: =СУММ(B2:B10*C2:C10)\nD: =СУММПРОИЗВ(B2:B10;C2:C10)/СЧЁТ(C2:C10)\ncorrect: B\nexplanation: Сумма произведений весов на значения делится на сумму весов. Простое среднее игнорирует веса, деление на число строк не нормирует их.\n```\n\n## День 2. Power Query: вопрос 1\n\n```quiz\nquestion: Почему отмену свертывания (unpivot) выполняют по варианту «Отменить свертывание других столбцов»?\nA: Так формируется меньше строк\nB: При появлении нового месяца новый столбец автоматически попадает в данные без правки запроса\nC: Этот вариант быстрее для источников из папки\nD: Другие варианты не поддерживают тип «Текст»\ncorrect: B\nexplanation: Выбор столбцов с названиями месяцев закрепляет их в запросе. Вариант «других столбцов» фиксирует только неизменяемые столбцы, остальные становятся строками.\n```\n\n## День 2. Power Query: вопрос 2\n\n```quiz\nquestion: В столбце «Сумма» источник содержит заполнители «н/д» и «-». Во что их следует преобразовать?\nA: В ноль: данных нет, значит значение нулевое\nB: В null: отсутствующее значение не участвует в подсчете количества и среднего\nC: В пустую строку, оставив столбец текстовым\nD: Удалить строки с такими значениями\ncorrect: B\nexplanation: Ноль искажает среднее и количество, а удаление строк меняет число записей. Отсутствие данных кодируется null.\n```\n\n## День 2. Power Query: вопрос 3\n\n```quiz\nquestion: Фактические продажи по точкам и месяцам объединяются с планом. Прямое слияние с транзакциями дублирует план. Что делать?\nA: Использовать внутреннее соединение вместо левого внешнего\nB: Сначала сгруппировать факт до уровня «точка × месяц», затем слить с планом по двум ключам\nC: Удалить дубликаты в плане после слияния\nD: Заменить слияние добавлением запросов\ncorrect: B\nexplanation: План имеет гранулярность «точка × месяц», транзакции мельче. Перед слиянием уровни детализации выравнивают, иначе значение плана повторяется для каждой транзакции.\n```\n\n## День 3. Модель данных и DAX: вопрос 1\n\n```quiz\nquestion: Почему плоская таблица может давать верный общий итог и неверный разрез по регионам?\nA: Итог в плоской таблице всегда завышен\nB: Атрибут региона хранится в каждой строке факта и может расходиться для одной точки; разрез строится по ошибочным значениям\nC: Сводная таблица не умеет группировать текстовые поля\nD: Региональные итоги не суммируются в общий\ncorrect: B\nexplanation: В плоской таблице атрибуты повторены в каждой строке, поэтому одна точка может оказаться в двух регионах. В модели данных регион хранится один раз в справочнике.\n```\n\n## День 3. Модель данных и DAX: вопрос 2\n\n```quiz\nquestion: Каким условием определяется связь «один ко многим» между справочником точек и таблицей фактов?\nA: Код точки в справочнике уникален, в таблице фактов повторяется\nB: Код точки уникален в обеих таблицах\nC: Код точки может повторяться в справочнике, но не в таблице фактов\nD: Обе таблицы содержат одинаковое число строк\ncorrect: A\nexplanation: На стороне «один» (справочник) ключ уникален, на стороне «многие» (факты) повторяется. Дубликат в справочнике делает связь невозможной.\n```\n\n## День 3. Модель данных и DAX: вопрос 3\n\n```quiz\nquestion: Как корректно вычислить среднюю цену в мере DAX, если в таблице есть выручка и количество?\nA: AVERAGE(FactSales[Цена строки])\nB: DIVIDE(SUM(FactSales[Выручка]); SUM(FactSales[Количество]))\nC: SUM(FactSales[Цена строки]) / COUNTROWS(FactSales)\nD: MAX(FactSales[Цена строки])\ncorrect: B\nexplanation: Средняя цена – отношение суммарной выручки к суммарному количеству. Среднее из средних цен строк игнорирует различие весов и завышает результат.\n```\n\n## День 4. Чувствительность: вопрос 1\n\n```quiz\nquestion: Значения цены записаны в столбце по вертикали. Какое поле диалога «Таблица данных» заполняется для однофакторной таблицы?\nA: «Подставлять значения по строкам в»\nB: «Подставлять значения по столбцам в»\nC: Оба поля\nD: Ни одно: Excel определяет ячейку автоматически\ncorrect: B\nexplanation: Поле выбирается по расположению списка тестовых значений: вертикальный список – по столбцам.\n```\n\n## День 4. Чувствительность: вопрос 2\n\n```quiz\nquestion: Эластичность NPV по цене равна 7,35. Как это читать?\nA: Около базовой точки рост цены на 1 % изменяет NPV примерно на 7,35 % при прочих равных\nB: Рост цены на 7,35 руб. увеличивает NPV на 1 млн руб.\nC: Вероятность роста NPV равна 7,35 %\nD: NPV в 7,35 раза превышает выручку\ncorrect: A\nexplanation: Эластичность – отношение относительных изменений результата и предпосылки. Это локальная характеристика, а не вероятность.\n```\n\n## День 4. Чувствительность: вопрос 3\n\n```quiz\nquestion: Что обязательно выполняется после «Подбора параметра» на модели?\nA: Ничего: результат сохраняется для следующих расчетов\nB: Найденное значение записывается отдельно, предпосылка возвращается к базе, проверяется базовый NPV\nC: Модель закрывается без сохранения\nD: Подбор повторяется до совпадения с целью\ncorrect: B\nexplanation: Подбор параметра записывает найденное значение во входную ячейку и тем самым меняет модель. Без возврата к базе следующие расчеты выполняются на искаженной точке.\n```\n\n## День 5. Сценарии и стресс-тесты: вопрос 1\n\n```quiz\nquestion: Чем сценарий отличается от однофакторной чувствительности?\nA: Сценарий задает вероятность каждого исхода\nB: Сценарий меняет согласованный набор предпосылок, чувствительность – одну при неизменных остальных\nC: Сценарий применяется только к затратам\nD: Сценарий строится только с помощью таблицы данных\ncorrect: B\nexplanation: Различие в постановке: сценарий описывает целостное состояние, где предпосылки связаны общей причиной. Вероятность сценарию не приписывается.\n```\n\n## День 5. Сценарии и стресс-тесты: вопрос 2\n\n```quiz\nquestion: После переключения сценария выручка 2024 года изменилась. Что это означает?\nA: Так и должно быть: сценарий меняет всю шкалу времени\nB: Фактический слой подключен к сценарным предпосылкам ошибочно\nC: Изменилась ставка дисконтирования\nD: Нужно обновить список проверки данных\ncorrect: B\nexplanation: Исторические данные не зависят от предположений о будущем. Неизменность факта – основной инвариант сценарной модели.\n```\n\n## День 5. Сценарии и стресс-тесты: вопрос 3\n\n```quiz\nquestion: Для NPV = 0 критический коэффициент интенсивности k равен 47,5 %. Какая формулировка корректна?\nA: Вероятность отрицательного NPV составляет 47,5 %\nB: При прохождении 47,5 % пути от базы к полному стрессу NPV пересекает ноль при заданном стресс-векторе\nC: Модель выдерживает любой стресс до 47,5 % по всем KPI\nD: В 47,5 % случаев NPV окажется ниже нуля\ncorrect: B\nexplanation: Коэффициент k – индекс интенсивности заданного вектора, а не вероятность. Он определен только вместе с KPI и порогом.\n```\n", "final": "---\ntitle: \"Итоговый тест: дни 6–9\"\nsummary: \"Двадцать вопросов для самопроверки по дням 6–9: статистика и прогнозирование, автоматизация на VBA, дашборды и BI, оптимизация и Monte Carlo, а также сквозные вопросы курса. После проверки к неверным ответам нужно вернуться в соответствующее занятие.\"\n---\n\n# Итоговый тест: дни 6–9\n\n## День 6. Статистика и прогнозирование: вопрос 1\n\n```quiz\nquestion: Почему качество прогнозной модели нельзя оценивать на тех же данных, на которых она строилась?\nA: Потому что на истории модель всегда дает нулевую ошибку\nB: Потому что Excel не позволяет считать ошибку на истории\nC: Потому что история всегда содержит выбросы\nD: Потому что хорошее совпадение с историей показывает лишь описание уже виденных данных, а не способность прогнозировать\ncorrect: D\nexplanation: Для проверки прогноза нужен holdout: период, который модель не видела. Совпадение с обучающей выборкой не доказывает качества на будущем.\n```\n\n## День 6. Статистика и прогнозирование: вопрос 2\n\n```quiz\nquestion: Для какого случая MAPE ненадежна?\nA: Когда фактические значения близки к нулю\nB: Когда ряд имеет тренд\nC: Когда ряд имеет сезонность\nD: Когда горизонт прогноза превышает год\ncorrect: A\nexplanation: MAPE делит ошибку на факт; при значениях около нуля процентная ошибка становится очень большой и нестабильной.\n```\n\n## День 6. Статистика и прогнозирование: вопрос 3\n\n```quiz\nquestion: Что такое rolling backtest?\nA: Прогноз на один период вперед по всей истории\nB: Подбор параметров ETS по минимуму ошибки на истории\nC: Сглаживание ряда скользящим средним\nD: Повторная проверка модели в нескольких origin с оценкой на следующих периодах\ncorrect: D\nexplanation: Rolling backtest строит модель по истории до каждого origin и оценивает прогноз на следующих периодах; это дает оценку по горизонтам.\n```\n\n## День 6. Статистика и прогнозирование: вопрос 4\n\n```quiz\nquestion: Что показывает рабочий горизонт?\nA: Максимальную дальность, на которой backtest подтверждает приемлемое качество по заранее заданному критерию\nB: Максимальную дальность прогноза, которую позволяет построить Excel\nC: Число периодов в обучающей выборке\nD: Период, за который ряд полностью обновляется\ncorrect: A\nexplanation: Рабочий горизонт определяется по результатам backtest и заданному критерию качества, а технический горизонт лишь описывает возможности функции.\n```\n\n## День 7. Автоматизация на VBA: вопрос 1\n\n```quiz\nquestion: Зачем в макросе определяют последнюю заполненную строку, а не записывают номер строки в код?\nA: Код продолжает работать при изменении числа строк в данных\nB: Это ускоряет открытие книги\nC: Это защищает книгу от изменений\nD: Это требуется синтаксисом VBA\ncorrect: A\nexplanation: Фиксированный номер строки перестает соответствовать данным после их роста или сокращения. Расчет последней строки делает код устойчивым.\n```\n\n## День 7. Автоматизация на VBA: вопрос 2\n\n```quiz\nquestion: Почему параметры расчета (например, порог отклонения) выносят в ячейки листа, а не в код макроса?\nA: Чтобы макрос работал быстрее\nB: Чтобы изменять правило без правки кода и сохранить прозрачность модели\nC: Чтобы макрос можно было запускать без включения макросов\nD: Потому что VBA не поддерживает константы\ncorrect: B\nexplanation: Параметры в ячейках изменяются пользователем без обращения к коду и видны в модели. Значения в коде скрыты и требуют правки процедуры.\n```\n\n## День 7. Автоматизация на VBA: вопрос 3\n\n```quiz\nquestion: Для чего ведется журнал выполнения автоматизации?\nA: Для увеличения скорости обработки\nB: Для замены контрольных сумм\nC: Для защиты кода паролем\nD: Для фиксации того, что обработано и какие ошибки возникли, чтобы результат можно было проверить\ncorrect: D\nexplanation: Журнал записывает обработанные объекты, время и ошибки; без него невозможно установить, что именно сделал макрос и где он остановился.\n```\n\n## День 7. Автоматизация на VBA: вопрос 4\n\n```quiz\nquestion: При пакетной обработке файлов один файл содержит ошибку формата. Какое поведение корректно?\nA: Записать ошибку в журнал, пропустить файл и продолжить обработку остальных\nB: Остановить всю обработку без сообщения\nC: Заменить ошибочные значения нулями\nD: Удалить файл из папки\ncorrect: A\nexplanation: Обработка должна быть устойчивой: ошибка фиксируется, остальные файлы обрабатываются, итог показывает, какие файлы не вошли в расчет.\n```\n\n## День 8. Дашборды и BI: вопрос 1\n\n```quiz\nquestion: Что является основным требованием к управленческому дашборду?\nA: Максимальное число диаграмм на одном экране\nB: Использование только круговых диаграмм\nC: Отсутствие фильтров\nD: Ответ на заранее определенные управленческие вопросы с контрольными числами, сверенными с моделью\ncorrect: D\nexplanation: Дашборд строится от вопросов пользователя, а его показатели сверяются с расчетной моделью. Число визуальных элементов не является целью.\n```\n\n## День 8. Дашборды и BI: вопрос 2\n\n```quiz\nquestion: Почему доля или процентный показатель не должен суммироваться по группам?\nA: Потому что Excel не суммирует проценты\nB: Потому что проценты нельзя фильтровать\nC: Потому что сумма долей групп не равна доле итога; показатель нужно пересчитывать из числителя и знаменателя\nD: Потому что проценты хранятся как текст\ncorrect: C\nexplanation: Отношение в итоге равно отношению сумм, а не сумме отношений. В BI показатель задается формулой агрегации числителя и знаменателя.\n```\n\n## День 8. Дашборды и BI: вопрос 3\n\n```quiz\nquestion: Что необходимо выполнить при переносе модели из Excel в BI-систему?\nA: Ничего: результаты совпадут автоматически\nB: Удалить все вычисляемые показатели\nC: Заменить все диаграммы таблицами\nD: Приемку: сравнить значения BI и Excel в нескольких контекстах фильтров\ncorrect: D\nexplanation: Различия в агрегации, типах и фильтрах приводят к расхождениям. Приемка по нескольким контекстам выявляет их до использования дашборда.\n```\n\n## День 8. Дашборды и BI: вопрос 4\n\n```quiz\nquestion: Какова основная роль слоя данных (датасета) в BI?\nA: Оформление дашборда\nB: Рассылка отчетов\nC: Единое определение полей и показателей для всех чартов\nD: Хранение паролей пользователей\ncorrect: C\nexplanation: Датасет содержит типы, роли полей и показатели; чарты используют их повторно, поэтому определение показателя не копируется в каждый отчет.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 1\n\n```quiz\nquestion: Решена линейная задача симплекс-методом. Теневая цена ограничения равна 0. Что это означает?\nA: Ограничение нарушено\nB: Ограничение не является активным: увеличение лимита не повысит цель\nC: Задача не имеет решения\nD: Решение найдено неверно\ncorrect: B\nexplanation: Нулевая теневая цена означает, что ограничение не сужает оптимум; ресурс использован не полностью.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 2\n\n```quiz\nquestion: В задаче выбора проектов жадное правило по индексу рентабельности дало NPV 44,5, а Solver с бинарными переменными – 47,1. Как объясняется разница?\nA: Solver ошибается из-за округления\nB: Бинарные переменные допускают доли проектов\nC: Жадное правило не учитывает остаток бюджета и не гарантирует оптимума\nD: Индекс рентабельности рассчитан неверно\ncorrect: C\nexplanation: Правило выбирает проекты по очереди и не анализирует сочетания; точное решение перебирает допустимые наборы и учитывает использование всего бюджета.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 3\n\n```quiz\nquestion: Какое значение целевой функции в задаче с долями проектов (0 ≤ x ≤ 1) по сравнению с бинарной задачей?\nA: Меньше или равно\nB: Больше или равно\nC: Всегда равно\nD: Не сравнивается\ncorrect: B\nexplanation: Допустимое множество релаксации шире, поэтому максимум не меньше. Значение релаксации служит верхней границей целочисленного оптимума.\n```\n\n## День 9. Оптимизация и Monte Carlo: вопрос 4\n\n```quiz\nquestion: Симуляция Monte Carlo построена на формулах с СЛЧИС(). Что нужно сделать, чтобы результаты можно было проверить и воспроизвести?\nA: Ничего: СЛЧИС() дает одинаковые числа\nB: Увеличить число формул СЛЧИС() в два раза\nC: Зафиксировать случайные числа значениями и указать число итераций\nD: Пересчитать книгу вручную через F9 до совпадения\ncorrect: C\nexplanation: СЛЧИС() меняется при каждом пересчете. Сохраненные значения U(0;1) делают результат воспроизводимым и проверяемым.\n```\n\n## Сквозные вопросы: вопрос 1\n\n```quiz\nquestion: Модель, построенная в Excel, выдает правдоподобные числа. Какое действие наиболее надежно подтверждает ее корректность?\nA: Оформление листов по единому стилю\nB: Контрольные значения, воспроизводимые независимым расчетом\nC: Защита листов паролем\nD: Отсутствие сообщений об ошибках\ncorrect: B\nexplanation: Правдоподобие и отсутствие ошибок не гарантируют верности. Независимый расчет контрольных значений выявляет молчаливые ошибки.\n```\n\n## Сквозные вопросы: вопрос 2\n\n```quiz\nquestion: Какой инструмент подходит для вопроса «при каком значении цены NPV станет равен нулю»?\nA: Монте-Карло с 1000 итераций\nB: Круговая диаграмма\nC: Поиск критического значения (подбор параметра)\nD: Сводная таблица\ncorrect: C\nexplanation: Критическое значение находится решением уравнения NPV(цена) = 0, например подбором параметра. Симуляция оценивает распределение, а не конкретную точку.\n```\n\n## Сквозные вопросы: вопрос 3\n\n```quiz\nquestion: Какой вопрос лучше всего решается оптимизацией, а не сценарным анализом?\nA: Какой будет NPV при падении цены на 10 %?\nB: Какие значения управляемых переменных дают максимальную цель при ограничениях?\nC: Как изменится прибыль при росте ставки?\nD: Какова вероятность убытка?\ncorrect: B\nexplanation: Оптимизация подбирает управляемые переменные при ограничениях. Остальные вопросы описывают последствия заданных значений или вероятность событий.\n```\n\n## Сквозные вопросы: вопрос 4\n\n```quiz\nquestion: Какой набор методов отвечает на вопрос «какова вероятность убытка проекта при заданных распределениях входов»?\nA: Монте-Карло с распределениями входов\nB: Анализ чувствительности по одному фактору\nC: Сценарии «базовый, оптимистичный, пессимистичный»\nD: Оптимизация Solver\ncorrect: A\nexplanation: Вероятность события определяется по распределению результата, которое дает симуляция. Чувствительность и сценарии вероятностей не оценивают.\n```\n"}, "exam": ""}, "en": {"title": "Инструменты для анализа финансовых данных I", "overview": "Учебник сопровождает курс «Инструменты для анализа финансовых данных I»: девять учебных дней по два занятия. Каждое занятие состоит из теории с примерами, коротких вопросов для самопроверки и практического задания, которое выполняется на учебной рабочей книге.\n\n### Как работать с учебником\n\n1. Читайте занятие по порядку и отвечайте на вопросы после разделов. Неверный ответ не раскрывает правильный вариант: вернитесь к тексту.\n2. Файлы к занятию скачивайте по ссылке в начале задания и выполняйте шаги по порядку. В каждой части даны контрольные числа, по которым можно проверить себя.\n3. Если шаг не получается, не пропускайте его молча: запишите, где остановились, и вернитесь к соответствующему разделу.\n\n### Требования\n\nMicrosoft Excel 2021 или Microsoft 365 под Windows. Названия команд приведены по русскому интерфейсу.\n", "lessons": {"1.1": "---\ntitle: \"Архитектура рабочей книги и средства контроля расчетов\"\nsummary: \"Слоистая структура расчетной книги, оформление предпосылок, структурированные таблицы, цветовые соглашения, контрольные суммы и встроенные средства диагностики Excel.\"\nsource: \"materials/lesson-1.1.xlsx\"\nconcepts:\n  - \"Слои книги :: Разделение книги на данные, предпосылки, расчеты и представление по характеру и частоте изменений.\"\n  - \"Предпосылка :: Управляемая величина (ставка, норматив, коэффициент), записанная в одной ячейке с указанием источника; формулы ссылаются на эту ячейку.\"\n  - \"Числовая константа в формуле :: Изменяемое число, записанное непосредственно в формуле, например `=C8*0,15`. В расчетном слое является дефектом.\"\n  - \"Структурированная таблица :: Именованный диапазон с автоматическим расширением, вычисляемыми столбцами и ссылками на столбцы по названиям. Создается командой Ctrl+T.\"\n  - \"Именованный диапазон :: Имя, присвоенное ячейке или диапазону. Для предпосылок область действия задается «Книга».\"\n  - \"Контрольная сумма :: Формула, проверяющая равенство, которое выполняется при корректном расчете, и выводящая результат проверки.\"\n  - \"Молчаливая ошибка :: Неверный результат, при котором Excel не выводит сообщения об ошибке.\"\n---\n\n# Архитектура рабочей книги и средства контроля расчетов\n\n## Цели и требования\n\nВ Excel нет автоматической проверки расчетов, поэтому неверный результат часто появляется без всяких сообщений об ошибке. На занятии разбирается, как строить книги, в которых такие дефекты маловероятны, и как находить их в готовых книгах.\n\nПосле занятия нужно уметь:\n\n- разделять содержимое книги на четыре слоя и находить элементы, лежащие не в своем слое;\n- выносить предпосылки в отдельные именованные ячейки и ссылаться на них в формулах;\n- создавать структурированные таблицы и применять структурированные ссылки;\n- применять цветовое кодирование и документировать источник вводимых значений;\n- формировать контрольные суммы;\n- искать дефекты встроенными средствами Excel.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. Названия команд приведены по русскому интерфейсу. Учебный файл `lesson-1.1.xlsx` содержит отчет вымышленной розничной сети «Северный двор» за I квартал 2026 г.: лист «Отчет» (8 торговых точек), лист «Данные доп» (выгрузка из учетной системы) и лист «Свод» (сводные показатели). Файл содержит преднамеренные дефекты, исправления в него на этом этапе не вносятся.\n\n## 1. Молчаливые ошибки на примере учебной книги\n\nМолчаливая ошибка – это неверный результат, о котором Excel не сообщает. Формулы считаются, файл открывается, числа выглядят правдоподобно. Такие ошибки опаснее видимых (`#ДЕЛ/0!`, `#ИМЯ?`): их не замечают, и неверный результат попадает в отчет.\n\nВ учебной книге присутствуют два типичных случая.\n\n**Случай 1. Предпосылка не участвует в расчете.** На листе «Отчет» в ячейке B5 указан норматив аренды 15 %. При замене значения на 18 % итоговая прибыль не изменяется. Причина – формула аренды содержит норматив в виде числа:\n\n```formula\n=C8*0,15\n```\n\nЯчейка B5 выглядит как предпосылка, но формулы на нее не ссылаются. Так же устроена ставка НДС: в столбце D она записана как `=C8/1,2`, а ячейка B4 нигде не используется.\n\n**Случай 2. Диапазон суммирования не охватывает все строки.** Выручка восьми точек (диапазон C8:C15) составляет 67 835 000 руб., итоговая строка показывает 63 575 000 руб. Расхождение 4 260 000 руб. равно выручке точки № 8 «Луговая». Итоговую формулу составили до добавления восьмой строки и не обновили:\n\n```formula\n=СУММ(C8:C14)\n```\n\n> [!WARNING]\n> Если Excel не сообщает об ошибке, это не значит, что расчет верен. Правильность проверяют отдельно: контрольными суммами, изменением входных данных, трассировкой зависимостей.\n\nКнига считается надежной, если ее результат остается верным после изменения данных и предпосылок и если другой человек может проверить расчет без помощи автора.\n\n### Порядок проверки незнакомой книги\n\n1. Просмотреть листы и понять, какие из них участвуют в расчете.\n2. Включить показ формул (`Ctrl+``) и сравнить формулы в расчетных столбцах.\n3. Найти числа, введенные вручную в расчетных областях: F5 → «Выделить» → «Константы».\n4. Для каждой предпосылки найти зависимые ячейки.\n5. Изменить одно исходное значение и записать, какие показатели не пересчитались.\n6. Сверить итоги с независимым подсчетом: суммой в строке состояния или сводной таблицей.\n\n```quiz\nquestion: После изменения значения в ячейке B5 итоговая прибыль не изменилась. Что это означает?\nA: Включен ручной режим пересчета\nB: Ячейка B5 защищена от изменений\nC: Формулы не ссылаются на B5, норматив записан в них числом\nD: Формат ячейки B5 не допускает ввод процентов\ncorrect: C\nexplanation: Если формулы ссылаются на ячейку, ее изменение влияет на результат. Отсутствие реакции означает отсутствие связи. При ручном режиме пересчета (Формулы → Параметры вычислений) не обновлялись бы все формулы книги, а не результаты, зависящие от одной ячейки.\n```\n\n## 2. Слоистая архитектура\n\nРасчетная книга состоит из четырех слоев. Они различаются тем, откуда приходят изменения и как часто они вносятся.\n\n| Слой | Содержимое | Характер изменений | Пример из учебной книги |\n|---|---|---|---|\n| Данные | Первичные сведения из внешних источников | Обновляются целиком, регулярно | Выручка и прочие расходы по точкам |\n| Предпосылки | Управляемые величины: ставки, нормативы, коэффициенты | Изменяются точечно, на основании решения | НДС, норматив аренды, доля ФОТ, индекс роста |\n| Расчеты | Формулы, преобразующие данные и предпосылки в результат | Изменяются при пересмотре методики | Выручка без НДС, аренда, прибыль, маржа |\n| Представление | Отчеты, сводки, графики | Изменяются при изменении формы выдачи | Лист «Свод» |\n\nСлои разделяют так, чтобы обновление данных не требовало правки формул, смена предпосылки не требовала правки данных, а изменение формы отчета не затрагивало расчеты.\n\nЧто дает разделение слоев:\n\n1. **Единственность источника.** Каждая изменяемая величина записывается один раз, остальные ячейки ссылаются на нее.\n2. **Сценарный анализ.** Если предпосылки собраны в одном месте, их набор можно заменить целиком и сравнить результаты.\n3. **Заменяемость данных.** Новая выгрузка загружается без изменения формул.\n4. **Проверяемость.** Можно узнать, откуда взято каждое значение.\n\n### Правило о числовых константах\n\nИзменяемое число внутри расчетной формулы – дефект. Допустимы числа, которые следуют из определения показателя и не пересматриваются: 12 месяцев в году, 100 при переводе доли в проценты, 1000 при переводе рублей в тысячи. Ставка налога, норматив аренды, доля ФОТ и индекс роста – управляемые величины, их хранят в слое предпосылок.\n\nЧисловые константы в учебной книге:\n\n| Расположение | Константа | Последствие |\n|---|---|---|\n| Столбец D | `/1,2` (ставка НДС) | При изменении ставки нужно править формулы в восьми строках |\n| Столбец E | `*0,15` (норматив аренды) | Предпосылка B5 существует, но не используется |\n| Столбец F | `*0,22` (доля ФОТ) | Отдельной предпосылки нет |\n| Ячейка C21 | `*1,07` (индекс роста выручки) | Источник значения не указан |\n\nОтдельные случаи:\n\n- **E13.** Множитель `0,18` вместо `0,15`. По одной книге нельзя понять, ошибка это или особое условие договора. Дефект здесь в том, что нет пояснения.\n- **E11.** Вместо формулы введено число 1 691 250. Сейчас оно совпадает с результатом расчета (11 275 000 × 0,15), поэтому сверка итогов дефект не покажет. Но при изменении выручки точки № 4 значение в E11 не пересчитается.\n- **C19.** «Средняя маржа по точкам» считается как простое среднее: точки с разной выручкой получают одинаковый вес. Маржа по сети – это прибыль сети, деленная на выручку сети без НДС. Результаты различаются: 47,03 % и 47,86 %.\n\n> [!NOTE]\n> Дефект сопровождаемости – это и неверное значение, и невозможность понять, верно ли оно. Поэтому любое исключение из общего правила (как E13) сопровождают пояснением.\n\nОпаснее всего дефекты, которые на текущих данных дают верный результат, а после изменения данных – неверный. Их находят не просмотром, а изменением данных.\n\n```quiz\nquestion: Какая константа допустима внутри расчетной формулы?\nA: Ставка НДС 20 % в формуле выручки без НДС\nB: Норматив аренды 15 % в формуле аренды\nC: Число 12 в формуле перевода годового показателя в месячный\nD: Индекс роста выручки 1,07 в формуле плана\ncorrect: C\nexplanation: Число месяцев в году следует из определения показателя и не пересматривается. Ставка налога, норматив аренды и индекс роста являются управляемыми величинами и размещаются в слое предпосылок.\n```\n\n## 3. Предпосылки и именованные диапазоны\n\nПредпосылки размещаются на отдельном листе («Предпосылки») в виде таблицы со столбцами: название, значение, единица измерения или период действия, источник. Значение вводится один раз.\n\n| Название | Значение | Источник |\n|---|---|---|\n| Ставка НДС | 20 % | Налоговый кодекс РФ, ст. 164 |\n| Норматив аренды от выручки | 15 % | Типовой договор аренды, редакция 2025 г. |\n| Доля ФОТ от выручки без НДС | 22 % | Штатное расписание, утверждено 10.01.2026 |\n| Индекс роста выручки | 1,07 | Решение бюджетного комитета, протокол № 3 от 12.01.2026 |\n\nВ источнике указывают, откуда взято значение, когда оно установлено и кем (каким документом) утверждено. По записи «индекс 1,07» нельзя понять, актуально ли значение. По записи «индекс роста выручки 7 % – решение бюджетного комитета от 12.01.2026» – можно.\n\n### Присвоение имен\n\nИмя присваивается выделенной ячейке одним из способов:\n\n- ввод имени в поле имен слева от строки формул с подтверждением клавишей Enter;\n- «Формулы» → «Присвоить имя» или диспетчер имен (**Ctrl+F3**);\n- выделение блока из подписей и значений и команда «Создать из выделенного» (**Ctrl+Shift+F3**): имена создаются по подписям.\n\nФормула с именем:\n\n```formula\n=C8*Норматив_аренды\n```\n\nТребования к именам:\n\n- имя не начинается с цифры и не содержит пробелов (для разделения слов используется подчеркивание);\n- имя не совпадает с адресом ячейки (`Q1`, `R2C3`, `НДС1` недопустимы);\n- регистр букв не различается.\n\nОбласть действия имени задается при создании. Для предпосылок выбирается **«Книга»**. Имя с областью «Лист» работает только на своем листе: на другом листе формула с таким именем возвращает `#ИМЯ?`, хотя записана верно.\n\nКлавиша **F3** при вводе формулы открывает список имен для вставки. Кнопка «Вставить список» формирует на листе перечень имен и адресов, что используется при документировании.\n\nИмя, которое ссылается на число (`=0,15`), а не на ячейку, не используют: предпосылка должна быть видна на листе.\n\n> [!WARNING]\n> Именуются предпосылки и величины, на которые выполняется много ссылок. Именование всех ячеек ухудшает читаемость.\n\n### Проверка данных\n\nКоманда «Данные» → «Проверка данных» ограничивает допустимые значения ячейки. Для долей применяется тип «Действительное», условие «между», границы от 0 до 1. Вкладка «Сообщение для ввода» содержит пояснение, отображаемое при выборе ячейки; вкладка «Сообщение об ошибке» – текст при недопустимом вводе. Тип оповещения «Остановка» блокирует ввод, «Предупреждение» допускает ввод после подтверждения.\n\nПроверка действует только на новый ввод. Значения, введенные до ограничения, находят командой «Обвести неверные данные».\n\nЧастая ошибка – ввод не в том порядке величины (20 вместо 0,2). Ограничение «от 0 до 1» такой ввод не пропустит.\n\n```quiz\nquestion: Формула с именем `Ставка_НДС` возвращает `#ИМЯ?`, хотя имя существует и написано без опечаток. Какая причина наиболее вероятна?\nA: Имя содержит символ подчеркивания\nB: Имя создано с областью действия «Лист» и недоступно на другом листе\nC: Ячейка со ставкой имеет процентный формат\nD: Имя создано позже, чем формула\ncorrect: B\nexplanation: Имя с областью «Лист» используется только на своем листе. Для предпосылок выбирается область «Книга». Подчеркивание допустимо, формат ячейки и порядок создания на доступность имени не влияют.\n```\n\n## 4. Структурированные таблицы\n\nДиапазон данных преобразуется в таблицу командой **Ctrl+T** («Вставка» → «Таблица») с признаком «Таблица с заголовками». Имя таблицы (по умолчанию `Таблица1`) изменяется на вкладке «Конструктор», например на `Точки`.\n\nСвойства таблицы, существенные для надежности расчета:\n\n1. Таблица расширяется при добавлении строки под ней. Ссылки на таблицу охватывают новую строку без изменения формул. Это исключает дефект вида `=СУММ(C8:C14)`.\n2. Формула вычисляемого столбца автоматически копируется на весь столбец, включая новые строки.\n3. Число, введенное вручную в вычисляемый столбец, становится заметным исключением: Excel помечает такую ячейку. Так находят ячейки вида E11.\n4. К столбцам таблицы можно обращаться по названиям.\n\n### Структурированные ссылки\n\nОбычная ссылка и структурированная ссылка для расчета прибыли:\n\n```formula\n=D8-E8-F8-G8\n=[@[Выручка без НДС, руб.]]-[@[Аренда, руб.]]-[@[ФОТ, руб.]]-[@[Прочие расходы, руб.]]\n```\n\nВ структурированной ссылке видно, что это за величина, и она не зависит от положения столбца: при вставке нового столбца ссылка остается верной.\n\n| Запись | Значение |\n|---|---|\n| `[@Столбец]` | значение из текущей строки таблицы |\n| `Точки[Столбец]` | все значения столбца (без заголовка и итогов) |\n| `Точки[[#Заголовки];[Столбец]]` | ячейка заголовка столбца |\n| `Точки[[#Итого];[Столбец]]` | ячейка строки итогов |\n| `Точки[@[Столбец 1]:[Столбец 3]]` | диапазон столбцов в текущей строке |\n\nЕсли название столбца содержит пробелы, запятые или скобки, оно заключается в дополнительные квадратные скобки: `[@[Выручка без НДС, руб.]]`. При вводе формулы щелчком мыши по ячейкам Excel формирует запись автоматически.\n\nСтрока итогов включается на вкладке «Конструктор». В ней применяется функция `ПРОМЕЖУТОЧНЫЕ.ИТОГИ`, которая не учитывает строки, скрытые фильтром.\n\n### Объединенные ячейки\n\nТаблицу нельзя создать на диапазоне с объединенными ячейками. Объединение мешает сортировке и фильтрации, ломает копирование формул и перемещение по ячейкам стрелками. Для заголовков вместо него используют выравнивание по центру выделения (Формат ячеек → Выравнивание → по горизонтали: по центру выделения): ячейки остаются раздельными.\n\n```quiz\nquestion: Что происходит при добавлении строки в конец структурированной таблицы?\nA: Формулы вычисляемых столбцов копируются в новую строку, ссылки на таблицу охватывают ее\nB: Значения новой строки заполняются средними по столбцам\nC: Excel запрашивает подтверждение пересчета книги\nD: Ничего, формулы необходимо копировать вручную\ncorrect: A\nexplanation: Это основное свойство таблицы. Формулы вычисляемых столбцов продолжаются автоматически, ссылки вида `Точки[Выручка]` учитывают новые строки без изменения.\n```\n\n## 5. Цветовое кодирование и документирование\n\nЦвет шрифта обозначает тип содержимого ячейки без анализа формулы.\n\n| Цвет шрифта | Содержимое ячейки |\n|---|---|\n| Синий | значение введено вручную: исходные данные и предпосылки |\n| Черный | формула со ссылками на ячейки того же листа |\n| Зеленый | формула со ссылкой на другой лист той же книги |\n| Красный | ссылка на другой файл |\n\nКрасный цвет требует повышенного внимания: внешний файл может быть перемещен или изменен, а сохраненное значение – устареть.\n\nЦвет лучше задавать стилями ячеек («Главная» → «Стили ячеек» → «Создать стиль ячейки»), а не вручную: тогда правило можно изменить в одном месте. Достаточно трех стилей: «Ввод» (синий шрифт), «Формула» (по умолчанию), «Связь» (зеленый шрифт).\n\nКроме того, единицы измерения указывают в заголовках столбцов («руб.», «тыс. руб.», «%»), а заголовки закрепляют командой «Вид» → «Закрепить области».\n\n### Журнал изменений и имя файла\n\nЖурнал изменений ведут на отдельном листе: дата, автор, что изменено, почему. Имя файла начинают с даты в формате `ГГГГ-ММ-ДД`: версии сортируются по времени, и не появляются названия вроде «отчет_итог_финал_2 (правки)» (такое имя стоит в ячейке A2 учебной книги).\n\n### Формат отображения и значение\n\nЧисловой формат меняет только то, как число выглядит. Ячейка может показывать `1,2`, а хранить 1,2345. Округлять нужно функцией `ОКРУГЛ`, а не форматом. Число, записанное как текст (например, `1 240 500,00` в выгрузке на листе «Данные доп»), выглядит как число, но функция `СУММ` его не учитывает. Признаки: выравнивание по левому краю и зеленый индикатор в углу ячейки.\n\n```quiz\nquestion: Ячейка содержит формулу `=Лист2!B5*Курс`. Каким цветом оформляется ее шрифт по принятому соглашению?\nA: Синим\nB: Черным\nC: Зеленым\nD: Красным\ncorrect: C\nexplanation: Формула ссылается на другой лист той же книги, для таких ячеек принят зеленый шрифт. Синий используется для вводимых значений, черный – для формул в пределах листа, красный – для внешних ссылок.\n```\n\n## 6. Средства диагностики Excel\n\n### Режим отображения формул\n\nСочетание **Ctrl+`** (клавиша слева от «1») включает отображение формул вместо значений. В столбце аренды значение 1 691 250 в ячейке E11 отличается от окружающих формул. Повторное нажатие возвращает отображение значений.\n\n### Выделение групп ячеек\n\nПорядок: выделить диапазон, нажать **F5**, нажать «Выделить», выбрать тип ячеек.\n\n| Тип | Результат |\n|---|---|\n| Константы | ячейки с введенными значениями (в диапазоне E8:E15 выделяется E11) |\n| Формулы → Ошибки | ячейки с ошибочными значениями |\n| Отличия по столбцам | ячейки, формулы которых отличаются от активной ячейки по структуре ссылок |\n\nКоманда лишь показывает факт. Константа в слое данных – не дефект, а константа в расчетном столбце требует разбора.\n\n### Трассировка зависимостей\n\nКоманды «Формулы» → «Влияющие ячейки» и «Зависимые ячейки» показывают связи стрелками. У ячейки B5 зависимых ячеек нет, значит, предпосылка не используется. Стрелки удаляются командой «Убрать стрелки». Сочетания **Ctrl+[** и **Ctrl+]** переходят к влияющим и зависимым ячейкам соответственно.\n\n### Вычисление формулы\n\nКоманда «Формулы» → «Вычислить формулу» выполняет формулу по шагам. Для проверки фрагмента его выделяют в строке формул и нажимают **F9**: фрагмент заменяется значением. После проверки нажимается Esc, иначе формула сохранится с подставленным значением.\n\n### Окно контрольного значения\n\nОкно контрольного значения («Формулы» → «Окно контрольного значения») показывает выбранные ячейки на любом листе. В него добавляют итоги и контрольные суммы.\n\n### Проверка наличия ошибок\n\nКоманда «Формулы» → «Проверка наличия ошибок» и зеленые индикаторы в углах ячеек сообщают, например, о формуле, которая не охватывает соседние ячейки, о числе, сохраненном как текст, о формуле, не похожей на соседние. Правила настраиваются в «Файл» → «Параметры» → «Формулы». Эти подсказки не заменяют полной проверки книги.\n\n```quiz\nquestion: Что выделяет команда F5 → «Выделить» → «Константы» в расчетном столбце, одна ячейка которого введена вручную?\nA: Все формулы столбца\nB: Только ячейку с введенным значением\nC: Выводит сообщение об ошибке из-за смешения типов\nD: Только ячейки с ошибками\ncorrect: B\nexplanation: Команда выделяет ячейки со значениями, а не формулами. В однородном расчетном столбце это ячейки-исключения. Решение, является ли значение дефектом, принимает пользователь.\n```\n\n## 7. Контрольные суммы\n\nКонтрольная сумма – это формула, которая проверяет равенство, обязанное выполняться при верном расчете, и выводит результат словом. Для учебной книги нужны минимум три проверки:\n\n1. Сумма выручки по точкам равна итогу по сети.\n2. Выручка без НДС равна сумме прибыли и всех видов расходов.\n3. Показатели листа «Свод» равны итоговым показателям листа «Отчет».\n\nОбщий вид:\n\n```formula\n=ЕСЛИ(ОКРУГЛ(A-B;2)=0;\"OK\";\"РАСХОЖДЕНИЕ\")\n```\n\nОкругление нужно, потому что дробные числа хранятся приближенно, и разность двух одинаковых по смыслу величин может быть не нулем, а числом порядка 1E-9. Для сумм в рублях хватает двух знаков, для долей – шести.\n\nПравила для контрольных сумм:\n\n- Результаты всех проверок сводят в одну ячейку и размещают ее на видном месте листа: `=ЕСЛИ(СЧЁТЕСЛИ(B2:B4;\"OK\")=3;\"OK\";\"ЕСТЬ РАСХОЖДЕНИЯ\")`.\n- Значение «РАСХОЖДЕНИЕ» выделяется условным форматированием («Главная» → «Условное форматирование»).\n- Проверка сравнивает результат с величиной, полученной независимо. Формула `=C16-СУММ(C8:C14)` пропускает ту же строку, что и проверяемая, и всегда покажет «OK». Верный вариант получает сумму другим способом, например `=СУММ(Точки[Выручка с НДС, руб.])`.\n\n### ЕСЛИОШИБКА: обработка и скрытие ошибок\n\nВ ячейке C18 рентабельность по сети равна 0 %. Формула делит прибыль на пустую ячейку D17; ошибка `#ДЕЛ/0!` перехватывается функцией `ЕСЛИОШИБКА` и заменяется нулем:\n\n```formula\n=ЕСЛИОШИБКА(H16/D17;0)\n```\n\nНуль выглядит допустимым, но смысла не имеет: формула ссылается на пустую ячейку вместо итога выручки. Без `ЕСЛИОШИБКА` ошибка была бы видна сразу.\n\nПравило: `ЕСЛИОШИБКА` используют, когда причина ошибки известна и результат допустим по условиям задачи (например, искомого значения может не быть). Если функцию добавили только ради того, чтобы убрать сообщение, она скрывает дефект. Если причина известна, лучше проверить ее явно: `=ЕСЛИ(D16=0;\"нет данных\";H16/D16)`.\n\n```quiz\nquestion: Какая контрольная сумма выявит пропуск строки в итоговой формуле C16?\nA: `=ЕСЛИ(C16-СУММ(C8:C14)=0;\"OK\";\"РАСХОЖДЕНИЕ\")`\nB: `=ЕСЛИ(ОКРУГЛ(C16-СУММ(Точки[Выручка с НДС, руб.]);2)=0;\"OK\";\"РАСХОЖДЕНИЕ\")`\nC: `=ЕСЛИ(C16>0;\"OK\";\"РАСХОЖДЕНИЕ\")`\nD: `=ЕСЛИОШИБКА(C16;\"OK\")`\ncorrect: B\nexplanation: Проверка должна опираться на независимый способ получения суммы. Вариант A использует диапазон с тем же пропуском и всегда дает «OK». Варианты C и D не проверяют равенство.\n```\n\n## 8. Использование языковой модели для анализа формул\n\nЯзыковая модель помогает разобрать незнакомую формулу и составить список гипотез для проверки. Проверку в Excel она не заменяет.\n\nШаблон запроса:\n\n```\nПроанализируй формулу Excel:\n\n[ВСТАВЬТЕ ФОРМУЛУ]\n\n1. Опиши логику вычисления по шагам.\n2. Перечисли ячейки, от которых зависит результат, и параметры, подлежащие проверке.\n3. Найди числовые константы и раздели их на: вытекающие из определения показателя; изменяемые предпосылки, подлежащие выносу в отдельные ячейки.\n4. Укажи риски сопровождаемости.\n5. Предложи более читаемую запись, при необходимости с функцией ЛЕТ.\n6. Опиши способ проверки эквивалентности исходной и предложенной формул.\n```\n\nАдреса, имена, значения предпосылок и равенство результатов исходной и новой формулы проверяют в самой книге. Конфиденциальные данные организации в запрос не включают.\n\n## 9. Итоги занятия\n\n1. Книга состоит из четырех слоев: данные, предпосылки, расчеты, представление.\n2. Изменяемая числовая константа в расчетной формуле – дефект. Предпосылки записывают один раз, с источником, и дают им имена с областью «Книга».\n3. Данные хранят в структурированных таблицах и обращаются к ним по названиям столбцов.\n4. Тип содержимого ячейки обозначают цветом шрифта через стили ячеек.\n5. Каждое равенство, которое должно выполняться, оформляют контрольной суммой с округлением; проверка опирается на независимый способ получения величины.\n6. `ЕСЛИОШИБКА` не используют, чтобы убрать сообщение об ошибке, причина которой неизвестна.\n7. Отсутствие сообщений об ошибках не доказывает, что расчет верен.\n\n## Практика: проверка и исправление отчета «Северный двор»\n\n**Задача.** Отчет сети «Северный двор» за I квартал передается другому пользователю. Найдите дефекты файла, исправьте их и добавьте средства контроля.\n\n**Файл.** [lesson-1.1.xlsx](materials/lesson-1.1.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Задание» внутри файла. Работайте в этом файле: результатом является выполненный файл Excel.\n\n**Что нужно сделать.**\n\n1. Обследовать книгу и занести найденные дефекты на лист «Дефекты» (не менее 13).\n2. Вынести предпосылки на отдельный лист, присвоить им имена и заменить константы в формулах ссылками на имена.\n3. Преобразовать данные в структурированную таблицу и исправить итоги.\n4. Добавить цветовое кодирование, контрольные суммы и журнал изменений.\n5. По желанию: защитить лист и привести в порядок выгрузку на листе «Данные доп».\n\n**Результат.** Книга, в которой смена ставки пересчитывает весь отчет, а расхождения в итогах отображаются автоматически.\n", "1.2": "---\ntitle: \"Формулы и их поведение\"\nsummary: \"Поиск функцией ПРОСМОТРX, вычисления с условиями через СУММПРОИЗВ, динамические массивы, функция LET, модель пересчета Excel и волатильные функции.\"\nsource: \"materials/lesson-1.2.xlsx\"\nconcepts:\n  - \"ПРОСМОТРX :: Функция поиска значения в одном массиве и возврата соответствующего значения из другого. По умолчанию ищет точное совпадение.\"\n  - \"Режим сопоставления :: Пятый аргумент ПРОСМОТРX: что считать совпадением (0 – точное; -1 – точное или следующее меньшее; 1 – точное или следующее большее).\"\n  - \"Режим поиска :: Шестой аргумент ПРОСМОТРX: как выполняется поиск (с начала, с конца, двоичный). Не путать с режимом сопоставления.\"\n  - \"СУММПРОИЗВ :: Функция, которая перемножает массивы и суммирует произведения. Позволяет задавать условия арифметикой над массивами.\"\n  - \"Средневзвешенная величина :: Показатель, который учитывает вес наблюдений: `СУММПРОИЗВ(вес; значение)/СУММ(вес)`.\"\n  - \"Динамический массив :: Формула, результат которой занимает несколько ячеек (область развертывания).\"\n  - \"Оператор развертывания :: Запись `F5#`: вся область развертывания формулы, начинающейся в F5.\"\n  - \"LET :: Функция, которая задает внутри формулы именованные промежуточные величины. Область действия имен – только эта формула.\"\n  - \"Граф зависимостей :: Схема связей между ячейками, по которой Excel определяет, какие формулы пересчитывать после изменения.\"\n  - \"Волатильная функция :: Функция, которая пересчитывается при каждом пересчете книги независимо от изменения ее аргументов.\"\n---\n\n# Формулы и их поведение\n\n## Цели и требования\n\nНа занятии 1.1 критерии надежности применялись к книге в целом. Здесь они применяются к отдельным формулам. Формула считается надежной, если она:\n\n1. дает верный результат на текущих данных;\n2. остается верной при изменении значений и размера данных;\n3. понятна человеку, который ее не писал.\n\nПосле занятия нужно уметь:\n\n- искать значения функцией ПРОСМОТРX и правильно обрабатывать отсутствие совпадения;\n- считать суммы, количества и средневзвешенные величины с условиями через СУММПРОИЗВ;\n- использовать динамические массивы (УНИК, ФИЛЬТР) и ссылаться на них оператором `#`;\n- сокращать формулы и повторные вычисления функцией LET;\n- объяснять, как Excel пересчитывает книгу, и находить волатильные функции.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. В Excel 2016 и 2019 функций ПРОСМОТРX, LET и динамических массивов нет. Учебный файл `lesson-1.2.xlsx` содержит листы «Справочники» (номенклатура из 12 товаров, 8 торговых точек, шкала скидок), «Продажи» (реестр из 120 строк за I квартал 2026 г.), «Матрица» (выручка по точкам и месяцам), «Задания» (12 заданий с контролем) и «Пересчет» (учебные опыты).\n\n## 1. Связь с занятием 1.1\n\nПринципы архитектуры книги переносятся на формулы:\n\n- **Единственный источник.** Формула ссылается на параметр и не повторяет изменяемое число.\n- **Структурированные таблицы.** Формулы должны корректно работать при изменении объема данных.\n- **Проверяемость.** Промежуточные шаги сложного расчета можно просмотреть и проверить.\n- **Видимость ошибок.** Обрабатывается только ожидаемое состояние, остальные ошибки не скрываются.\n\n> [!WARNING]\n> Формула может быть записана верно и возвращать число, но оставаться ненадежной: зависеть от положения столбца, молча выбирать неверное совпадение, скрывать отсутствие данных или замедлять пересчет книги.\n\n## 2. ПРОСМОТРX: основные режимы\n\nПРОСМОТРX ищет значение в одном массиве и возвращает соответствующее значение из другого массива.\n\n```formula\n=ПРОСМОТРX(\n    искомое;\n    просматриваемый_массив;\n    возвращаемый_массив;\n    [если_не_найдено];\n    [режим_сопоставления];\n    [режим_поиска]\n)\n```\n\nОбязательны первые три аргумента.\n\n### Отличия от ВПР\n\n| Свойство | ВПР | ПРОСМОТРX |\n|---|---|---|\n| Где ищет | Только в первом столбце диапазона | В любом отдельном массиве |\n| Куда возвращает | Только вправо, по номеру столбца | Из любого отдельного массива |\n| Режим по умолчанию | Приближенный (если не указан четвертый аргумент) | Точный |\n| Ссылка на результат | Номер столбца, который сдвигается при изменении структуры | Диапазон, который сдвигается вместе с данными |\n\nДва последних отличия важнее остальных. Приближенный поиск по умолчанию в ВПР может вернуть правдоподобное, но неверное значение без сообщения об ошибке. Номер столбца в ВПР после вставки нового столбца начинает указывать не туда.\n\n### Неоднозначный ключ\n\nПРОСМОТРX – функция поиска, а не агрегирования. Если искомый код встречается в справочнике несколько раз, возвращается первое совпадение. Возможны два случая:\n\n- ключ должен быть уникальным, значит, повтор – дефект данных;\n- повторы допустимы по смыслу, значит, нужна фильтрация или агрегирование, а не поиск.\n\nФункция не определяет, допустим ли дубликат. Это решение принимается в модели данных.\n\n### Размерность массивов\n\nПросматриваемый и возвращаемый массивы должны совпадать по размеру: каждой позиции в первом соответствует позиция во втором. Если возвращаемый массив состоит из нескольких столбцов, результат разворачивается как динамический массив.\n\n### Аргумент «если не найдено»\n\nЧетвертый аргумент задает результат для единственной ситуации: совпадение не найдено.\n\n```formula\n=ПРОСМОТРX(код;коды;наименования;\"не найден\")\n```\n\n`ЕСЛИОШИБКА` перехватывает любые ошибки: деление на ноль, неверную ссылку, ошибку имени. Четвертый аргумент ПРОСМОТРX обрабатывает только отсутствие записи, поэтому остальные ошибки остаются видимыми.\n\n> [!WARNING]\n> Не всякое отсутствие совпадения нужно заменять нулем или пустой строкой. Если запись обязана существовать, «не найдено» – сигнал о проблеме в данных, и он должен оставаться заметным.\n\n```quiz\nquestion: Почему для ожидаемого отсутствия кода в справочнике предпочтительнее четвертый аргумент ПРОСМОТРX, а не ЕСЛИОШИБКА?\nA: Четвертый аргумент включает приближенный поиск\nB: Он обрабатывает только отсутствие совпадения и не скрывает прочие ошибки\nC: Он автоматически удаляет дубликаты ключей\nD: Он ускоряет поиск при любом размере данных\ncorrect: B\nexplanation: Четвертый аргумент охватывает единственную ситуацию – отсутствие совпадения. Остальные ошибки формулы остаются видимыми, и их можно диагностировать. ЕСЛИОШИБКА скрывает любые ошибки.\n```\n\n## 3. Двусторонний и приближенный поиск\n\n### Двусторонний поиск\n\nЗадача: получить значение на пересечении заданной строки и заданного столбца таблицы. Решение строится на том, что ПРОСМОТРX может вернуть массив. Внутренняя функция находит столбец по месяцу:\n\n```formula\n=ПРОСМОТРX(месяц;строка_месяцев;массив_значений)\n```\n\nРезультат – столбец значений нужного месяца. Внешняя функция выбирает из него строку по точке:\n\n```formula\n=ПРОСМОТРX(\n    точка;\n    столбец_точек;\n    ПРОСМОТРX(месяц;строка_месяцев;массив_значений)\n)\n```\n\n### F9: просмотр промежуточного результата\n\nЧтобы увидеть, что возвращает часть формулы, выделите ее в строке формул и нажмите **F9**: фрагмент заменится вычисленным значением. Для вложенной функции ПРОСМОТРX так видно весь возвращаемый столбец.\n\n> [!WARNING]\n> После просмотра нажмите **Esc**. Клавиша Enter оставит в формуле вычисленное значение вместо исходного фрагмента.\n\n### Приближенный поиск\n\nЕсли шкала задана нижними границами (например, скидка зависит от объема закупки), точного совпадения может не быть. Нужно найти точное значение или ближайшее меньшее. Для этого в пятом аргументе задается `-1`:\n\n```formula\n=ПРОСМОТРX(объем;границы;ставки;;-1)\n```\n\nДве точки с запятой подряд означают, что четвертый аргумент пропущен.\n\n### Режим сопоставления и режим поиска\n\n| Аргумент | Что определяет | Значения |\n|---|---|---|\n| Пятый: режим сопоставления | какое совпадение считать подходящим | `0` – точное; `-1` – точное или следующее меньшее; `1` – точное или следующее большее |\n| Шестой: режим поиска | как выполнять поиск | `1` – с начала; `-1` – с конца; `2` – двоичный по возрастанию; `-2` – двоичный по убыванию |\n\nЭто разные параметры. Сортировка данных обязательна только для двоичного поиска (`2`, `-2`). Сочетание сопоставления `-1` с обычным поиском сортировки не требует. Для небольших шкал порогов двоичный поиск не нужен, но отсортированную шкалу легче проверять.\n\n```quiz\nquestion: Шкала скидок задана нижними границами объема: 0, 500 000, 1 500 000, 3 000 000. Какой пятый аргумент ПРОСМОТРX вернет скидку для объема 2 450 000?\nA: 0 (точное совпадение)\nB: -1 (точное или следующее меньшее)\nC: 1 (точное или следующее большее)\nD: 2 (двоичный поиск)\ncorrect: B\nexplanation: Значения 2 450 000 в шкале нет. Нужна граница, не превышающая объем, то есть 1 500 000. Это режим -1. Режим 1 вернул бы границу 3 000 000, а режим 2 относится к порядку поиска, а не к выбору совпадения.\n```\n\n## 4. СУММПРОИЗВ и условия над массивами\n\nСУММПРОИЗВ нужна не только для суммирования произведений: она позволяет задавать условия арифметикой над массивами, в том числе вычисляемые.\n\n### Как работает условие\n\nСравнение диапазона со значением возвращает массив ИСТИНА/ЛОЖЬ. Арифметическая операция превращает ИСТИНА в 1, а ЛОЖЬ в 0. Произведение двух таких массивов равно 1 только там, где выполнены оба условия, то есть умножение дает логику «И»:\n\n```formula\n=СУММПРОИЗВ((условие1)*(условие2)*суммы)\n```\n\nСтроки, не удовлетворяющие условиям, умножаются на 0 и выпадают из суммы.\n\nДля логики «ИЛИ» массивы условий складывают. Если строка удовлетворяет обоим условиям, сумма равна 2, поэтому такой массив нужно проверять на промежуточном результате (F9).\n\n### СУММПРОИЗВ или СУММЕСЛИМН\n\nДля простых условий по готовым столбцам предпочтительна СУММЕСЛИМН: она короче и читается проще. СУММПРОИЗВ оправдана, если:\n\n- условие является результатом вычисления (готового столбца с признаком нет);\n- нужна арифметика над массивами;\n- считается взвешенный показатель.\n\nРасположение данных на другом листе – не повод заменять СУММЕСЛИМН на СУММПРОИЗВ.\n\n### Вычисляемое условие\n\nВ реестре продаж нет столбца с категорией товара. Категорию можно получить по коду через справочник, применив ПРОСМОТРX сразу ко всему столбцу кодов:\n\n```formula\n=СУММПРОИЗВ(\n    (Продажи!C4:C123=точка)\n    *(ПРОСМОТРX(Продажи!D4:D123;Справочники!A5:A16;Справочники!C5:C16)=категория)\n    *Продажи!G4:G123\n)\n```\n\nВсе массивы в формуле должны охватывать одни и те же строки. Ссылки на целые столбцы (миллион строк) в таких формулах замедляют пересчет.\n\n### Средневзвешенная величина\n\nПростое среднее цены по строкам не учитывает, что единиц продано разное количество. Верная средневзвешенная цена:\n\n```formula\n=СУММПРОИЗВ(количество;цена)/СУММ(количество)\n```\n\n> [!NOTE]\n> Прежде чем агрегировать относительный показатель, нужно определить его знаменатель. Если показатель – отношение A/B, то по группе его считают как СУММ(A)/СУММ(B), а не как среднее значений A/B по строкам. Это относится к цене, марже, доходности, ставкам.\n\nВ учебной книге простое среднее цены по реестру равно 166,83 руб., а средневзвешенная цена – 165,44 руб.\n\n```quiz\nquestion: В каком случае СУММПРОИЗВ предпочтительнее СУММЕСЛИМН?\nA: Нужно сложить один числовой столбец без условий\nB: Условие является результатом вычисления, готового столбца с признаком нет\nC: Данные находятся на другом листе\nD: Нужно заменить любую функцию СУММ\ncorrect: B\nexplanation: СУММПРОИЗВ позволяет задавать условие вычислением над массивом. Если условия заданы готовыми столбцами, СУММЕСЛИМН короче и проще. Положение данных на другом листе на выбор функции не влияет.\n```\n\n## 5. Динамические массивы\n\nФормула с динамическим массивом возвращает не одно значение, а массив, который занимает столько ячеек, сколько нужно. Занятую область называют **областью развертывания**.\n\n| Функция | Результат |\n|---|---|\n| УНИК | уникальные значения |\n| ФИЛЬТР | строки, удовлетворяющие условию |\n| СОРТ, СОРТПО | упорядоченный массив |\n| ПОСЛЕД | последовательность чисел |\n| СЛУЧМАССИВ | массив случайных чисел |\n\nНапример, `=УНИК(диапазон)` записывается в одну ячейку, а результат занимает несколько. Формула хранится только в первой ячейке, остальные ячейки области отдельно не редактируются.\n\n### Таблица на входе, массив на выходе\n\nИсходные данные хранят в структурированной таблице: она сама расширяет входной диапазон. Формулу с динамическим массивом размещают вне таблицы. Структура: таблица расширяет вход, динамическая формула расширяет результат, зависимые формулы ссылаются на всю область результата.\n\n### Оператор `#`\n\nЕсли динамическая формула начинается в ячейке F5, то запись `F5#` означает всю область развертывания независимо от ее размера:\n\n```formula\n=СУММ(F5#)\n=ЧСТРОК(F5#)\n```\n\nПри увеличении массива ссылка расширится сама.\n\n> [!WARNING]\n> Не ссылайтесь на динамический результат фиксированным диапазоном «с запасом» (`F5:F20`). Такая ссылка снова привязывает модель к текущему размеру.\n\n### Ошибка #ПЕРЕНОС!\n\nЕсли хотя бы одна ячейка будущей области развертывания занята, массив не строится, и Excel возвращает `#ПЕРЕНОС!`. Достаточно освободить занятую ячейку.\n\n### Несколько условий в ФИЛЬТР\n\nУсловия объединяют умножением:\n\n```formula\n=ФИЛЬТР(диапазон;(условие1)*(условие2);\"нет строк\")\n```\n\nФункция `И` не подходит: она сворачивает массив в одно значение. Третий аргумент ФИЛЬТР, как и четвертый аргумент ПРОСМОТРX, используют осознанно: если отсутствие строк допустимо, выводят сообщение; если оно сигнализирует о дефекте данных, его нейтральным текстом не маскируют.\n\n```quiz\nquestion: Формула `=УНИК(Справочники!C5:C16)` записана в J5 и возвращает 4 значения. Какая запись считает их количество и останется верной при росте списка?\nA: `=ЧСТРОК(J5:J8)`\nB: `=ЧСТРОК(J5#)`\nC: `=ЧСТРОК(J5)`\nD: `=СУММ(J5#)`\ncorrect: B\nexplanation: Оператор # охватывает всю область развертывания и расширяется вместе с ней. Диапазон J5:J8 привязан к текущему размеру. Ссылка J5 дает одну ячейку, а СУММ складывает значения, а не считает строки.\n```\n\n## 6. Функция LET\n\nLET объявляет внутри формулы именованные промежуточные величины:\n\n```formula\n=LET(\n    имя1;значение1;\n    имя2;значение2;\n    выражение_результата\n)\n```\n\nLET решает две задачи.\n\n**Читаемость.** Повторяющееся выражение вычисляется один раз, получает содержательное имя и используется по имени. В отличие от имен диспетчера имен, переменные LET существуют только внутри своей формулы и не засоряют список имен книги. Переменной может быть значение, диапазон или массив.\n\n**Меньше повторных вычислений.** Если сложное выражение встречается в формуле трижды, Excel вычисляет его три раза. Если оно объявлено как переменная LET, то вычисляется один раз. Это важно для больших массивов, повторных ПРОСМОТРX и ФИЛЬТР.\n\nПример для средневзвешенной цены:\n\n```formula\n=LET(\n    выручка;СУММПРОИЗВ(Продажи!E4:E123;Продажи!F4:F123);\n    количество;СУММ(Продажи!E4:E123);\n    выручка/количество\n)\n```\n\nLET нужна, если выражение длинное или дорогое и повторяется, или если формула состоит из нескольких содержательных шагов, которым полезно дать имена. Короткую формулу в один шаг оборачивать в LET не нужно.\n\n> [!NOTE]\n> Функция LAMBDA развивает идею LET и позволяет создавать собственные функции. В программу курса она не входит и в Excel 2021 недоступна.\n\n## 7. Разбор формулы с помощью языковой модели\n\nЯзыковая модель может помочь прочитать чужую формулу и подготовить черновой вариант упрощения.\n\n```\nНиже формула Excel:\n\n[ВСТАВЬТЕ ФОРМУЛУ]\n\n1. Опиши вычисление по этапам.\n2. Перечисли зависимости формулы.\n3. Найди повторяющиеся выражения.\n4. Найди числовые константы и укажи, чем они являются: изменяемыми предпосылками или величинами, вытекающими из определения показателя.\n5. Предложи эквивалентную запись через LET, если она улучшает читаемость или убирает повторные вычисления.\n6. Не меняй диапазоны, условия и знаки операций.\n7. Отдельно перечисли, что нужно проверить в Excel после преобразования.\n```\n\nНовую формулу нельзя считать эквивалентной без проверки. Порядок проверки:\n\n1. сравнить результаты старой и новой формулы на исходных данных;\n2. изменить несколько входных значений;\n3. убедиться, что результаты по-прежнему совпадают;\n4. отдельно проверить диапазоны, знаки операций и условия.\n\n## 8. Модель вычислений и волатильные функции\n\nНа стоимость пересчета влияет не только результат формулы, но и ее устройство.\n\n### Граф зависимостей\n\nExcel не пересчитывает всю книгу при каждом изменении. Он строит граф зависимостей между ячейками и после изменения значения пересчитывает только формулы, которые зависят от него напрямую или через цепочку других формул.\n\n### Режим вычислений\n\nРежим выбирается в «Формулы» → «Параметры вычислений». В автоматическом режиме формулы пересчитываются сразу после изменения данных. В ручном режиме данные уже изменены, а на экране остаются прежние результаты.\n\n| Клавиши | Действие |\n|---|---|\n| F9 | пересчитать измененные формулы и зависящие от них во всех открытых книгах |\n| Shift+F9 | пересчитать активный лист |\n| Ctrl+Alt+F9 | полный пересчет всех формул независимо от признака изменения |\n\n> [!WARNING]\n> Режим вычислений действует на все открытые книги. После опыта с ручным режимом верните «Автоматически», иначе вы можете работать с устаревшими значениями.\n\n### Волатильные функции\n\nВолатильные функции пересчитываются при каждом пересчете книги, даже если их аргументы не менялись. К ним относятся СЛЧИС, СЛУЧМЕЖДУ, СЕГОДНЯ, ТДАТА, СМЕЩ, ДВССЫЛ, а также ЯЧЕЙКА и ИНФОРМ в ряде режимов. Вместе с волатильной ячейкой пересчитываются все формулы, которые от нее зависят.\n\nПоэтому важно не только наличие волатильной функции, но и ее положение в графе зависимостей. Одна функция СЕГОДНЯ в заголовке практически не влияет на скорость. Большое число функций СМЕЩ в основе расчетной модели замедляет всю ветвь зависимых формул.\n\n### Что показывают опыты листа «Пересчет»\n\n**Опыт 1. СЛЧИС.** Изменение ячейки B6 меняет значение B7 (СЛЧИС), хотя B7 от B6 не зависит. Это признак волатильности.\n\n**Опыт 2. СМЕЩ и прямая ссылка.** Суммы в B13 (через СМЕЩ) и B14 (через прямой диапазон) равны, но B13 пересчитывается при каждом пересчете, а B14 – только при изменении реестра. Динамический диапазон лучше задавать структурированной таблицей: зависимость остается явной, а волатильная функция не нужна.\n\n**Опыт 3. ДВССЫЛ.** Функция получает адрес в виде текста. Трассировка влияющих ячеек такую связь не показывает, поэтому ДВССЫЛ ухудшает проверяемость книги (см. занятие 1.1).\n\n> [!NOTE]\n> Волатильная функция допустима, если без нее задача не решается и нет более прозрачного решения. В этом случае причина и стоимость применения должны быть понятны.\n\n### Диагностика медленной книги\n\n1. Определить режим вычислений.\n2. Найти волатильные функции.\n3. Оценить положение каждой в графе зависимостей.\n4. Найти повторяющиеся дорогие выражения.\n5. Только после этого менять формулы.\n\n```quiz\nquestion: Почему одна волатильная функция может иметь разную стоимость в разных местах книги?\nA: Excel случайно выбирает время ее пересчета\nB: Стоимость зависит от числа формул, зависящих от нее, которые тоже пересчитываются\nC: Любая волатильная функция всегда пересчитывает всю книгу\nD: Волатильность влияет только на размер файла\ncorrect: B\nexplanation: Волатильная функция пересчитывается при каждом пересчете, а вместе с ней пересчитывается вся цепочка зависимых формул. Поэтому важно, сколько формул находится ниже нее в графе зависимостей.\n```\n\n## 9. Итоги занятия\n\n1. ПРОСМОТРX по умолчанию ищет точное совпадение и принимает независимые массивы поиска и возврата.\n2. Ожидаемое отсутствие совпадения обрабатывается четвертым аргументом ПРОСМОТРX, а не скрывается через ЕСЛИОШИБКА.\n3. Режим сопоставления и режим поиска – разные параметры. Сортировка обязательна только для двоичного поиска.\n4. СУММПРОИЗВ нужна, когда условие получено вычислением или требуется арифметика над массивами; для простых условий используют СУММЕСЛИМН.\n5. Средневзвешенная величина не равна простому среднему.\n6. Формулу с динамическим массивом размещают вне структурированной таблицы, а на ее результат ссылаются оператором `#`.\n7. LET дает имена промежуточным величинам и убирает повторные вычисления внутри формулы.\n8. В ручном режиме вычислений на экране остаются устаревшие результаты; для диагностики служат F9, Shift+F9 и Ctrl+Alt+F9.\n9. Волатильные функции пересчитываются при каждом пересчете и тянут за собой зависимые формулы; риск определяется размером этой цепочки.\n\n## Практика: формулы в рабочей тетради занятия 1.2\n\n**Задача.** Выполнить 12 заданий на листе «Задания», провести опыты с пересчетом и сверить результаты с контрольными ячейками.\n\n**Файл.** [lesson-1.2.xlsx](materials/lesson-1.2.xlsx). Пошаговые инструкции и контрольные значения находятся на листе «Порядок работы» внутри файла. Формулы вводятся в желтые ячейки столбца C листа «Задания»; столбец E показывает «ОК», если результат совпал с контролем. Результатом является выполненный файл Excel.\n\n**Что нужно сделать.**\n\n1. Задания 1–5: поиск функцией ПРОСМОТРX, в том числе двусторонний и приближенный.\n2. Задания 6–8: суммы, количества и средневзвешенная цена через СУММПРОИЗВ.\n3. Задания 9–12: динамические массивы УНИК и ФИЛЬТР, функция LET.\n4. Опыты на листе «Пересчет»: волатильные функции и ручной режим вычислений. Наблюдения записываются на листе «Наблюдения».\n5. По желанию: сводка по регионам на динамических массивах.\n\n**Результат.** Во всех строках столбца «Проверка» на листе «Задания» стоит «ОК».\n", "2.1": "---\ntitle: \"Power Query: импорт и очистка данных\"\nsummary: \"Запрос как сохраненная последовательность преобразований: импорт выгрузки, типы данных и локаль, очистка и стандартизация текста, преобразование широкой таблицы в длинную, обновление на новой выгрузке.\"\nsource: \"materials/lesson-2.1.xlsx; materials/lesson-2.1-source.xlsx\"\nconcepts:\n  - \"Запрос :: Сохраненная последовательность преобразований данных (примененные шаги). При обновлении источника последовательность выполняется заново.\"\n  - \"Примененные шаги :: Список операций запроса в порядке выполнения. Каждый шаг принимает результат предыдущего и записывается выражением на языке M.\"\n  - \"Язык M :: Язык, на котором Power Query записывает шаги запроса. Действия интерфейса формируют M-код, который можно прочитать в строке формул и в расширенном редакторе.\"\n  - \"Тип данных :: Свойство столбца, определяющее допустимые операции: текст, целое и десятичное число, дата, дата и время, логический тип.\"\n  - \"Локаль источника :: Набор правил записи чисел и дат (десятичный разделитель, разделитель тысяч, порядок day-month-year). Задается при преобразовании типа командой «Использовать локаль».\"\n  - \"null :: Значение «данных нет». В отличие от нуля не участвует в подсчете количества и среднего.\"\n  - \"Неразрывный пробел :: Символ U+00A0, внешне неотличимый от обычного пробела. Часто используется как разделитель тысяч в выгрузках; обычная замена пробела его не затрагивает.\"\n  - \"Стандартизация текста :: Приведение значений к единому виду (пробелы, регистр, служебные символы) до сопоставления и удаления дубликатов.\"\n  - \"Широкий формат :: Таблица, в которой каждый период занимает отдельный столбец. Новый период меняет структуру таблицы.\"\n  - \"Длинный формат :: Таблица, в которой период хранится значением в столбце «Месяц». Новый период добавляет строки, структура не меняется.\"\n  - \"Отменить свертывание (unpivot) :: Преобразование столбцов в строки. Вариант «Отменить свертывание других столбцов» задает столбцы, которые остаются, и поэтому охватывает любые новые периоды.\"\n  - \"Воспроизводимость :: Свойство запроса давать корректный результат на следующей выгрузке без ручной правки шагов.\"\n---\n\n# Power Query: импорт и очистка данных\n\n## Цели и требования\n\nНа первом дне рассматривались книга и формулы. Теперь рассматривается слой данных: как первичная выгрузка попадает в книгу и в каком виде. От этого зависит всё последующее: связи в модели данных (занятие 3.1), сводные таблицы, формулы и отчеты.\n\nПосле занятия нужно уметь:\n\n- создавать запрос к листу другой книги и читать его примененные шаги;\n- приводить числа и даты к нужному типу с учетом локали источника;\n- заменять заполнители отсутствующих значений на null;\n- стандартизировать текст и удалять дубликаты в правильном порядке;\n- преобразовывать широкую таблицу в длинную;\n- проверять результат по количеству строк и контрольным суммам;\n- обновлять запрос на новой выгрузке без правки шагов.\n\n> [!NOTE]\n> Требуется Microsoft Excel 2021 или Microsoft 365 для Windows. Power Query встроен в эти версии и не требует установки. Занятие использует два файла: `lesson-2.1-source.xlsx` (источник данных, не редактируется) и `lesson-2.1.xlsx` (рабочая книга с инструкцией на листе «Задание»). Подробнее в разделе «Практика».\n\n## 1. Место Power Query в архитектур
